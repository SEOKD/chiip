    expected:   # 무엇이 나타나야 하는지 미리 적어 둔다(§11.0 페어북 원칙) — 나오면 단계가 바뀐다
      - "오하이오 개발부 온쇼어링 보조금($600M) 계약 수정 — 완료 시한 2028-12-31·$20B 투자·3,000명 고용 조건 변경, 사업 주체 추가"
      - "뉴올버니 시의회·리킹 카운티 세제 감면(CRA·TIF) 조례에 새 법인명"
