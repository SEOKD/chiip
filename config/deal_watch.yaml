    keywords: '\b(?:SK ?hynix|Hynix|joint venture|JV|lease agreement|leas(?:e|ing) (?:of|to) (?:the )?(?:fab|plant|facility|site)|memory (?:fab|chip|production|manufactur\w*)|HBM|DRAM|foundry partner|operating partner)\b'
