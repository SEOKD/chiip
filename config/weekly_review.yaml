# Chiip Weekly Review 구성·품질 관문 — 2026-10-31 재설계(마스터 평가: 가독성·품질·구성 모두 3/10 이하)
# 진단: 시장 보고서가 아니라 운영 장부였다. 독자의 질문 "이번 주 무엇이 바뀌었고 다음 주 무엇을 보나"보다 예측 장부·시스템 성능·개선 제안이 길었다.
# 원칙: 읽는 사람은 휴대폰으로 3분 안에 끝낸다. 본론만 쓴다. 판정할 수 없는 항목은 싣지 않는다. 작업 과정은 쓰지 않는다.
# 계산: scripts/weekly/render.py — 이 파일의 제한을 넘으면 렌더가 멈춘다.
sections: [이번 주 결론, 글로벌 지수, 글로벌 증시 주간 상승률, 이번 주 상승 업종, 급등 종목 왜 올랐나, 이번 주 바뀐 것, 섹터 온도, 다음 주 볼 것, 이 판단이 틀릴 조건]
regions:
  - {key: US, title: "US", count: 20}
  - {key: US_SMALL, title: "US(<$10B)", count: 10}
  - {key: EU, title: "Europe", count: 10}
  - {key: JP, title: "Japan", count: 10}
  - {key: KR, title: "Korea", count: 10}
  - {key: TW, title: "Taiwan", count: 10}
  - {key: HK, title: "Hong Kong", count: 10}
limits:
  headline: 60
  bullet: 90
  bullets: [3, 3]
  changes: [3, 4]
  change_field: 120
  sectors: [3, 6]
  leadtime: [4, 12]   # AI 하드웨어 부품 리드타임(2026-11-04)
  next: [4, 6]
  next_field: 60
  risks: [2, 3]
  risk: 90
  prose_chars: 3500       # 상승률 목록을 뺀 본문 전체
  surges: [4, 8]          # 급등 종목, 왜 올랐나 — 미국·유럽·일본·한국 각 1종목 이상(2026-11-14 마스터 지시, scripts/weekly/surges.py)
  surge_field: 120
sector_moves:             # 섹터 온도 = Chiip AI 바스켓 + 그 주 크게 움직인 섹터(2026-11-14 마스터 지시, scripts/weekly/sector_moves.py)
  big: 0.04               # S&P 500 대비 주간 등락 차이 4%p 이상이면 싣는다(상승·하락 모두) — 사전값, 38개 섹터 중 6~10개가 걸리는 수준
  top: 2                  # 상승·하락 각 상위 2개는 기본(조용한 주에도 양쪽을 본다)
  max: 16
gpu_block: false          # Nebius GPU 렌털료 블록 — 2026-11-14 마스터 지시로 Pulse 월요일 06:00 점검(radar/gpu_weekly.py)으로 옮김
routes_from: 2026-W46     # 이 주차부터 surges·changes마다 근거 경로 2곳 이상(scripts/weekly/evidence.py, 2026-11-14 마스터 지시)
themes_from: 2026-W46     # 이 주차부터 themes 관문(이전 주차는 옛 8분류 그대로 다시 렌더할 수 있게)
themes:                   # 주간 상승률 종목 업종(2026-11-14 마스터 지시 "사이버보안·SW에 데이터센터 사업자인 디지털오션·코어위브가 들어가는 게 맞나? 섹터 분류를 제대로 해라")
                          # 옛 8분류(반도체·부품/사이버보안·SW/금융·서비스 등)는 너무 굵어 GPU 클라우드가 SW로, 케이블 통신이 금융으로 들어갔다.
                          # 회사가 돈을 버는 방식(매출의 주된 원천)으로 고른다. 렌더러·put이 이 목록 밖의 업종을 거부한다.
  반도체 칩: 칩 설계·제조(GPU·ASIC·CPU·전력·아날로그·RF·센서 칩, 설계 서비스)
  반도체 장비·소재·후공정: 웨이퍼 장비·검사·계측·프로브카드·소켓, 반도체 소재·부품, 패키징·테스트(OSAT)
  PCB·기판: PCB·패키지 기판·모듈 기판·CCL
  네트워크·광통신: 스위치·라우터·광 모듈·광 부품·광 전송 장비
  서버·스토리지: 서버 조립·위탁생산(EMS)·HDD·SSD·스토리지 시스템
  냉각·설비: 데이터센터·공장 냉각, 공조, 열관리 부품, 기계·전기 설비 공사
  클라우드·데이터센터: GPU 클라우드·클라우드 인프라 임대·데이터센터 운영(코로케이션 포함)
  소프트웨어·보안: 소프트웨어·SaaS·사이버보안(보안 하드웨어 키 포함)·CDN·AI 소프트웨어
  전자부품·기기: 수동소자·디스플레이·RF 부품·단말기·휴대폰·전자기기
  전력·에너지: 발전·전력망·석유·가스·LNG·재생에너지, AI 전력 단지
  방산·우주: 방산·항공우주·발사체·위성
  산업재·서비스: 기계·자동화·물류 장비, 인력·사업 서비스
  화학·소재: 화학·유리·금속·포장재·점착 소재(반도체 전용이 아닌 것)
  미디어·통신·광고: 통신·케이블·방송·뉴스·인터넷 광고
  소비재: 소매·의류·안경·식음료·생활용품
  바이오·의료: 제약·바이오·의료기기·약국
  금융: 은행·증권·보험·자산운용
  부동산: 부동산 개발·관리·리츠
banned:                   # 작업 과정·판정 불가·내부 표기 — 보고서에 쓰지 않는다
