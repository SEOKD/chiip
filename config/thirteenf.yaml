# 13F 시즌 → Pulse 기관 매입·매도 순위 (마스터 지시 2026-11-08 "13F가 공시되면 Pulse를 통해 종목별 매입 및 매도 기관 수 상위순으로 정리하도록 구조를 설계하라")
# 구현 radar/thirteenf.py, 수집 본보기 scripts/fiscal/templates/holders_batch.js, 절차 docs/channels/pulse.md '13F 시즌'
# 13F-HR 마감 = 분기 말 + 45일(주말이면 다음 영업일). 대부분 마감 직전 며칠에 몰린다 → 세 번 모은다.
rounds:                   # 마감일 기준 날짜 차 — 잠정(마감 전 일부)·주(마감 다음 날)·확정(늦은 정정·제출 반영)
  - {name: 잠정, offset: -2}
  - {name: 주, offset: 1}
  - {name: 확정, offset: 7}
universe: fiscal_us       # config/fiscal_keys.yaml에서 NASDAQ_·NYSE_·AMEX_ 키를 가진 감시 종목 전부
batch: 20                 # execute_code 한 번에 부를 종목 수
top: 10                   # Pulse에 싣는 상위 종목 수(매입 기관 수·매도 기관 수 각각)
min_holders: 30           # 보유 기관이 이보다 적은 종목은 순위에서 뺀다(소형주 왜곡)
