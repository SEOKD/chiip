# 구루 명단 (마스터 지시 2026-11-15 "패니메이 & 프레디맥과 같이 구루 포지션을 따라가는 전략" — radar/guru13f.py, radar/discovery_filings.py 13D·13G 구루 일치)
# CIK는 2026-11-15 조사 E가 data.sec.gov 제출 목록·13F 표지로 확인(45곳). 제출 법인이 바뀌면 ciks에 기간을 적는다(from/to = 보고 분기).
# 값은 운용사 13F 정보표의 주식(SH)만 — 풋·콜 제외. 일부 운용사는 가치를 천 달러로 낸다(Baupost 2026Q3·Duquesne 2026Q2) — 비중 계산은 같은 서류 안이라 영향 없다.
# 해외 직접 보유(Fundsmith 유럽, Pabrai 터키·인도·한국, 버크셔 일본 상사)는 13F에 없다 — 빠진 것이지 0이 아니다.
# 장외(OTC)·비의결권 종목(패니메이 FNMA·프레디맥 FMCC)은 13F에 안 나온다 → pages(공개 포트폴리오 페이지)·config/special_situations.yaml 논지 장부.
# 점수 규칙(조사 E §7, 사전값 — 등록부 prm-guru-*): rules 절. 명단 밖 관측은 조사 E 표 'bench'(아래 bench)로 남긴다.

rules:
  w_new: 1.0             # 신규 편입(직전 2분기 없음)
  w_add: 0.5             # 증액 — × min(증가율, 1), 증가율 add_min 이상만
  add_min: 0.25
  w_best: 0.3            # 상위 3 보유 유지(Antón·Cohen·Polk 2021 최고 확신 — 사건은 아니라 낮게)
  w_confidential: 1.2    # 13F-HR/A 'NEW HOLDINGS' — 기밀 처리했던 보유 공개(Agarwal 외 2013, Aragon 외 2013)
  rank_w: [1.0, 0.8, 0.65, 0.55, 0.5]   # 비중 순위 1~5
  rank_w_6_10: 0.2
  min_w: 0.02            # 확신 가점 최소 비중(신규 0.5% 미만은 무시)
  new_min_w: 0.005
  q_conc: 1.2            # 상위 5 비중 ≥ 0.5
  q_giant: 0.8           # 13F 주식 ≥ $10B
  q_diversified: 0.5     # 150종목 이상
  q_regime: 0.8          # 운용 체제 변화 8분기 안
  consensus_step: 0.15   # 같은 분기 다른 구루 신규·증액 1명당(최대 3명)
  consensus_cap: 3
  strength_base: 3.0     # 단서 강도 = base + slope × 점수(상한 10)
  strength_slope: 5.0
  lead_min: 5.0          # 이 강도 밑은 단서 장부에 넣지 않는다(잡음)
  crowd_lo: 0.20         # 쏠림 — 13F 보유 기관 비율 20% 이상 −0.3, 40% 이상 −0.6(조사 E 헤지펀드 상위 10 기준의 근사)
  crowd_hi: 0.40
  crowd_pen_lo: 0.3
  crowd_pen_hi: 0.6
  crowd_cap: 5.9         # 40% 이상은 강도 상한(경보·선별 문턱 아래 — 장부에는 남긴다)

