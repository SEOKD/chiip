# 국장 테마 사전 (마스터 지시 2026-11-15 "국장 테마주" 발굴 채널, scripts/discovery/kr_theme.py, 렌즈 knowledge/methods/sector_lenses/kr_theme.md)
# type: structural_candidate(이익 상향·수출·수주가 받칠 수 있는 테마 — 확인 전엔 '후보') / mixed / speculative(재료·인물·기술 소문 위주 — 과열 뒤 급락 기저율이 높다)
# seeds: KRX 6자리 코드(처음 쓰는 날 TradingView 설명으로 대조 — scripts/discovery/kr_theme.py --verify). 모르는 코드는 넣지 않는다.
# buzz: 공개 텔레그램 채널(이미 수집 중인 17곳) 글 중 이 어휘가 나온 글 수(radar/kr_theme_news.py) — 리테일·셀사이드 테마 확산의 대용 지표(언급 수 ≠ 펀더멘털).
#   Google News RSS는 쓰지 않는다(news.google.com robots.txt가 /rss를 모든 수집기에 금지·ClaudeBot 전면 금지 — 2026-11-15 확인).
# industries: TradingView 업종(industry) — 사전 종목이 아니어도 그 업종 급등 종목을 테마 후보로 묶는다(테마 이름 확정은 모델).
# 수치 문턱은 config/discovery_channels.yaml이 아니라 아래 lifecycle(사전값, 등록부 prm-krth-*).

lifecycle:
  mover_change_pct: 7        # 급등 종목 = 하루 +7% 이상(TradingView change)
  limit_up_pct: 29.5         # 상한가(가격제한폭 30%) 근사
  ignite_min: 3              # 점화: 같은 테마 급등 3종목 이상(또는 상한가 포함 2종목)
  ignite_quiet_days: 10      # 점화 = 직전 10거래일 동안 급등 1종목 이하였던 테마
  spread_days: [3, 5]        # 확산: 최근 5거래일 중 3일 이상 급등 2종목 이상
  overheat_limit_ups: 3      # 과열: 하루 상한가 3종목 이상, 또는 텔레그램 언급 20일 평균 대비 5배 이상, 또는 최근 10일 KRX 투자경고 지정 2종목 이상
  overheat_news_x: 5.0
  overheat_alerts: 2         # 투자경고 지정(open.krx — 내부 표지) 구성 종목 수
  alert_days: 10
  fade_days: 5               # 소멸: 최근 5거래일 급등 0 — 직전 20거래일 중 5일 이상 활발했던 테마
  structural_growth: 20      # 구조적 확인: 테마 구성 종목 매출 성장 중앙값 20% 이상 + 영업이익률 중앙값 8% 이상 + 최근 60거래일 중 20일 이상 활발
  structural_margin: 8
  structural_active: 20
  cluster_min: 3             # 사전 밖 업종 묶음: 같은 TradingView 업종 급등 3종목 이상
  min_value_krw: 3000000000  # 급등 종목 하한 — 하루 거래대금 30억 원(소형 단주 급등 제외)

