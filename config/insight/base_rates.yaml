# 사건 유형별 기저율 (치입 인사이트 판단 틀 6단계, knowledge/methods/insight_framework.md) — 2026-10-29
# 문헌에서 확인한 방향·크기만 적는다. 크기를 확인하지 못한 것은 magnitude: null(방향만).
# 출처는 서지(저자·연도·제목·학술지)로 — 원문을 열어 확인할 수 있게. 새 유형은 model-lab 제안서를 거쳐 추가한다.
events:
  seo:
    label: 유상증자(보통주 신주) 발표
    direction: negative
    magnitude: "산업 기업 약 −3%, 유틸리티 −1% 미만(발표일 전후)"
    note: "발표 규모가 클수록 하락 폭이 크다(산업 기업)"
    source: "Asquith & Mullins (1986), Equity Issues and Offering Dilution, Journal of Financial Economics 15(1-2)"
  stock_acquisition_bidder:
    label: 주식 교환 인수(인수자 주가)
    direction: negative
    magnitude: null
    note: "현금 인수보다 인수자 비정상 수익률이 낮다 — 합병·공개매수, 성사 여부와 무관"
    source: "Travlos (1987), Corporate Takeover Bids, Methods of Payment, and Bidding Firms' Stock Returns, Journal of Finance 42(4)"
  stale_news:
    label: 재보도·재포장 뉴스
    direction: reversal
    magnitude: null
    note: "가격 반응이 작고, 그날 움직임은 다음 주에 되돌려진다"
    source: "Tetlock (2011), All the News That's Fit to Reprint, Review of Financial Studies 24(5)"
  attention_nonevent:
    label: 새 정보 없는 대중 주목(유명 매체 재보도)
    direction: positive
    magnitude: "사례: EntreMed 하루 +300%대(장중), 이후 일부 유지"
    note: "새 정보가 없어도 주목이 가격을 크게 움직일 수 있다 — 되돌림 조건(재현 실패 등) 확인"
    source: "Huberman & Regev (2001), Contagious Speculation and a Cure for Cancer, Journal of Finance 56(1)"
  customer_news_supplier:
    label: 고객사 소식 → 공급사 주가
    direction: delayed_same_sign
    magnitude: null
    note: "고객 주가 움직임이 공급사 주가에 늦게 반영된다(예측 가능한 수익률)"
    source: "Cohen & Frazzini (2008), Economic Links and Predictable Returns, Journal of Finance 63(4)"
  complicated_firm:
    label: 같은 소식의 복합 기업 반영
    direction: delayed_same_sign
    magnitude: "쉬운 기업 → 복잡한 기업 예측 전략 월 118bp(거래비용 전)"
    source: "Cohen & Lou (2012), Complicated Firms, Journal of Financial Economics 104(2)"
  filing_text_change:
    label: 10-K·10-Q 문장 변화(위험 요인·경영진·소송)
    direction: delayed_negative
    magnitude: "변경 기업 매도·미변경 매수 전략 월 최대 188bp"
    note: "발표 당일 반응 없음 — 이후 뉴스·실적으로 반영"
    source: "Cohen, Malloy & Nguyen (2020), Lazy Prices, Journal of Finance 75(3)"
  friday_afterhours_earnings:
    label: 금요일(특히 장 마감 후) 실적 발표
    direction: delayed_same_sign
    magnitude: "즉시 반응 15% 작고 지연 반응 70% 큼, 거래량 8% 적음"
    note: "후속 연구: 금요일 장 마감 후 발표에서만 나타난다는 반박 있음"
    source: "DellaVigna & Pollet (2009), Investor Inattention and Friday Earnings Announcements, Journal of Finance 64(2)"
  activist_short_report:
    label: 공개 숏 리포트(행동주의 공매도)
    direction: negative
    magnitude: null
    note: "SEC 서류 열람·변동성·거래 급증으로 가격 발견을 앞당긴다(2006~2011년 124건). 공매도자의 우위는 공개 정보 처리 능력"
    source: "Ljungqvist & Qian (2016), How Constraining Are Limits to Arbitrage?, Review of Financial Studies 29(8); Engelberg, Reed & Ringgenberg (2012), How Are Shorts Informed?, Journal of Financial Economics 105(2)"
  earnings_drift:
    label: 실적 발표 뒤 같은 방향 표류(PEAD)
    direction: delayed_same_sign
    magnitude: null
    note: "실적 서프라이즈 방향으로 발표 후 수주~수개월 표류. 발표 당일 반응이 서프라이즈와 반대면 해석 주의"
    source: "Bernard & Thomas (1989), Post-Earnings-Announcement Drift: Delayed Price Response or Risk Premium?, Journal of Accounting Research 27"
  slow_bad_news_small:
    label: 소형·커버리지 적은 종목의 나쁜 소식
    direction: delayed_same_sign
    magnitude: null
    note: "작고 애널리스트가 적은 종목일수록, 특히 나쁜 소식이 늦게 반영된다"
    source: "Hong, Lim & Stein (2000), Bad News Travels Slowly: Size, Analyst Coverage, and the Profitability of Momentum Strategies, Journal of Finance 55(1)"
  call_qa_content:
    label: 어닝콜 Q&A 내용·어조(발표문 대비)
    direction: delayed_same_sign
    magnitude: null
    note: "Q&A 구간이 경영진 발표문보다 정보가 많다(애널리스트 질문이 공시 밖 정보를 끌어낸다). Q&A 어조는 발표 당일 비정상 수익률과 이후 60거래일 표류를 실적 서프라이즈와 별개로 설명 — 전문을 늦게 읽어도 표류 구간에는 값이 남는다"
    source: "Matsumoto, Pronk & Roelofsen (2011), What Makes Conference Calls Useful?, The Accounting Review 86(4); Price, Doran, Peterson & Bliss (2012), Earnings Conference Calls and Stock Returns: The Incremental Informativeness of Textual Tone, Journal of Banking & Finance 36(4); Frankel, Johnson & Skinner (1999), Journal of Accounting Research 37(1)"
    added: "2026-10-30 마스터 직접 지시(어닝콜 인사이트 피드) — model-lab 제안서 없이 추가, 주간 피팅 때 표본 외 점검"
  call_nonanswer:
    label: 어닝콜 답변 회피(질문에 답하지 않음)
    direction: negative
    magnitude: null
    note: "경영진이 질문에 답하지 않으면 시장은 나쁜 소식을 숨긴 것으로 읽는다(침묵도 신호). 짧은 답·'말하지 않겠다' 표현은 후보일 뿐 — 원문 맥락으로 판정"
    source: "Hollander, Pronk & Roelofsen (2010), Does Silence Speak? An Empirical Analysis of Disclosure Choices During Conference Calls, Journal of Accounting Research 48(3)"
    added: "2026-10-30 마스터 직접 지시(어닝콜 인사이트 피드) — model-lab 제안서 없이 추가, 주간 피팅 때 표본 외 점검"
