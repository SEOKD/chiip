# 리서치·투자자 감시 목록 (BUILD_PROMPT §21.11, 마스터 지시 2026-10-28)
# 시장 영향력이 큰 리서치 기관·독립 애널리스트·투자자의 새 글을 실시간으로 따라간다.
# 채널 두 가지:
#   feed — 공개 RSS(뉴스레터·블로그). 무료, 지금 가동. 유료 글은 제목·공개 요약만 들어온다.
#   x    — X 공식 API(사용량 과금). 비용 승인·키 입력 전까지 꺼 둔다(§21.6 'X API 제외' 유지).
# X 웹 화면 수집은 하지 않는다: x.com robots.txt가 모든 경로를 막는다(User-agent: * / Disallow: /, 2026-10-28 확인).
# 이 목록의 글은 '의견·추정·채널체크'다. 사실로 쓰지 않는다(S1~S2 단서, claim 승격은 claim-intake로).
# 계정 평판(맞힘·틀림·선행일)은 knowledge/handle_reputation.csv. 개인 신원 추적 금지.

x_api:
  # 켜기: config/source_registry.yaml src-research-x 의 enabled: true (마스터 비용 승인 + 키 입력 후, TODO 21-3)
  key_env: X_BEARER_TOKEN     # D:\local-only\secrets\.env — 값은 출력·커밋 금지
  base: "https://api.x.com/2"
  doc: "https://docs.x.com/x-api/users/get-posts"
  pricing_doc: "https://docs.x.com/x-api/getting-started/pricing"   # 2026-10-28: 글 읽기 1건 $0.005, 사용자 조회 $0.010, 같은 자원 24시간(UTC) 안 재요청은 1회 과금
  monthly_post_cap: 10000     # 이번 달 받은 글이 이 수에 닿으면 멈춤(≈ $50). 비용 상한 안전장치
  exclude: [replies, retweets]   # 답글·리트윗 제외(인용 글은 포함)
  max_results: 20

