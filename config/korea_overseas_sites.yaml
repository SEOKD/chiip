# 한국 전자기업 해외 생산 거점 — 그 나라 정부 자료·수출입을 기사 소재 발굴에 연결한다(마스터 지시 2026-11-08 "기사 소재 발굴 시 해외에 생산 거점을 두고 있는
# 한국 전자기업과 연관된 해당 국가의 정부기관 자료와 수출입, PPI 데이터도 참고"). 수집 radar/overseas_sites.py, 후보 scripts/article/pitch_pool.py ⑤
# 거점·품목은 회사 사업보고서·IR의 공개 정보 기준(도시·주력 품목). 수치는 쓰지 않는다. 미국 거점(테일러·오스틴·인디애나·뉴욕)은 config/us_gov/korea_watch.yaml이 맡는다.
# 수출입 거울: 그 나라에서 미국으로 가는 품목 수입(Census, 나라 코드) + 일본 품목·국가별 수출입(e-Stat, 이미 수집) + EU 국가별 수입(Comext, 이미 수집). 거점 나라 자체 통계는 robots·접근이 열린 곳만.
# PPI: 거점 나라 PPI는 아직 공식 자동 경로가 없다(베트남 통계총국 DNS 실패·인도 403·필리핀 403, 2026-11-08 확인 — 우회하지 않음). 그 대신 품목의 미국·일본·대만 PPI(config/trade_ppi.yaml)를 거점 품목에 붙여 쓴다.
census_country: {VN: "5520", IN: "5330", CN: "5700", MX: "2010", PH: "5650"}
jp_country: {VN: ベトナム, IN: インド, CN: 中華人民共和国, MX: メキシコ, PH: フィリピン}
months: 36            # 거울 시계열 기간
surge_yoy: 0.3        # 최근 3개월 합의 전년 같은 기간 대비 ±30% 이상이면 신호
min_usd_3m: 50000000  # 3개월 합 $50M 미만 품목은 신호에서 뺀다(잡음)
sites:
  - {company: co-samsung, name: 삼성전자, country: VN, place: "박닌·타이응우옌", items: [{name: 스마트폰, hs: "851713", ppi: null}]}
