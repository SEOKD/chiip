# Chiip Ten-bagger Discovery — 엣지 있는 AI 밸류체인 종목 발굴 엔진 (마스터 지시 2026-10-29)
# "일본 Taiyo Yuden, JX Advanced Metals, Nitto Boseki, 대만 Yageo, Union Tool 같은 엣지 있는 AI 밸류체인 종목을 발굴하는 데 집중하라. 발굴하고
#  관련 보도(반드시 원문)를 팔로업하고 실적도 챙기고 텐배거 리포트도 적어라. 투자 커뮤니티 관심도를 트래킹하고 글로벌 IB 리서치 하우스의
#  전통적이고 독보적인 접근 방법과 의사결정 과정도 답습해 이를 발굴할 역량을 갖춰라."
# (참고: Union Tool은 일본 상장사(6278) — PCB 초소경 드릴. 대만 쪽 같은 사슬은 CCL·유리섬유 회사들)
#
# 흐름: 테마(병목·BOM 함량) → 후보 → [관심도 radar/attention.py · 펀더멘털 knowledge/models/discovery/fundamentals.json]
#       → 선별 점수 scripts/discovery/screen.py → 증거(원문)·위원회 메모(knowledge/methods/discovery_ib_process.md)
#       → 커버리지(config/coverage.yaml) → 원문 팔로업(일본 적시공시·IR Q&A / 대만 重大訊息·월매출 / 미국 SEC) + 실적 + 텐배거 리포트 대기열
# code는 거래소 코드(일본 4자리·대만 4자리·한국 6자리·미국 티커). code_verified: false면 첫 주간 회차에 easyconomics company_profile(market jp/tw/kr)로 확인.
# edge(0~10)는 치입 판단(병목에서 대체 불가성·점유율·가격 결정력) — 근거 한 줄과 함께, 주간 회차에서 고친다.

