# 투자자 관심도 원천 — CLAUDE.md 컴플라이언스(약관·robots·제외 원천) 안에서
attention:
  window_days: 7
  baseline_weeks: 4
  sources:
    google_news: {enabled: true, note: "회사 영문명 + 일본어/중국어 표기 각각 — 언론 관심(글로벌·현지)"}
    seeking_alpha: {enabled: true, note: "Google News 색인 제목만(site:seekingalpha.com) — 사이트 직접 접속은 robots.txt가 막음"}
    substack: {enabled: true, note: "Google News 색인(site:substack.com) + config/research_watch.yaml 공개 RSS 본문 제목·요약에서 회사명 언급"}
    reddit: {enabled: true, note: "ApeWisdom 공개 API(미국 티커만)"}
    sellside_events: {enabled: true, note: "회사 원문 공시 속 증권사 투자자 행사 초청·법인설명회 수(대만 重大訊息·일본 적시공시) — IB 커버리지 관심의 선행 신호"}
    x: {enabled: false, note: "CLAUDE.md 제외 원천(X API) — 마스터 승인 시 공식 API 집계 수만(본문 저장 안 함)"}
    telegram: {enabled: false, note: "CLAUDE.md 제외 원천(텔레그램 자동 수집) — 마스터 승인 시 공개 채널 웹 미리보기의 회사명 언급 수만(본문 저장 안 함)"}

# 선별 점수 가중치(사전값 — 주간·월간 성과로 피팅, knowledge/models/params/registry.yaml에 등록 대상)
scoring:
  edge: 0.30            # 병목 대체 불가성(치입 판단 0~10)
  growth: 0.15          # 매출 성장(최근)
  coverage_gap: 0.10    # 애널리스트 수가 적을수록(덜 알려짐 — 정보 비효율)
  attention_accel: 0.15 # 관심 가속(7일 ÷ 직전 4주 평균) — 가격보다 먼저 오는 관심
  crowding: -0.10       # 관심 절대 수준이 이미 높으면 감점(SemiAnalysis 렌즈의 크라우딩)
  valuation: 0.15       # 같은 테마 안 EV/매출 ÷ 성장의 상대 수준(낮을수록)
  size_fit: 0.15        # 텐배거 시가총액 구간(config/tenbagger.yaml universe.market_cap) 안이면 가점
