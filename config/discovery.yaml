# 투자자 관심도 원천 — CLAUDE.md 컴플라이언스(약관·robots·제외 원천) 안에서
# 조용한 매집형 상승(scripts/discovery/quiet.py, 마스터 지시 2026-10-29 "수급과 관심도가 제한적이지만 기관 자금이 유입되면서 조용하면서
# 꾸준히 상승하는 종목을 잘 발굴") — 가중치 = 등록부 prm-quiet-w-* 사전값(단계적 고도화로 피팅)
quiet:
  weights: {trend: 0.30, accumulation: 0.20, neglect: 0.15, fundamental: 0.25, edge: 0.10}
  gates: {max_drawdown: 0.35, min_to_high: 0.70}   # 126일 최대 낙폭 35% 초과·52주 고점의 70% 미만이면 '조용한 상승' 아님
  watch_min: 6.0        # watch 문턱(0~10)
  top_n: 15             # watch 상한(마스터 지정 always_watch 제외)
  finra_top: 40         # FINRA 주간 자료를 받을 1차 상위 미국 종목 수(요청 수 제한)
  min_band_n: 5         # 구간 안 비교 대상이 이보다 적으면 전체 백분위
  always_watch: [co-formfactor, us-nvmi, us-onto, us-camt]   # 마스터 지시로 반드시 관측(점수 무관)

attention:
  window_days: 7
  baseline_weeks: 4
  sources:
    google_news: {enabled: true, note: "회사 영문명 + 일본어/중국어 표기 각각 — 언론 관심(글로벌·현지)"}
    seeking_alpha: {enabled: true, note: "Google News 색인 제목만(site:seekingalpha.com) — 사이트 직접 접속은 robots.txt가 막음"}
    substack: {enabled: true, note: "Google News 색인(site:substack.com) + config/research_watch.yaml 공개 RSS 본문 제목·요약에서 회사명 언급"}
    reddit: {enabled: true, note: "ApeWisdom 공개 API(미국 티커만)"}
    sellside_events: {enabled: true, note: "회사 원문 공시 속 증권사 투자자 행사 초청·법인설명회 수(대만 重大訊息·일본 적시공시) — IB 커버리지 관심의 선행 신호"}
    # X·텔레그램 — 2026-10-29 마스터 허용(ADR-011): 회사명 언급 수만. 글 본문·작성자·계정은 저장하지 않는다.
    x:
      enabled: true
      key_env: X_BEARER_TOKEN   # D:\local-only\secrets\.env — 입력 전엔 건너뜀(TODO 21-3과 같은 키)
      monthly_cap: 1500         # 이번 달 요청 수 상한(≈ $7.5) — 닿으면 멈춤
      note: "X 공식 API Counts: Recent(GET /2/tweets/counts/recent) — 종목당 하루 1요청 $0.005(2026-10-29 공식 가격표, 30종목 ≈ 월 $4.5). 글 본문은 받지 않는다. 타임라인 본문 수집(src-research-x)은 별도 승인 대기"
    telegram:
      enabled: true
      max_pages: 25             # 채널당 7일을 거슬러 읽는 최대 쪽 수(쪽당 약 20글, 요청 사이 1초)
      note: "공개 채널 웹 미리보기(t.me/s/<핸들>, robots.txt 없음 2026-10-29 확인)에서 회사명이 나온 글 수만 — 본문은 메모리에서 세고 버림. 비공개 그룹·봇 API·계정 로그인 사용 금지"
      # 2026-10-29 t.me/s로 실재·최근 활동 확인한 공개 채널만. 마스터가 핸들을 알려주면 추가(Dean's Ticker 등 — 추측 금지)
      channels:
        - {handle: HanaResearch, name: "하나증권 리서치", kind: 셀사이드, verified: 2026-10-29}
