# 선별 점수 가중치(사전값 — 주간·월간 성과로 피팅, knowledge/models/params/registry.yaml에 등록 대상)
scoring:
  edge: 0.30            # 병목 대체 불가성(치입 판단 0~10)
  growth: 0.15          # 매출 성장(최근)
  coverage_gap: 0.10    # 애널리스트 수가 적을수록(덜 알려짐 — 정보 비효율)
  attention_accel: 0.15 # 관심 가속(7일 ÷ 직전 4주 평균) — 가격보다 먼저 오는 관심
  crowding: -0.10       # 관심 절대 수준이 이미 높으면 감점(SemiAnalysis 렌즈의 크라우딩)
  valuation: 0.15       # 같은 테마 안 EV/매출 ÷ 성장의 상대 수준(낮을수록)
  size_fit: 0.15        # 텐배거 시가총액 구간(config/tenbagger.yaml universe.market_cap) 안이면 가점
  quiet: 0.15           # 조용한 매집형 상승 점수(scripts/discovery/quiet.py, 2026-10-29) — 꾸준한 상승·기관 매집·관심 부족·실적 확인
