# Pulse 용어 풀이 — 마스터 지시 2026-10-31 "Pulse에서도 전문 용어를 풀어 설명하라. 특히 기술명, 세그먼트명, 제품명, 정책 용어, 프로젝트 명 등을 풀어 설명하라. 금융 용어는 풀어 설명하지 않아도 된다."
# radar/pulse_gloss.py가 Pulse 발송 직전 처음 나오는 곳에 '용어(풀이)'로 넣는다. 바로 뒤에 괄호가 있으면 건드리지 않는다.
# 풀이는 휴대폰 한 줄을 넘기지 않게 짧게. 뜻이 둘 이상인 이름은 회사명을 붙여 등록한다(예 Hyperion — 메타 캠퍼스와 ERock 공장이 다르다).
# 금융 용어는 넣지 않는다. 사전에 없는 말은 모델이 글에 직접 괄호로 풀고, 다시 나올 말이면 여기에 한 줄 추가한다.
