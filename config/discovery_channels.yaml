filings:      # radar/discovery_filings.py
  lookback_days: 3   # 처음 켠 날 볼 기간(이후는 마지막 실행일부터)

triage:       # scripts/discovery/channels.py
  days: 45                 # 이 기간의 단서만 선별에 쓴다
  confluence_bonus: 0.75   # 다른 채널 단서가 하나 더 겹칠 때마다 가점(상한 1.5)
  confluence_cap: 1.5
  pass_min: 6.0            # 채널 선별 통과(② 채널 선별) — 판단 카드 대기열 후보
  card_queue: 6            # 회차마다 판단 카드를 쓸 상위 수
  pulse_max: 5             # Pulse 경보 회차당 상한
  focus_max: 10            # 집중 명단 상한(조사 A — GS 확신 목록·제프리스 관행, 제외 규칙은 킬 규칙과 따로)
