# 한국 외 소비재 시장 트렌드 (마스터 지시 2026-11-14 "나는 한국 주식종목을 투자하기도 하지만 메인은 미국, 일본, 유럽이다.
#  한국 외 소비재 시장 트렌드를 파악하는 파이프라인을 만들어라")
#
# 두 층이다. 공식 통계(무엇이 실제로 팔리나 — 월간, 늦지만 정직하다) + 상향식 관심(무엇이 막 뜨나 — 매일, 빠르지만 단서다).
#   radar/consumer_macro.py      공식 통계 수집·지표(3개월 YoY·가속·5년 z) → knowledge/models/consumer_trends/macro_latest.json
#                                새 달이 나오고 문턱을 넘는 업종이 있으면 Pulse '지표 발표'(src-consumer-macro)
#   radar/consumer_discovery.py  애플 차트·스팀 판매 순위·위키 상위 문서·Google Trends 급상승 → discovery_latest.json → Pulse '소비재'
#   scripts/consumer/trends_board.py  주간 보드(outputs/consumer/trends_<날짜>.md)·대시보드 자료
# 원천 규칙(2026-11-14 확인): robots·약관 허용 + 공식 API만. 경제산업성(商業動態統計)은 robots.txt까지 비브라우저 접속을 403으로 막아 제외(접속 가장 금지).
#   위키백과 자체 API(/api/, /w/)는 robots 금지 — Wikimedia 조회수 API(wikimedia.org)만 쓴다. 아마존·월마트·타깃·틱톡은 제외(knowledge/methods/consumer_lens.md 3).
# 금지표: 업종 판매 증가 → 특정 기업 매출 / 관심 증가 → 매출. 노출(exposure)은 가설이다 — 2026-11-14 C단계 검정에서 관심·수입 신호는 회사 매출 예측을
#   지난 분기 성장률보다 낫게 하지 못했다(knowledge/models/consumer/nowcast.json). 이 보드는 '무엇이 움직이나'를 먼저 아는 도구이지 실적 예측기가 아니다.

macro:
  history_from: "2015-01"
  # 경보 문턱 — 등록부 prm-ctrend-*(운영 가정, 피팅 전). 가속 = 최근 3개월 YoY − 3개월 전의 3개월 YoY(%p), z = 최근 3개월 YoY의 직전 60개월 분포 대비
  alert: {accel_pp: 3.0, z: 1.5, accel_pp_noisy: 8.0}
