# 모델 포트폴리오 위험 엔진 1단계 (마스터 지시 2026-11-04 "1단계부터 구현", 설계 knowledge/methods/portfolio_management_design.md)
# 연구용 가상 포트폴리오 지표 — 마스터 계좌의 매매·비중 지시가 아니다. 등록부 prm-pm-*. 위험 정책 상수는 피팅하지 않는다(설계 3절).
universe:
  status: [보유, 관심]       # config/portfolio.yaml holdings 중
  market: AMEX:SPY
  themes:                    # Chiip 테마 팩터(ETF 수익의 SPY 잔차에 대한 종목 잔차의 β)
    AI 반도체: NASDAQ:SMH
    전력 인프라: NASDAQ:GRID
    원자력·우주: AMEX:URA
    방산: AMEX:ITA
risk:
  window: 252                # 일간 수익률 최대 길이
  min_days: 40               # 이보다 짧은 종목은 빼고 '이력 부족'으로 표시(IPO 종목)
  halflife: 63               # EWMA 반감기(일) — RiskMetrics 관행
  shrink: ledoit_wolf        # 축소 강도는 해석해(자동)
  annualize: 252
overlay:
  sigma_target: 0.20         # 연 변동성 목표 — 위험 정책
  dd_max: 0.25               # 허용 최대 낙폭 — 위험 정책
  w_max: 0.10                # 단일 종목 상한(2단계 구성에서 쓴다. 1단계는 위반 표시만)
  theme_max: 0.35            # 테마(군집) 상한
  event_haircut: 0.7         # 실적·보호예수 이벤트 창의 비중 승수
  event_window: {실적: [-3, 1], 보호예수: [-5, 3], 기타: [-1, 1]}   # 이벤트일 기준 영업일 아님(달력일)
  cvar_q: 0.95
# ── 2단계 구성(scripts/pm/construct.py, 마스터 지시 2026-11-04 "2단계 진행") ──
expected:
  scenario_probs: [0.25, 0.50, 0.25]   # 약세·기본(목표)·강세 — v2 시나리오 기본 확률과 같음
  ic: 0.05                   # 정보 계수 사전값(Grinold & Kahn 실무 통상 0.02~0.10)
  weights: {pwr: 0.3333, grinold: 0.3333, conv: 0.3334}   # 세 식 가중 — 없는 식은 빼고 다시 나눔
  k_kelly: 0.25              # 분수 켈리 — config/valuation_v2.yaml kelly_fraction과 같다
  rf: 0.04                   # 1년 무위험 수익(근사)
bl:
  lambda: 2.5                # 위험 회피 — 위험 정책
  tau: 0.05                  # He & Litterman 1999
  mrp: 0.05                  # 시장 위험 프리미엄(연) — CAPM 사전 Π = β × mrp. Damodaran 내재 ERP 4~5%대 관행
  view_conf: 0.3             # 컨빅션이 없는 견해의 신뢰(0~1)
opt:
  kappa: 0.002               # 회전 벌점(설계 단계 3에서 비용 장부로 점검)
  step: 0.05
# ── 3단계 가상 장부(scripts/pm/ledger.py, 마스터 지시 2026-11-04 "3단계 진행") ──
ledger:
  band: 0.20                 # 무거래 구간 — 목표 비중의 ±20% 안이면 거래하지 않음(Gârleanu & Pedersen 2013)
  band_abs: 0.005            # 목표가 작을 때의 절대 하한(비중 0.5%p)
  speed: 0.5                 # 목표 쪽 부분 조정 속도 a
  half_spread_bps: 10        # 스프레드 반(소형·중형 성장주 근사)
  eta: 0.5                   # 제곱근 충격 계수(Almgren–Chriss 실무)
  nav_usd: 1000000           # 충격 계산용 명목 규모(가상)
# ── 4단계 성과 귀속·학습(scripts/pm/attribution.py, 마스터 지시 2026-11-04 "4단계 진행") ──
attribution:
  min_days_factor: 20        # 팩터 귀속 최소 관측일
  ic_horizon: 20             # 실현 IC 수익 기간(거래일)
  min_days: 126              # 재보정 제안 최소 장부 일수(약 6개월, 설계 3절)
  dsr_min: 0.95              # 수축 샤프 기준(Bailey & López de Prado 2014)
  min_ic_dates: 60           # 실현 IC 날짜 수 하한
  ic_prior_weight: 60        # IC 축소: 사전값에 주는 관측 수 상당 가중
  trials_extra: 2            # 2단계에서 버린 설정 수(ERC 사전·총 변동성 그리놀드) — DSR 시도 수에 더한다
