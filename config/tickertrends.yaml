# TickerTrends 대체 데이터 신호(마스터 지시 2026-11-12 "TickerTrends로 데이터 파이프라인을 만들어") — radar/tickertrends.py가 하루 1회 읽는다.
# 키: TICKERTRENDS_API_KEY(D:\local-only\secrets\.env) — 없으면 '키 대기'로 건너뛴다. API는 유료(KPI Tracking Suite에 API 접근 요청, 별도 견적 — 2026-11-12 tiers 페이지).
# 약관(tickertrends.io/terms-conditions, 2026-11-12 읽음): 내부 업무용 한정 라이선스 — 재배포·제3자 공유·복제 금지.
#   → 수치는 마스터 개인 Pulse(내부)와 내부 판단 입력으로만. 기사·리포트·노션·공개 산출물에 수치를 옮기지 않는다(internal_only).
# 엔드포인트: GET https://api.tickertrends.io/signals?entity=…&signal_type=…, 헤더 Authorization: Bearer <키> (tickertrends.io/api-service 예제).
#   응답 필드(예제 기준, 실제 스키마는 키가 들어온 뒤 확인): intent_volume·acceleration_90d·persistence_score·peer_divergence·kpi_readthrough
signal_types: [consumer_demand]   # 공식 예제에 나온 값만. 다른 값은 키가 들어오면 문서로 확인해 추가
from_portfolio: true              # config/portfolio.yaml 보유·관심 종목 티커를 자동으로 넣는다
entities: []                      # 그 밖에 볼 브랜드·제품·회사명(TickerTrends 예제는 브랜드명 'HOKA')
max_calls: 40                     # 회차당 호출 상한(레이트 리밋 미확인 — 보수적으로)
alert:                            # 둘 다 넘을 때만 inbox(가속이 지속되는 관심만)
  acceleration_90d: 0.25
  persistence_score: 70
