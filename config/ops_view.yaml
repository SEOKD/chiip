# 운영 지표 3종 상수(마스터 지시 2026-11-14, ADR-033, scripts/tenbagger/ops_view.py) — 등록부 prm-ops-*
rule40:
  pass: 40        # Rule of 40 기준선(성장% + FCF 마진%)
  flat: 3         # 4개 분기 변화가 ±이 값 안이면 '거의 그대로'
cycle:
  bb_line: 1.0    # 4개 분기 수주/출하 비율 기준
  inv_gap: 0.05   # 재고 증가율 − 매출 증가율이 이보다 크면 '재고가 쌓인다'
implied:
  hi: 1.2         # 옵션 내재 ÷ 과거 실적일 평균 움직임 > hi → 평소보다 큰 움직임 예상
  lo: 0.8
options:
  enabled: true   # Cboe 지연 시세 자동 수집(radar/options_implied.py) — 마스터 승인 2026-11-14 "켜라". 끄면 --put 수동 입력만
  window_days: 30 # Analysis(gather)에서 실적일이 이 안이면 받는다
  due_days: 14    # run_hourly 정기 수집 — 실적일이 이 안인 감시 종목만
