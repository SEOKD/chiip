# 종합 9.5 연구 명단 — 마스터 지시 2026-10-31 "알파 및 손익비 점수가 매우 높다고 분석되는 종목이 있다면 … 텐배거 리포트에 다루는 종목, 텐배거 레이더 망에 잡히는
# 종목에만 국한하지 않고 기술적 관점과 시의성 요인도 넣어 이를 종합 평가해 10점 만점에 9.5점인 종목만 제시하라"
# 계산: scripts/discovery/composite.py. 지표·연구 후보일 뿐 매수 권유가 아니다 — 마스터 포지션을 읽지 않고, 비중·시점·금액을 내지 않는다.
threshold: 9.5
weights: {alpha: 0.30, reward_risk: 0.30, technical: 0.20, timing: 0.20}
# 알파·손익비 원점수 → 10점 환산의 만점 기준. 2026-10-31 전체 134종목 최고 알파 7.3, 비대칭 점수 8 이상 1종목이라 원점수 그대로면 9.5에 닿을 수 없다
full_marks: {alpha: 8.0, reward_risk: 8.0}
gates:
  min_adv_usd: 5000000     # 30일 평균 거래대금
  min_technical_for_queue: 8.0   # 알파가 없는 종목이 이 값을 넘으면 v2 대기열에 올린다
  queue_per_run: 3
technical:   # 합 10
  above_sma50: 2
  sma50_above_sma200: 2
  near_52w_high: 2          # 고점의 near_ratio 이상
  near_ratio: 0.85
  momentum: 2               # 1개월·3개월 수익률 모두 양수
  rsi_band: 1
  rsi_low: 50
  rsi_high: 75
  volume: 1
  volume_min: 1.2
timing:      # 합 10
  catalyst: 3               # catalyst_days일 안에 확인 사건
  catalyst_days: 30
  new_primary: 3            # 7일 안에 새 1차 자료
  revision: 2               # 30일 EPS 추정 상향
  sector: 2                 # 시장 국면의 섹터 판정이 '이익 상향과 주가 동행'
