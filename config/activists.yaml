# 행동주의 명단 (마스터 지시 2026-11-15 "행동주의 표적" 발굴 채널 — radar/discovery_filings.py, 렌즈 knowledge/methods/sector_lenses/activism.md)
# 식별자는 2026-11-15 조사 C가 확인: 미국 EDGAR CIK(제출 법인이 여럿이면 filer_ciks), 일본 EDINET 코드 목록 제출인명, 한국 DART 제출인명(flr_nm).
# 이름 일치: 일본은 NFKC 정규화 뒤(전각 영문·기호 혼재), 한국은 공백을 지운 뒤 대소문자 무시(DART가 외국 이름의 공백을 뺀다).
# 등급(tier)은 조사 C 제안 사전값 — A 대형·상시 캠페인, B 중형, C 나머지. Saba(폐쇄형 펀드 전문)는 따로 본다.
# 수익 사전값: 미국 13D 공시 전후 7.2%(−20,+20) 중 탐지 뒤(+2~+20일) 약 +2%, 매각 요구 +8.54%, 늑대 무리(여러 행동주의) ×2.2(Becht 외 2017),
#   일본 +1.8%(−5,+5)·적대적 +3.8%(Hamao·Kutsuna·Matos), 한국 +2.5%(0,+5, 미검증) — config/discovery_channels.yaml activist prior.
# 성과는 '결과(이사 선임·매각·환원)'가 날 때만 난다: 북미 61%, 아시아 18%(2000~2010, Becht 2017) → 결과 추적이 킬 조건.
