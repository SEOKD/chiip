# 결정론 문턱 설정 (ADR-013 H2, 마스터 승인 2026-10-31)
# 2026-10-31 마스터 지시 "항상 활성화되도록 설정하라"로 앱 예약 chiip-pulse로 되돌렸다. Windows 작업 chiip-pulse-trigger는 꺼 둔다.
pulse_trigger:
  enabled: true                   # 2026-11-04 마스터 지시(시의성 ④): 앱 예약 chiip-pulse는 켠 채 긴급 원본만 바로 띄운다. 앱 회차가 도는 중이면 peek가 잠금을 보고 건너뛴다
  urgent:                         # 앱 예약(10분)을 기다리지 않을 1차 원본 — 사전값(미검증), 시의성 장부로 점검
    enabled: true
    classes: [실적, 속보 판단, 숏 리포트, 공시, 보도자료, 파이낸싱]
    min_score: 8
    max_age_min: 30
  skill: chiip-pulse              # ~/.claude/scheduled-tasks/<skill>/SKILL.md 본문을 프롬프트로 쓴다
  timeout_min: 25                 # Windows 작업 시간 상한(30분)보다 짧게
  daily_model_cap: 40             # 하루 긴급 모델 회차 상한(최근 4일 기준 하루 약 20건 예상). 넘으면 마스터에게 한 번 알리고 멈춘다
  max_budget_usd: 8               # 회차당 추정 비용 상한(공식 문서상 클라이언트 추정값이라 조금 넘을 수 있다)
  fail_alert_after: 2             # 연속 실패가 이 횟수에 닿으면 알린다
  heartbeat_stale_min: 20         # 문턱이 이만큼 안 돌면 run_hourly가 알린다
  stall_min: {weekday: 20, weekend: 90}   # 앱 예약 회차(주중 5분·주말 1시간)가 이만큼 안 돌면 급하지 않은 새 자료도 문턱이 대신 띄운다(2026-11-14 점검 — 11/10 앱 예약 12시간 정지). 상한은 daily_model_cap 그대로
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Write
    - Edit
    - WebSearch
    - WebFetch
    - "Bash(py *)"
    - "Bash(python *)"
    - "Bash(git status*)"
    - "Bash(git log*)"
    - "Bash(git diff*)"
    - "PowerShell(py *)"
    - "mcp__claude_ai_Fiscal_ai__*"
    - "mcp__claude_ai_TradingView__mcp-tv-get-symbol-data"
    - "mcp__claude_ai_TradingView__mcp-tv-get-symbol-data-batch"
    - "mcp__claude_ai_TradingView__mcp-tv-get-ohlcv"
    - "mcp__easyconomics__*"          # 2순위 채널(ADR-014)
  disallowed_tools:
    - "Bash(git push*)"
    - "Bash(git commit*)"
