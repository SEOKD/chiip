# 포커스 종목 점수 (BUILD_PROMPT §21.13, 마스터 지시 2026-10-28)
# AI 밸류체인 유니버스(config/valuation.yaml universe) 전 종목을 매일 10점 만점으로 점수화하고,
# 기준점 이상인 종목만 레이더가 따라간다(뉴스·공시·보도자료·X). 정책·학회·협회 자료는 종목과 무관하게 받는다.
#
# 네 요소 — 모두 '추적할 가치'(어느 방향이든 크게 움직일 여지)로 잰다. 높을수록 지켜볼 이유가 크다.
#   attention   시장의 관심도: 7일 언급량(수집 전 단계에서 센 전체 언급, 매체 제한 전) + 30일 주가 변동 크기
#   narrative   내러티브 매력도: 등록부 내러티브 노출 × 강도(언급 추세), 단계(확산·컨센서스가 높음)
#   fundamental 펀더멘털 전망 상하방 룸: EPS 리비전 크기·폭, 역DCF 내포 성장 − 컨센서스 괴리, 시나리오 비대칭
#   multiple    멀티플 프리미엄 정도: 피어 대비 프리미엄·정당 P/E 잔차·자기 역사 백분위의 극단성(크게 비싸거나 싸면 높음)
# 계산(코드)이 가능한 요소는 코드가 0~10을 매기고, 데이터가 없거나 코드가 놓친 맥락은 모델이 판단 점수와 이유를 남긴다
# (scripts/focus/score.py, 스킬 focus-score). 판단 점수는 '판단'으로 표시되어 계산 점수와 구분된다.

threshold: 5.0
min_components: 2          # 요소가 2개 미만이면 총점 없음(미산정)
weights: {attention: 0.25, narrative: 0.25, fundamental: 0.25, multiple: 0.25}
always_include: []         # 점수와 무관하게 항상 추적할 종목 id (예: co-skhynix). 마스터가 정한다
retired: true              # 2026-10-29: 포커스 점수 예약 작업(chiip-focus-score)이 정리돼 점수가 갱신되지 않는다 → 관문은 감시 목록 전체(약 200종목)를 추적
fail_open: true            # 점수 파일이 없거나 오래되면(3일) 관문을 열어 전부 받는다(정보 누락 방지)
stale_days: 3
send_time_note: "매일 06:40 KST 예약 작업(chiip-focus-score) → 텔레그램으로 점수표·변화 발송"
