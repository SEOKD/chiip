# 텐배거 판단 체계 — 구루 교차 점검 (마스터 지시 2026-11-21, 방법론 knowledge/methods/tenbagger_playbook.md, 계산·검사 scripts/tenbagger/playbook.py)
# "스탠리 드러켄밀러, 베일리 기포드, 론 바론, 피터 린치, 워렌 버핏 등 글로벌 구루의 투자 논리를 학습하고 2020년대 시장 역학과 투자 성공 방정식도 참조"
# 여섯 관점은 서로 다른 질문을 던진다 — 한 관점만 통과한 종목은 그 관점의 맹점을 그대로 안는다. 관점마다 '통과·미달·미확인'과 근거를 적고,
# 가장 약한 관점(dissent)을 스스로 지목한다(마스터 가설도 같은 강도로 반대 검증 — CLAUDE.md). 수치는 사전값(prm-pb-*), 채택 뒤 성과로만 고친다.

views:
  runway:
    name: 성장 여지
    guru: 베일리 기포드(LTGG 질문 1·2)
    ask: "5년 안에 매출이 2배가 될 자리가 있나, 10년 뒤에도 커지나"
    how: "5년 2배 = 연 14.9%. 참조 시장 크기·점유율·신제품·지역으로 근거를 댄다. 컨센서스 매출 경로와 비교(스크립트가 계산)"
  moat_returns:
    name: 해자와 자본수익률
    guru: 워렌 버핏(2007 서한 해자, 1986 서한 소유주 이익) · 베일리 기포드(질문 3·6·7)
    ask: "경쟁우위가 무엇이고, 투하자본수익률(ROIC)이 자본비용보다 높으며 유지·상승하나"
    how: "ROIC = 세후 영업이익 ÷ 투하자본(스크립트). 해자 종류(전환 비용·네트워크·원가·규제·무형)와 반증을 1차 자료로"
  reinvestment:
    name: 재투자 복리
    guru: 워렌 버핏(1984 서한 — 유보 1달러가 시장가치 1달러 이상) · 론 바론 · 베일리 기포드(질문 8)
    ask: "번 돈을 높은 수익률로 다시 넣을 곳이 있나 — 자본 배분(재투자·인수·자사주·희석) 이력은"
    how: "지속 가능 성장 ≈ ROIC × 재투자율(스크립트, 근사). 희석(주식 수 증가)과 인수 성과를 함께 본다"
  people:
    name: 사람과 문화
    guru: 론 바론(뛰어난 경영진) · 베일리 기포드(질문 4·5) · 피터 린치(내부자 매수)
    ask: "경영진이 주주와 같은 배를 탔나 — 창업자·내부자 지분, 기회형 내부자 매수, 문화가 경쟁우위에 기여하나"
    how: "위임장(DEF 14A)·사업보고서 지분, Form 4·소유상황보고(radar/insider_buys.py), 임원 교체 이력. 공개 직책자의 공개 정보만"
  change:
    name: 변화의 방향
    guru: 스탠리 드러켄밀러
    ask: "18~24개월 뒤 이익 그림이 지금과 얼마나 다른가, 유동성 국면은 그 변화를 받쳐 주나"
    how: "2년 뒤 EPS 추정 ÷ 다음 12개월 EPS(스크립트), 추정 수정 방향, 금리·신용 스프레드 20일 변화(스크립트). 지금 실적이 아니라 바뀔 그림에 값을 매긴다"
  mispricing:
    name: 5배 경로와 시장이 모르는 이유
    guru: 베일리 기포드(질문 9·10) · 피터 린치(PEG·6분류) · 드러켄밀러(밸류에이션은 타이밍이 아니다)
    ask: "어떻게 5배 이상이 되나(이익 성장 × 배수 변화), 시장은 왜 아직 값을 안 매기나"
    how: "배수 사다리(ladder.py)·가격 내포 성장(역DCF)·합의와의 차이(consensus_gap)·린치 분류(lynch.py). 소외는 오가격이 아니다 — 이유를 댄다"

gate:                       # 위원회 메모(memo_check) 관문 — 2026-11-22 이후 메모부터
  from_date: "2026-11-22"
  pass_min: {focus: 4, bench: 3}     # 여섯 관점 중 '통과' 수(prm-pb-pass-min) — 미확인은 통과가 아니다
  must_not_fail: [moat_returns]      # 이 관점이 '미달'이면 focus 불가(해자 없는 성장은 복리가 끊긴다 — 버핏·Alta Fox 80% 진입장벽)
  kpis_min: 2                        # 보유 규율: 투자 논리가 살아 있는지 볼 지표 최소 개수
  horizon: [3, 10]                   # 판단 기간(년)

arithmetic:                 # 스크립트가 쓰는 상수
  multiples: [2, 5, 10]
  years: [5, 7, 10]
  double_5y: 0.1487         # 5년 2배 = 연 14.87%
  rare_cagr: 0.45           # 목표 배수 ÷ 판단 기간이 이 속도 이상이면 '희소' 경고(사전값 — 5년 6.4배. Chiip 조사 G 기저율 5년 3배 6.8%·10배 0.69% 사이)
  drawdown_review: 0.50     # 고점 대비 이만큼 빠지면 '재심사'(제외가 아니다 — 최고 종목도 큰 낙폭을 겪는다, Mauboussin·Callahan 2025)

liquidity:                  # 드러켄밀러 유동성 국면(knowledge/models/portfolio/market_latest.json macro) — 사전값
  tighten: {us10y_d20_bp: 25, hy_d20_bp: 40}     # 10년물 20일 +25bp 이상 또는 하이일드 스프레드 +40bp 이상 → 긴축 쪽
  ease: {us10y_d20_bp: -25, hy_d20_bp: -30}
