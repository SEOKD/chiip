# 공개 텔레그램 채널 수집 (마스터 지시 2026-11-01 "모든 피드를 다 수집하고 실시간으로 파악하라") → radar/pollers/tg_channels.py, docs/channels/telegram.md
# always: 글이 모두 본업 주제인 채널 — 키워드 없이도 Pulse 회차를 연다
min_chars: 20     # 이보다 짧은 글은 회차를 열지 않는다(수집은 한다)
# 국내 증시 시황(코스피·코스닥 마감·등락·수급)은 Pulse로 보내지 않는다 — 2026-11-25 마스터 지시 "코스피 시황은 Pulse로 안 보내도 된다". 수집은 한다
skip_market_wrap: '(코스피|코스닥|KOSPI|KOSDAQ)[^\n]{0,60}?(마감|출발|시황|장중|사이드카|서킷|순매도|순매수|[-+−]\s?\d+(\.\d+)?%)|국내 증시|증시 시황'
