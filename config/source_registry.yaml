# 수집 원천 등록부 (BUILD_PROMPT §5.11). 1단계는 T0 원천 위주의 초안.
# verified: false = 공식 문서로 엔드포인트·호출 제한·약관을 아직 확인하지 않음 → 구현 직전 확인(§0.2-4)
# enabled: false = 아직 수집기 없음. 3단계부터 순서대로 켠다.

- id: src-dart
  name: DART 전자공시 OpenAPI
  category: A-규제공시
  method: api
  endpoint_doc: "https://opendart.fss.or.kr"
  auth: env:DART_API_KEY
  scope: [T0, T1]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "일일 호출 한도 확인 필요"
  reliability_default: 1차
  verified: false
  enabled: false

- id: src-kind
  name: KRX KIND 공시
  category: A-규제공시
  method: html
  endpoint_doc: "https://kind.krx.co.kr"
  auth: none
  scope: [T0, T1]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "robots.txt·이용약관 확인 필요. DART와 중복 시 DART 우선"
  reliability_default: 1차
  verified: false
  enabled: false

- id: src-naver-news
  name: 네이버 뉴스 검색 API
  category: F-뉴스
  method: search_api
  endpoint_doc: "https://developers.naver.com/docs/serviceapi/search/news/news.md"
  auth: env:NAVER_CLIENT_ID,NAVER_CLIENT_SECRET
  scope: [T0]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "일일 호출 한도 확인 필요. 원문 저장 금지(제목·링크·요지만)"
  reliability_default: 2차
  verified: false
  enabled: false

- id: src-google-news-rss
