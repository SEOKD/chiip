# 수집 원천 등록부 (BUILD_PROMPT §5.11)
# module: radar/pollers/<module>.py 또는 rss(공통). 없으면 run_poll이 건너뜀.
# verified: 공식 문서·첫 호출로 엔드포인트·약관을 확인했는가
# enabled: true면 run_poll(로컬) 또는 클라우드 루틴이 사용. 키가 없으면 자동으로 건너뛰고 health에 기록.

# ===== A. 규제 공시 =====
- id: src-dart
  name: DART 전자공시 OpenAPI (list.json)
  category: A-규제공시
  module: dart
  method: api
  endpoint_doc: "https://opendart.fss.or.kr/guide/detail.do?apiGrpCd=DS001&apiId=2019001"
  auth: env:DART_API_KEY
  scope: [T0]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "제외(2026-10-28 마스터 결정 — 국내 공시는 마스터가 이미 실시간으로 접함, 타 봇과 중복). 호출 한도 초과 시 status 020. corp_code 1회 조회 시 최대 100개사"
  reliability_default: 1차
  verified: true
  enabled: false

- id: src-kind
  name: KRX KIND 공시
  category: A-규제공시
  method: html
  endpoint_doc: "https://kind.krx.co.kr"
  auth: none
  scope: [T0]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "DART와 중복. robots.txt·약관 확인 전 비활성"
  reliability_default: 1차
  verified: false
  enabled: false

# ===== F. 뉴스 =====
- id: src-naver-news
