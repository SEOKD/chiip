  method: search_api
  endpoint_doc: "https://developers.naver.com/docs/serviceapi/search/news/news.md"
  auth: env:NAVER_CLIENT_ID,NAVER_CLIENT_SECRET
  scope: [T0]
  interval_min: 5
  run_on: local
  language: ko
  terms_note: "제외(2026-10-28 마스터 결정 — 국내 뉴스는 마스터가 이미 접함). 참고: 개발자센터 검색 API 신규 신청 7/31 종료·API HUB 이관, 9/7 개정 특약이 결과의 저장·캐싱·AI 입력·요약 금지(보도 기준)"
