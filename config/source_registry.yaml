# ===== G. 정책·행정명령 — 미국(연방·주·지방)·EU·회원국·일본·대만·중국 (§21.12) =====
# 1차 공식 RSS가 열리면 직접 받고 include_regex로 분야 글만 남긴다. 자동 접속을 막는 곳(METI·MOEA·MOFCOM·상무부 403 등)은
# 우회하지 않고 Google News를 정부 도메인(site:)으로 제한해 받는다. doc_type 규제·정책은 텔레그램 매체 제한 대상이 아님.
- id: src-policy-us-fed
  name: 미국 연방 공식 RSS(백악관 뉴스·팩트시트, NIST·CHIPS, 에너지부)
  category: L-미국정부
  module: rss
  method: rss
  feed_urls: ["https://www.whitehouse.gov/news/feed/", "https://www.whitehouse.gov/fact-sheets/feed/", "https://www.nist.gov/news-events/news/rss.xml", "https://www.energy.gov/rss/newsroom.xml"]
  include_regex: "semiconductor|chip|CHIPS|artificial intelligence|\\bAI\\b|data cent|export control|tariff|Section 232|critical mineral|rare earth|gallium|germanium|grid|transmission|nuclear|supercomput|quantum|Genesis Mission"
  endpoint_doc: "https://www.whitehouse.gov/news/"
  auth: none
  scope: [글로벌]
  interval_min: 30
  max_age_days: 3
  run_on: local
  language: en
  doc_type: 규제·정책
  terms_note: "공식 RSS 4개 응답 확인(2026-10-28). 행정명령은 src-whitehouse(presidential-actions), 관보는 src-fedreg"
  reliability_default: 1차
  verified: true
  enabled: true

- id: src-policy-us-fed-gn
  name: 미국 연방 기관(상무부·BIS·USTR·재무부·의회) — Google News 도메인 제한
  category: L-미국정부
  module: rss
  method: rss
  feed_queries:
    - "site:bis.gov when:2d"
    - "site:commerce.gov (semiconductor OR chips OR \"artificial intelligence\" OR tariff OR \"Section 232\") when:2d"
    - "site:ustr.gov (semiconductor OR \"Section 301\" OR tariff) when:2d"
    - "site:treasury.gov (\"outbound investment\" OR semiconductor) when:2d"
    - "site:congress.gov (semiconductor OR \"chip security\" OR \"export control\") when:2d"
  hl: en-US
  gl: US
  include_regex: "semiconductor|chip|export|Entity List|tariff|Section 232|Section 301|artificial intelligence|\\\
  bAI\\b|outbound|comput|critical mineral|rare earth"
  endpoint_doc: "https://news.google.com/rss"
  auth: none
  scope: [글로벌]
  interval_min: 60
  max_age_days: 3
  run_on: local
  language: en
  doc_type: 규제·정책
  terms_note: "commerce.gov RSS 403·bis.gov RSS 파싱 불가(2026-10-28) → 우회 대신 Google News 색인. 링크는 기관 원문으로 연결"
  reliability_default: 1차(기관 문서 색인)
  verified: true
  enabled: true

- id: src-policy-us-state
  name: 미국 주·지방정부(텍사스·인디애나·애리조나·뉴욕·오하이오·아이다호, 거점 시·카운티) — Google News 도메인 제한
