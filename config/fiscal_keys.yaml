# Fiscal.ai 회사 키 캐시 — 감시 목록 id → '<EXCHANGE>_<TICKER>'(knowledge/methods/data_fiscal.md, 마스터 지시 2026-10-30)
# 모르는 id는 모델이 company_profile로 NYSE_·NASDAQ_ 순서로 확인하고 `py scripts/fiscal/adapter.py --key <id> <키> [terminalUrl]`로 넣는다.
# 한국·일본·대만 상장사는 키·데이터 범위를 확인하고, 없으면 넣지 않는다(지어내지 않는다). terminal_url은 응답 값 그대로(손으로 만들지 않는다).
# 어닝 캘린더(radar/markets/earnings_calendar.py)도 이 키를 코드 접미사 변환보다 먼저 쓴다 — 1차 상장 키로 풀리는 종목과 코드 없는 일본 종목.
# Fiscal 회사 키가 없는 종목(2026-10-30 company_profile 확인): 코스닥 전부(ISC·산일전기 등 → KIND로), Ibiden(4062)·Ajinomoto(2802)·Nittobo(3110).
# 일본 상장 키는 XJPX_<코드>. 2026-10-30 확인(마스터 지시 "일본 종목 실적에도 est."): 감시 일본 60종목 중 키가 있는 17곳(도쿄일렉트론·어드반테스트·디스코·레이저텍·
# 신에츠·무라타·TDK·HOYA·르네사스·후지쿠라·키옥시아·히타치·미쓰비시전기·미쓰비시중공업·NEC·후지쓰·소프트뱅크G)도 Fiscal 추정·Zacks·주가가 모두 '아직 없음' — est. 불가.
# Fiscal의 일본 재무·추정은 미국 상장 기업(도요타·소니·MUFG 등)만. 재확인은 scripts/fiscal/templates/jp_est_check.js.
