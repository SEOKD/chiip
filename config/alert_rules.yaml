# 알림 등급 규칙 (BUILD_PROMPT §10.6, §21.3) — 초안, 마스터 확정 전
levels:
  P0: {deliver: immediate, flash_note: true}
  P1: {deliver: batch_60min}
  P2: {deliver: brief}
  P3: {deliver: archive}

# 모델 판정 전에 스크립트가 바로 보내는 P0 (T0 + DART 보고서명 패턴)
deterministic_p0:
  scope_tiers: [T0]
  dart_report_patterns:
    - "잠정"                  # 연결재무제표기준영업(잠정)실적 등
    - "단일판매ㆍ공급계약"
    - "단일판매·공급계약"
    - "신규시설투자"
    - "유형자산취득"
    - "생산중단"
    - "영업정지"
    - "대표이사변경"
    - "타법인주식및출자증권취득"
    - "회사합병"
    - "회사분할"
  dart_exclude_patterns:
    - "[기재정정]"            # 정정공시는 P1로 (원공시와 대조 필요)
  message_prefix: "[P0-규칙]"
  suffix: "(1차 판정 전)"

# 키워드 가중 — radar-triage 참고값
priority_keywords:
  P0: [잠정실적, 공급계약, 증설, 생산 중단, 화재, 수출통제, Entity List]
  P1: [양산, 인증, 퀄, qualification, 목표주가, 투자의견, HBM4, CoWoS, 유리기판]

# 폴링 간격(분) — 티어 × 시간대(KST). run_poll.py가 사용
schedule:
  weekday:
    - {from: "08:00", to: "16:00", T0: 5, T2: 60}
    - {from: "16:00", to: "23:00", T0: 10, T2: 60}
    - {from: "23:00", to: "08:00", T0: 30, T2: 60}
  weekend:
    - {from: "00:00", to: "24:00", T0: 60, T2: 180}
  boost_on_calendar_days: 0.5     # calendar.csv에 해당 기업 일정이 있는 날은 간격 × 0.5

# 비용 상한
caps:
  daily_model_calls: 200
  daily_p0_deep_analysis: 10
  overflow_to: brief

# 텔레그램 알림 매체 제한 (2026-10-28 마스터 지시)
# - 국내 언론사 기사는 보내지 않는다. 기사는 아래 매체만. 막힌 항목은 브리프 대기열로 간다(수집은 계속).
# - 기업 뉴스룸 보도자료·공시·정부 문서·논문(doc_type이 '기사'가 아닌 것)은 언론 기사가 아니므로 이 제한을 받지 않는다.
telegram_filter:
  allowed_publishers:          # 기사 매체명 전체 일치(대소문자 무시) — Google News 제목 끝 ' - 매체명'
    - "Reuters"
    - "Bloomberg"
    - "Bloomberg.com"
    - "The Wall Street Journal"
    - "Wall Street Journal"
    - "WSJ"
    - "The Information"
    - "Business Insider"
    - "CNBC"
    - "Seeking Alpha"            # 2026-10-28 추가(마스터 지시). 기고 분석 글은 의견
    - "PR Newswire"
    - "GlobeNewswire"
    - "GlobeNewswire News Room"
  allowed_wire_sources: [src-prn]   # 보도자료 배포처 수집분 중 텔레그램 허용(Business Wire src-bw는 제외)
  wire_sources: [src-prn, src-bw, src-globenewswire]
  brief_only_doc_types: [리서치]   # 뉴스레터 RSS 글은 브리프로만. X 글(SNS)은 마스터 지시로 텔레그램 허용(§21.12)
  # 규제·정책(미국 연방·주·지방, EU·회원국, 일본·대만·중국)·학회·협회·보도자료·공시는 기사가 아니므로 매체 제한 없이 P0·P1 발송

# 규칙 상향 (2026-10-29 마스터 지시 — Broadcom–Anthropic 630억 달러 금융·앤트로픽 IPO 신청이 T0 중심 판정 기준 탓에 P2로 묻힌 뒤)
# 판정 모델이 P2·P3로 둔 항목도 아래 규칙에 걸리면 P1로 올린다(radar/promote.py). 같은 신호(서명)는 window_h 안에 1번만 — 같은 사건 기사 수십 건 폭주 방지.
promote_p1:
  window_h: 24
  mega_deal:                   # AI 밸류체인 대형 거래: 100억 달러 이상 + AI·칩·데이터센터·전력 문맥 + 거래 문구
    min_billion: 10
    context: '\bAI\b|chip|GPU|TPU|ASIC|accelerator|data ?cent|compute|semiconductor|HBM|memory|power|nuclear|gigawatt|\bGW\b|hyperscal|cloud'
    deal: 'deal|financ|contract|agreement|order|invest|capex|spend|lease|loan|debt|bond|acqui|buy|stake|partner|commit|fund'
  frontier_ipo:                # 프런티어 AI 랩·AI 인프라 비상장사의 상장 서류
    labs: ["Anthropic", "OpenAI", "xAI", "Mistral", "Safe Superintelligence", "Thinking Machines", "Perplexity", "Cohere", "Databricks", "Cerebras", "Lambda", "Crusoe", "Groq", "SambaNova"]
    terms: '\bIPO\b|\bS-1\b|\bF-1\b|prospectus|listing|go(es|ing)? public|public offering|files? (confidentially )?(for|to)'
  exclusive:                   # 주요 매체 단독(감시 기업이 잡힌 것만)
    publishers: ["Reuters", "Bloomberg", "Bloomberg.com", "The Wall Street Journal", "Wall Street Journal", "WSJ", "The Information"]
    pattern: '^Exclusive\b|\bExclusive:|\(Exclusive\)|\bScoop\b|\bsources say\b'
  ai_financing:                # AI 밸류체인 자금 조달 10억 달러 이상(문구는 config/financing_watch.yaml terms, 이름은 org_names 또는 감시 기업)
    min_billion: 1
  ma_talks:                    # 감시 기업 M&A 협상·인수 보도(주요 매체) — 1차 출처 대기 P1
    pattern: 'in talks|nears? (a )?deal|is said to|weighs? (a )?(sale|bid|deal)|explor\w* (a )?sale|to (buy|acquire)|agrees? to (buy|acquire)|acquisition of|merger|takeover|\bbuyout\b'
  portfolio_related:           # config/portfolio.yaml holdings의 related(경쟁사·고객) + 사건 문구 → '보유 ○○ 관련'
    event: 'deal|contract|order|wins?\b|financ|custom|design win|supply|guidance|earnings|results|acqui|partner|capex|lawsuit|ban\b|tariff|price|launch|ship'

# 신선도 관문(§21.13 보강, 2026-10-28 마스터 지시 "무조건 시의성"): 공개 시각이 이보다 오래되면
# collect = 저장하지 않음(판정·알림 대상에서 제외), alert = 판정돼도 텔레그램으로 보내지 않음. 단위 시간.
# 공개 시각을 못 읽으면 기사·SNS·리서치·보도자료는 버리고, 공시·정책·학회는 수집 시각 기준으로 받는다.
freshness:
  collect: {기사: 36, SNS: 36, 리서치: 72, 보도자료: 48, 공시: 72, 실적: 72, 규제·정책: 72, 학회·협회: 72, default: 48}
  alert: {기사: 24, SNS: 24, 리서치: 48, 보도자료: 24, 공시: 48, 실적: 48, 규제·정책: 48, 학회·협회: 48, default: 24}
  drop_undated: [기사, SNS, 리서치, 보도자료]
