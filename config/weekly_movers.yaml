# 글로벌 증시 주간 상승률 (위클리 리뷰 · Dean's Ticker 형식) — draft, 마스터 확인 전
# 수집기: radar/markets/weekly_movers.py (EODHD 스크리너 API, 키 EODHD_API_KEY는 D:\local-only\secrets\.env)
# 출력: knowledge/models/weekly_movers/YYYY-Www.csv  — 토요일 06:00~09:00 KST 사이 1회(위클리 리뷰 09:13 전)
# 등락률: EODHD 스크리너 refund_5d_p(최근 5거래일). 휴장일이 낀 주는 금요일→금요일과 다를 수 있음(파일에 표시)

provider: tradingview     # 2026-10-31 — Weekly Review 모델이 TradingView 스크리너로 뽑고 radar/markets/weekly_movers.py --put 으로 저장. 아래 EODHD 설정은 키가 들어올 때만 쓴다
tradingview:
  sort_by: "change|1W"    # 금요일 대 금요일. Perf.W는 기준일이 달라 쓰지 않는다
  # market_cap_basic은 현지 통화다
  regions:
    - {key: US, market: america, min: 10000000000, exchange: [NYSE, NASDAQ, AMEX]}
    - {key: US_SMALL, market: america, min: 1000000000, max: 10000000000, exchange: [NYSE, NASDAQ, AMEX]}
    - {key: JP, market: japan, min: 150000000000}
    - {key: KR, market: korea, min: 280000000000}
    - {key: TW, market: taiwan, min: 30000000000}
    - {key: HK, market: hongkong, min: 7800000000}
    # 유럽은 나라별로 뽑아 합친다. 영국 LSE는 0으로 시작하는 해외 주식 코드를 빼고, 독일은 XETR만
    - {key: EU, market: [uk, germany, france, switzerland, sweden, denmark, norway, netherlands, italy, spain], min: 900000000, min_sek_dkk_nok: 9000000000}
link: "https://t.me/d_ticker"
fetch_limit: 100          # 거래소별로 5일 상승률 상위 몇 개를 받아 거를지(최대 500)
min_avg_volume_200d: 50000 # 거래량 하한(주) — 거래 거의 없는 종목 제외

regions:
  - key: US
    title: "US"
    count: 20
    exchanges: [us]
    market_cap_usd_min: 10_000_000_000
  - key: US_SMALL
    title: "US(<$10B)"
    count: 10
    exchanges: [us]
    market_cap_usd_min: 1_000_000_000
    market_cap_usd_max: 10_000_000_000
  - key: EU
    title: "Europe"          # 영국 포함(채널 형식상 Europe 한 묶음)
    count: 10
    exchanges: [LSE, XETRA, PA, AS, MI, MC, SW, ST, CO, HE, BR, OL]
    market_cap_usd_min: 1_000_000_000
  - key: JP
    title: "Japan"
    count: 10
    exchanges: []            # EODHD 도쿄 거래소 코드 미확인 — 키 발급 후 exchanges-list로 확인해 채움
    market_cap_usd_min: 1_000_000_000
  - key: KR
    title: "Korea"
    count: 10
    exchanges: [KO, KQ]
    market_cap_usd_min: 200_000_000   # 약 3천억 원(예시 목록 기준 추정 — 마스터 확인)

# 통화별 USD 환산(시총 하한 계산용). 스크리너 시총은 상장 통화 기준이라 환산 필요. 매 실행 시 EODHD 환율로 갱신, 실패하면 아래 값
fx_fallback_per_usd: {USD: 1, GBP: 0.78, GBX: 78, EUR: 0.92, CHF: 0.88, SEK: 10.5, DKK: 6.9, NOK: 10.8, JPY: 150, KRW: 1400}

# 이름에 이게 들어가면 제외(우선주·ETF·워런트 등)
exclude_name_pattern: '\b(ETF|ETN|Fund|Trust Units|Warrant|Rights|Preferred|Pref|SPAC|Acquisition Corp)\b|우선주|\d우B?$|스팩'
