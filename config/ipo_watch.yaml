# 대형 비상장사 상장(IPO) 서류 실시간 감시 (마스터 지시 2026-11-13 "Anthropic처럼 큰 회사의 상장 소식이 나오면 SEC에 S-1이 뜨는 즉시 가져와 풀이")
# 수집기: radar/pollers/ipo_watch.py(10분, EDGAR 전문검색 efts — 문서 메타데이터, 원문은 SEC_USER_AGENT 필요). 설계: docs/decisions/ADR-030-ipo-watch.md
# 고정 목록이 아니다 — Chiip(chiip-pulse 회차)이 상장 추진·주관사 선정·비공개 제출(DRS) 보도를 보면 여기에 추가하고 status를 바꾼다.
# 선정 기준: ① AI 밸류체인(모델·컴퓨트·반도체·데이터센터 전력)에서 공모 규모가 클 회사 ② 한국 기업(메모리·파운드리·전력 기기) 공급망 언급 가능성
#           ③ 이미 상장한 회사는 넣지 않는다(Cerebras·CoreWeave·Nebius). why는 보도·서류 기준이며 미확인 부분은 '보도'로 적는다.
# status: filed(S-1 공개) · reported(상장 추진 보도) · watch(대형 비상장, 상장 시 대상)
# names: EDGAR 표시명과 맞출 이름(대소문자 무시, 단어 경계). cik를 알면 cik가 우선
forms: [S-1, S-1/A, F-1, F-1/A, 424B4, DRS, DRS/A, FWP, RW]   # FWP = 공모 마케팅 자료(로드쇼), RW = 등록 철회
large_offering_usd: 1.0e9     # 감시 목록 밖이라도 최대 공모 총액(수수료 첨부 EX-FILING FEES)이 이 이상이면 Pulse 후보(원문 필요)
poll_min: 10
