# 리포트 이미지(마스터 지시 2026-11-08, 지시서 v1.2 종목·v1.1 산업) — Gemini 이미지 API. 구현 scripts/tenbagger/product_images.py·image_check.py, ADR-017
# 그림은 Gemini(글자 없는 개념도), 이름표·BOM 표·출처는 Chiip이 datapack/제품 BOM 사실로 얹는다.
backend: vertex                     # 2026-11-08 마스터 지시 — Vertex AI(에이전트 플랫폼). 인증은 scripts/tenbagger/vertex_auth.py: VERTEX_API_KEY 우선(로그인 만료 없음), 없으면 gcloud ADC. aistudio = 예전 API 키 경로(선불 크레딧 0으로 402)
vertex: {project: project-2e9891a3-ef5c-46af-956, location: global}   # My First Project. ADC 쿼터 프로젝트도 같다(gcloud auth application-default set-quota-project)
batch_supported: false               # Vertex 일괄 예측은 Cloud Storage 버킷이 필요하다 — 버킷을 만들기 전에는 즉시 생성만(일괄 할인 없음)
models:
  default: gemini-3.1-flash-image   # 제품·서비스 (Nano Banana 2) — 2026-11-08 models 목록에서 확인
  exploded: gemini-3-pro-image      # 분해도 (Nano Banana Pro)
size: {default: "1K", exploded: "2K"}
aspect: {product: "1:1", service: "16:9", exploded: "4:3"}
price_usd: {gemini-3.1-flash-image: {"1K": 0.067, "2K": 0.101}, gemini-3-pro-image: {"1K": 0.134, "2K": 0.134}, gemini-3.1-flash-lite-image: {"1K": 0.067}}   # pro 1K·lite는 보수적으로(가격표 확인 전)   # 2026-10 2차 자료 — 분기마다 Google 가격표로 갱신
batch_discount: 0.5
monthly_budget_usd: 9.0               # Chiip 장부 한도(약 ₩12,600) — 구글 예산 한도 ₩13,000보다 낮게(구글 비용 기록이 최대 24시간 늦다)
google_cap_krw: 13000                 # 참고값(Budgets & caps). Chiip이 바꾸지 않는다
industry_share: 0.4                   # 산업 리포트 몫(장부 scope=industry 합계) — 종목 리포트 이미지가 밀려나지 않게
per_company_max: {product: 2, service: 1, exploded: 2}
per_industry_report_max: {total: 3, exploded: 2}
min_confirmed_parts: 1                # 2026-11-08 마스터 지시 "BOM에 부품 1개라도 있으면 분해도에" (이전 6개)
bom_auto:                             # datapack에 bom이 없으면 회사·업계 기술 자료를 웹 검색으로(scripts/tenbagger/bom_discover.py)
  enabled: true
  model: gemini-3.5-flash             # Vertex + Google 검색 그라운딩
  max_parts: 10
  usd_per_call: 0.04                  # 장부용 대략값(그라운딩 검색 1회 + 생성) — Google 가격표로 갱신
  stale_days: 90
bom_stale_days: 90                    # BOM as_of가 이보다 오래되면 분해도만 다시 그린다
retries: 1                            # (옛 값) — 아래 ensure가 대신한다
ensure:                               # 2026-11-08 마스터 지시 "검수에 실패한 이미지가 없도록 웬만하면 다 생성되도록" — product_images.ensure
  max_attempts: 3                     # 이미지 하나에 최대 3번 그린다(실패 사유를 다음 설명문에 덧붙인다)
  max_calls: 5                        # 할당량·모델 오류 포함 호출 상한
  cost_cap_x: 3                       # 이미지 하나에 쓰는 돈은 1장 값의 3배까지
  fallback: {default: [gemini-3.1-flash-image, gemini-3.1-flash-lite-image], exploded: [gemini-3-pro-image, gemini-3.1-flash-image]}   # 모델 오류·할당량이면 다음 모델
  jpeg_quality_steps: [80, 65, 50]    # 200KB를 넘으면 다음 시도에서 품질을 낮춘다
qa_model: gemini-3.1-flash-lite       # 자동 눈 검수(scripts/tenbagger/image_qa.py) — Vertex에서 쓸 수 있는 모델(2.5-flash-lite는 이 프로젝트에서 404)
approval_first: {company: 5, industry: 3}   # (auto_approve가 false일 때만) 처음 n건은 텔레그램 미리보기로 마스터 승인
auto_approve: {company: true, industry: true}   # 2026-11-08 마스터 지시 "마스터 승인을 자동 승인하도록" — 자동 검수(눈 검수 포함)를 통과하면 바로 리포트에 넣는다
max_long_side: 1600
max_kb: 200
jpeg_quality: 80                      # Vertex 출력 JPEG 품질(Pillow 없이 200KB 안에)
style: "plain white background, isometric projection, neutral grayscale with a single accent color #2563EB, soft shadows, clean technical illustration style"
banned: ["로고", "상표", "글자", "숫자", "워터마크", "실존 인물", "사진 같은 연출"]
caption_fixed: "AI 생성 개념도 · 실제 제품·내부 구조·비율과 다를 수 있음"
