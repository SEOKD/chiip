# 수집 채널 자가 복구 — radar/self_heal.py (마스터 지시 2026-11-02). 새 수집 채널을 만들면 여기에 넣는다
error_count: 3          # 연속 오류가 이만큼이면 문제로 본다
max_retries: 3          # 자동 재시도 횟수(1·2·4·8시간 간격) 뒤 모델 복구로 넘긴다
telegram_min_score: 7.0 # tg_channels.score 10점 기준
report_keep_h: 12       # 모델이 보고한 장애를 유지하는 시간(같은 시간에 다시 보고하면 연장)
route_hold_h: 3         # rate·network 장애 채널을 source_router가 건너뛰는 시간

routed: [fiscal, zacks, easyconomics, tradingview]   # 데이터 채널 — 장애 때 다음 순위로 넘어간다

# 모델이 없는 수집기를 다시 돌릴 때 쓸 모듈. 없는 채널은 정해진 회차를 기다린다
jobs:
  trade-ppi: trade_ppi
  trade-hs: trade_hs
  site-imagery: site_imagery
  korea-watch: korea_watch
  exclusive-leads: exclusive_leads
  tg-channels: tg_channels
  ppi-release: ppi_release   # 지표 발표 수집기 — 발표 창 밖이면 아무것도 안 한다(2026-11-13)
  cpi-release: cpi_release
  kr-exports: kr_exports
  options-implied: options_implied   # 실적 발표 옵션 내재 변동폭(ADR-033)
  consumer-macro: consumer_macro   # 한국 외 소비 통계(2026-11-14)
  consumer-discovery: consumer_discovery
# 10분 넘게 걸리는 작업 — self-heal 안에서 다시 돌리지 않고 정규 회차(run_hourly)에 맡긴다(2026-11-13 점검: self-heal이 이 작업을 품다 26회 연속 10분 초과)
no_inline: [trade-ppi, trade-hs, site-imagery]

files:
  - {id: trade-ppi, path: knowledge/models/trade_ppi/latest.json, max_age_h: 30}
  - {id: trade-hs, path: knowledge/models/trade_ppi/surge.json, max_age_h: 30}
  - {id: fiscal, path: knowledge/models/estimates/snapshots.csv, max_age_h: 36}
  - {id: consumer-macro, path: knowledge/models/consumer_trends/macro_latest.json, max_age_h: 30}
  - {id: consumer-discovery, path: knowledge/models/consumer_trends/discovery_latest.json, max_age_h: 36}

# 키를 쓰지 않기로 결정한 원천은 문제로 세지 않는다(마스터 결정이 바뀌면 뺀다)
ignore: [src-valuation, src-weekly-movers]   # EODHD는 무료 조합을 먼저 쓰기로 보류(2026-10-28 마스터 결정)
