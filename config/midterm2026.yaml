# 스마트 머니 점수(섹터·업종 ETF) — 가중치는 사전값(미검증)
smart_money:
  weights: {car: 0.35, abvol_up: 0.25, cmf: 0.25, rel_strength: 0.15}
  cmf_window: 10

# 장중 수급 국면 감시(마스터 지시 2026-11-04: 개장 중 수급이 바뀔 때마다 즉시, 10분 안에 여러 번이어도) — midterm.py --tick
# 흐름 = (등락 − β·SPY 등락) × 상대 거래량(10일, 상한 rv_cap). 사전값(미검증)
tick:
  tone: ["AMEX:SPHB", "AMEX:USMV", "AMEX:HYG", "AMEX:LQD", "NASDAQ:TLT", "AMEX:UUP", "CBOE:VIX", "NASDAQ:QQQ", "AMEX:IWM"]
  rv_cap: 3.0
  hyst: 0.15        # 상위·하위 3 진입이 밀려난 종목보다 이 %p 이상 커야 변화
  spy_band: 0.5     # SPY 등락 0.5% 구간을 넘을 때
  tone_dead: 0.10   # 위험 선호 톤 부호 판정 무감대(%p)
  vix_jump: 5.0     # 직전 관측 대비 VIX 등락률 변화(%p)

# ── 중간선거 이후 종목 영향 점수(scripts/policy/midterm_impact.py, 마스터 지시 2026-11-04 "Analysis·Pulse·Ten-bagger에 2026 미국 중간선거 이후 영향 —
