# PeeringDB 대체 데이터 — 데이터센터·상호접속 시계열 (마스터 지시 2026-11-20 "넣어라", ADR-049, 수집기 radar/pollers/peeringdb.py)
# 이용 조건: AUP의 허용 목적 '인터넷 연구·분석'(개인 리서치, 비상업). 표적 질의만 — 전체 복제·sync·since= 전체 동기화 금지, 대량 재배포 금지,
# 익명 GET(인증 생략), common.contact_ua(), 요청 사이 6초·하루 1회·회차당 요청 8건 이하. 429면 그 회차는 멈춘다(fail-closed).
# 저장은 숫자만(개수·용량·새 연결 시설 ID·날짜) — 연락처·사람 이름은 저장하지 않는다. 원표는 공개 채널(딘스티커 등)에 올리지 않는다.
