# SPAC 테마 판정·알림 (radar/pollers/spac_theme.py, 마스터 지시 2026-11-04 2단계, 설계 knowledge/methods/spac_discovery_design.md 2절)
# 피인수 기업 사업 문구를 Chiip 테마 어휘와 대조한다. 정규식 단어(대소문자 무시). 사전값 — 오탐·누락은 themes.csv로 점검해 고친다
themes:
  AI·반도체: ['semiconductor', 'chip(?:s|set|maker)?', '\bGPU', 'AI infrastructure', 'artificial intelligence', 'machine learning', 'data cent(?:er|re)s?', 'photonic', 'optical interconnect', 'silicon', 'wafer', 'inference', 'accelerator', 'HBM', 'memory chip', 'compute capacity', 'AI chips?']
  전력·에너지 인프라: ['power generation', 'power grid', 'electric grid', 'nuclear', 'small modular reactor', '\bSMR', 'fusion', 'energy storage', 'battery', 'microgrid', 'natural gas', 'turbine', 'transmission', 'uranium', 'geothermal', 'electrification']
  우주·위성: ['space (?:company|economy|infrastructure|station|industry|technolog\w*|systems?|domain|launch)', 'in-space', 'spaceport', 'satellite', 'launch vehicle', 'low Earth orbit', 'orbital', 'lunar', 'spacecraft']   # 맨 'space'는 사무 공간·여유 공간에 걸린다(2026-11-04 오탐)
  로봇·자율: ['robot(?:s|ics)?', 'humanoid', 'autonomous', 'drone', 'eVTOL', 'industrial automation']
  양자: ['quantum']
  방산: ['defense', 'defence', 'missile', 'munition', 'national security', 'Department of War', 'Department of Defense']
min_hits: 3            # 한 테마 단어가 서류 본문에서 이만큼 이상 나와야 일치
min_terms: 2           # 서로 다른 어휘가 이만큼 이상(한 단어 반복만으로는 일치로 보지 않는다)
single_term: {양자: 8, 로봇·자율: 8}   # 어휘가 사실상 한 단어인 테마 — 그 단어가 이만큼 이상 나오면 한 단어로도 일치(CCXI 휴머노이드 'robot' 10회, 2026-11-04)
max_chars: 80000       # 서류당 읽는 글자 수(첫 부분 — 거래 개요·피인수 기업 소개가 앞에 있다)
max_docs: 2            # 거래 서류 중 읽을 문서 수(EX-99.1 보도자료 우선, 다음 본문)
alert_stages: [S2, S3, S4, S5]   # Pulse 알림 단계(상장 S0은 테마 판정 대상 아님 — 목표 업종 문구만 있어 오탐이 크다)
# ── 3단계 비대칭 점수(scripts/tenbagger/spac_score.py, 마스터 지시 2026-11-04 "3단계 진행") — 등록부 prm-spac-*, 모두 사전값 ──
score:
  floor_premium_max: 0.03     # 신탁가 대비 프리미엄이 이 이하면 '바닥 인정'(주총 전 환매권)
  projection_haircut: 0.5     # 스팩 경영진 전망 할인(전망 과대 경향 — Dambra, Even-Tov & George 2021; Kiesel 등 2023)
  overhang_days: 180          # 이 기간 안 보호예수 해제를 오버행으로 센다
  candidate_min: 6.0          # Ten-bagger 연구 후보 문턱
  kill_cap: 2.0               # 킬 조건이 있으면 점수 상한
  weights:
    pre_vote:   {floor: 0.20, dilution: 0.25, edge: 0.15, value: 0.25, overhang: 0.10, attention: 0.05}   # 주총 전(S2~S4) — 바닥·희석·가치 중심
    post_close: {dilution: 0.10, edge: 0.30, value: 0.30, overhang: 0.25, attention: 0.05}              # 종결 뒤(S5~) — 바닥 없음, 사업·가치·오버행 중심
