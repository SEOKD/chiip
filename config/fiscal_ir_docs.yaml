# Fiscal.ai IR 문서 감시 (마스터 지시 2026-11-08 "AT&S도 최근 실적 발표 프레젠테이션 자료를 공유했는데 이걸 가져오고 있는지 파이프라인을 점검하라")
# 구현 radar/fiscal_ir_docs.py, 수집 본보기 scripts/fiscal/templates/ir_docs_batch.js, 절차 docs/tasks/chiip-pulse.md 2-3
# 회사 IR 수집기(일본 jp_ir_docs·한국 kr_ir_docs·대만·홍콩 tw_hk_ir)가 없는 시장 — 유럽 등 — 의 실적 PT(slide_deck)·보도자료·반기·분기 보고서를
# Fiscal.ai IR 이벤트로 받는다. AT&S처럼 회사 사이트가 자동 수집을 막아도(2026-11-08 www.ats.net 응답 없음 — 우회하지 않는다) 같은 자료가 Fiscal에 있다.
interval_h: 3            # 몇 시간마다 회차를 여나(새 문서가 없으면 Pulse 글은 없다)
batch: 12                # execute_code 한 번에 볼 종목 수
fresh_days: 14           # 이벤트 날짜가 이보다 오래된 문서는 기록만 하고 알리지 않는다
roles: [slide_deck, press_release, interim_report, annual_report]
exclude_prefix: ["NASDAQ_", "NYSE_", "AMEX_", "XJPX_", "XKRX_", "XKOS_", "XTAI_", "XTPE_", "XHKG_"]   # 미국은 8-K·전문 경로, 일·한·대만·홍콩은 회사 IR 수집기가 있다
