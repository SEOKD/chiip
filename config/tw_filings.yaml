# 대만 공시 재무 파이프라인 (마스터 지시 2026-11-07 "한국 DART와 같은 대만 전자공시시스템에도 연결해 대만 AI 밸류체인 기업들의 어닝 및 재무 데이터를 가져올 수 있는 파이프라인을 구축해라")
# 수집 radar/pollers/tw_financials.py(분기 재무), radar/pollers/tw_disclosure.py(重大訊息·이사회 재무보고 승인 공고), radar/reverse/collectors/twse_monthly.py(월매출)
# 운영 docs/channels/earnings.md '대만 공시 재무', 원천 상세 docs/channels/data.md

# 원천·약관 확인(2026-11-07). 쓸 수 있는 것만 자동 수집한다 — 로그인·유료벽·CAPTCHA 우회 금지
sources:
  twse_openapi:
    url: https://openapi.twse.com.tw/v1
    use: [t187ap06_L_ci 綜合損益表(누계), t187ap07_L_ci 資產負債表, t187ap05_L 월매출, t187ap04_L 重大訊息]
    terms: "Swagger 첫머리가 '歡迎各位介接使用'·정부 데이터 개방 라이선스 1판(data.gov.tw/license) 안내. TWSE 사이트 약관은 자동 다운로드를 금지하되 정부 데이터 개방 플랫폼 제공분은 예외로 둔다"
    robots: "없음(404)"
    status: ok
  tpex_openapi:
    url: https://www.tpex.org.tw/openapi/v1
    use: [mopsfin_t187ap06_O_ci 綜合損益表(누계), mopsfin_t187ap07_O_ci 資產負債表, mopsfin_t187ap05_O 월매출, mopsfin_t187ap04_O 重大訊息]
    terms: "TPEx 사이트 약관 5조가 자동 다운로드를 금지하되 7조가 정부 데이터 개방 플랫폼 제공분을 예외로 둔다. OpenAPI가 그 제공 경로"
    robots: "빈 파일"
    status: ok
  mops:
    url: https://mops.twse.com.tw
    status: blocked
    why: "TWSE 사이트 약관 '下載軟體或資料' 조항이 스크립트·크롤러 다운로드를 금지한다(TWSE 동의 방식 제외). 새 사이트 JSON(t164sb03·04·05)은 이력·현금흐름이 있지만 자동 수집하지 않는다. 구 사이트 mopsov·emops는 robots 전면 금지"
    manual: "과거 분기·현금흐름은 마스터가 화면에서 직접 내려받거나, Fiscal.ai(1순위) 이력을 쓴다"
  trade_gov_tw:
    url: https://publicinfo.trade.gov.tw/cuswebo
    status: blocked
    why: "자료는 정부 데이터 개방 라이선스 1판(데이터 개방 선언)이지만 HS 2~11단위×국가 조회 화면 6종이 모두 CAPTCHA를 요구한다 — 자동 조회하지 않는다"

# 재무 항목 단위: 천 대만달러(NT$ thousand) 원값. quarters_hist로 내보낼 때만 원 단위(×1000)로 바꾼다
statement_kind: ci   # 一般業만. 금융·보험업 표는 받지 않는다

