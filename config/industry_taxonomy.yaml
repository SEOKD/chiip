# 시장 업종 분류(GICS 4단계: 섹터 → 산업그룹 → 산업 → 세부 산업) — 마스터 지시 2026-11-08 "시장이 섹터로 분류하는 세부 산업으로 기준을 다시 잡아봐"
# 원천: Fiscal.ai companies_list(sector·industryGroup·industry·subIndustry, 2026-11-08 조회, 거래소까지 맞춰 동명 티커 제외).
# Fiscal에 없는 한국·대만·일본 일부는 Chiip이 같은 GICS 기준으로 배정했다(assigned — 사업보고서·회사 개요 기준, 회사 공식 GICS가 아님).
# 묶는 규칙(scripts/industry/weekly_pick.py groups()): 세부 산업 구성 min_members(3) 이상 → 그대로 하나의 산업,
#   미만 → 상위 '산업'으로 올려 묶고 그래도 미만이면 제외. 구성이 split_over를 넘는 세부 산업(반도체 등)은 감시 목록 테마(분야 모듈)로 한 번 더 나눈다.
# 티커는 거래소 접미사를 뗀 값(config 유니버스와 맞춘다). 새 종목은 이 표에 넣는다 — 없으면 테마 묶음만 따른다.
