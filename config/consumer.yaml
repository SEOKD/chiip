# Chiip Consumer — 비AI 급성장 소비재·게임·콘텐츠IP 발굴 (마스터 지시 2026-10-30)
# "일본 완구주 Tomy Company가 오늘 실적 나오고 11% 쐈다. 종목 레이더망에 Non-AI 섹터 중 급성장하는 소비재·게임·콘텐츠IP 종목을 발굴하는
#  알고리즘도 넣어라. 전례 없는 구조적 성장 국면·상승 사이클 진입·상승 사이클 여력 — AI 밸류체인·방위와 다른 관점으로. 소비재는 트렌드에
#  민감하니 아마존 같은 글로벌 이커머스 관심도, 온라인 커뮤니티 등 리테일 채널 반응을 살펴 어떤 내러티브가 있는지 엣지 있게 캐치.
#  Chiip Pulse와 Ten-bagger 엔진에 넣어 설계하라." (설계안 승인: 같은 날 "이대로 구현")
#
# 렌즈: AI·방위는 공급 병목(누가 막힌 곳을 푸나), 소비재·IP는 수요(실제로 팔려 나가는가·얼마나 더 퍼질 수 있나) — knowledge/methods/consumer_lens.md
# 흐름: 이 지도 → 수요 관심도 radar/consumer_attention.py(IP·브랜드 위키 조회·앱 순위·스팀 추천 증가·브랜드 뉴스, 하루 1회)
#       + 리테일 반응 radar/attention.py(투자자 원천: 뉴스·Seeking Alpha·Substack·X·텔레그램 — 이 지도 종목을 후보에 포함)
#       + 펀더멘털 knowledge/models/consumer/fundamentals.json(Fiscal.ai consumer.js 또는 회사 결산 자료 --put-q)
#       → 국면 판정·점수 scripts/discovery/consumer.py → outputs/discovery/consumer_<날짜>.md · knowledge/models/consumer/latest.json
#       → Chiip Pulse 🛍 Consumer(지도 종목 실적·적시공시·관심 급가속) · Ten-bagger 일요일 발굴(소비재 선별)
# fiscal = Fiscal.ai 회사 키 — 재무가 있는 것만(2026-10-30 확인: 미국·영국 11곳). 캡콤 XJPX_9697·닌텐도 XJPX_7974·미쉐 XHKG_2097은 키는 있으나 재무·주가 없음, 나머지 아시아 소비재는 키 자체가 없음 → 회사 결산 자료로 --put-q.
# wiki = {언어: 문서 제목} 위키 조회수(Wikimedia 공식 API, robots 제한 없음) — 제목이 틀리면 수집기가 'missing'으로 기록, 주간 회차에서 고친다(1차 입력, 미검증).
# steam = 스팀 앱 id(store.steampowered.com/api/appdetails 누적 추천 수, robots 허용) · apps = 애플 앱 순위 RSS의 개발사 이름 패턴(정규식) · terms = 브랜드 뉴스 검색어.
# 아마존: 원천에서 제외(2026-10-30 마스터 결정). robots.txt가 ClaudeBot을 명시적으로 막아 직접 수집 금지, PA-API는 폐지, 후속 Creators API는 약관이 분석 용도를 제한 — knowledge/methods/consumer_lens.md.
