# 국면 판정(사전값 — knowledge/models/params/registry.yaml prm-consumer-*). 분기 매출 YoY 기준, 반기 결산 회사는 반기 YoY
phase:
  structural: {min_growth: 0.20, min_periods: 4, max_gm_drop: 0.02}   # 4개 기간 연속 +20% 이상 + 매출총이익률 하락 2%p 이내 → '구조적 성장'
  upcycle: {accel_pp: 0.10}                        # 최근 YoY − 직전 4개 기간 평균 YoY ≥ +10%p → '상승 사이클 진입'
  late: {crowding_pct: 90, inv_gap_pp: 0.15}       # 쏠림 상위 10% + 성장 감속 + (재고 증가율 − 매출 증가율) ≥ 15%p → '사이클 후반 경고'
  watch_min: 6.0                                   # 점수 문턱(0~10) — 이상이거나 구조·진입 국면이면 watch

# 점수 가중치(사전값 — 주간·월간 성과로 피팅). 합 1.0
weights:
  growth: 0.15            # 최근 매출 YoY
  accel: 0.15             # 성장 가속(%p)
  persistence: 0.10       # +20% 이상 연속 기간 수
  margin: 0.10            # 매출총이익률 변화(가격 결정력)
  sell_through: 0.10      # 재고 증가율 − 매출 증가율(낮을수록 실판매 — 밀어내기 점검)
  demand_attention: 0.20  # IP·브랜드 위키 조회·스팀 추천·앱 순위·브랜드 뉴스 가속
  retail_buzz: 0.05       # 투자자·리테일 원천 언급 가속(radar/attention.py)
  runway: 0.15            # 여력 — 해외 비중 상승 여지·쏠림 낮음·같은 지도 안 EV/매출 ÷ 성장

# 수요 관심도 수집(radar/consumer_attention.py)
attention:
  window_days: 7          # 최근 7일 ÷ 직전 28일 주평균
  spike_accel: 2.0        # 이 가속 이상이면 펄스 '관심 급가속' 원본(하루 1회 관측)
  spike_min_views: 20000  # 위키 7일 조회가 이보다 적으면 급가속이라도 잡음으로 본다
  apple_countries: [us, jp, kr]
  apple_feeds: [top-free, top-paid]
  user_agent: "Chiip research fhteo1101@gmail.com"   # Wikimedia API 정책: 연락처가 든 UA
