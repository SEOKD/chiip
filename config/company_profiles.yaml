# 실시간 알림 '☞ 회사 설명' 3줄 (마스터 지시 2026-10-29 "뉴스 전달할 때 종목｜내용｜시간 → ☞ 회사 설명(비즈니스 모델, 성장동력, 내러티브 등) 3줄 → 핵심 내용 3개")
# 줄 순서: ① 비즈니스 모델(무엇을 팔아 돈을 버나) ② 성장 동력(지금 매출·이익을 끌어올리는 것) ③ 내러티브(시장이 이 회사를 보는 이야기·멀티플 근거)
# 판정 모델(radar-triage·빠른 길)이 P0·P1 알림에서 처음 쓰면 radar/notify.py remember_profile이 저장하고, 30일이 지나면 새로 쓴다(내러티브는 변한다).
# 마스터·세션이 손으로 고친 줄은 source를 '검증'으로 바꾸면 된다. 지어내지 않는다 — 모르면 줄을 비운다.
