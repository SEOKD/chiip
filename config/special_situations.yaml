# 구루 논지 특수 상황 장부 (마스터 지시 2026-11-15 "패니메이 & 프레디맥과 같이 구루 포지션을 따라가는 전략" — 조사 E §6.4 탐지 틀)
# 13F에 안 보이는 구루 논지(OTC·비의결권·보전관리·회생 직후·분할 직후·해외 주 상장)를 손으로 적고, 촉매 서류를 radar/discovery_filings.py(thesis)가 지켜본다.
# 올리는 조건(A+B+C, D는 계산 — 판단 카드 렌즈 knowledge/methods/sector_lenses/guru.md):
#   A 공개 논지: 명단 구루의 서한·공개 포트폴리오·발표가 종목을 이름으로 든다, 또는 명단 CIK의 첫 13D·13G, 또는 등록 펀드 보유 순자산 2% 이상, 또는 90일 안 구루 2명 이상 공개 언급
#   B 구조적 수급 장벽: OTC·12(b) 등록 없음 / 13F 보유 기관 0.5% 미만인데 구루가 보유 / 비의결권·보전관리·관재 / 회생 뒤 24개월 / 분할 뒤 12개월 / 해외 주 상장 ADR 없음 / 지수 기준 미달
#   C 24개월 안 날짜 붙은 촉매: 판결·심리, 협정 개정, 필수 절차(규정 의견 수렴·위원회 보고), 상장 재등록 8-A12B·공모 S-1, 선거·입법 단계 — 기한이 두 번 이상 밀리면 감점
#   D 비대칭: 현재가 ÷ 구루 매입 단가(13D Item 5(c)가 있으면 정확), 자본 구조 산술(청산 우선권·워런트 희석·자본 부족)로 상방 ÷ 하방 ≥ 3
#   E 거래 가능성(관문): OTC 거래대금·호가 차이·마스터 증권사(한국) 결제 가능 여부
# 숫자를 지어내지 않는다 — 1차 자료(10-Q·서한·법원 문서)로 확인한 것만 적고, 모르면 '미확인'. 매수 권유가 아니다.

