# ⑤~⑧ 무료 키(마스터가 가입해 D:\local-only\secrets\.env에 넣는다 — docs/TODO_MASTER.md 21-39)
keys:
  courtlistener: COURTLISTENER_TOKEN   # courtlistener.com 무료 가입 → API 토큰. 미국 연방법원 특허 소송 접수(사건 성격 830 Patent)
  uspto: USPTO_API_KEY                 # data.uspto.gov(Open Data Portal) 무료 키 — PTAB 무효심판(IPR·PGR)·특허 등록
  dart: DART_API_KEY                   # opendart.fss.or.kr — '소송등의제기' 공시(값이 비어 있음, 21-7·2026-11-06 항목)
  kipris: KIPRIS_API_KEY               # plus.kipris.or.kr 무료 회원 — 한국 특허심판원 심판·등록(아직 코드 없음: 키가 오면 공식 문서로 붙인다)

