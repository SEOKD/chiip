# ① 기자 페이지(robots 허용 2026-11-08 확인 — /reporter/ 허용, /Contents/·/Include2/user/만 막힘). 제목·링크만 저장(본문 복제 금지)
reporters:
  - {id: zdnet-gjgj, name: "지디넷코리아 이기종", url: "https://zdnet.co.kr/reporter/?lstcode=gjgj", base: "https://zdnet.co.kr"}

