# 무역·PPI 세부 항목 — 마스터 지시 2026-11-02 "BOM과 공급망 파악, 밸류에이션 계산할 때 미국, 대만, 유럽연합, 영국, 일본, 한국의 무역 지표의 세부항목 데이터와
# PPI의 세부항목 데이터를 가져오도록". 수집 radar/trade_ppi.py, 리포트 scripts/tenbagger/input_view.py, 운영 docs/channels/data.md
# BOM·공급 품목의 "input" 값이 아래 inputs의 키다. ppi의 proxy는 품목보다 넓은 업종 지수라 미국·일본 세부 지수보다 뒤에 쓴다.
partners: [CN, TW, KR, JP, US, VN, MY]   # EU가 이 나라에서 들여온 수입. 대만·한국·일본의 수출을 거울로 읽는다

# 경로 상태 — ok: 실제 호출 확인 / key: 키가 있으면 돈다(없으면 건너뛰고 gaps에 남긴다) / todo: 공식 경로 미확인
sources:
  us: {trade: {via: census, status: key, key: CENSUS_API_KEY}, ppi: {via: bls, status: ok}}
  eu: {trade: {via: comext, status: ok}, ppi: {via: eurostat, status: ok}}
  uk: {trade: {via: hmrc, status: ok}, ppi: {via: ons, status: ok}}
  jp: {trade: {via: e-stat, status: todo, why: "앱 ID 필요, 요청 형식 미확인"}, ppi: {via: boj, status: ok}}
  kr: {trade: {via: 관세청 공공데이터포털, status: todo, why: "API 문서 미확인, 키 필요"}, ppi: {via: 한국은행 ECOS, status: todo, why: "API 문서를 읽지 못함, 키 필요"}}
  tw: {trade: {via: 관세 통계 포털, status: todo, why: "접속 거부, API 미확인"}, ppi: {via: 주계총처, status: todo, why: "API 미확인"}}

