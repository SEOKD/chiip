# HS 시계열·급등 품목 — radar/trade_hs.py (마스터 지시 2026-11-02). 미국은 전 품목, EU·일본은 아래 관심 장만 받는다
hs_scan:
  backfill_months: 120   # 10년 — 리포트 매출 시계열(quarters_hist, 최장 약 11년)과 같은 구간(마스터 지시 2026-11-07 "매출 시계열과 같은 구간에서 지표가 보이도록")
  months_per_run: 24    # 회차당 새로 받는 달 수(첫 적재를 나눠서 한다 — 10년 소급을 며칠 안에 끝내려고 8→24)
  chapters: ["2804", "2818", "3818", "7106", "7108", "7403", "7408", "7409", "7601", "8103", "8112", "8406", "8411", "8471", "8473", "8481", "8486", "8501", "8502", "8504", "8507", "8517", "8523", "8532", "8533", "8534", "8535", "8536", "8537", "8538", "8541", "8542", "8543", "8544", "9013", "9027", "9030", "9031"]
  surge:
    window: 3           # 최근 3개월 합을 전년 같은 달과 비교
    min_yoy: 0.5
    top: 40             # 나라·방향별 상한
    min_value: {us: 30000000, eu: 30000000, jp: 3000000, tw: 30000, hk: 300}   # 3개월 합 하한(원 단위: 달러·유로·천 엔·천 달러·백만 홍콩달러)
