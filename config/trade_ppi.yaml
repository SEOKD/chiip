# 무역·PPI 세부 항목 — 마스터 지시 2026-11-02 "BOM과 공급망 파악, 밸류에이션 계산할 때 미국, 대만, 유럽연합, 영국, 일본, 한국의 무역 지표의 세부항목 데이터와
# PPI의 세부항목 데이터를 가져오도록". 수집 radar/trade_ppi.py, 리포트 scripts/tenbagger/input_view.py, 운영 docs/channels/data.md
# BOM·공급 품목의 "input" 값이 아래 inputs의 키다. ppi의 proxy는 품목보다 넓은 업종 지수라 미국·일본 세부 지수보다 뒤에 쓴다.
partners: [CN, TW, KR, JP, US, VN, MY]   # EU가 이 나라에서 들여온 수입. 대만·한국·일본의 수출을 거울로 읽는다

# 경로 상태 — ok: 실제 호출 확인 / key: 키가 있으면 돈다(없으면 건너뛰고 gaps에 남긴다) / todo: 공식 경로 미확인
sources:
  us: {trade: {via: Census, status: ok}, ppi: {via: BLS v2, status: ok}}
  eu: {trade: {via: Comext, status: ok}, ppi: {via: Eurostat, status: ok}}
  uk: {trade: {via: HMRC, status: ok}, ppi: {via: ONS, status: ok}}
  jp: {trade: {via: e-Stat 品別国別表, status: ok}, ppi: {via: 일본은행, status: ok}}
  kr: {trade: {via: 공공데이터포털 관세청, status: todo, why: "키가 관세청 서비스에 등록되지 않았다(활용신청 필요)"}, ppi: {via: 한국은행 ECOS 404Y014, status: ok}}
  tw: {trade: {via: "재정부 data.gov.tw 28573 + 재정부 통계 DB i9161·i9162·i8201·i8202", status: ok, note: "HS 21개 류·주요국 + 세부 품목(積體電路·DRAM·서버·반도체 장비 등, 세계 합계) + 국가×주요 품목군. HS 4·6단위×국가 조회(국제무역서 publicinfo.trade.gov.tw)는 CAPTCHA라 자동 수집하지 않는다", terms: "재정부·국제무역서 '데이터 개방 선언' — 정부 데이터 개방 라이선스 1판, 출처 표기(2026-11-07 확인). 재정부 robots 없음·CAPTCHA 없음"}, ppi: {via: 주계총처 data.gov.tw 148439, status: ok, note: "업종 101개 항목 — taiwan.ppi_watch를 --status 대만 절에 싣는다"}}
  hk: {trade: {via: "C&SD 410-50031", status: ok, note: "SITC 10개 대분류, HS 품목별 공개 표 없음"}, ppi: {via: "C&SD 520-62001", status: ok, note: "분기, 업종 단위"}}

taiwan:
  ppi_dataset: 148439
  trade_dataset: 28573
  # 재정부 통계 DB 조회(radar/trade_ppi.py tw_goods, 2026-11-07 마스터 지시 "대만 수출입 통계 데이터, PPI 데이터 파이프라인도 함께"). 천 달러
  mof:
    detail:   # 세부 품목(세계 합계) — items는 조회 화면의 품목 수(전부 고른다)
      export: {funid: i9161, items: 56}
      import: {funid: i9162, items: 51}
    cross:    # 국가×주요 품목 — countries는 나라·지역 수, goods는 (시작 위치, 개수): 16류 (1)電子零組件~(5)家用電器
      export: {funid: i8201, countries: 75, goods: [31, 5]}
      import: {funid: i8202, countries: 75, goods: [29, 5]}
    partners: [中國大陸, 香港, 美國, 日本, 南韓, 新加坡, 馬來西亞, 越南, 泰國, 菲律賓, 印度, 墨西哥, 加拿大, 德國, 荷蘭, 英國]   # 지역 합계(亞洲·東協 등)는 몫 계산에서 뺀다
  goods_watch: [積體電路, DRAM, 記憶體, 自動資料處理機及其附屬單元, 電腦之零附件, 半導體設備, 生產半導體等機械, 印刷電路, 交換器及路由器, 電容器及電阻器, 晶圓(化學品)]
  main_watch: [(1)電子零組件, (4)資通與視聽產品, (2)機械]
  ppi_watch: [15.電子零組件, (1)半導體, (2)被動電子元件, (3)印刷電路板, 16.電腦、電子產品及光學製品, (1)電腦及其週邊設備, (2)通訊傳播設備, 17.電力設備及配備, 18.機械設備, (2)其他專用生產機械]
  labels:   # --status 한국어 표기(원문은 괄호로 남긴다). 나라·품목·업종 이름
    中國大陸: 중국
    香港: 홍콩
    美國: 미국
    日本: 일본
    南韓: 한국
    新加坡: 싱가포르
    馬來西亞: 말레이시아
    越南: 베트남
    泰國: 태국
    菲律賓: 필리핀
    印度: 인도
    墨西哥: 멕시코
    加拿大: 캐나다
    德國: 독일
    荷蘭: 네덜란드
    英國: 영국
    積體電路: 집적회로
    記憶體: 메모리
    自動資料處理機及其附屬單元: 자동 데이터 처리기(서버·PC)
    電腦之零附件: 컴퓨터 부품
