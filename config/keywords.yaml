# 이벤트 키워드 — 레이더 등급 판정 보조
events:
  공급계약: [단일판매·공급계약, 공급계약 체결, supply agreement, qualified, 인증 통과]
  실적: [잠정실적, 영업(잠정)실적, earnings, guidance, 가이던스]
  증설: [신규시설투자, 유형자산 취득, 증설, 착공, groundbreaking, capacity expansion]
  차질: [생산 중단, 화재, 정전, outage, 리콜]
  인사: [임원 인사, 조직개편, 대표이사 변경, 사업부장]
  정책: [수출통제, Entity List, 232조, 관세, CHIPS, 보조금, 세액공제]
