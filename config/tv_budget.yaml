# TradingView MCP 하루 호출 예산 (2026-11-19 마스터 지시, 훅 .claude/hooks/tv_budget.py, 상태 radar/state/tv_budget.json)
# 관측(세션 기록): 11-14~16 KST 하루 149~194건 통과 → 11-17 90건째(직전 24h 97건) 'daily usage limit + 10분 냉각', 이후 이틀 넘게 냉각 반복.
# 정확한 한도는 TradingView가 공개하지 않아 미확인 — 관측된 가장 낮은 차단점 90보다 아래로 잡는다.
daily_budget: 25          # 하루(06:00 KST 시작) 호출 상한 — 2026-11-21 70→25(11/20·21은 06시 뒤 7·13건째에 TradingView 일일 한도, 직전 24시간 28·57건)
priority_tasks: [chiip-tenbagger-report, chiip-analysis-samyang-once]   # 우선 작업(2026-11-19 마스터 지시: Analysis TradingView 그래프 우선) — 예산 전부 쓸 수 있다
priority_reserve: 12      # 다른 작업은 하루 예산에서 이만큼을 남긴 만큼(13건)만 쓴다 — Analysis 우선 몫(2026-11-21 30→12, 예산 축소에 맞춤)
deny_tasks: [chiip-proviser, chiip-report-audit-weekly]   # TradingView 금지(2026-11-22 마스터 지시 "Provisor로 Analysis Report의 주가 반응을 Revised할 때는 TradingView를 이용하지 마라") — 주가 반응은 ohlcv.csv·market_data history·Fiscal.ai
tool_caps:                # 도구별 하루 상한(2026-11-22 마스터 승인 — 11/15~22 Analysis가 TradingView 알림을 58건 만들었다. 알림 생성도 호출 한도를 쓴다)
  create-alert: 3
  update-alert: 3
task_caps:                # 작업별 하루 상한(2026-11-22 마스터 지시 "Pulse 줄이기") — 11/16~20 Pulse가 하루 32~103건(일본 전사 조회 88%·주가 줄 12%).
  chiip-pulse: 5          # 일본 전사 조회는 radar/jp_tv_docs.py가 하루 3종목(11-21), 나머지는 실적 주가 줄(장전·장후 등락은 TradingView만 준다) — 넘으면 주가 줄을 뺀다
  chiip-pulse-weekend: 2
block_hours_after_daily: 24   # TradingView '일일 한도'가 걸리면 이 시간 동안 부르지 않는다(06시에 풀어도 바로 다시 걸렸다, 2026-11-21)
day_start_hour: 6
# TradingView 와치리스트 동기화는 일요일 18:00 주 1회(2026-11-22 마스터 지시 — 토요일 08:00은 Weekly 전용 시간과 겹쳐 막혔다, TODO 21-59) — 그날 다른 작업 몫 안에서 쓴다
# 시간대 독점(2026-11-21 마스터 지시 "이번 주 Weekly에 유럽·일본·한국·대만·홍콩 주간 상승률 순위가 빠졌다") — 그 시간에는 only 작업(예약 작업 이름 앞부분)만 부른다.
# 47주차: 토 07:00~07:15 Pulse Weekend 5건·Industry 5건이 먼저 쓰고 Weekly는 1건째에 계정 한도(11건)로 막혔다. 사람 세션은 막지 않는다. weekdays: 월=0 … 토=5·일=6
holds:
  - {weekdays: [5], from: "06:00", until: "10:30", only: [chiip-weekly]}
  - {weekdays: [6], from: "06:00", until: "06:40", only: [chiip-weekly]}   # 일요일 보충 회차 chiip-weekly-fill(docs/tasks/chiip-weekly-fill.md) — 마스터가 앱에서 직접 등록(2026-11-21)
# 공용 응답 캐시(2026-11-22 마스터 지시 "TradingView 호출을 효율적으로") — 같은 도구·같은 인자는 이 분 안에 다시 부르지 않고 radar/state/tv_cache/ 파일을 읽는다.
# 11/22: 08:20에 11건째 일일 한도, 세션 6곳. 일봉·스크리너는 장 마감 뒤 하루 안 바뀌어 길게, 뉴스·시세는 짧게. 키 = 도구 이름 일부.
cache_ttl_min:
  get-ohlcv: 360
  run-screener: 180
  get-economic: 720
  get-documents: 720
  get-document-view: 1440
  get-news-story: 1440
  get-news: 60
  get-symbol-data: 30
  technicals: 60
  search-: 1440
  default: 60
