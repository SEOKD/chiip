# 방위(Defense) 섹터 지도 — 마스터 지시 2026-10-29 "Ten-bagger와 Pulse에 방위 섹터도 넣어라. 유럽(독일·프랑스·이탈리아·스페인)부터
# 일본·미국까지. 방위 대기업·방위 제품 제조사·방위 서비스·방위 솔루션 등 포트폴리오 전반. 방위 제품은 대분류로 나눠 접근하라."
#
# 쓰는 곳: radar/pollers/common.py entity_aliases(레이더 종목 인식) · radar/pollers/gate.py extra_focus(이 지도 종목의 공시·보도자료·뉴스는
#   포커스와 무관하게 수집) · radar/notify.py(기업 1줄·종목코드) · radar/pulse.py '방위' 원본 분류 · scripts/tenbagger/bands.py(시가총액 구간 유니버스)
#   · config/discovery.yaml 방위 병목 테마 · 분석 틀 knowledge/methods/defense_lens.md
# 2026-10-29 개정: 그 밖 유럽(노르웨이·체코·스웨덴·영국·그리스·오스트리아·핀란드) 추가 — 마스터 "Kongsberg, CSG 같은 유럽 방위 종목도".
# code는 EODHD 형식(미검증 — 키 입력 후 일괄 확인). ec_ticker는 옛 easyconomics 조회 인자(기록) — 2026-10-30부터 조회는 Fiscal.ai 회사 키(config/fiscal_keys.yaml).
# not_titles: 별칭이 겹치는 다른 회사 제목(예: 분리 상장한 Kongsberg Maritime) — 방위 판정 상향·펄스 방위 분류에서 그 회사로 보지 않는다. exposure(방산 비중)는 확실한 것만: core(본업) / major(큰 비중) / partial(일부), 모르면 비움.
# biz는 회사 공시·IR 개요를 자기 말로 1줄. 지어내지 않는다 — 모르면 쓰지 않는다.
code_verified: false

# ── 부문(segment) ──
segments:
  prime: "방위 대기업 — 다영역 시스템 통합(프라임 계약자). 정부와 직접 계약하고 하청 공급망을 거느린다"
  product: "방위 제품 제조사 — 아래 제품 대분류의 체계·부품을 만든다"
  services: "방위 서비스 — MRO(정비)·훈련·군수 지원·기지 운영·정부 IT·엔지니어링 서비스(인력·시간 기반 계약)"
  solutions: "방위 솔루션 — 지휘통제(C2) 소프트웨어·데이터·AI·사이버·시뮬레이션·통합 임무 체계(소프트웨어·IP 기반)"

# ── 방위 제품 대분류(마스터 지시 '대분류로 나눠 접근') — 병목·실적 동인·확인 자료 ──
products:
  air:
    name: 항공(전투기·수송기·헬기·훈련기·항공 엔진·기체 구조물)
    driver: "기체 인도 대수 × 단가 + 엔진·부품 애프터마켓(운용 시간 비례)"
    bottleneck: "엔진 단조·주조(초내열합금), 숙련 인력, 다년 인증 — 프로그램이 정해지면 수십 년 독점"
    evidence: ["정부 조달 계획·다년 계약", "인도 대수 공시", "엔진 정비 수요(운용 시간)"]
  land:
    name: 지상 전투 체계(전차·장갑차·자주포·전술차량·파워팩·변속기)
    driver: "차량 발주 대수 × 단가 + 현대화·개량 + 예비 부품"
    bottleneck: "장갑 강판·변속기·파워팩 등 소수 공급사, 생산 라인 증설 리드타임"
    evidence: ["프레임워크 계약 대비 개별 발주(call-off)", "독일 연방의회 예산위원회 2,500만 유로 이상 조달 승인", "수출 정부 간 계약"]
  naval:
    name: 해상(수상함·잠수함·무인 수상/수중정·함정 전투체계·추진)
    driver: "건조 척수 × 척당 가격(수년 공정 진행률로 매출 인식)"
    bottleneck: "조선소 도크·숙련 인력·원자로/추진 체계 — 조선 캐파가 가장 느리게 늘어난다"
    evidence: ["건조 계약·진행률", "조선소 증설·인력 채용", "잠수함 수출 경쟁 결과"]
  missile_ad:
    name: 미사일·방공(유도무기·요격체·고체 로켓 모터·발사대·탐색기)
    driver: "연간 조달 발수 × 단가 — 재고 소진(실전 사용)이 다년 보충 수요"
    bottleneck: "고체 로켓 모터·탐색기·에너제틱 소재 — 공급사 소수, 증설 2~4년"
    evidence: ["다년 조달 계약(multi-year)", "로켓 모터 증설·가동", "요격체 생산률 목표 발언"]
  munitions:
    name: 탄약·에너제틱(포탄·추진제·화약·폭약·신관)
    driver: "연간 생산 발수 × 단가, 국가 비축 목표"
    bottleneck: "니트로셀룰로스·TNT·추진제 원료, 장전 라인 — 2022년 이후 가장 뚜렷한 병목"
    evidence: ["연간 생산 능력(발/년) 증설 공정", "원료 공장 착공·가동", "정부 비축 목표·다년 구매"]
  c4isr_ew:
    name: 방위 전자(레이더·전자광학·전자전·통신·센서·항전)
    driver: "플랫폼 탑재 수 × 함량 + 업그레이드 주기(플랫폼보다 짧다)"
    bottleneck: "GaN 고출력 반도체(MMIC)·적외선 검출기·FPGA 등 반도체 부품, 보안 인증 인력"
    evidence: ["레이더·센서 수주", "GaN·적외선 부품 공급 계약", "플랫폼 업그레이드 프로그램"]
  unmanned:
    name: 무인·자율(무인기·배회형 탄약·대드론·무인 지상 차량)
    driver: "소모성 대량 조달(단가 낮고 물량 큼) — 조달 방식이 시제품→양산으로 빨리 넘어가는지"
    bottleneck: "모터·배터리·카메라·통신 모듈의 비(非)중국 공급망, 대량 생산 라인"
    evidence: ["양산 계약 전환(시제·평가 → 대량 발주)", "비중국 부품 조달 규정", "실전 사용 평가"]
  space:
    name: 우주·위성(정찰·통신 위성, 발사체, 우주 감시·미사일 경보)
    driver: "위성 기수 × 단가 + 데이터·서비스 구독 + 발사 횟수"
    bottleneck: "발사 슬롯, 위성 버스 양산, 방사선 내성 부품"
    evidence: ["정부 위성군 계약(미 우주개발청 등)", "발사 일정", "데이터 구독 계약"]
  small_arms:
    name: 소화기·개인 장비(총기·방탄·야간 투시·개인 통신)
    driver: "병력 수 × 교체 주기 × 단가"
    bottleneck: "영상증폭관·열상 검출기(야간 투시) 소수 공급사"
    evidence: ["군 제식 채택", "다년 공급 계약"]
  components:
    name: 방산 부품·소재(특수강·티타늄·단조·주조·커넥터·전자부품·액추에이터)
    driver: "플랫폼·탄약 생산률에 비례하는 함량 — 여러 프로그램에 동시 노출"
    bottleneck: "초내열합금·티타늄 단조, 인증 공급사(교체에 수년)"
    evidence: ["프라임의 공급사 증설 지원", "장기 공급 계약", "가격 인상 공시"]

# ── 수요 동인(정책 단계 분리 — 발표·의결·시행·계약은 다르다) ──
