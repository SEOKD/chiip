  - {region: DE, item: "국방비 부채 제동 예외(2025년 기본법 개정)·특별기금", check: "연방의회 예산위원회 2,500만 유로 이상 조달 승인(25-Mio-Vorlagen)·BAAINBw 계약"}
  - {region: FR, item: "군사계획법(LPM)", check: "DGA 발주 공시"}
  - {region: IT, item: "다년 국방 계획 문서(DPP)", check: "의회 승인·국방부 계약"}
  - {region: ES, item: "특별 현대화 프로그램(PEM)", check: "각료회의 승인(라 몬클로아 각료회의 참고자료)·국방부 계약"}
  - {region: JP, item: "방위력 정비 계획·GDP 2% 목표", check: "개산요구 → 정부안 → 국회 성립 → 방위장비청 중앙조달 계약"}
  - {region: US, item: "국방 예산(대통령 예산안 → NDAA 수권 → 세출 → 집행)", check: "세출 성립·계약 발주(obligation)·국방부 일일 계약 공시"}

