# 리포트 용어 풀이 — 마스터 지시 2026-10-30 "전문 용어는 괄호 열고 무슨 의미인지 한국어로 적어줘라. 기관, 협회 이름이 영어 약자로 돼 있으면 괄호 열고 한국어로 풀 네임을 풀이하라"
# scripts/tenbagger/report_html.py gloss()가 리포트에서 처음 나오는 곳에 '용어(풀이)'로 넣는다. 이미 바로 뒤에 괄호가 있으면 건드리지 않는다.
# 새 용어·기관 약자는 여기에 추가한다. 긴 말이 먼저 잡힌다(EV/매출 → EV).
terms:
  EPS: 주당순이익
  P/E: 주가수익비율
  EV/매출: 기업가치 ÷ 매출
  EV/EBITDA: 기업가치 ÷ 상각전영업이익
  EV: 기업가치
  EBITDA: 상각전영업이익
  EBITA: 영업이익에 인수 무형자산 상각을 더한 값
  EBIT: 이자·세금 차감 전 이익
  OPM: 영업이익률
  GPM: 매출총이익률
  DCF: 현금흐름 할인 평가
  Fwd 1Y: 향후 12개월 추정 기준
  WACC: 가중평균자본비용
  ERP: 주식 위험 프리미엄
  ROIC: 투하자본이익률
  RONIC: 신규 투자 이익률
  NOPAT: 세후 영업이익
  CAGR: 연평균 성장률
  TTM: 최근 12개월
  YoY: 전년 동기 대비
  QoQ: 전 분기 대비
  비GAAP: 회사가 일회성 항목을 뺀 조정 기준
  GAAP: 미국 회계기준
  CAPEX: 설비투자
  FCF: 잉여현금흐름
  SBC: 주식보상비용
  ATM: 시장가로 조금씩 파는 증자
  CMF: 매집·분산을 재는 자금 흐름 지표
  RVOL: 평소 대비 거래량 배수
  13F: 미국 기관투자자 분기 보유 공시
  10-K: 미국 연차보고서
  10-Q: 미국 분기보고서
  8-K: 미국 수시공시
  capped call: 전환 희석을 줄이는 옵션 계약
  term loan: 만기가 정해진 은행 대출
  몬테카를로: 가정을 무작위로 바꿔 수천 번 계산하는 방법
  build-to-spec: 고객 요구 성능에 맞춰 직접 설계·생산
  build-to-print: 고객 도면대로 생산
  NPX: 신제품 개발·도입·이관
  NPI: 신제품 도입
  WFE: 웨이퍼 팹 장비 투자
  GAA: 게이트올어라운드, 채널을 게이트가 둘러싼 트랜지스터 구조
  HBM: 고대역폭 메모리
  ALD: 원자층 증착
  PVD: 물리기상증착
  MFC: 질량유량제어기
  TSV: 실리콘 관통 전극
  IB: 투자은행
  EP: 경제적 이익
  FCFF: 기업 잉여현금흐름
  CFO: 최고재무책임자
  IP: 지식재산
  ATS: 대체거래시스템
  ATR: 평균 일중 변동폭
  bp: 0.01%포인트
  멀티플: 주가가 이익·매출의 몇 배인지 나타내는 배수
  리비전: 추정치 수정
  컨센서스: 시장 평균 추정
  디레이팅: 배수 하락
  런레이트: 현재 속도를 1년으로 환산한 값
  셀사이드: 증권사 리서치
  바이사이드: 자산운용사 등 기관 투자자
  캐파: 생산능력
  가이던스: 회사가 제시한 전망
  기저율: 같은 조건의 과거 사례 빈도
  계속가치: 예측 기간 이후의 가치
  서브시스템: 장비 안에 들어가는 모듈 조립품
  서브팹: 장비 아래층의 배기·가스 설비
  낙수효과: 대기업 투자가 아래 공급망으로 번지는 효과
  # 기관·협회·회사 약자
