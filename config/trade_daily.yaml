# Chiip Trade — 매일 아침 품목 하나의 수출입 추이 (마스터 지시 2026-11-21 "매일 아침 특정 재화 품목에 대한 수출입 데이터 추이를 가져와라 … 국가는 시장 관심사에 따라 임의로 정해라", radar/trade_daily.py)
# 원천: us = USITC DataWeb API(미국 수입·수출, 월간 나라별 — 토큰 USITC_DATAWEB_TOKEN), jp = 일본 재무성 무역통계(radar/trade_hs.py가 받은 e-Stat, 천 엔)
# 한국 → 미국 = 미국의 한국산 수입, 미국 → 한국 = 미국의 대한국 수출, 일본 → 한국 = 일본의 대한국 수출(상대국 통계로 본다 — 역방향 레이더와 같은 생각)
# 고르는 법(결정론): 새 달 통계가 나온 품목 > 최근 2일 Chiip 발송 글에 keywords가 많이 나온 품목 > 가장 오래 안 보낸 품목. 같은 품목은 min_gap_days 안에 다시 보내지 않는다(새 달은 예외).
window: [7, 10]        # 발송 시간대(KST) — 하루 1회
min_gap_days: 6
months_shown: 6
dataweb_gap_sec: 2
# valid_from: 이 달 앞의 값은 쓰지 않는다 — 일본 시계열은 2025년 값이 2026년의 3~4배로 끊겨 있다(전 세계 합계도 같이 끊김, 2026-11-21 발견 — radar/trade_hs.py 일본 수집분 단위·중복 점검 필요). 비중은 맞지만 전년 대비는 틀리므로 2026-01부터만 쓴다.
