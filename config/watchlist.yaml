# Portfolio 와치리스트 자동 편입·제외 (마스터 지시 2026-11-04 "Portfolio 와치리스트는 에이전트가 스스로 판단해 추가하고 제외하라.
# 단, 체계적인 판단 흐름과 정량적 지표에 따라"). 계산: scripts/portfolio/watchlist.py. 대상은 config/portfolio.yaml status: 관심 — 보유는 건드리지 않는다.
# 값은 둥근 사전값(미검증). 등록부 prm-watchlist-*. 성과는 watchlist_log.csv → 편입 후 20거래일 초과수익으로 Model Lab이 점검한다.
add:
  alpha_min: 6.0          # 알파 잠재력(knowledge/models/alpha/latest.json total) — Buy Call 기준과 같다
  composite_pct: 0.75     # 종합 점수가 그날 평가 종목 중 상위 25%(분위 — 점수 눈금이 바뀌어도 같은 뜻, 2026-11-04 분포 최고 6.5라 고정 7.0은 닿지 않는다)
  buy_call_counts: true   # 리포트 규칙 등급이 현재가로 Buy 이상(buy_call_latest)이면 종합 점수 대신 인정
  confirm_days: 2         # 서로 다른 날 연속 충족해야 편입(하루 잡음 방지)
remove:
  use_add_criteria: true  # 편입 기준(alpha_min·composite_pct·Buy Call·거래대금)에 못 미치면 제외(마스터 지시 2026-11-06). false면 아래 중앙값 규칙
  alpha_pct: 0.5          # 알파와 종합 점수가 '둘 다' 그날 분포의 중앙값 아래일 때만 미달(하나만 낮으면 유지 — 보수적 제외)
  composite_pct: 0.5
  confirm_days: 3         # 연속 미달 일수 — 편입보다 길게(들락날락 방지)
  killed_immediate: true  # 킬 조건 발동은 바로 제외
cap:
  max_auto: 8             # Chiip이 넣은 관심 종목 상한
  replace_margin: 1.0     # 상한일 때 새 후보가 가장 낮은 자동 편입 종목보다 종합 점수가 이만큼 높아야 교체
