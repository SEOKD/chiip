# 알파 잠재력 점수 (마스터 지시 2026-10-28) — '텐배거 가능성' 10점 만점
# 마스터 정의: 1000%를 찍을 종목이 아니라 "그만큼 알파가 큰" 종목. 5.0 이상만 실적 일정을 텔레그램으로 보낸다.
# 포커스 점수(config/focus.yaml)와 다르다: 포커스는 '지켜볼 이유의 크기'(상·하방 모두), 알파는 '상방 초과수익 여지'(한 방향).
# 계산: scripts/alpha/score.py / 판단: 스킬 tenbagger-card '알파 점수' 절(주 1회 + 실적 후 해당 종목) / 소비: radar/markets/earnings_calendar.py
threshold: 5.0
min_components: 2
weights: {upside: 0.30, gap: 0.30, bottleneck: 0.20, asymmetry: 0.20}
components:
  upside: "상방 여지 — 실적이 컨센서스·가격 기대를 크게 넘을 경로(병목 수혜, 리비전 상향 초입, 사이클 초입, 신규 고객·제품 램프)"
  gap: "기대 괴리 — 가격 내포 기대가 낮다(역DCF 내포 성장 < 합리적 기본 시나리오, 피어·역사 대비 디스카운트, 우려 과잉 낙폭)"
  bottleneck: "병목 노출 — 치입 엣지. 해결 기술의 독점도·대체 어려움·고객 채택 단계(샘플→인증→양산)"
  asymmetry: "비대칭·발견 여지 — 작은 규모·낮은 커버리지·카탈리스트 밀도. 초대형주는 낮다"
stale_days: 14          # 점수가 이보다 오래되면 '미산정'으로 본다
fail_closed: true       # 점수가 없거나 오래된 종목의 실적 일정은 보내지 않는다(정보 과잉 방지 — 마스터 지시). 메시지에 미산정 건수만 표시
