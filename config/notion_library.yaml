# 노션 자료실 (마스터 지시 2026-11-01) → radar/notion_library.py, docs/channels/notion.md
kinds: [pdf, xlsx]
stale_h: 6              # 색인이 이보다 오래되면 --need가 갱신을 요구한다
digest_max_chars: 3000  # 요지 분량 상한
max_shared_words: 12    # 원문과 이만큼 이어서 겹치면 요지를 거절한다
default_class: 일반 자료
blocked_classes: [채널체크]   # 필드 인텔일 수 있어 어떤 기능에도 내주지 않는다(CLAUDE.md 경계)
aliases:                # 영문 파일 이름과 맞추는 이름
  co-skhynix: [SK Hynix, SKHynix]
  co-samsung: [Samsung Electronics]
# 페이지 제목으로 분류한다. 라이선스 = 저장소에 원문을 두지 않고 요지만 둔다
classes:
  - {name: IB 리포트, match: ["IB Report", "IB 리포트"], license: true}
  - {name: 채널체크, match: ["Channel Check", "채널체크", "채널 체크"]}
  - {name: 링크드인 메모, match: ["LinkedIn", "링크드인"]}   # 마스터가 옮겨 둔 글만. 자동 수집하지 않는다(docs/channels/notion.md)
# 새 첨부를 찾을 때 읽는 페이지. Stocks 종목 페이지와 Informations 하위 페이지는 notion-fetch로 돌며 --sync에 넣는다
roots:
  - {name: IB Report, id: "40bb5d1e-0998-8064-ba1e-fd1d57bb67e3"}
  - {name: Informations, id: "407b5d1e-0998-803a-8359-e41e621d673c"}
  - {name: Stocks, id: "407b5d1e-0998-803d-a81a-d5570164959f"}
  - {name: Insights, id: "407b5d1e-0998-800a-99aa-c6f8581276ba"}
# 업종·테마 리포트 → 시장 세부 산업(config/industry_taxonomy.yaml sub, 영문 GICS) 연결(마스터 지시 2026-11-08 "Analysis에서 다루는 종목과 연관된 IB Report를 잘 참고")
# 파일 이름(밑줄 = 띄어쓰기)이 match 정규식 중 하나에 걸리고, 종목의 세부 산업이 subs에 있으면 그 종목의 관련 자료가 된다(종목 하나만 다루는 리포트는 entities로 이미 연결)
themes:
  - {match: ["Utilities", "\\bPower\\b", "\\bIPPs?\\b", "Energy Transition", "Grid", "Watts"], subs: [Electric Utilities, Multi-Utilities, Independent Power Producers & Energy Traders, Renewable Electricity, Heavy Electrical Equipment, Electrical Components & Equipment, Construction & Engineering]}
  - {match: ["Data ?Cent(er|re)", "Datacenter", "Hyperscaler", "AI Adoption"], subs: [Semiconductors, Technology Hardware, Storage & Peripherals, Communications Equipment, Electrical Components & Equipment, Heavy Electrical Equipment, Construction & Engineering, Internet Services & Infrastructure, Data Center REITs, Electronic Manufacturing Services]}
  - {match: ["Networking", "Optical", "Switch"], subs: [Communications Equipment, Semiconductors, Electronic Components]}
  - {match: ["\\bCCL\\b", "\\bPCB\\b", "Substrate", "Passive", "MLCC"], subs: [Electronic Components, Electronic Manufacturing Services]}
  - {match: ["Semiconductor", "Semis\\b", "Memory", "DRAM", "NAND", "HBM", "Foundry", "Wafer Fab", "WFE"], subs: [Semiconductors, Semiconductor Materials & Equipment, Technology Hardware, Storage & Peripherals]}
  - {match: ["Solar", "Clean Tech"], subs: [Electrical Components & Equipment, Renewable Electricity, Semiconductors]}
  - {match: ["Oil ?field", "Oilfield", "Energy Services", "Frac"], subs: [Oil & Gas Equipment & Services]}
  - {match: ["Aerospace", "Defen[cs]e"], subs: [Aerospace & Defense]}
  - {match: ["Machinery", "Automation", "Robot"], subs: [Industrial Machinery & Supplies & Components, Semiconductor Materials & Equipment]}
related_max_age_days: 45   # 관련 자료(테마·관련 종목)는 이 기간 안 자료만 요지를 의무로 한다 — 오래된 업종 자료로 작성이 막히지 않게
related_max_per_report: 6  # 관련·테마 자료 중 요지 의무는 최신 6건까지(한 리포트 작성 시간 상한) — 요지는 파일 단위라 다른 종목 리포트에서 재사용된다
