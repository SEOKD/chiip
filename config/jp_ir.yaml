# 일본 AI 밸류체인 IR 질의응답(Q&A) 수집 (마스터 지시 2026-10-29 "easyconomics에는 일본 어닝콜이 없다. 일본 종목은 공식 IR 페이지에서
# Q&A 전문이 있으면 가져와 분석하라. 영문판이 아니라 일본판으로 들어가야 나온다")
# radar/pollers/jp_ir_qa.py가 일본어 IR 페이지에서 '決算説明会 質疑応答'류 문서를 찾아 새 것만 내려받고(PDF는 pdftotext) 텍스트를
# radar/inbox/jp_qa/(git 제외)에 둔다. 판단은 펄스(⑥ IR 질의응답)가 한다. 저장소에는 자기 말 요약·15단어 이하 인용·링크만.
# site = 회사 대표 도메인(일본어판). ir_pages = 질의응답이 실리는 일본어 IR 페이지(확인되면 적는다 — 비어 있으면 seeds로 자동 탐색).
# 회사 id는 config/jp_watch.yaml과 같다.
seeds: ["/ir/", "/ja/ir/", "/jp/ir/", "/ir/library/", "/ja/ir/library/", "/jp/ir/library/", "/ir/event/", "/ir/presentation/",
        "/ja/investors/", "/ir/index.html", "/company/ir/", "/corporate/ir/"]
# 2026-10-29 첫 탐색: Q&A 발견 15곳(도쿄일렉트론·도쿄정밀·후루카와전공·신에츠·미쓰비시전기·어드반테스트·SCREEN·에바라·TDK·르네사스·TOWA·레조낙 등),
# IR 페이지는 있으나 Q&A 0건 16곳(공개 안 함 또는 탐색 실패 — 주간 발굴 회차에서 모델이 회사 IR 페이지를 직접 보고 ir_pages를 채운다), IR 페이지 0건 7곳(경로 추정값 입력).
# IR 자료실 상시 감시(2026-10-30 마스터 지시 "일본 기업은 실적 보도자료 뒤에 PT 자료·Q&A 스크립트를 늦게 낸다 — 공식 IR 사이트를 지속적으로"):
# radar/pollers/jp_ir_docs.py(src-jp-ir-docs)가 회사별 doc_pages(決算説明会資料·決算短信·質疑応答 목록 페이지 — 비어 있으면 자동 탐색, 7일 보관)를 본다.
# 실적 구간(적시공시 미러 決算·説明会 제목·새 자료·Q&A 대기 — hot_days일) 회사는 매 회차, 나머지는 cold_min분마다. 회차당 페이지 요청 max_fetch회 이하.
# 자동 탐색이 못 찾는 곳은 doc_pages를 손으로 적는다. 자료 목록을 자바스크립트로 그리는 곳은 수집 불가 — 적시공시 미러로만.
# 2026-10-30 전체 첫 회차: 자료실 확보 30곳, 못 찾음 24곳. 자바스크립트 렌더링 확인 = 키옥시아(E-IR 파츠)·이비덴 短信 목록(XjStorage — 영문 ibiden.com 短信은 정적)·후지쿠라·SUMCO·다이요유덴.
# 접속 실패 = 히타치(주소 추정 오류)·소시오넥스트(SSL 핸드셰이크)·스미토모전공(연결 끊김). 나머지는 주간 점검에서 회사 IR 페이지를 직접 보고 채운다.
docs_params: {hot_days: 10, cold_min: 180, max_fetch: 45, discover_per_run: 4, fresh_days: 21, backlog_days: 3}
