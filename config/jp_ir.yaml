# 일본 AI 밸류체인 IR 질의응답(Q&A) 수집 (마스터 지시 2026-10-29 "easyconomics에는 일본 어닝콜이 없다. 일본 종목은 공식 IR 페이지에서
# Q&A 전문이 있으면 가져와 분석하라. 영문판이 아니라 일본판으로 들어가야 나온다")
# radar/pollers/jp_ir_qa.py가 일본어 IR 페이지에서 '決算説明会 質疑応答'류 문서를 찾아 새 것만 내려받고(PDF는 pdftotext) 텍스트를
# radar/inbox/jp_qa/(git 제외)에 둔다. 판단은 펄스(⑥ IR 질의응답)가 한다. 저장소에는 자기 말 요약·15단어 이하 인용·링크만.
# site = 회사 대표 도메인(일본어판). ir_pages = 질의응답이 실리는 일본어 IR 페이지(확인되면 적는다 — 비어 있으면 seeds로 자동 탐색).
# 회사 id는 config/jp_watch.yaml과 같다.
seeds: ["/ir/", "/ja/ir/", "/jp/ir/", "/ir/library/", "/ja/ir/library/", "/jp/ir/library/", "/ir/event/", "/ir/presentation/",
        "/ja/investors/", "/ir/index.html", "/company/ir/", "/corporate/ir/"]
