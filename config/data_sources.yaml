# 데이터 추출 우선순위 (마스터 지시 2026-11-01 "Fiscal.ai 1순위, Easyconomics와 Zacks 2순위. Easyconomics도 호출 제한이 있으니 같은 우선순위인 Zacks와 번갈아 쓰고,
# 2순위 채널끼리 서로 보완할 부분이 있으면 보완하는 구조도 만들어라") → ADR-014, 호출 순서는 scripts/fiscal/source_router.py가 정한다.
# Zacks는 별도 연결이 아니라 Fiscal.ai MCP의 company_analyst_estimates·company_analyst_ratings다. Easyconomics는 별도 MCP(mcp__easyconomics__*).
# 2순위는 Fiscal.ai 칸이 비었을 때만 쓴다. Fiscal.ai 값이 있으면 2순위를 부르지 않는다.
tier1: fiscal
tier2: [easyconomics, zacks, yfinance, alphavantage]   # alphavantage = 2026-11-11 마스터 지시, radar/alphavantage.py

# yfinance 직접 호출 금지: finance.yahoo.com robots.txt가 ClaudeBot·anthropic-ai를 전면 금지하고 query1 API는 모든 봇을 금지한다. 라이브러리는 브라우저 위장(curl_cffi)으로 그 차단을 넘는다.
# 그래서 Easyconomics MCP가 내주는 yfinance 출처 자료를 채널로 쓴다. 호출 수는 Easyconomics에 묶인다.
via: {yfinance: easyconomics}

limits:
  alphavantage:
    daily_cap: 24      # 무료 25회/일(alphavantage.co/support) — radar/alphavantage.py BUDGET과 같게
    cooldown_h: 24
  easyconomics:
    daily_cap: 100     # 실제 한도 미확인 — 보수적으로 잡은 값, 한도를 알게 되면 고친다
    cooldown_h: 24     # 호출 제한 응답을 받으면 이 시간 동안 Zacks로만

# 2026-11-01 마스터 지시 "Chiip Analysis 1순위 Fiscal.ai, 2순위 Easyconomics·Zacks·yfinance. 세 가지를 모두, 균형 있게"
# tier2가 둘 이상이면 지금까지 덜 쓴 채널부터 쓰고(radar/state/data_sources.json served), 그 채널에 빈칸이 남으면 다른 채널이 채운다. 하나면 그 채널만 낼 수 있는 항목이다.
items:
  jp_est:
    name: 일본 상장사 분기 컨센서스(매출·EPS)
    tier2: [tradingview]
    tradingview: radar/jp_consensus.py — Fiscal.ai·Zacks·Easyconomics에 일본 추정이 없다(2026-11-02 확인, knowledge/methods/jp_consensus_routes.md)
  quarter_est:
    name: 지난 분기 발표 전 추정(매출·EPS)
    fiscal: knowledge/models/estimates/snapshots.csv(매일 저장) → company_estimates
    tier2: [easyconomics, zacks, yfinance]
    easyconomics: earnings_summary_dates의 eps_estimate·revenue_estimate(발표일 기준, 깨진 칸 있음)
    zacks: surprise.js 안의 company_analyst_estimates history
    yfinance: Easyconomics company_profile의 earnings_history(응답 출처 표시 yfinance, 8개 분기)
  street_ratings:
    name: 애널리스트 의견 분포·목표가
    tier2: [zacks, yfinance]
    zacks: consensus.js 안의 company_analyst_ratings
    yfinance: Easyconomics company_profile의 analyst_buy·hold·sell·total, target_price(강력 매수·강력 매도 구분 없음)
  margin_est:
    name: 지난 분기 조정 EBIT·EBITDA 추정
    fiscal: knowledge/models/estimates/snapshots.csv → company_estimates
    tier2: [zacks]
    zacks: surprise.js
  eps_revision:
    name: EPS 추정 변경 이력·과거 Fwd 멀티플 레인지
    tier2: [zacks]
    zacks: eps_history.js·forward_multiples.js
  rating_changes:
    name: 애널리스트 상향·하향 피드(최근 5일)
    tier2: [easyconomics]
    easyconomics: analyst_rating_changes
  jp_tw_eu_financials:
    name: Fiscal.ai 칸이 빈 일본·대만·유럽 요약 재무
    fiscal: company_financials
    tier2: [easyconomics]
    easyconomics: company_financials_summary(market 인자)
  positioning_macro:
    name: 시장 포지셔닝·유동성·매크로 합성 지표
    tier2: [easyconomics]
    easyconomics: market_positioning·liquidity_monitor·macro_composite
  us_earnings_calendar:
    name: 미국 감시 종목 실적 일정·분기 EPS 추정(발표 전)
    tier2: [alphavantage]
    alphavantage: radar/alphavantage.py ①(매일, knowledge/models/alphavantage/earnings_calendar.csv) — 회사 IR 일정으로 대조
  transcript_backup:
    name: Fiscal.ai에 없는 미국 어닝콜 전사
    tier2: [alphavantage]
    alphavantage: py radar/alphavantage.py --transcript <티커> <YYYYQn> — 요약만, 원문 복제 금지

# Fiscal.ai 장애 우회(2026-11-14 파이프라인 점검 — 11/13 22시 Analysis가 Fiscal.ai 커넥터 4회 실패로 리포트 0건). 위 tier2는 '빈칸 보완'이고,
# 이 절은 '연결 자체가 죽었을 때'다. 순서: ① 10분 뒤 한 번 더 ② 아래 항목별 대체 원천으로 진행하고 datapack sources·리포트 출처에 '대체 원천' 표시
# ③ 대체가 없는 항목(Fiscal 자체 추정·Forward 배수 이력)은 '미확인'으로 두고 막히면 그 종목은 다음 회차로 미룬다(pick_report --done을 하지 않는다).
# 장애는 radar/self_heal.py --report fiscal "<오류>"로 남긴다(채널 우회 표 radar/state/channel_down.json).
outage:
  fiscal:
    retry_after_min: 10
    routes:
      financial_statements: [tradingview: mcp-tv-get-financials·mcp-tv-get-financial-history, easyconomics: company_financial_statements·company_financials_summary, sec: radar/markets/sec_xbrl.py 출력(knowledge/models/fundamentals/us — 미국 상장·ADR, 주 1회)]
      quarters: [tradingview: mcp-tv-get-financial-history(분기), easyconomics: company_financial_statements(quarterly)]
      estimates: [easyconomics: company_profile(yfinance 출처)·earnings_summary_dates, tradingview: mcp-tv-get-forecasts, alphavantage: radar/alphavantage.py --about]
      ratings_targets: [easyconomics: company_profile·analyst_rating_changes, tradingview: mcp-tv-get-forecasts]
      prices: [tradingview: mcp-tv-get-ohlcv(일봉은 원래 TradingView가 정본)]
      transcripts: [easyconomics: earnings_call_transcript, alphavantage: radar/alphavantage.py --transcript]
      forward_multiples: [tradingview: mcp-tv-get-symbol-data(price_earnings_forward 등) — 이력 레인지는 대체 없음(미확인)]
