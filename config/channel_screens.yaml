                    buyback_yield, sloan_ratio_ttm, Volatility.M, Perf.1M, Perf.Y, price_52_week_high]
columns_activist: &ca [name, description, industry, market_cap_basic, close, is_primary, AvgValue.Traded_30d, tobin_q_ratio_fy, price_book_fq,
                       cash_n_short_term_invest_fq, return_on_equity_ttm, dividend_payout_ratio_ttm, buyback_yield, Perf.Y, free_cash_flow_ttm]

