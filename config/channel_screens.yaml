screens:
  neglected:
    exclude_industries: "Real Estate Investment Trusts|Investment Trusts|Mutual Funds|Closed-End|Exchange Traded|Unit Trust"   # 리츠·펀드 제외(2026-11-15 일본 시험: 인프라 펀드가 1위)
    title: 저관심 텐배거 조짐 스크린
    about: "작고(시총 $3천만~$20억) FCF를 벌며 싸고(FCF 수익률·PBR), 매출·이익률이 꺾여 오르기 시작했는데, 애널리스트·거래가 적고 주가가 아직 뻗지 않은 종목(조사 G NMP·조사 B 복합 B — Yartseva 2025 서열). 주 1회 7개 시장 순번."
    channel: neglected
    kind: precursor
    signal_head: 저관심 10배 전조
    rotation: [america, japan, korea, taiwan, uk, germany, hongkong, france, sweden, italy, netherlands, spain, switzerland, denmark, norway, finland]
    per_run: 2            # 하루 시장 수 — 16개 시장을 약 8거래일에 한 바퀴
    weekdays: [0, 1, 2, 3, 4]
    limit: 50
    mcap_usd: [30000000, 2000000000]
    filters: {price_free_cash_flow_ttm: [0.5, 25], total_revenue_yoy_growth_ttm: [0, 300]}   # FCF 흑자(현금 경로 관문)·매출 감소 기업 제외 — TradingView가 적용
    sort_by: price_free_cash_flow_ttm   # FCF 수익률 높은 순으로 잘라 받는다(Yartseva: 가장 큰 계수)
    sort_order: asc
    columns: *cn
    primary_only: true
    min_value_usd: {default: 250000, america: 1000000, hongkong: 500000}
    min_price: {america: 2.0, hongkong: 0.5}
    size_peak_usd: 250000000   # 규모 언덕형 정점($1~5억, 조사 G)
    altman_min: 1.1
    fcf_margin_floor: -5
    lottery_1m: 100
    lottery_vol: 15
    perf_y_max: 400
    sloan_max: 25
    dilution_max_pct: 10       # 이 이상 희석은 감점
    dilution_hard_pct: 20      # 이 이상 희석은 제외
    weights:                   # 시장 안 백분위 가중(합 1) — 사전값
      value: 0.24              # FCF 수익률 60%·B/M 30%·EV/EBITDA 10%(Yartseva 2025 최대 계수, 조사 G)
      inflection: 0.20         # 매출 가속·매출총이익률 계단·EPS 서프라이즈(Bernard·Thomas 1989, 조사 G — 성장 '수준'은 Yartseva에서 무의미)
      neglect: 0.17            # 애널리스트 수·회전율(Arbel·Strebel 1983 — 시장 안 상대값, 아시아는 0명이 다수)
      not_extended: 0.15       # 12개월 가격 위치·6개월 수익률이 낮을수록(Yartseva 2025 음의 계수)
      quality: 0.13            # EBITDA 마진·ROIC·피오트로스키 F·자산 증가 ≤ EBITDA 증가(Yartseva)
      size: 0.11               # 언덕형($2.5억 정점)
    completeness_floor: 0.85
    penalty_each: 0.7
    top_n: 6                   # 시장별
    lead_min: 7.0
    stale_days: 21
  quant_alpha:
    exclude_industries: "Real Estate Investment Trusts|Investment Trusts|Mutual Funds|Closed-End|Exchange Traded|Unit Trust"   # 리츠·펀드 제외(2026-11-15 일본 시험: 인프라 펀드가 1위)
    title: IB 정량 복합 스크린
    about: "가치(EBIT/EV·FCF 수익률·B/M·E/P)·질(ROA·ROIC·F)·12-1 모멘텀·주식 수 감소·낮은 발생액·낮은 변동성·단기 반전을 시장 안에서 합친 3~12개월 순위(조사 B 복합 A, 시장별 배수). 애널리스트 추정 상향·내부자 매수는 TradingView에 없어 빠진다."
    channel: quant
    kind: composite
    signal_head: IB 정량 복합
    rotation: [america, japan, korea, uk, germany, taiwan, france, hongkong, sweden, switzerland, italy, netherlands]
    per_run: 1
    weekdays: [0, 2, 4]        # 월·수·금
    limit: 50
    mcap_usd: [500000000, 30000000000]
    filters: {price_free_cash_flow_ttm: [0.5, 40], total_revenue_yoy_growth_ttm: [-20, 300]}
    sort_by: Perf.6M
    sort_order: desc
    columns: *cq
    primary_only: true
    min_value_usd: {default: 1000000, america: 5000000}
    sloan_max: 25
    dilution_max_pct: 5
    dilution_hard_pct: 20
    weights:                   # 조사 B 복합 A 중 TradingView로 계산 가능한 블록(합 1로 다시 나눔)
      value: 0.30
      quality: 0.24
      momentum: 0.18
      issuance: 0.10
      accruals: 0.06
      low_vol: 0.07
      reversal: 0.05
    market_mult:               # 조사 B §9·§12 — 일본 모멘텀 ×0.3·가치 ×1.3, 한·대만·홍콩 모멘텀 ×0.5, 홍콩은 가치·질 중심
      japan: {momentum: 0.3, value: 1.3}
      korea: {momentum: 0.5}
      taiwan: {momentum: 0.5}
      hongkong: {momentum: 0.5, value: 1.2}
    completeness_floor: 0.85
    penalty_each: 0.5
    top_n: 5
    lead_min: 7.5
    stale_days: 28
  activist_target:
    exclude_industries: "Real Estate Investment Trusts|Investment Trusts|Mutual Funds|Closed-End|Exchange Traded|Unit Trust"   # 리츠·펀드 제외(2026-11-15 일본 시험: 인프라 펀드가 1위)
    title: 행동주의 표적 유사도 스크린
    about: "행동주의가 고르는 회사의 특징 — 동종보다 싸고(토빈 q·PBR), 현금이 많고, 자본 효율이 낮고, 주주환원이 적고, 주가가 뒤처진 중소형 — 이 겹치는 종목. 진입 공시가 아니라 '표적이 될 만한가'다."
    channel: activist
    kind: target
