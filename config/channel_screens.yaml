# 발굴 채널 TradingView 스크린 (마스터 지시 2026-11-15, scripts/discovery/channel_screens.py, 설계 knowledge/methods/discovery_engine.md)
# TradingView 호출은 모델이 한 번에 하나씩(병렬 금지). market_cap_basic은 현지 통화 — plan이 USD 구간을 ECB 환율로 바꾼다.
# 2026-11-15 시험: 시가총액·price_free_cash_flow_ttm·total_revenue_yoy_growth_ttm 필터와 P/FCF 정렬은 TradingView가 적용한다.
#   recommendation_total·AvgValue.Traded_30d·is_primary·tobin_q_ratio_fy·price_book_fq 필터는 무시한다(응답 ignored_filters) → 받은 뒤 파이썬 관문에서 다시 거른다.
# 응답은 모델이 파일로 옮겨 적는다(토큰 비용) — 행 수(limit)·칸 수를 작게, 무거운 거르기는 TradingView 쪽 필터·정렬로.
# 가중·문턱은 사전값(미검증) — 등록부 prm-cscr-*. 성적표(leads.py --scorecard)가 표본 30 이상이면 표본 외 검정으로만 바꾼다.

