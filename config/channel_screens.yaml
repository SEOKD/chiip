    sort_by: price_book_fq
    sort_order: asc
    columns: *ca
    primary_only: true
    min_value_usd: {default: 1000000}
    size_sweet_usd: 2000000000
    dilution_max_pct: 5
    dilution_hard_pct: 20
    weights:                   # 사전값 — Brav·Jiang·Partnoy·Thomas 2008 표적 특징(낮은 q·높은 현금·낮은 배당·작은 규모), 일본 PBR 1배 미만 개선 요구(2023 TSE)
      cheap: 0.25
      cash_rich: 0.20
      low_roe: 0.15
      low_payout: 0.15
      lagging: 0.10
      size: 0.10
