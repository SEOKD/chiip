                        price_free_cash_flow_ttm, price_book_fq, enterprise_value_ebitda_ttm, total_revenue_yoy_growth_ttm, total_revenue_yoy_growth_fq,
                        gross_margin, gross_profit_margin_fy, ebitda_margin_ttm, return_on_invested_capital, piotroski_f_score_ttm,
                        ebitda_yoy_growth_ttm, total_assets_yoy_growth_fy, eps_surprise_percent_fq, free_cash_flow_ttm, free_cash_flow_margin_ttm,
                        altman_z_score_ttm, buyback_yield, Volatility.M, Perf.1M, Perf.6M, Perf.Y, price_52_week_high, price_52_week_low]
columns_quant: &cq [name, description, industry, market_cap_basic, close, is_primary, AvgValue.Traded_30d, enterprise_value_to_ebit_ttm,
