# 밸류에이션 시스템 설정 (docs/valuation/framework.md, ADR-008) — 초안, 마스터 확정 전
# 수집: radar/markets/valuation_data.py (결정론) / 계산: scripts/valuation/engine.py (결정론) / 해석: 스킬 valuation-card (모델)
provider: eodhd             # Fundamentals(추정치·리비전)는 EODHD 'Fundamentals' 또는 'ALL-IN-ONE' 요금제 필요. 가격(EOD)은 모든 유료 요금제
code_verified: false        # EODHD 종목 코드는 키 입력 후 일괄 확인(일본 거래소 코드 미확인 → code: null은 건너뜀)

# 수집 시간대(KST) — 하루 두 번. 아침 브리프(06:00대)·저녁 브리프(22:00대) 전에 끝나게
slots:
  - {name: morning, from: "05:00", to: "06:00"}   # 미국 장 마감 반영(아침 브리프 06:00대 전)
  - {name: evening, from: "15:45", to: "17:00"}   # 한국 장 마감 반영
price_history_days: 400     # 수익률 분해(30·90·365일)·실적 반응용

params:
  discount_rate: {US: 0.09, KR: 0.10, TW: 0.09, JP: 0.08, EU: 0.09}   # 역DCF 할인율(자기자본비용 가정 — 마스터 확인)
  horizon_years: 5                                                    # 역DCF: N년 뒤 EPS × 장기 P/E
  min_regression_n: 12                                                # 정당 멀티플 회귀 최소 표본
  pe_cap: 200                                                         # 이보다 큰 P/E(적자 근접)는 회귀·백분위 제외
  history_min_days: 20                                                # 자기 역사 백분위에 필요한 스냅숏 수
  narrative_window_days: 7

# 하위 섹터 — 기본 방법(공개 IB 관행 종합, framework.md §4). terminal_pe = 역DCF 장기 P/E 가정
subsectors:
  memory:       {label: 메모리, cyclical: true, terminal_pe: 10, primary: "P/B 사이클 밴드 + 2년 평균·정상화 P/E", cross: "내포 P/E ↔ P/B 교차 검증", key: "DRAM·NAND ASP, HBM 비중·점유율, 비트 성장, CAPEX"}
  accelerator:  {label: AI 가속기·ASIC, cyclical: false, terminal_pe: 22, primary: "2년 선행 P/E, PEG", cross: "S&P500 대비 상대 P/E", key: "하이퍼스케일러 CAPEX, CoWoS 배정, 고객 집중도"}
  foundry:      {label: 파운드리·로직, cyclical: false, terminal_pe: 18, primary: "선행 P/E", cross: "ROE 대비 P/B", key: "가동률, 노드 믹스, CAPEX 강도, 가격"}
  semicap:      {label: 반도체 장비, cyclical: true, terminal_pe: 20, primary: "정상화 EPS × 사이클 중간 P/E", cross: "사이클 고점·저점 P/E", key: "WFE 전망, 중국 비중, 수주·백로그"}
  substrate:    {label: 기판·PCB·소재, cyclical: true, terminal_pe: 13, primary: "FY1·FY2 P/E", cross: "EV/EBITDA, P/B", key: "AI 서버 비중, ASP, 가동률, 증설"}
  components:   {label: 부품·모듈, cyclical: true, terminal_pe: 12, primary: "FY1·FY2 P/E", cross: "EV/EBITDA", key: "고객(애플 등) 물량, 믹스, 환율"}
  analog:       {label: 아날로그·전력반도체, cyclical: true, terminal_pe: 20, primary: "사이클 평균 EPS × 평균 P/E", cross: "재고일수", key: "재고 조정 단계, 산업·차량 수요"}
  networking:   {label: 네트워킹·광, cyclical: false, terminal_pe: 22, primary: "선행 P/E", cross: "성장 조정 EV/S", key: "800G·1.6T 전환, 스케일업·아웃 수요"}
  eda_ip:       {label: EDA·IP, cyclical: false, terminal_pe: 30, primary: "EV/FCF, 선행 P/E", cross: "역사 대비 프리미엄", key: "백로그, 로열티, 고객 설계 착수"}
  software:     {label: AI 소프트웨어, cyclical: false, terminal_pe: 25, primary: "성장 조정 EV/S(EV/선행매출 ÷ 2년 성장률)", cross: "Rule of 40, EV/FCF", key: "NRR, RPO, AI 매출 공개"}
  hyperscaler:  {label: 하이퍼스케일러, cyclical: false, terminal_pe: 20, primary: "선행 P/E, SOTP(클라우드)", cross: "EV/EBITDA, FCF 추이", key: "CAPEX 가이던스 — 공급사 매출의 선행 지표"}
  server:       {label: 서버·ODM, cyclical: false, terminal_pe: 14, primary: "선행 P/E", cross: "ROIC, 운전자본", key: "GB·랙 출하, 마진"}
  power_infra:  {label: 전력·냉각 인프라, cyclical: false, terminal_pe: 20, primary: "FY2 P/E", cross: "수주잔고·Book-to-bill", key: "변압기·냉각 리드타임, 데이터센터 착공"}
  storage:      {label: 스토리지(HDD·SSD), cyclical: true, terminal_pe: 12, primary: "정상화 P/E", cross: "P/B", key: "엑사바이트 출하, 가격"}
  conglomerate: {label: 복합기업, cyclical: true, terminal_pe: 12, primary: "SOTP(사업부별 피어 배수) − 지주 할인", cross: "P/B", key: "사업부별 이익 기여"}

