# 반영도 지수 구성(0~100, 높을수록 기대가 많이 반영됨) — 구성 요소별 가중치. 없는 요소는 빼고 재정규화
priced_in_weights:
  pe_vs_peer: 1.0          # 하위 섹터 중앙값 대비 선행 P/E 백분위
  pe_vs_history: 1.0       # 자기 스냅숏 역사 내 선행 P/E 백분위
  residual_premium: 1.0    # 정당 멀티플 회귀 잔차(펀더멘털로 설명 안 되는 프리미엄) 백분위
  price_ahead_of_revision: 1.0   # 90일 주가 z − 90일 리비전 z 백분위
  implied_growth_gap: 1.0  # 역DCF 내포 성장률 − 컨센서스 FY1 성장률 백분위
  implied_bull_prob: 1.0   # 시나리오 사이 주가 위치(강세 확률) — scenarios.csv 있을 때만
  beat_and_drop: 0.5       # 최근 4회 실적에서 서프라이즈인데 하락한 비율
