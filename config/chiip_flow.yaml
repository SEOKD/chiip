# Chiip Flow — 미국 장초·장마감 섹터 로테이션 관측(radar/markets/sector_flow.py, 마스터 지시 2026-11-08 "Chiip Midterm을 Chiip Flow로 바꾸고
# 미국 주식 시장의 장초, 장마감 섹터 로테이션 흐름을 관측") — 옛 중간선거 장중 감시(config/midterm2026.yaml tick)를 상시 엔진으로 옮겼다
benchmark: AMEX:SPY
checkpoints:            # 미국 동부 시각(ET) — 서머타임은 zoneinfo가 처리한다. 조기 폐장일은 마감 15분 전
  open: "09:45"
  close: "15:45"
tolerance_min: 40       # 예약 지연(최대 약 15분)을 감안해 체크포인트 ±40분 안이면 그 회차로 본다

