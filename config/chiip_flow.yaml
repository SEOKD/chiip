# 로테이션 축 = (왼쪽 묶음 평균 등락 − 오른쪽 묶음 평균 등락), %p. 양수면 왼쪽으로 돈이 간다
axes:
  - {name: "경기민감 ↔ 방어", left: [AMEX:XLY, AMEX:XLI, AMEX:XLF, AMEX:XLB, AMEX:XLE], right: [AMEX:XLP, AMEX:XLU, AMEX:XLV, AMEX:XLRE]}
  - {name: "성장 ↔ 가치", left: [AMEX:IWF], right: [AMEX:IWD]}
  - {name: "소형 ↔ 대형", left: [AMEX:IWM], right: [AMEX:SPY]}
  - {name: "고베타 ↔ 저변동", left: [AMEX:SPHB], right: [CBOE:USMV]}
  - {name: "반도체 ↔ 소프트웨어", left: [NASDAQ:SMH], right: [CBOE:IGV]}
  - {name: "동일가중 ↔ 시총가중(시장 폭)", left: [AMEX:RSP], right: [AMEX:SPY]}
  - {name: "하이일드 ↔ 투자등급(신용 위험 선호)", left: [AMEX:HYG], right: [AMEX:LQD]}
axis_dead: 0.15         # |축 값| 이 %p 미만이면 '중립'

rv_floor: 0.3           # 흐름 = (등락 − SPY 등락) × 상대 거래량(10일, floor~cap) — 사전값(미검증)
rv_cap: 3.0
thin_rv: 1.0            # 오르는데 상대 거래량이 이 아래면 '얇은 상승'
streak_days: 3          # 유입 상위 3에 연속 n거래일 장마감 기준으로 들면 '다일 로테이션'

