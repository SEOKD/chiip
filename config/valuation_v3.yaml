# DCF 보강(D2~D6) + SOTP (ADR-016, 마스터 승인 2026-11-07 "위 설계안과 확인하지 못한 것 모두 Chiip 시스템 아키텍처에 구현하라")
# 값은 모두 사전값(prior) — 등록부 prm-dcf-*·prm-sotp-*. 피팅은 scripts/backtest/ 데이터셋이 생긴 뒤 표본 외로(채택 관문 그대로).
# 계산: scripts/valuation/v2/plus.py(D2·D3·D5·D6) · montecarlo.py(D4) · sotp.py(SOTP)

outside_view:              # D2 외부 관점 혼합 — 3년차 이후 성장률을 같은 규모 구간 기저율 중앙값 쪽으로 당긴다
  enabled: true
  start_year: 3            # 이 해까지는 종목 가정 그대로(컨센서스·가이던스 구간)
  k: 0.35                  # 혼합 가중 w_t = 1 − exp(−k·(t − start_year)). 10년차 w ≈ 0.91
  source: "Mauboussin, Callahan & Majd(2016) The Base Rate Book; Chan, Karceski & Lakonishok(2003) J Finance 58(2) — 장기 성장 지속성은 우연 수준"

normalize:                 # D3 정상화 이익률 — 경기순환 업종은 계속가치 마진을 한 사이클 평균으로
  blend_years: 3           # 마지막 몇 해 동안 정상화 마진으로 선형 이동(계속가치는 마지막 해 마진을 쓴다)
  cycle_years: 10          # 피어 SEC 연간 영업이익률 평균 창(8~10년 = 메모리 한 사이클)
  peers: {memory: MU, storage: WDC}   # drivers에 cyclical이 없을 때 감시 목록 업종(sub)으로 정상화 피어를 고른다(2026-11-13 — 메모리 동인 전부 cyclical 누락)
  sigma_window: 3          # 경기순환 종목 몬테카를로 마진 충격 σ = 피어 영업이익률 3년 이동평균의 표준편차(MU 2017~2026 = 14.7%p, 동인 기본 2%p 대신) — 등록부 prm-dcf-cycle-sigma
  source: "Damodaran, Investment Valuation 3판 22장(순환 기업 — 정상화 이익)"

mc_corr:                   # D4 상관 충격 + 두꺼운 꼬리
  enabled: true
  rho_growth_margin: 0.4   # 성장 충격과 마진 충격의 상관(영업 레버리지). 사전값 — 피팅 대상
  t_df: 5                  # 스튜던트 t 자유도(분산 1로 정규화)
  source: "영업 레버리지(Mandelker & Rhee 1984 J Financial Quant Anal); 수익률 두꺼운 꼬리(Cont 2001 Quant Finance)"

exit_check:                # D5 계속가치 내포 출구 EV/EBIT 점검 — 업종의 지금 EV/EBIT보다 높으면 '공격적' 경고(값은 바꾸지 않는다, ADR-040)
  # 위 기준 = 업종의 지금 배수(성장 기대 포함). 10년 뒤 안정 성장 해의 출구 배수는 보통 이보다 낮아야 한다. 아래 기준(바닥)은 (1 − t)/WACC로 종목마다 계산
  # 옛 범위(semiconductor 8~25 등, '어림값, 대조 전')는 보수 가정(RONIC = WACC)의 당연한 결과를 '범위 밖'으로 띄웠다(122종목 중 71곳)
  industry_ev_ebit:        # Damodaran, Enterprise Value Multiples by Sector (US), 2026-01 — EV/EBIT, Only positive EBITDA firms(동인 industry → Damodaran 업종)
    semiconductor: 44.30         # Semiconductor
    semicap: 28.81               # Semiconductor Equip
    electronics: 29.76           # Electronics (General)
    electrical_equipment: 43.19  # Electrical Equipment
    aerospace_defense: 34.79     # Aerospace/Defense
    telecom_equipment: 30.86     # Telecom. Equipment
    computers: 29.36             # Computers/Peripherals
    software: 32.41              # Software (System & Application)
    software_internet: 32.41     # Software (Internet)은 172.99(이익이 작은 회사가 섞여 왜곡) — System & Application으로 대신
    oilfield_services: 14.90     # Oilfield Svcs/Equip.
    offshore_drilling: 14.90     # Oilfield Svcs/Equip.
    datacenter: 19.25            # Computer Services(GPU 클라우드·데이터센터 임대 — 업종 표에 데이터센터가 따로 없다, 근사)
    power_ipp: 21.86             # Power
    power_utility: 22.63         # Utility (General)
    personal_products: 16.25     # Household Products
    payments: 20.15              # Business & Consumer Services(근사)
    life_science_services: 15.02 # Healthcare Support Services(근사)
    media_entertainment: 38.92   # Entertainment
    leisure_facilities: 23.96    # Recreation
    instruments: 29.76           # Electronics (General)(정밀 계측, 근사)
    education: 14.49             # Education
    legal_finance: null          # 금융업은 EV 배수가 맞지 않는다 — 점검하지 않는다
  default_ev_ebit: 25.70         # Total Market (without financials)
  source: "Damodaran, Enterprise Value Multiples by Sector (US), Data as of January 2026 — https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/vebitda.html (2026-11-15 확인). 연 1회(1월) 갱신"

roic_fade:                 # D6 계속가치 RONIC = WACC + max_spread × 해자 점수(0~1). drivers에 ronic_spread가 있으면 그것이 우선.
                           # 해자 점수 = 리포트 해자 판정(datapack moat.items, 근거 있는 항목)을 멀티플 선정과 같은 점수표로(plus.moat_score, ADR-040). 해자에서 온 RONIC은 10년차 ROIC 상한
  max_spread: 0.08
  source: "Fama & French(2000) J Business 73(2) — 수익성 연 약 38% 평균회귀; McKinsey Valuation 7판 — 넓은 해자 기업도 계속가치 스프레드는 한 자릿수"

sotp:
  holding_discount: 0.30   # 상장 지분 시가 할인 사전값(아래 근거) — 리포트는 0%·30%·50% 민감도를 같이 낸다
  holding_discount_range: [0.20, 0.50]
  holding_discount_basis:
    - "신현한 외 — 한국 지주회사는 상장 자회사가 많을수록 할인 확대(https://www.bohrium.com/scholar/37292C67/Hyun-Han_Shin, 서지만 확인)"
    - "자회사 상장 시 모회사 PBR 약 −33% 보도(어림)"
    - "삼성물산 셀사이드 SOTP: 목표 할인율 45% 적용 사례(증권사·날짜 미확인), 시장 NAV 할인 50%대 거론(아시아경제 2025-12-08, https://core.asiae.co.kr/article/2025120816154741157) — 지주회사 자체 할인이라 사업회사가 쥔 지분 할인의 상한 참고"
    - "Berger & Ofek(1995) J Financial Econ 37 복합기업 할인 13~15% — 상한 참고만(이중 적용 금지)"
  corr_segments: 0.5       # 사업부 충격의 공통 거시 요인 비중(상관 ρ)
  draws: 2000
  seed: 20261107
