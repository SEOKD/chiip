  packaging-substrate: {name: "패키징·기판·PCB·소재", etf: "NASDAQ:SMH"}
  ai-accelerators: {name: "AI 가속기(GPU·ASIC)", etf: "NASDAQ:SMH"}
  networking-interconnect: {name: "네트워킹·광 인터커넥트", etf: "NASDAQ:SMH"}
  materials-equipment: {name: "반도체 장비·소재", etf: "NASDAQ:SMH"}
  passives-components: {name: "수동소자·부품(MLCC 등)", etf: "NASDAQ:SMH"}
  power-infra: {name: "데이터센터 전력 인프라", etf: "AMEX:XLU"}
  cooling: {name: "데이터센터 냉각", etf: "AMEX:XLI"}
  devices-robotics: {name: "기기·로보틱스", etf: "AMEX:XLK"}
sub_map:                   # config/valuation.yaml universe·earnings_watch extra의 sub → 산업(알파 유니버스 종목까지 구성에 넣는다)
  memory: dram-hbm
