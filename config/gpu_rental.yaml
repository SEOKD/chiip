# GPU 렌털료 변동 구조 — radar/gpu_movers.py가 읽는다
# 2026-11-21 마스터 지시 "GPU 렌털비는 일일 데이터 변동이 있는 파이프라인을 찾고 이 값이 매일 변할 경우 업데이트할 수 있는 구조를 만들어라"
# 계열 = (제공사, GPU, 구성, 조건). 매 수집 회차(run_hourly 360분)가 최근 classify_days일의 '하루 마지막 값'으로 계열마다 변동 성격을 다시 잰다.
#   daily      관측일 사이 값이 바뀐 비율 ≥ daily_ratio — 시장 가격(지수·마켓). 작은 움직임은 그림·캡션으로만, 알림은 문턱을 넘을 때
#   occasional 기간 안에 한 번 이상 바뀜 — 정가 개편 진행 중일 수 있다. 바뀔 때마다 알림
#   sticky     기간 내내 같은 값 — 정가. 바뀌면 그 자체가 소식이라 알림
classify_days: 14
min_obs_days: 4          # 관측일이 이보다 적으면 'new'(판정 보류)
daily_ratio: 0.3
stale_days: 5            # expect: daily 원천의 GPU 계열이 전부 이 일수 넘게 같은 값이면 '정체'(원천 갱신 멈춤 의심) — 수집 문제 목록에 올린다
alert:
  daily_pct: 5.0         # daily 계열: 전 관측일 대비 ±5% 이상
  week_pct: 10.0         # daily 계열: 7일 전 대비 ±10% 이상(완만한 누적 변화)
# 원천별 기대 성격·쓰임. role: 참고선 = 일일 그림(radar/gpu_daily.py) 각 칸에 회색 점선으로 그린다(정가와 정의가 달라 직접 비교하지 않는다)
# 새 일일 원천을 붙일 때: radar/gpu_rental.py에 수집 함수를 넣고(약관·robots 확인 후) 여기 한 줄 추가 → 분류·알림·그림·주간 점검이 따라온다
# expect: daily = 매일 움직여야 함(멈추면 정체 경고) · probe = 매일 바뀔 수 있다고 하나 미검증(판별기가 재기만, 경고 없음) · sticky = 정가
# term이 있으면 아카이브 CSV(gpu_rental_wayback.csv)의 그 원천 과거값도 판별에 넣는다
sources:
  - {provider: "Silicon Data 지수", expect: daily, role: 참고선, term: "시장 지수(인용)", note: "거래 가격 기반 시장 지수, 공개 페이지 헤드라인 인용(데이터셋·API 유료 미사용)"}
  - {provider: "Flopper 시장 중앙값", expect: daily, role: 참고선, term: "시장 중앙값(온디맨드)", note: "flopper.io/pricing/<gpu> 페이지에 든 제공사 15~31곳 일별 최저 온디맨드가의 중앙값. robots Allow(Crawl-delay 1, /api/ 금지 — HTML만), 약관 페이지 없음(2026-11-21). 하루 1회·페이지 사이 1.5초"}
  - {provider: "Ornn 지수", expect: daily, role: 참고선, term: "시장 지수(실거래 정산)", internal_only: true, note: "Ornn Compute Price Index(OCPI) 실거래 정산 일일 지수, data.ornn.com/api/public-index/daily-index/all(robots Allow, 키 없음). 약관(2026-05-29)은 서면 허락 없는 체계적 수집·리포트 재게시 금지 — 마스터 결정 2026-11-21 '붙여'(내부용). 하루 1회, 마스터 개인 봇 그림·캡션·주간 점검에만 — 리포트·노션·공개 산출물·비교표 금지(gpu_rental.INTERNAL_ONLY). 원자료는 git 제외 radar/inbox/gpu_ornn.csv에만"}
  - {provider: "Google Cloud 스팟", expect: probe, note: "cloud.google.com/spot-vms/pricing(us-central1) — '하루 한 번까지 바뀔 수 있다'는 문구뿐, 실제 변동 미검증. robots 허용·Google 약관은 robots 준수 자동 접근 허용. 하루 1회"}
  - {provider: Nebius, expect: sticky}
  - {provider: CoreWeave, expect: sticky}
  - {provider: Lambda, expect: sticky}
  - {provider: AWS, expect: sticky}
