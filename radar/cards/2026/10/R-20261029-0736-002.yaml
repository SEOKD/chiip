what_happened: "백악관 팩트시트에 따르면 대통령이 Section 232(1962년 무역확장법)에 근거한 포고(Proclamation)에 서명해 로봇·산업기계 및 그 부품·부속품의 미국 수입을 조정한다고 발표했다. 단계는 서명·발표이며, 발효일·세율·대상 HTS 코드 범위는 포고문 원문과 부속서를 확인하기 전까지 미확인이다."
primary_source_confirmed: true
novelty: "미확인 — 기존 232조 조치(반도체·장비 관련)와의 중복·신규 범위 여부 대조 필요. 포고문 부속서에 반도체 제조장비(ALD 등)가 포함되는지 확인 전까지 T0 노출은 불명"
