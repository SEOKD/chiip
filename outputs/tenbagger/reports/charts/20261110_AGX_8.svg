<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="164.9" height="16" rx="3" fill="#5d6470"><title>약세: 109$ (-64%) · 확률 30% — 신규 대형 수주가 2027년 하반기로 밀려 백로그 소진만 이어지고, 산업 저마진과 발전 마진 정상화(20% 안팎)로 이익이 줄어든다</title></rect><text x="288.9" y="22">109 (-64%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="282.2" height="16" rx="3" fill="#5d6470"><title>기본: 186$ (-39%) · 확률 45% — 다음 4개 분기 컨센서스 경로 — FY27 매출 약 $1.45B, 발전 마진 22% 안팎, 신규 수주 1건 반영</title></rect><text x="406.2" y="48">186 (-39%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="400.8" height="16" rx="3" fill="#5d6470"><title>강세: 265$ (-14%) · 확률 25% — 3Q~4Q에 가스복합화력 신규 FNTP 2건 이상, 발전 마진 23% 유지, Farmville 공장과 ValCor가 산업·Teledata를 키운다</title></rect><text x="524.8" y="74">265 (-14%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 306</text><text x="120" y="114" style="fill:#5d6470">확률 가중 183 (-40%)</text><line x1="436.7" x2="436.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 209 (-32%)</text></g></svg>