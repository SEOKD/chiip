<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="192.6" height="16" rx="3" fill="#5d6470"><title>약세: 13,733¥ (-55%) · 확률 5% — 검수가 밀려 FY6/27 EPS가 가이던스 ¥1,003을 10% 밑돈다 — 2Q 매출이 컨센서스 ¥79.6B에 못 미치고 판관비 증가가 이어진다</title></rect><text x="316.6" y="22">13,733 (-55%) · 확률 5%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="311.6" height="16" rx="3" fill="#5d6470"><title>기본: 22,216¥ (-27%) · 확률 75% — 선행 EPS ¥1,092 — 통기 가이던스를 조금 넘고 수주가 전망 하단 ¥400B를 채운다</title></rect><text x="435.6" y="48">22,216 (-27%) · 확률 75%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 33,060¥ (+8%) · 확률 20% — 수주가 전망 상단으로 가고 A200HiT·A300 검수가 앞당겨져 선행 EPS가 ¥1,300에 닿는다</title></rect><text x="587.6" y="74">33,060 (+8%) · 확률 20%</text><line x1="548.4" x2="548.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="552.4" y="100">현재 30,550</text><text x="120" y="114" style="fill:#5d6470">확률 가중 23,961 (-22%)</text><line x1="462.4" x2="462.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 24,417 (-20%)</text></g></svg>