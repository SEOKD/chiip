<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="101.2" height="16" rx="3" fill="#d0452f"><title>약세: 19.1$ (-59%) · 확률 30% — 미국 전력 지연이 2027 상반기까지 이어지고 1.6T 수율·DSP 공급이 막혀 2027 매출이 $1.6~1.8B에 머문다. 조정 GM 27~28%, 추가 ATM으로 주식 100M주 이상</title></rect><text x="225.2" y="22">19.1 (-59%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="252.9" height="16" rx="3" fill="#2a5bd7"><title>기본: 47.8$ (+2%) · 확률 50% — 연말 설비 50만 개 근처, 2027 매출 약 $2.3B(8월 중순 컨센서스 수준), 조정 GM 30~31%. 주식 약 96~100M주. 다음 4개 분기 EPS는 8월 추정 $3.25에서 하향분을 뺀 값</title></rect><text x="376.9" y="48">47.8 (+2%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 87.7$ (+87%) · 확률 20% — LTA·$200M 주문으로 1.6T가 2027 상반기에 빠르게 늘고 설비 2027년 말 100만 개 경로가 지켜진다. 2027 매출 $3B 이상·조정 GM 32%. 9월 말 추정 $4.42 수준</title></rect><text x="587.6" y="74">87.7 (+87%) · 확률 20%</text><line x1="367.9" x2="367.9" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="371.9" y="100">현재 46.9</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 47.2 (+1%)</text><line x1="447.8" x2="447.8" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 62.0 (+32%)</text></g></svg>