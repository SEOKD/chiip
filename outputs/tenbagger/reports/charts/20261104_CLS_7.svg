<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 329" width="340" height="329"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="220" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="111" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">네트워킹 스위치(HPS 포함)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="143.4" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 56%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">이더넷 스위치·스케일업 스위치</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · AI 데이터센터 백엔드 망</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수익 · 대당 판매가(실리콘 포함)</text><text x="12" y="129" style="fill:#1a1d23;font-size:13px;font-weight:700">AI 컴퓨트·스토리지</text><text x="328" y="129" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="135" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="135" width="68.4" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="143" text-anchor="end" style="font-size:11.5px">매출 27%</text><text x="12" y="166" style="fill:#1a1d23;font-size:12px">맞춤 칩 서버·랙 조립·검증</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">쓰는 곳 · 하이퍼스케일러 AI 학습·추론</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">수익 · 랙당 위탁 제조비(실리콘 대부분 제외)</text><text x="12" y="238" style="fill:#1a1d23;font-size:13px;font-weight:700">ATS(항공·산업·반도체 장비)</text><text x="328" y="238" text-anchor="end" style="f