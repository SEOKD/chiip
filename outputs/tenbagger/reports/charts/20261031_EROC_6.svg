<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="123.6" height="16" rx="3" fill="#d0452f"><title>약세: 5.33$ (-25%) · 확률 30% — 램프가 늦어 FY2027 매출 약 $1.0B에 그치고 2028년분 주문이 없다. 해제 물량이 나온다</title></rect><text x="247.6" y="22">5.33 (-25%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="280.3" height="16" rx="3" fill="#2a5bd7"><title>기본: 12.1$ (+70%) · 확률 50% — 잔고가 2028년 초까지 전환되고 이익률이 약 11%다. 컨센서스 $0.78보다 약 13% 낮게 잡았다</title></rect><text x="404.3" y="48">12.1 (+70%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 20.0$ (+181%) · 확률 20% — 납품이 가이던스대로 가고 2028년분 주문과 Anthropic 설치 계약이 나온다</title></rect><text x="587.6" y="74">20.0 (+181%) · 확률 20%</text><line x1="285.1" x2="285.1" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="289.1" y="100">현재 7.12</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 11.6 (+64%)</text><line x1="395.9" x2="395.9" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 11.9 (+67%)</text></g></svg>