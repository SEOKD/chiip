<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="41.0" height="16" rx="3" fill="#5d6470"><title>약세: 0.51$ (-91%) · 확률 35% — 우크라이나 주문이 줄고 원통형 비중이 남아 매출총이익률이 25~27%에 머문다. DIU 같은 과제 수익이 없으면 EBITDA는 거의 0이다</title></rect><text x="165.0" y="22">0.51 (-91%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="107.7" height="16" rx="3" fill="#5d6470"><title>기본: 1.34$ (-77%) · 확률 45% — 매출이 컨센서스 경로($195M대)로 늘고 해상 운송·파우치 믹스로 매출총이익률이 29~30%가 된다. 4Q27~3Q28 조정 EBITDA 추정 합 약 $21M</title></rect><text x="231.7" y="48">1.34 (-77%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="249.1" height="16" rx="3" fill="#5d6470"><title>강세: 3.10$ (-46%) · 확률 20% — 2027 가이던스가 $220M 이상, 매출총이익률 32% 이상, Caminus 미국산 파우치가 NDAA 조달로 단가를 높인다</title></rect><text x="373.1" y="74">3.10 (-46%) · 확률 20%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 5.77</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1.40 (-76%)</text><line x1="272.7" x2="272.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1.90 (-67%)</text></g></svg>