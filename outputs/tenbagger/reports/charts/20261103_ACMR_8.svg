<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="163.6" height="16" rx="3" fill="#5d6470"><title>약세: 33.8$ (-32%) · 확률 25% — GM이 40~41%에 머물고 2027 매출 <span class="up">+15%</span>(약 $1.45B). 영업현금 적자가 이어져 운전자본이 이익을 먹는다. 중국 장비 수요가 2027 상반기에 꺾인다</title></rect><text x="287.6" y="22">33.8 (-32%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="294.6" height="16" rx="3" fill="#5d6470"><title>기본: 60.8$ (+22%) · 확률 50% — 2027 매출 약 $1.7B(<span class="up">+35%</span>), GM 43%. 지금 다음 4개 분기 EPS 컨센서스 $2.64와 비슷하다. 영업현금은 2027 하반기에 흑자로 돈다</title></rect><text x="418.6" y="48">60.8 (+22%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 95.8$ (+92%) · 확률 25% — 수주 <span class="up">+147%</span>가 2027 매출 약 $2.0B로 바뀌고 SPM·패널 도금·퍼니스가 믹스를 올려 GM 45%. 컨센서스 상단 $2.05B에 가깝다</title></rect><text x="587.6" y="74">95.8 (+92%) · 확률 25%</text><line x1="361.5" x2="361.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="365.5" y="100">현재 49.9</text><text x="120" y="114" style="fill:#5d6470">확률 가중 62.8 (+26%)</text><line x1="425.0" x2="425.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 63.0 (+26%)</text></g></svg>