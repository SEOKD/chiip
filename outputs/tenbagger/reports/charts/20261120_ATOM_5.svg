<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="150.5" height="16" rx="3" fill="#5d6470"><title>약세: 0.75$ (-68%) · 확률 15% — GAA 결과가 재시도로 넘어가고 IQE 튜닝도 늦어져 평가 웨이퍼 수수료만 남는다. 장비 리스 인상분을 메우려 ATM을 더 쓴다</title></rect><text x="274.5" y="22">0.75 (-68%) · 확률 15%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="178.6" height="16" rx="3" fill="#5d6470"><title>기본: 0.89$ (-61%) · 확률 70% — Prima 웨이퍼·MSTcad 매출이 조금씩 붙고 라이선스는 2028년 이후로 간다. 컨센서스 약 $2.4M보다 낮게 잡았다</title></rect><text x="302.6" y="48">0.89 (-61%) · 확률 70%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="309.1" height="16" rx="3" fill="#5d6470"><title>강세: 1.54$ (-33%) · 확률 15% — GAA 또는 대형 IDM 한 곳과 업프런트가 있는 상업 라이선스를 맺고 IQE 샘플 판매가 시작된다</title></rect><text x="433.1" y="74">1.54 (-33%) · 확률 15%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 2.31</text><text x="120" y="114" style="fill:#5d6470">확률 가중 0.97 (-58%)</text><line x1="340.8" x2="340.8" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1.10 (-52%)</text></g></svg>