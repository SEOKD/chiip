<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="171.2" height="16" rx="3" fill="#d0452f"><title>약세: 714,240₩ (-20%) · 확률 30% — 루빈 물량을 나눠 주고 전자BG 영업이익이 ₩900B대에 머문다. 실트론 이자가 얹힌다</title></rect><text x="295.2" y="22">714,240 (-20%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="296.7" height="16" rx="3" fill="#2a5bd7"><title>기본: 1,238,016₩ (+39%) · 확률 50% — 전자BG 영업이익 약 ₩1.15T(메리츠 ₩1.18T보다 조금 낮게), 일회성 뺀 FY2026 약 27,000원에서 출발. 치입 추정이다</title></rect><text x="420.7" y="48">1,238,016 (+39%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 1,934,400₩ (+117%) · 확률 20% — 광모듈과 1.6T 믹스로 OPM이 33%를 넘고 실트론 이익이 온기로 더해진다</title></rect><text x="587.6" y="74">1,934,400 (+117%) · 확률 20%</text><line x1="333.6" x2="333.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="337.6" y="100">현재 891,000</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 1,220,160 (+37%)</text><line x1="438.8" x2="438.8" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 1,330,034 (+49%)</text></g></svg>