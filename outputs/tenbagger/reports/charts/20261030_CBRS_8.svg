<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 427" width="340" height="427"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="332" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="220" width="338" height="104" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="111" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">추론 클라우드</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="179.2" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 70%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">자체 시스템을 임차 데이터센터에 깔아 토큰을 판다</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · OpenAI, 코딩·에이전트 스타트업, 기업</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수익 · 2Q 코어 $127.7M, +287%. 코어 마진 41.8%</text><text x="12" y="129" style="fill:#1a1d23;font-size:13px;font-weight:700">CS-3·CS-4 시스템</text><text x="328" y="129" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="135" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="135" width="76.8" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="143" text-anchor="end" style="font-size:11.5px">매출 30%</text><text x="12" y="166" style="fill:#1a1d23;font-size:12px">웨이퍼 칩 기반 랙 시스템을 고객 시설에 판매</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">쓰는 곳 · G42·MBZUAI, 연구소, 정부</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">수익 · 2Q 코어 $82.1M, +17%. 코어 마진 38.8%</text><text x="12" y="238" style="fill:#1a1d23;font-size:13px;font-weight:700">WSE 웨이퍼 스케일 엔진</text><text x="328" y="238" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="261" style="fill:#1a1d23;font-size:12px">웨이퍼 전체를 한 칩으로 쓰고 SRAM을 칩 안에 둔다</text><text x="12" y="278" style="fill:#1a1d23;font-size:12px">. TSMC 5nm</text><text x="12" y="295" style="fill:#5d6470;font-size:12px">쓰는 곳 · 디코드(토큰 생성) 구간</text><text x="12" y="312" style="fill:#5d6470;font-size:12px">수익 · 시스템 원가 미공개</text><text x="12" y="350" style="fill:#1a1d23;font-size:13px;font-weight:700">분리형 추론</text><text x="328" y="350" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="373" style="fill:#1a1d23;font-size:12px">프리필은 GPU·Trainium, 디코드는 WSE가 맡는 구성</text><text x="12" y="390" style="fill:#5d6470;font-size:12px">쓰는 곳 · AWS, AMD Helios</text><text x="12" y="407" style="fill:#5d6470;font-size:12px">수익 · 매출 미확인, 회사는 토큰 5배 주장</text></g></svg>