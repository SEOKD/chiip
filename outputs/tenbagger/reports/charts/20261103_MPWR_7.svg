<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="181.9" height="16" rx="3" fill="#d0452f"><title>약세: 630$ (-49%) · 확률 25% — 2027 ED 성장이 +40~50%로 꺾이고 통신·자동차가 메우지 못한다. GM 55% 정체, SBC 증가. 애널리스트 평균(약 $34, 3Q 전)과 같은 높이</title></rect><text x="305.9" y="22">630 (-49%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="306.7" height="16" rx="3" fill="#2a5bd7"><title>기본: 1,063$ (-15%) · 확률 50% — 4Q 가이던스 중간값 달성, 2027 매출 약 $6.4B(+47%), 비GAAP OPM 41%. 컨센서스 다음 4개 분기 EPS $43.42와 비슷하다</title></rect><text x="430.7" y="48">1,063 (-15%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 1,607$ (+29%) · 확률 25% — ED가 2027에도 +100% 가까이 늘고 캐파 $8B가 2H27에 채워진다. 2027 매출 $7.5B(컨센서스 상단), OPM 43%</title></rect><text x="587.6" y="74">1,607 (+29%) · 확률 25%</text><line x1="478.9" x2="478.9" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="482.9" y="100">현재 1,244</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 1,091 (-12%)</text><line x1="413.4" x2="413.4" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 1,017 (-18%)</text></g></svg>