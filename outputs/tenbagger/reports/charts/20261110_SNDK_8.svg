<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="157.6" height="16" rx="3" fill="#5d6470"><title>약세: 943$ (+6%) · 확률 35% — 2Q FY27을 정점으로 NAND 시장 가격이 하락으로 돌아 비계약 물량(비트의 절반) 가격이 분기마다 15~20% 내린다. 장기 계약 최저 가격이 하단을 받쳐 적자는 아니다</title></rect><text x="281.6" y="22">943 (+6%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="321.5" height="16" rx="3" fill="#5d6470"><title>기본: 1,924$ (+117%) · 확률 45% — 다음 4개 분기 컨센서스 경로 — 2Q 가이던스 $12.4B 뒤 FY27 매출 약 $51B, GM 80% 안팎, 분기 자사주 $5B 안팎</title></rect><text x="445.5" y="48">1,924 (+117%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 2,775$ (+213%) · 확률 20% — 데이터센터 비트 수요 +40%(CY27, 회사 전망)에 공급이 못 따라가 가격이 완만히 계속 오르고, 장기 계약 2차분이 추가된다</title></rect><text x="587.6" y="74">2,775 (+213%) · 확률 20%</text><line x1="268.1" x2="268.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="272.1" y="100">현재 887</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1,751 (+97%)</text><line x1="384.9" x2="384.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1,585 (+79%)</text></g></svg>