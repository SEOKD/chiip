<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="215.3" height="16" rx="3" fill="#5d6470"><title>약세: 286$ (-27%) · 확률 25% — 새 모델 효과가 4Q로 끝나고 소비재가 1Q 계절성에 꺾인다. Unity와 지면 경쟁이 붙어 성장이 연 20%대로. 매출 약 $9.3B, 조정 EBITDA 약 $7.6B</title></rect><text x="339.3" y="22">286 (-27%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="331.7" height="16" rx="3" fill="#5d6470"><title>기본: 440$ (+12%) · 확률 50% — 모델 전환이 가이던스대로 이어지고 소비재가 커진다. 매출 약 $10.4B(다음 4개 분기 컨센서스), 조정 EBITDA 약 $8.77B(마진 약 85%)</title></rect><text x="455.7" y="48">440 (+12%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 615$ (+56%) · 확률 25% — 새 모델 전환이 끝나며 게임·소비재가 함께 가속한다. 매출 약 $11.5B, 조정 EBITDA 약 $9.8B</title></rect><text x="587.6" y="74">615 (+56%) · 확률 25%</text><line x1="416.7" x2="416.7" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="420.7" y="100">현재 394</text><text x="120" y="114" style="fill:#5d6470">확률 가중 445 (+13%)</text><line x1="449.4" x2="449.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 437 (+11%)</text></g></svg>