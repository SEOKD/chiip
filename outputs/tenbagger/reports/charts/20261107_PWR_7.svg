<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="204.0" height="16" rx="3" fill="#d0452f"><title>약세: 345$ (-36%) · 확률 25% — 지방 데이터센터 제한이 공사 지연·취소로 번지고 고정가 공사에서 원가가 샌다. FY2028 EPS 컨센서스 하단</title></rect><text x="328.0" y="22">345 (-36%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="321.5" height="16" rx="3" fill="#2a5bd7"><title>기본: 544$ (+1%) · 확률 50% — CEO가 말한 성장이 이어진다. FY2026 $18.10에서 연 20%면 FY2028 약 $26, 컨센서스 상단 $26.4 부근</title></rect><text x="445.5" y="48">544 (+1%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 784$ (+45%) · 확률 25% — 765kV와 발전이 1H27부터 쌓이고 지하 부문이 두 자릿수 이익률에 간다. FY2028 EPS 추정 최고 $31 부근</title></rect><text x="587.6" y="74">784 (+45%) · 확률 25%</text><line x1="439.7" x2="439.7" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="443.7" y="100">현재 541</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 554 (+2%)</text><line x1="424.4" x2="424.4" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 515 (-5%)</text></g></svg>