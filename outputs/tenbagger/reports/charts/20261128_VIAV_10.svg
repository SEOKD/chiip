<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="198.7" height="16" rx="3" fill="#5d6470"><title>약세: 20.7$ (-26%) · 확률 30% — 데이터센터 투자가 2027년 하반기에 꺾여 FY2028 매출이 약 $2.15B(<tspan style="fill:#5d6470;font-weight:600">+5%</tspan>)에 그친다. 조정 영업이익률 28%, 세율이 10%대로 오르기 시작한다. 애널리스트 최저 추정 $2.22 아래다.</title></rect><text x="322.7" y="22">20.7 (-26%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="312.6" height="16" rx="3" fill="#5d6470"><title>기본: 32.6$ (+16%) · 확률 55% — FY2028 매출 약 $2.35B(<tspan style="fill:#5d6470;font-weight:600">+15%</tspan>), 조정 영업이익률 31%대. 1.6T 양산 시험과 방산이 끌고 반도체 패키징·시험은 연 $50M 안팎. 애널리스트 평균 $2.33~2.39 수준이다.</title></rect><text x="436.6" y="48">32.6 (+16%) · 확률 55%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 48.4$ (+72%) · 확률 15% — FY2028 매출 약 $2.5B(<tspan style="fill:#5d6470;font-weight:600">+22%</tspan>), 조정 영업이익률 32~33%. 반도체 패키징·시험이 연 $100M에 닿고 통신사 교체 수요가 붙는다. 애널리스트 최고 추정 $2.48을 넘는 값이다.</title></rect><text x="587.6" y="74">48.4 (+72%) · 확률 15%</text><line x1="389.9" x2="389.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="393.9" y="100">현재 28.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 31.4 (+12%)</text><line x1="407.6" x2="407.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 30.0 (+7%)</text></g></svg>