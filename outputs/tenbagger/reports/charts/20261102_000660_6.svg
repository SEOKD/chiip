<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="139.1" height="16" rx="3" fill="#d0452f"><title>약세: 876,878₩ (-41%) · 확률 25% — 2H27에 DRAM·낸드 값이 내려 FY27 영업이익 ₩280T. 4Q 추정 연환산 약 ₩430T보다 35% 낮다</title></rect><text x="263.1" y="22">876,878 (-41%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="293.1" height="16" rx="3" fill="#2a5bd7"><title>기본: 1,848,045₩ (+25%) · 확률 50% — 영업이익 ₩440T. 3Q 뒤 IB 두 곳 ₩454~481T보다 조금 낮게 뒀다</title></rect><text x="417.1" y="48">1,848,045 (+25%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 2,922,928₩ (+97%) · 확률 25% — HBM 가격과 범용 DRAM 강세가 겹쳐 영업이익 ₩560T</title></rect><text x="587.6" y="74">2,922,928 (+97%) · 확률 25%</text><line x1="355.4" x2="355.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="359.4" y="100">현재 1,484,000</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 1,873,974 (+26%)</text><line x1="450.6" x2="450.6" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 2,084,111 (+40%)</text></g></svg>