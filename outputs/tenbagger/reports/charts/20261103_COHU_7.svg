<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="152.6" height="16" rx="3" fill="#d0452f"><title>약세: 31.4$ (-35%) · 확률 25% — 2027 매출 약 +20%, GM 45%, 분기 영업비용 $58M. 인증이 2H로 밀리고 코어 회복이 멈춘다. 콜 전 EPS 추정 $1.63과 비슷하다</title></rect><text x="276.6" y="22">31.4 (-35%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="287.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 59.1$ (+22%) · 확률 50% — 매출 약 +30%로 틀의 하단에 가깝고 GM 46.5%. 지금 집계 $2.33과 비슷하며 회사 틀 중간값보다 보수적이다</title></rect><text x="411.2" y="48">59.1 (+22%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 95.5$ (+97%) · 확률 25% — 매출 +40%, GM 48%, 분기 영업비용 $56M. 회사 틀 상단이고 7개 프로그램이 일정대로 간다</title></rect><text x="587.6" y="74">95.5 (+97%) · 확률 25%</text><line x1="355.0" x2="355.0" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="359.0" y="100">현재 48.4</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 61.3 (+27%)</text><line x1="411.4" x2="411.4" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 60.0 (+24%)</text></g></svg>