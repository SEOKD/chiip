<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 606" width="340" height="606"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="511" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="416" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="321" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="226" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="97" width="338" height="121" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">토미카·프라레일</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="43" style="fill:#1a1d23;font-size:12px">미니카·철도 완구</text><text x="12" y="60" style="fill:#5d6470;font-size:12px">쓰는 곳 · 아동, 토미카 프리미엄은 어른</text><text x="12" y="77" style="fill:#5d6470;font-size:12px">수익 · 브랜드별 매출 미공개</text><text x="12" y="115" style="fill:#1a1d23;font-size:13px;font-weight:700">베이블레이드 X</text><text x="328" y="115" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="138" style="fill:#1a1d23;font-size:12px">금속 팽이 배틀 완구</text><text x="12" y="155" style="fill:#5d6470;font-size:12px">쓰는 곳 · 일본·아시아 직판, 북미·유럽은 Hasbro</text><text x="12" y="172" style="fill:#5d6470;font-size:12px">판매</text><text x="12" y="189" style="fill:#5d6470;font-size:12px">수익 · 미공개, 전 세대 Burst는 시장 기준 ¥250B</text><text x="12" y="206" style="fill:#5d6470;font-size:12px">이상</text><text x="12" y="244" style="fill:#1a1d23;font-size:13px;font-weight:700">듀얼 마스터즈·TCG</text><text x="328" y="244" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="267" style="fill:#1a1d23;font-size:12px">카드 게임, Lorcana 일본 판매 포함</text><text x="12" y="284" style="fill:#5d6470;font-size:12px">쓰는 곳 · 어린이·어른</text><text x="12" y="301" style="fill:#5d6470;font-size:12px">수익 · 미공개</text><text x="12" y="339" style="fill:#1a1d23;font-size:13px;font-weight:700">키디랜드</text><text x="328" y="339" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><text x="12" y="362" style="fill:#1a1d23;font-size:12px">캐릭터 잡화 소매</text><text x="12" y="379" style="fill:#5d6470;font-size:12px">쓰는 곳 · 국내·방일객</text><text x="12" y="396" style="fill:#5d6470;font-size:12px">수익 · 미공개</text><text x="12" y="434" style="fill:#1a1d23;font-size:13px;font-weight:700">가챠·타카라토미아츠</text><text x="328" y="434" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="457" style="fill:#1a1d23;font-size:12px">캡슐 토이</text><text x="12" y="474" style="fill:#5d6470;font-size:12px">쓰는 곳 · 일본, 북미 식료품점·영화관 확대</text><text x="12" y="491" style="fill:#5d6470;font-size:12px">수익 · 미공개</text><text x="12" y="529" style="fill:#1a1d23;font-size:13px;font-weight:700">포켓몬 메자스타</text><text x="328" y="529" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="552" style="fill:#1a1d23;font-size:12px">포켓몬 아케이드 게임기와 라이선스 상품</text><text x="12" y="569" style="fill:#5d6470;font-size:12px">쓰는 곳 · 아동</text><text x="12" y="586" style="fill:#5d6470;font-size:12px">수익 · 미공개</text></g></svg>