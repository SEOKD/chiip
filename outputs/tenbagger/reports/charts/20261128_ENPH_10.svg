<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="81.4" height="16" rx="3" fill="#5d6470"><title>약세: 3.81$ (-82%) · 확률 30% — 미국 주거용 수요가 2027년에도 줄고 배터리 가격 경쟁이 이어진다. FY2028 매출 약 $0.85B, 조정 영업이익률 약 9%. 45X는 유지되지만 물량이 줄어 혜택도 준다</title></rect><text x="205.4" y="22">3.81 (-82%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="209.3" height="16" rx="3" fill="#5d6470"><title>기본: 9.79$ (-55%) · 확률 40% — 핵심 매출이 분기 약 $200M에서 멈추고 배터리·상업용이 늘어 FY2028 매출 약 $1.05B, 조정 영업이익률 약 15%. 컨센서스 두 값($1.30·$1.54)의 아래쪽</title></rect><text x="333.3" y="48">9.79 (-55%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="407.0" height="16" rx="3" fill="#5d6470"><title>강세: 19.0$ (-12%) · 확률 30% — 금리 하락과 TPO 확산으로 주거용이 돌아오고 배터리가 2027년 675MWh를 넘는다. SST 첫 출하가 2028년에 시작된다. FY2028 매출 약 $1.3B, 조정 영업이익률 약 20%</title></rect><text x="531.0" y="74">19.0 (-12%) · 확률 30%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 21.7</text><text x="120" y="114" style="fill:#5d6470">확률 가중 10.8 (-50%)</text><line x1="376.5" x2="376.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 12.0 (-45%)</text></g></svg>