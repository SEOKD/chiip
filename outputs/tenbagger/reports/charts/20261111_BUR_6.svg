<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="69.5" height="16" rx="3" fill="#5d6470"><title>약세: 1.67$ (-54%) · 확률 30% — 할인율 역풍이 이어지고 2016~2017년 빈티지 회수가 더 늦어진다. 부채 축소에 현금을 쓰느라 신규 약정이 줄어 FY2027 EPS 약 $0.25 — 이자 약 $190M이 실현 이익 대부분을 가져간다</title></rect><text x="193.5" y="22">1.67 (-54%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="229.7" height="16" rx="3" fill="#5d6470"><title>기본: 5.52$ (+51%) · 확률 50% — 컨센서스 — FY2027 매출 약 $450~520M, 순이익 약 $140M. 분기 배치 $100M 유지, 차입은 회수 현금으로 조금씩 줄인다</title></rect><text x="353.7" y="48">5.52 (+51%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 11.1$ (+205%) · 확률 20% — 금리가 내려가 할인율 역풍이 평가 이익으로 돌아오고, 대형 사건 2~3건이 끝나 실현 이익이 커진다. ROE 15~20%로 회복 — EPS 약 $1.0(2025년 초 컨센서스 수준)</title></rect><text x="587.6" y="74">11.1 (+205%) · 확률 20%</text><line x1="271.9" x2="271.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="275.9" y="100">현재 3.65</text><text x="120" y="114" style="fill:#5d6470">확률 가중 5.49 (+50%)</text><line x1="353.1" x2="353.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 5.60 (+53%)</text></g></svg>