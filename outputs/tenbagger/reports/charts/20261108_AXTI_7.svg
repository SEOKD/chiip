<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="123.7" height="16" rx="3" fill="#d0452f"><title>약세: 20.8$ (-47%) · 확률 30% — 2027년 중국 신규 공급이 들어와 장당 가격이 내려가고 미국 고객 허가가 늦어진다. 총이익률이 40%대로 돌아가 낮은 쪽 추정 $2.27보다 약 30% 낮다</title></rect><text x="247.7" y="22">20.8 (-47%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="278.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 46.8$ (+20%) · 확률 50% — 4Q 가이던스대로 가고 2027년 캐파 2배가 매출이 된다. 두 컨센서스($2.27·$3.19)의 중간쯤</title></rect><text x="402.2" y="48">46.8 (+20%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 77.9$ (+100%) · 확률 20% — 총이익률 60%대가 이어지고 6인치·저결함 프리미엄이 붙는다. 높은 쪽 추정 $3.19보다 약 13% 높다</title></rect><text x="587.6" y="74">77.9 (+100%) · 확률 20%</text><line x1="351.4" x2="351.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="355.4" y="100">현재 38.9</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 45.2 (+16%)</text><line x1="405.6" x2="405.6" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 48.0 (+23%)</text></g></svg>