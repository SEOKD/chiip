<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 590" width="340" height="590"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="481" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="386" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="257" width="338" height="121" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="145" width="338" height="104" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="135" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">기술 제품·솔루션(전자전·대드론·우주·소프</text><text x="12" y="37" style="fill:#1a1d23;font-size:13px;font-weight:700">트웨어)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="43" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="43" width="150.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="51" text-anchor="end" style="font-size:11.5px">매출 59%</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">아래 세 제품군과 소프트웨어 개발·사이버를 묶은 회</text><text x="12" y="91" style="fill:#1a1d23;font-size:12px">사 &#x27;기술&#x27; 매출</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">쓰는 곳 · 전쟁부·정보기관</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 1Q FY27 $1.45B(58.6%)</text><text x="12" y="163" style="fill:#1a1d23;font-size:13px;font-weight:700">전자전·신호정보(TLS MANPACK, Spectral)</text><text x="328" y="163" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="186" style="fill:#1a1d23;font-size:12px">적 전파를 탐지·교란하는 소프트웨어 정의 장비</text><text x="12" y="203" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미 육군·해군</text><text x="12" y="220" style="fill:#5d6470;font-size:12px">수익 · 연 약 $2B(2월 회사 언급 보도). Spectral</text><text x="12" y="237" style="fill:#5d6470;font-size:12px">은 초도 양산 단계</text><text x="12" y="275" style="fill:#1a1d23;font-size:13px;font-weight:700">대드론(SkyValor, BEAM)</text><text x="328" y="275" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="298" style="fill:#1a1d23;font-size:12px">최대 75km 탐지, 휴대형과 고정형으로 드론 신호를</text><text x="12" y="315" style="fill:#1a1d23;font-size:12px">찾아 무력화</text><text x="12" y="332" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미군 기지·본토·유럽·태평양 동맹</text><text x="12" y="349" style="fill:#5d6470;font-size:12px">수익 · Domestic Shield 상한 $500M, 제품별 매출</text><text x="12" y="366" style="fill:#5d6470;font-size:12px">미공개</text><text x="12" y="404" style="fill:#1a1d23;font-size:13px;font-weight:700">우주 광학·광통신(ARKA, EST)</text><text x="328" y="404" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="427" style="fill:#1a1d23;font-size:12px">정찰 위성 탑재체와 위성 간 레이저 통신 단말</text><text x="12" y="444" style="fill:#5d6470;font-size:12px">쓰는 곳 · 우주군·정보기관·Vantor</text><text x="12" y="461" style="fill:#5d6470;font-size:12px">수익 · FY27 인수 매출 약 $450M, 잔고 밖 약 $2B</text><text x="12" y="499" style="fill:#1a1d23;font-size:13px;font-weight:700">임무 지원·네트워크 현대화</text><text x="328" y="499" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="505" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="505" width="106.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="513" text-anchor="end" style="font-size:11.5px">매출 41%</text><text x="12" y="536" style="fill:#1a1d23;font-size:12px">정보 분석, 임무 계획, AI 기반 시스템 현대화</text><text x="12" y="553" style="fill:#5d6470;font-size:12px">쓰는 곳 · 전투사령부·정보기관·연방 민간</text><text x="12" y="570" style="fill:#5d6470;font-size:12px">수익 · Expertise 매출 1Q $1.03B(41%)</text></g></svg>