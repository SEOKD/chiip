<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="205.8" height="16" rx="3" fill="#5d6470"><title>약세: 57.7$ (-27%) · 확률 25% — 부품 부족과 하이퍼스케일러 투자 감속으로 CPI 성장이 FY28에 <span class="up">+30%</span>대로 꺾이고, 분사가 CY2Q27 뒤로 밀려 EPC 차입 이자가 길게 남는다. 다음 4개 분기 EPS 약 $5.4(컨센서스 $6.44보다 16% 낮다)</title></rect><text x="329.8" y="22">57.7 (-27%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="325.2" height="16" rx="3" fill="#5d6470"><title>기본: 91.2$ (+15%) · 확률 50% — 3Q 가이던스 중간 $1.22 + 4Q 가이던스 계산 $1.60(연간 $5.00 − 상반기 $2.18 − 3Q) + FY28 1·2Q 컨센서스 $1.70·$1.82 — 약 $6.34~6.44</title></rect><text x="449.2" y="48">91.2 (+15%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 130$ (+65%) · 확률 25% — CPI 3Q <span class="up">+115%</span>·전력 이익률 mid-teens 유지, EPC 기여와 우선주 납입으로 이자가 줄어 다음 4개 분기 EPS 약 $7.3(컨센서스 상단 $7.8 아래)</title></rect><text x="587.6" y="74">130 (+65%) · 확률 25%</text><line x1="401.6" x2="401.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="405.6" y="100">현재 79.0</text><text x="120" y="114" style="fill:#5d6470">확률 가중 92.5 (+17%)</text><line x1="473.0" x2="473.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 99.0 (+25%)</text></g></svg>