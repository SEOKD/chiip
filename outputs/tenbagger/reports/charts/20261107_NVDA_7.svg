<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="201.4" height="16" rx="3" fill="#d0452f"><title>약세: 210$ (+13%) · 확률 25% — 메모리 원가와 공급 병목으로 GM이 70% 아래로, 출하가 FY28 +70% 경로 밑으로 간다. 다음 4개 분기 EPS 컨센서스 $12.5보다 약 16% 낮다</title></rect><text x="325.4" y="22">210 (+13%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="319.8" height="16" rx="3" fill="#2a5bd7"><title>기본: 334$ (+79%) · 확률 50% — 다음 4개 분기 EPS 컨센서스 $12.5대로 간다. FQ3 가이던스가 첫 분기다</title></rect><text x="443.8" y="48">334 (+79%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 484$ (+159%) · 확률 25% — 공급이 70%보다 빨리 늘고 FY28 1분기 가격 인상으로 GM이 73% 위에서 바닥을 친다</title></rect><text x="587.6" y="74">484 (+159%) · 확률 25%</text><line x1="298.8" x2="298.8" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="302.8" y="100">현재 187</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 340 (+82%)</text><line x1="400.7" x2="400.7" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 293 (+57%)</text></g></svg>