<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="180.3" height="16" rx="3" fill="#d0452f"><title>약세: 85.7$ (-55%) · 확률 25% — AI 데이터센터 투자 2028년 불확실성으로 모듈 제조사가 재고를 줄여 데이터센터가 FY27 하반기 QoQ 감소, FY27 매출 $1.65B·EPS 추정 하단 $6.9 쪽. 청구지 중국 39%에 수출 통제가 겹치면 더 낮다</title></rect><text x="304.3" y="22">85.7 (-55%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="310.8" height="16" rx="3" fill="#2a5bd7"><title>기본: 148$ (-22%) · 확률 50% — 데이터센터 +70~80%·산업·방산 +30%·통신 $300M으로 FY27 매출 $1.87B, 조정 영업이익률 40% 안팎. 다음 4개 분기 EPS 컨센서스 $9.05와 같은 높이</title></rect><text x="434.8" y="48">148 (-22%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 220$ (+16%) · 확률 25% — 회사 &#x27;가정&#x27; $2B·EPS $10을 넘어 하반기 캐파 추가·이퀄라이저·초기 NPO가 겹치고 매출총이익률 64%. FY27 EPS 추정 상단 $11.3 쪽</title></rect><text x="587.6" y="74">220 (+16%) · 확률 25%</text><line x1="520.6" x2="520.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="524.6" y="100">현재 190</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 150 (-21%)</text><line x1="467.3" x2="467.3" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 165 (-13%)</text></g></svg>