<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="101.6" height="16" rx="3" fill="#5d6470"><title>약세: 48.6$ (-78%) · 확률 30% — 선두 고객 플랫폼 물량이 2027년 상반기에 쉬고 Scorpio X 추가 고객 양산이 밀린다. 영업비용은 계속 늘어 조정 OPM이 40% 아래로. 다음 4개 분기(4Q27~3Q28) EPS가 컨센서스 하단 $5.2 근처인 $5.8</title></rect><text x="225.6" y="22">48.6 (-78%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="189.1" height="16" rx="3" fill="#5d6470"><title>기본: 90.5$ (-59%) · 확률 40% — FY27 매출 $3.45B(컨센서스), 조정 OPM 44% 안팎. 다음 4개 분기(4Q27~3Q28) EPS 컨센서스 $8.1 수준</title></rect><text x="313.1" y="48">90.5 (-59%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="306.4" height="16" rx="3" fill="#5d6470"><title>강세: 147$ (-34%) · 확률 30% — Scorpio X가 고객 3곳 이상 양산, Leo·Taurus 800G·NPO가 동시에 붙는다. EPS가 컨센서스 상단 $11.3 쪽으로 간다</title></rect><text x="430.4" y="74">147 (-34%) · 확률 30%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 222</text><text x="120" y="114" style="fill:#5d6470">확률 가중 94.8 (-57%)</text><line x1="326.9" x2="326.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 99.0 (-55%)</text></g></svg>