<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="143.9" height="16" rx="3" fill="#5d6470"><title>약세: 168$ (-11%) · 확률 30% — 전력 인도가 2028로 밀려 2027 전력 EBITDA가 0에 가깝고, 유가 부담으로 항공사 정비 지출이 줄어 항공 제품이 2026 수준(EBITDA 약 $1.05B)에서 10%만 큰다. 리스는 자산 경량화로 계속 준다. 2027 조정 EBITDA $1.5B — 가이던스보다 35% 낮다</title></rect><text x="267.9" y="22">168 (-11%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="320.7" height="16" rx="3" fill="#5d6470"><title>기본: 374$ (+99%) · 확률 50% — 항공 제품이 모듈 약 1,700개·30% 이익률을 지키고 전력이 하단($450M)을 낸다. 2027 조정 EBITDA $2.3B — 회사 가이던스 하단이자 컨센서스($2.23~2.30B) 위쪽</title></rect><text x="444.7" y="48">374 (+99%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 540$ (+187%) · 확률 20% — 전력이 2027 말 월 10~15기 속도에 닿아 상단($750M)을 내고 SCI-2가 빠르게 차서 리스 이익이 바닥을 친다. 2027 조정 EBITDA $2.6B</title></rect><text x="587.6" y="74">540 (+187%) · 확률 20%</text><line x1="281.4" x2="281.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="285.4" y="100">현재 188</text><text x="120" y="114" style="fill:#5d6470">확률 가중 345 (+84%)</text><line x1="389.6" x2="389.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 314 (+67%)</text></g></svg>