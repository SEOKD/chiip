<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="31.0" height="16" rx="3" fill="#5d6470"><title>약세: 7.27$ (-93%) · 확률 30% — 4Q 가이던스 상향의 큰 몫이 Oracle 하드웨어 일회성이고, 2027년 신규 데이터센터 가동이 반년 늦어 클라우드 매출이 2.2배에 그친다. OpenAI 지연 크레딧이 더 커진다</title></rect><text x="155.0" y="22">7.27 (-93%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="113.5" height="16" rx="3" fill="#5d6470"><title>기본: 26.6$ (-76%) · 확률 30% — 2027 코어 매출 3배(회사 표현) 안팎, 컨센서스 FY2027 EPS $1.235. 700MW 용량이 2027년 중반부터 차례로 켜진다</title></rect><text x="237.5" y="48">26.6 (-76%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="212.5" height="16" rx="3" fill="#5d6470"><title>강세: 49.8$ (-54%) · 확률 40% — 4Q 가이던스가 컨센서스 상향으로 이어지고, Microsoft·AWS·Oracle 하이퍼스케일러 매출이 2027년 OpenAI 의존을 낮춘다. 코어 총마진이 4Q 48%에서 50%대로 오른다</title></rect><text x="336.5" y="74">49.8 (-54%) · 확률 40%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 109</text><text x="120" y="114" style="fill:#5d6470">확률 가중 30.1 (-72%)</text><line x1="256.5" x2="256.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 32.0 (-71%)</text></g></svg>