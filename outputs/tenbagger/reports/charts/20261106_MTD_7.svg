<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="242.5" height="16" rx="3" fill="#d0452f"><title>약세: 1,128$ (-33%) · 확률 25% — 미주·유럽이 +1~2%에 머물고 아시아 반등이 식어 2027 현지 통화 +3%, 가격 1.5%만 남아 다음 4개 분기 EPS가 $47.5(2027 컨센서스 하단 $50.2보다 낮다). 배수는 동종 하단으로</title></rect><text x="366.5" y="22">1,128 (-33%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="348.3" height="16" rx="3" fill="#2a5bd7"><title>기본: 1,621$ (-3%) · 확률 50% — 2027 현지 통화 +5%(회사 가이던스)·조정 영업이익률 30% 안팎·자사주 연 $0.85B로 다음 4개 분기 EPS 컨센서스 $51.18</title></rect><text x="472.3" y="48">1,621 (-3%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 2,158$ (+29%) · 확률 25% — 제약 실험실 투자 회복과 아시아 두 자릿수가 이어져 2027 현지 통화 +7%, 영업이익률 31% — 2027 EPS 추정 상단 $55 쪽</title></rect><text x="587.6" y="74">2,158 (+29%) · 확률 25%</text><line x1="480.8" x2="480.8" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="484.8" y="100">현재 1,679</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 1,632 (-3%)</text><line x1="443.0" x2="443.0" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 1,503 (-10%)</text></g></svg>