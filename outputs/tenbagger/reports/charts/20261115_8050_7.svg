<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="189.0" height="16" rx="3" fill="#5d6470"><title>약세: 4,367¥ (-47%) · 확률 35% — 엔화가 ¥145/달러 쪽으로 강해지고 미국 시계 붐이 식어 EVS 성장이 한 자릿수로 내려간다. 영업이익률 10~11%. 다음 4개 분기 EPS ¥360</title></rect><text x="313.0" y="22">4,367 (-47%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="314.9" height="16" rx="3" fill="#5d6470"><title>기본: 7,279¥ (-11%) · 확률 30% — FY3/27 컨센서스(EPS ¥428.8)를 지키고 FY3/28 상반기 이익이 8% 늘어 영업이익률 12~13%. 다음 4개 분기 EPS ¥450(추정)</title></rect><text x="438.9" y="48">7,279 (-11%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 10,716¥ (+30%) · 확률 35% — 미국 그랜드세이코 성장이 이어지고 DS가 AI 부품으로 이익을 더 늘려 영업이익률 14%. 다음 4개 분기 EPS ¥530</title></rect><text x="587.6" y="74">10,716 (+30%) · 확률 35%</text><line x1="475.6" x2="475.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="479.6" y="100">현재 8,220</text><text x="120" y="114" style="fill:#5d6470">확률 가중 7,463 (-9%)</text><line x1="453.1" x2="453.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 7,699 (-6%)</text></g></svg>