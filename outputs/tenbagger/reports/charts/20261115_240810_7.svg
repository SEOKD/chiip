<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="154.1" height="16" rx="3" fill="#5d6470"><title>약세: 38,706₩ (-50%) · 확률 30% — 삼성 P5 발주가 2027년 하반기 이후로 밀리고 메모리 가격 하락으로 고객이 투자를 늦춘다. 매출은 2026년 수준, OPM 15% 안팎</title></rect><text x="278.1" y="22">38,706 (-50%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="288.6" height="16" rx="3" fill="#5d6470"><title>기본: 72,509₩ (-7%) · 확률 40% — FY2027 EPS 컨센서스(삼성증권 ₩5,058). P5·Y1 장비가 2027년 중 반입되고 OPM 약 20%</title></rect><text x="412.6" y="48">72,509 (-7%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 116,475₩ (+50%) · 확률 30% — 해외 IB 전망처럼 2027 DRAM 설비투자가 <tspan style="fill:#5d6470;font-weight:600">+50%</tspan> 넘게 늘고 1c 전환 투자가 더해져 매출이 ₩1.6T를 넘고 OPM 22%</title></rect><text x="587.6" y="74">116,475 (+50%) · 확률 30%</text><line x1="429.3" x2="429.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="433.3" y="100">현재 77,700</text><text x="120" y="114" style="fill:#5d6470">확률 가중 75,558 (-3%)</text><line x1="397.4" x2="397.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 69,693 (-10%)</text></g></svg>