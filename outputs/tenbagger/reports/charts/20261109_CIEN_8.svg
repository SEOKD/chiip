<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="185.5" height="16" rx="3" fill="#5d6470"><title>약세: 152$ (-38%) · 확률 30% — 상위 고객 한 곳의 주문 이연과 업종 배수 하락이 겹쳐 FY27 매출 약 $7.6B·조정 영업이익률 23%</title></rect><text x="309.5" y="22">152 (-38%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="316.0" height="16" rx="3" fill="#5d6470"><title>기본: 259$ (+6%) · 확률 50% — FY27 가이던스 경로 — 매출 약 $8.5B·조정 영업이익률 26%, 가격 인상이 잔고에 일부 반영</title></rect><text x="440.0" y="48">259 (+6%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 380$ (+56%) · 확률 20% — 공급 확대로 FY27 매출 $9B 이상, HyperRail 램프가 앞당겨져 영업이익률 27% 상단</title></rect><text x="587.6" y="74">380 (+56%) · 확률 20%</text><line x1="417.1" x2="417.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="421.1" y="100">현재 243</text><text x="120" y="114" style="fill:#5d6470">확률 가중 251 (+3%)</text><line x1="449.6" x2="449.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 270 (+11%)</text></g></svg>