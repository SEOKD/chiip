<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="140.6" height="16" rx="3" fill="#d0452f"><title>약세: 109$ (-43%) · 확률 30% — 로열티가 $43M에 머물고 제품은 Fab-1에 묶인다. 4Q27~3Q28 EPS 컨센서스 하단 $6.97보다 31% 낮다</title></rect><text x="264.6" y="22">109 (-43%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="273.3" height="16" rx="3" fill="#2a5bd7"><title>기본: 213$ (+11%) · 확률 45% — 라이선시 1~2곳이 늘고 Fab-2가 2027년 하반기에 기여한다. 컨센서스 범위 $6.97~$8.0의 하단이다. 표본이 2명이라 하단을 쓴다</title></rect><text x="397.3" y="48">213 (+11%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 361$ (+89%) · 확률 25% — 하이퍼스케일러 라이선스와 2세대 VPD 다고객 채택이 함께 온다. 컨센서스 상단보다 19% 높다</title></rect><text x="587.6" y="74">361 (+89%) · 확률 25%</text><line x1="365.5" x2="365.5" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="369.5" y="100">현재 191</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 219 (+14%)</text><line x1="375.7" x2="375.7" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 199 (+4%)</text></g></svg>