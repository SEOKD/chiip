<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="93.3" height="16" rx="3" fill="#5d6470"><title>약세: 5.97$ (-44%) · 확률 40% — Merom 정지가 이어져 구매 전력비가 분기 $10M 안팎에 머물고 석탄 적자가 계속된다. Turtle Creek FID가 2027년으로 밀려 브리지 대출 PIK 이자만 쌓인다</title></rect><text x="217.3" y="22">5.97 (-44%) · 확률 40%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="262.8" height="16" rx="3" fill="#5d6470"><title>기본: 16.8$ (+57%) · 확률 25% — Merom이 정상 가동하고 2027 계약 단가($59/MWh)가 이익으로 들어온다. FY2027 컨센서스 EBITDA $87~95M과 FY2028 $135M 사이</title></rect><text x="386.8" y="48">16.8 (+57%) · 확률 25%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 29.7$ (+178%) · 확률 35% — 4Q 가동 회복이 이어지고 Turtle Creek이 연말 FID·2027 초 tolling 계약을 마쳐 2029 용량 계단($131M)과 피커 수입이 추정에 들어온다</title></rect><text x="587.6" y="74">29.7 (+178%) · 확률 35%</text><line x1="287.0" x2="287.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="291.0" y="100">현재 10.7</text><text x="120" y="114" style="fill:#5d6470">확률 가중 17.0 (+59%)</text><line x1="338.8" x2="338.8" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 14.0 (+31%)</text></g></svg>