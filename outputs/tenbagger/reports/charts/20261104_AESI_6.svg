<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="47.6" height="16" rx="3" fill="#d0452f"><title>약세: 2.26$ (-73%) · 확률 35% — 모래 ASP가 $16대에 머물고 4Q EBITDA가 가이던스 하단 $40M. AI 연구소 사업 PPA가 2027 상반기까지 나오지 않아 Socorro만 2Q27부터 더해진다</title></rect><text x="171.6" y="22">2.26 (-73%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="220.8" height="16" rx="3" fill="#2a5bd7"><title>기본: 10.5$ (+27%) · 확률 45% — 4Q $45M 뒤 2027 배정 물량 23Mt를 소화하고 Socorro 120MW가 2Q27부터 더해진다. 다음 4개 분기 EBITDA 컨센서스 $260M과 같은 높이</title></rect><text x="344.8" y="48">10.5 (+27%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 22.0$ (+167%) · 확률 20% — AI 연구소 사업 하나 이상이 2027 상반기에 PPA를 맺고 모래 가격이 2027 계약에서 $18 이상으로 오른다</title></rect><text x="587.6" y="74">22.0 (+167%) · 확률 20%</text><line x1="293.4" x2="293.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="297.4" y="100">현재 8.23</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 9.91 (+20%)</text><line x1="315.9" x2="315.9" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 9.30 (+13%)</text></g></svg>