<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="199.8" height="16" rx="3" fill="#d0452f"><title>약세: 37.5$ (-29%) · 확률 25% — 일당이 $400K 초반에 머물고 West Gemini 공백이 길어진다. 다음 4개 분기 EBITDA 추정 범위 $340~572M의 하단 쪽</title></rect><text x="323.8" y="22">37.5 (-29%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="316.9" height="16" rx="3" fill="#2a5bd7"><title>기본: 59.5$ (+13%) · 확률 50% — 가이던스 범위대로 간다. 다음 4개 분기 EBITDA 컨센서스 $439M</title></rect><text x="440.9" y="48">59.5 (+13%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 87.0$ (+65%) · 확률 25% — West Carina 조기 시작과 $450K 이상 재계약, 동종이 일당을 $500K로 끌어올린다</title></rect><text x="587.6" y="74">87.0 (+65%) · 확률 25%</text><line x1="400.2" x2="400.2" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="404.2" y="100">현재 52.6</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 60.9 (+16%)</text><line x1="418.4" x2="418.4" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 56.0 (+7%)</text></g></svg>