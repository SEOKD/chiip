<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="200.7" height="16" rx="3" fill="#5d6470"><title>약세: 39.8$ (-11%) · 확률 25% — West Gemini 공백이 2027 중반까지 가고 멕시코만 재계약 일당이 $400K 초반에 머문다. 다음 4개 분기 EBITDA 컨센서스 범위 하단 쪽</title></rect><text x="324.7" y="22">39.8 (-11%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="324.2" height="16" rx="3" fill="#5d6470"><title>기본: 64.2$ (+43%) · 확률 50% — 다음 4개 분기 EBITDA 컨센서스 $488M. West Carina가 2027 중반에 시작하고 이동비가 들어온다</title></rect><text x="448.2" y="48">64.2 (+43%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 91.8$ (+105%) · 확률 25% — Gemini 조기 재계약과 2028 다년 계약이 $500K 안팎, Aquarius·Phoenix 중 1척이 고객 비용으로 재가동 계약</title></rect><text x="587.6" y="74">91.8 (+105%) · 확률 25%</text><line x1="346.4" x2="346.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="350.4" y="100">현재 44.9</text><text x="120" y="114" style="fill:#5d6470">확률 가중 65.0 (+45%)</text><line x1="417.9" x2="417.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 59.0 (+32%)</text></g></svg>