<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="176.3" height="16" rx="3" fill="#5d6470"><title>약세: 210$ (-62%) · 확률 25% — 2028년 가격 협상에서 인상 폭이 줄고 경쟁사 증설 소식이 이어져 가격 상승이 멈춘다. 분기 매출이 $4.8~5.0B에서 정체하고 비GAAP 영업이익률 50% — 다음 4개 분기 EPS 약 $36</title></rect><text x="300.3" y="22">210 (-62%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="293.2" height="16" rx="3" fill="#5d6470"><title>기본: 349$ (-37%) · 확률 50% — FQ2 가이던스(EPS $9.20)대로 가고 HAMR 믹스와 원가 전가로 분기 EPS가 $10.7·$11.9·$12.7로 오른다 — 다음 4개 분기 컨센서스 합 $44.9와 같다</title></rect><text x="417.2" y="48">349 (-37%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="416.4" height="16" rx="3" fill="#5d6470"><title>강세: 495$ (-10%) · 확률 25% — Mozaic 4 비중이 빨리 오르고 2028년 가격이 올라 영업이익률이 57% 이상, 2027년 자사주 확대로 주식 수가 줄어 다음 4개 분기 EPS 약 $51</title></rect><text x="540.4" y="74">495 (-10%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 552</text><text x="120" y="114" style="fill:#5d6470">확률 가중 351 (-36%)</text><line x1="458.7" x2="458.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 403 (-27%)</text></g></svg>