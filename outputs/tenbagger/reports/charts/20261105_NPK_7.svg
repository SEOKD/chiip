<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 315" width="340" height="315"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="220" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="111" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">방산(40mm 탄약·탄피·신관·에너지 물질)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="215.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 84%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">40mm 훈련탄·전술탄, 중구경 탄피, 신관·기폭관</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미 육군·국방부·프라임 계약사</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수익 · 고정가 계약 납품</text><text x="12" y="129" style="fill:#1a1d23;font-size:13px;font-weight:700">Housewares(Presto 소형 가전)</text><text x="328" y="129" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="135" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="135" width="38.4" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="143" text-anchor="end" style="font-size:11.5px">매출 15%</text><text x="12" y="166" style="fill:#1a1d23;font-size:12px">압력솥·통조림 솥·튀김기·그리들</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미국·캐나다 소매점</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">수익 · 중국 위탁 생산 제품 판매</text><text x="12" y="238" style="fill:#1a1d23;font-size:13px;font-weight:700">Safety(Rely 경보기·소화기)</text><text x="328" y="238" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="261" style="fill:#1a1d23;font-size:12px">연기·일산화탄소 경보기, Rely FX 소화기</text><text x="12" y="278" style="fill:#5d6470;font-size:12px">쓰는 곳 · 가정·상업·군용</text><text x="12" y="295" style="fill:#5d6470;font-size:12px">수익 · 제품 판매(초기 단계, 적자)</text></g></svg>