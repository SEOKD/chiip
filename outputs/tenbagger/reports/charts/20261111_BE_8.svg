<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="158.8" height="16" rx="3" fill="#5d6470"><title>약세: 63.5$ (-66%) · 확률 30% — 2027 출하가 캐파 2GW에 못 미치고(데이터센터 준비 지연·탄소 포집 설비 대기) 두 고객 주문이 늦는다. 매출 약 $5.6B, 조정 영업이익률 20% — EPS 약 $3.6(컨센서스 하단 $3.3 위)</title></rect><text x="282.8" y="22">63.5 (-66%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="288.2" height="16" rx="3" fill="#5d6470"><title>기본: 115$ (-38%) · 확률 45% — 매출 약 $6.6~7.0B(+47~55%), 조정 영업이익률 24~25% — EPS 약 $4.9(컨센서스 $4.67~5.69 사이)</title></rect><text x="412.2" y="48">115 (-38%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="455.7" height="16" rx="3" fill="#5d6470"><title>강세: 182$ (-2%) · 확률 25% — NTT DATA·Google·Oracle이 겹쳐 2GW 캐파가 다 팔리고 Fremont 증설이 앞당겨진다. 매출 약 $8B, 조정 영업이익률 26% — EPS 약 $6.2(최고 추정 $6.66 아래)</title></rect><text x="579.7" y="74">182 (-2%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 185</text><text x="120" y="114" style="fill:#5d6470">확률 가중 116 (-37%)</text><line x1="437.6" x2="437.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 127 (-32%)</text></g></svg>