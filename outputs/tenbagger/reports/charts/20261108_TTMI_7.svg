<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="183.5" height="16" rx="3" fill="#d0452f"><title>약세: 50.5$ (-24%) · 확률 30% — N+M 지연이 1Q27을 넘기고 최대 고객이 물량을 나눈다. 2027 매출이 가이던스 하단을 밑돌고 이자·상각이 더해져 다음 4개 분기 EPS가 컨센서스 약 $8.1보다 약 24% 낮다</title></rect><text x="307.5" y="22">50.5 (-24%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="323.6" height="16" rx="3" fill="#2a5bd7"><title>기본: 89.0$ (+34%) · 확률 50% — 2027 가이던스 중간(조정 EPS $8.5)으로 가고 지연 프로그램이 1Q27에 양산된다. 다음 4개 분기 컨센서스와 같다</title></rect><text x="447.6" y="48">89.0 (+34%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 128$ (+92%) · 확률 20% — N+M 프로그램이 5개 이상으로 늘고 PCB 가격 상승(미국 PPI +45.8%)이 소재값보다 앞선다. 가이던스 상단 $8.90보다 약 6% 높다</title></rect><text x="587.6" y="74">128 (+92%) · 확률 20%</text><line x1="361.8" x2="361.8" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="365.8" y="100">현재 66.5</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 85.2 (+28%)</text><line x1="476.3" x2="476.3" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 98.0 (+47%)</text></g></svg>