<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="204.6" height="16" rx="3" fill="#5d6470"><title>약세: 84.2€ (-29%) · 확률 30% — 예약 전환이 늦어지고 풍력이 다시 적자로 돌아 FY27 성장 10%·이익률 13%에 그친다</title></rect><text x="328.6" y="22">84.2 (-29%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="322.9" height="16" rx="3" fill="#5d6470"><title>기본: 133€ (+12%) · 확률 40% — 회사 가이던스 중간 — 매출 <tspan style="fill:#5d6470;font-weight:600">+15%</tspan>, 이익률 15%, 순이익 약 €5B</title></rect><text x="446.9" y="48">133 (+12%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 191€ (+61%) · 확률 30% — 가스·그리드 가격 인상분이 빨리 매출로 잡혀 이익률이 가이던스 상단 16%에 닿고 예약이 상반기에 확정된다</title></rect><text x="587.6" y="74">191 (+61%) · 확률 30%</text><line x1="407.3" x2="407.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="411.3" y="100">현재 118</text><text x="120" y="114" style="fill:#5d6470">확률 가중 136 (+15%)</text><line x1="447.9" x2="447.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 135 (+14%)</text></g></svg>