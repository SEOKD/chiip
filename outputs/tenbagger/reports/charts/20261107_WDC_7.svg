<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="147.7" height="16" rx="3" fill="#d0452f"><title>약세: 84.0$ (-68%) · 확률 30% — Toshiba 증설과 메모리 원가로 TB당 가격 상승이 멈추고 GM이 55%에서 꺾인다. 다음 4개 분기 EPS 컨센서스 $29.0보다 약 24% 낮다</title></rect><text x="271.7" y="22">84.0 (-68%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="259.7" height="16" rx="3" fill="#2a5bd7"><title>기본: 148$ (-44%) · 확률 45% — 다음 4개 분기 EPS 컨센서스 $29.0대로 간다. FQ2 가이던스 $5.80이 첫 분기다</title></rect><text x="383.7" y="48">148 (-44%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="380.5" height="16" rx="3" fill="#1a1d23"><title>강세: 216$ (-18%) · 확률 25% — FQ1처럼 가이던스를 넘고 40TB ePMR·HAMR로 EB 성장이 30%대로 가속한다</title></rect><text x="504.5" y="74">216 (-18%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 264</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 146 (-45%)</text><line x1="422.3" x2="422.3" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 172 (-35%)</text></g></svg>