<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="241.9" height="16" rx="3" fill="#5d6470"><title>약세: 284$ (-38%) · 확률 25% — 연료 가격이 내려가 거시 효과가 마이너스로 돌고, 기업결제 성장이 중간 10%대 아래로 내려간다. 2027 조정 EPS가 컨센서스 하단($30.8) 아래다</title></rect><text x="365.9" y="22">284 (-38%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="349.4" height="16" rx="3" fill="#5d6470"><title>기본: 410$ (-10%) · 확률 50% — 회사 2027 전망(유기 9~11%)과 자사주로 조정 EPS +16%. 컨센서스 범위($31.5~32.9) 안이다</title></rect><text x="473.4" y="48">410 (-10%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 544$ (+20%) · 확률 25% — 기업결제 신규 판매 램프(7~8%p)와 수익화 확대로 유기 11%를 넘고, 매각 대금 자사주로 EPS가 +23%. 컨센서스 상단($34.8) 근처다</title></rect><text x="587.6" y="74">544 (+20%) · 확률 25%</text><line x1="507.6" x2="507.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="511.6" y="100">현재 455</text><text x="120" y="114" style="fill:#5d6470">확률 가중 412 (-9%)</text><line x1="517.7" x2="517.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 467 (+3%)</text></g></svg>