<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="201.2" height="16" rx="3" fill="#5d6470"><title>약세: 7.11$ (-38%) · 확률 35% — 2·3호기 상업 운전이 2027년 하반기로 밀리거나 우물 출력이 떨어져 Cape Phase I 매출이 연 $60M 아래에 머물고, Cape Google 400 첫 전력이 2029년으로 밀린다</title></rect><text x="325.2" y="22">7.11 (-38%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="311.1" height="16" rx="3" fill="#5d6470"><title>기본: 11.0$ (-5%) · 확률 40% — Cape Phase I 약 100MW가 2027년 내내 돌고 Cape Google 400 첫 묶음이 2028년 중반에 붙는다. FY2027 컨센서스 $69M과 FY2028 $176M 사이</title></rect><text x="435.1" y="48">11.0 (-5%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 16.4$ (+42%) · 확률 25% — Cape Google 400 네 묶음이 2028년 안에 순서대로 들어오고 보조 태양광으로 판매 전력이 늘어 FY2028 컨센서스 상단($226M)에 닿는다</title></rect><text x="587.6" y="74">16.4 (+42%) · 확률 25%</text><line x1="445.8" x2="445.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="449.8" y="100">현재 11.5</text><text x="120" y="114" style="fill:#5d6470">확률 가중 11.0 (-5%)</text><line x1="476.6" x2="476.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 12.6 (+9%)</text></g></svg>