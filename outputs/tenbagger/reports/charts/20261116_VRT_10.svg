<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="192.4" height="16" rx="3" fill="#5d6470"><title>약세: 119$ (-41%) · 확률 30% — 고객 데이터센터 전력 연결이 밀려 2027년 출하가 2026년 하반기 속도에 머문다. 선수금이 줄고 조정 OPM이 23%로 내려간다. 다음 4개 분기(4Q27~3Q28) EPS가 컨센서스 하단 $8.9 근처인 $9.2</title></rect><text x="316.4" y="22">119 (-41%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="317.9" height="16" rx="3" fill="#5d6470"><title>기본: 196$ (-3%) · 확률 35% — FY27 매출 $19.6B(컨센서스, <tspan style="fill:#5d6470;font-weight:600">+33%</tspan>), 조정 OPM 25% 안팎. 다음 4개 분기(4Q27~3Q28) EPS 컨센서스 $11.4 수준</title></rect><text x="441.9" y="48">196 (-3%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 286$ (+42%) · 확률 35% — 주문 <tspan style="fill:#5d6470;font-weight:600">+100%</tspan>가 2027년 출하로 이어지고 800V DC·중전압 UPS가 2027 하반기에 붙는다. EPS가 컨센서스 상단 $13.9 쪽으로 간다</title></rect><text x="587.6" y="74">286 (+42%) · 확률 35%</text><line x1="447.1" x2="447.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="451.1" y="100">현재 202</text><text x="120" y="114" style="fill:#5d6470">확률 가중 205 (+1%)</text><line x1="445.3" x2="445.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 201 (-1%)</text></g></svg>