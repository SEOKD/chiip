<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="214.7" height="16" rx="3" fill="#5d6470"><title>약세: 10.7$ (-41%) · 확률 35% — AST 마일스톤이 밀려 라이선스·용역 매출이 2027년 하반기에야 잡히고, Flight 8이 다시 밀려 발사 매출이 붙지 않는다. 매출은 올해 가이던스에서 35% 느는 데 그친다</title></rect><text x="338.7" y="22">10.7 (-41%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="306.1" height="16" rx="3" fill="#5d6470"><title>기본: 15.2$ (-16%) · 확률 30% — 달·국방 잔고가 올해 속도로 매출로 바뀌고 AST 매출이 연중 고르게 붙는다. 컨센서스 범위 $700M~$905M의 하단이다 — 연도별 AST 인식 금액이 공개되지 않아 낮은 쪽에 뒀다</title></rect><text x="430.1" y="48">15.2 (-16%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 23.1$ (+27%) · 확률 35% — AST 현금 대가가 일찍 들어와 라이선스 매출이 앞당겨 잡히고, Alpha가 2027년에 4회 이상 발사한다. AST 계약 뒤 올라간 애널리스트 평균 수준이다</title></rect><text x="587.6" y="74">23.1 (+27%) · 확률 35%</text><line x1="484.4" x2="484.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="488.4" y="100">현재 18.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 16.4 (-10%)</text><line x1="415.3" x2="415.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 14.7 (-19%)</text></g></svg>