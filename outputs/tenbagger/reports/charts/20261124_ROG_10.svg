<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="212.4" height="16" rx="3" fill="#5d6470"><title>약세: 65.9$ (-45%) · 확률 35% — 매출 성장이 3% 안팎으로 식고 원자재 가격과 중국 세라믹 공장 저가동으로 조정 EBIT 이익률이 올해 수준(11.7%)에 머문다 — 애널리스트 최저 추정</title></rect><text x="336.4" y="22">65.9 (-45%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="330.5" height="16" rx="3" fill="#5d6470"><title>기본: 103$ (-15%) · 확률 30% — 컨센서스 $4.76~4.90 — 매출 <tspan style="fill:#5d6470;font-weight:600">+7.5%</tspan>, 조정 EBIT 이익률 13.3%. 신제품 매출은 거의 넣지 않은 값</title></rect><text x="454.5" y="48">103 (-15%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 144$ (+19%) · 확률 35% — 매출 <tspan style="fill:#5d6470;font-weight:600">+9%</tspan>가 이어지고 늘어난 매출의 절반이 조정 EBITDA로 남는다(3Q 실적 수준). 신제품 첫 매출이 4분기에 붙는다</title></rect><text x="587.6" y="74">144 (+19%) · 확률 35%</text><line x1="508.9" x2="508.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="512.9" y="100">현재 121</text><text x="120" y="114" style="fill:#5d6470">확률 가중 104 (-14%)</text><line x1="471.2" x2="471.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 109 (-10%)</text></g></svg>