<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="97.5" height="16" rx="3" fill="#5d6470"><title>약세: 1.64$ (-78%) · 확률 30% — 공급망 지연이 2분기 넘게 이어져 잔고 소화가 분기 $21~22M에 묶인다. 매출 약 $88M, 총이익률 38~40%, 영업비용 분기 $10.8M — 조정 EBITDA 약 $3M. 현금이 $60M대로 내려가 증자 이야기가 나온다</title></rect><text x="221.5" y="22">1.64 (-78%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="236.6" height="16" rx="3" fill="#5d6470"><title>기본: 3.98$ (-47%) · 확률 50% — 12개월 인도 잔고 $110.8M의 약 95%를 소화해 매출 약 $105M(다음 4개 분기 컨센서스 $105.9M). 총이익률 40%대 초반, 분기 영업비용 $10.8M(주식보상 $1.8M 포함)에 감가상각을 더해 조정 EBITDA 약 $9M — 애널리스트 분기 추정 합 $9.4M과 같은 수준</title></rect><text x="360.6" y="48">3.98 (-47%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 7.80$ (+4%) · 확률 20% — 공급망이 2Q부터 풀리고 드론 조립품 캐파가 월 2만 개 이상으로 오르며 후속 드론 주문이 들어온다. 매출 약 $120M, 총이익률 42% — 조정 EBITDA 약 $16M</title></rect><text x="587.6" y="74">7.80 (+4%) · 확률 20%</text><line x1="567.0" x2="567.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="571.0" y="100">현재 7.52</text><text x="120" y="114" style="fill:#5d6470">확률 가중 4.04 (-46%)</text><line x1="375.6" x2="375.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 4.30 (-43%)</text></g></svg>