<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="181.7" height="16" rx="3" fill="#5d6470"><title>약세: 69.5$ (-25%) · 확률 30% — 하이퍼스케일러 투자가 2027년 하반기에 꺾여 데이터센터 매출이 두 배가 아니라 <tspan style="fill:#5d6470;font-weight:600">+40%</tspan>에 그친다. 매출 약 $1.80B, 조정 영업이익률 33%에서 정체(레이저 공장 비용 지속).</title></rect><text x="305.7" y="22">69.5 (-25%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="316.5" height="16" rx="3" fill="#5d6470"><title>기본: 121$ (+30%) · 확률 45% — 데이터센터 매출 약 $0.95B(<tspan style="fill:#5d6470;font-weight:600">+80%</tspan>), LoRa <tspan style="fill:#5d6470;font-weight:600">+30%</tspan>, 휴대통신 모듈 매각 종결. 매출 약 $2.05B, 조정 영업이익률 38~39%. 애널리스트 평균 $6.58보다 조금 낮게 잡았다.</title></rect><text x="440.5" y="48">121 (+30%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 177$ (+91%) · 확률 25% — 데이터센터 매출이 $1B을 넘고 보드 탑재 칩·NPO가 상반기부터 붙는다. 매출 약 $2.25B, 조정 영업이익률 41%대. 애널리스트 최고 추정 $7.49 수준.</title></rect><text x="587.6" y="74">177 (+91%) · 확률 25%</text><line x1="363.1" x2="363.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="367.1" y="100">현재 92.9</text><text x="120" y="114" style="fill:#5d6470">확률 가중 120 (+29%)</text><line x1="410.3" x2="410.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 111 (+19%)</text></g></svg>