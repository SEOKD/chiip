<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="185.4" height="16" rx="3" fill="#5d6470"><title>약세: 8.91$ (-58%) · 확률 30% — 분기 매출이 가이던스 하한 근처($80M대)에 머물고 수주가 매출을 밑돈다. 매출 약 $350M, 비GAAP 순이익률 약 11% — 회사 가이던스 하한을 옮긴 추정 $0.81과 같은 자리다</title></rect><text x="309.4" y="22">8.91 (-58%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="309.0" height="16" rx="3" fill="#5d6470"><title>기본: 14.8$ (-30%) · 확률 35% — 12개월 잔고 $320M이 일정대로 매출이 되고 분기 수주가 $100M 안팎을 유지한다. 매출 약 $387M, 비GAAP 순이익률 약 12% — 애널리스트 분기 추정 합 $0.995와 같다</title></rect><text x="433.0" y="48">14.8 (-30%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 22.3$ (+5%) · 확률 35% — 납품 앞당김이 이어지고 변압기 북미 사업이 수주가 된다. 매출 약 $410M, 매출총이익률 30%, 비GAAP 순이익률 약 14%</title></rect><text x="587.6" y="74">22.3 (+5%) · 확률 35%</text><line x1="561.8" x2="561.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="565.8" y="100">현재 21.2</text><text x="120" y="114" style="fill:#5d6470">확률 가중 15.7 (-26%)</text><line x1="453.0" x2="453.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 16.0 (-25%)</text></g></svg>