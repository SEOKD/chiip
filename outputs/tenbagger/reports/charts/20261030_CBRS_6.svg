<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="64.2" height="16" rx="3" fill="#d0452f"><title>약세: 31.1$ (-72%) · 확률 30% — 2028년 매출 $3.5B, 조정 영업이익률 8%. 데이터센터가 늦고 OpenAI가 작업을 다른 칩으로 나누며 임차·교체 비용이 남는다</title></rect><text x="188.2" y="22">31.1 (-72%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="228.3" height="16" rx="3" fill="#2a5bd7"><title>기본: 110$ (+1%) · 확률 45% — 2028년 매출 $5.5B, 조정 영업이익률 20%. RPO는 일정대로 가지만 옵션 행사가 늦고 총마진은 60%에 못 미친다. 컨센서스 $6.15보다 낮고 GAAP 추정 $3.91 근처다</title></rect><text x="352.3" y="48">110 (+1%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 224$ (+105%) · 확률 25% — 2028년 매출 $6.8B, 조정 영업이익률 27%. 분리형이 처리량을 올리고 AWS·Oracle 물량이 RPO에 잡힌다. 컨센서스 상단 $6.62 근처다</title></rect><text x="587.6" y="74">224 (+105%) · 확률 25%</text><line x1="345.7" x2="345.7" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="349.7" y="100">현재 109</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 115 (+5%)</text><line x1="308.2" x2="308.2" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 91.0 (-17%)</text></g></svg>