<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="65.5" height="16" rx="3" fill="#5d6470"><title>약세: 25.9$ (-74%) · 확률 25% — 2028년 매출 $3.5B, 조정 영업이익률 8%. 데이터센터 준공이 2027년 말까지 밀리고 OpenAI 지연 몫 일부가 취소된다. 하이퍼스케일러 계약은 작게 시작한다</title></rect><text x="189.5" y="22">25.9 (-74%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="234.5" height="16" rx="3" fill="#5d6470"><title>기본: 92.7$ (-5%) · 확률 50% — 2028년 매출 $5.7B, 조정 영업이익률 21%. 700MW가 2027년 하반기에 대부분 켜지고 총마진은 50%대 중반. 컨센서스 $6.15보다 낮게 둔다 — 임차 시스템 비용이 2027년 중반까지 남는다</title></rect><text x="358.5" y="48">92.7 (-5%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 183$ (+87%) · 확률 25% — 2028년 매출 $7.0B, 조정 영업이익률 28%. Oracle·Microsoft 물량이 2027년에 매출로 들어오고 OpenAI가 옵션 일부를 앞당긴다. 컨센서스 상단 $6.62를 조금 넘는다</title></rect><text x="587.6" y="74">183 (+87%) · 확률 25%</text><line x1="367.4" x2="367.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="371.4" y="100">현재 97.8</text><text x="120" y="114" style="fill:#5d6470">확률 가중 98.6 (+1%)</text><line x1="317.5" x2="317.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 78.0 (-20%)</text></g></svg>