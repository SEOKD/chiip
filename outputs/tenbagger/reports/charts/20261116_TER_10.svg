<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="180.0" height="16" rx="3" fill="#5d6470"><title>약세: 107$ (-57%) · 확률 30% — 2027 하이퍼스케일러 설비투자가 줄고 하이퍼스케일러 1·2 램프가 2028로 밀린다. 메모리는 3Q26 고점 뒤 소화가 길어지고 매출총이익률이 57% 근처로 내려온다. 다음 4개 분기(4Q27~3Q28) EPS가 지금 다음 4개 분기 수준($10.6)에 머무는 $11.0</title></rect><text x="304.0" y="22">107 (-57%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="312.0" height="16" rx="3" fill="#5d6470"><title>기본: 185$ (-26%) · 확률 40% — 회사 말대로 2027년 분기마다 성장하고 하반기에 ASIC·GPU 고객 램프가 붙는다. 메모리는 HBM이 이끌어 2027 큰 폭 성장. 다음 4개 분기(4Q27~3Q28) EPS 컨센서스 $14.3 수준</title></rect><text x="436.0" y="48">185 (-26%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 275$ (+10%) · 확률 30% — 하이퍼스케일러 2·3이 함께 캐파 구매로 넘어가고 GPU 테스터 점유율이 10%대로 올라선다. CPO 테스트가 2027 말부터 붙고 제품 테스트 믹스로 매출총이익률이 59% 위를 지킨다. EPS가 컨센서스 상단 쪽 $17</title></rect><text x="587.6" y="74">275 (+10%) · 확률 30%</text><line x1="540.2" x2="540.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="544.2" y="100">현재 250</text><text x="120" y="114" style="fill:#5d6470">확률 가중 189 (-24%)</text><line x1="483.7" x2="483.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 216 (-13%)</text></g></svg>