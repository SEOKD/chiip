<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="180.8" height="16" rx="3" fill="#5d6470"><title>약세: 108$ (-45%) · 확률 30% — 반도체 장비와 AI 서버 투자가 2027년 하반기에 함께 꺾인다. 매출 약 $2.75B(<tspan style="fill:#5d6470;font-weight:600">+9%</tspan>, 추정 범위 하단 $2.99B 아래), 비GAAP 영업이익률 22% — 지금 주가를 동종 중앙 배수로 나눈 내재 EPS $13.5 근처다</title></rect><text x="304.8" y="22">108 (-45%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="315.3" height="16" rx="3" fill="#5d6470"><title>기본: 188$ (-5%) · 확률 40% — 회사가 말한 &#x27;30% 안팎&#x27;에서 부품 제약만큼 덜어 매출 약 $3.15B(<tspan style="fill:#5d6470;font-weight:600">+25%</tspan>), 비GAAP 영업이익률 약 26%, 주식 수 41.2M주. 두 EPS 추정($16.5와 $17.9) 사이다</title></rect><text x="439.3" y="48">188 (-5%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 276$ (+40%) · 확률 30% — 부품 제약이 풀려 수요만큼 출하하고 신제품·2차 고객군이 일찍 매출이 된다. 매출 약 $3.35B(<tspan style="fill:#5d6470;font-weight:600">+33%</tspan>), 비GAAP 영업이익률 28.5% — 컨센서스 상단 $19.0 위</title></rect><text x="587.6" y="74">276 (+40%) · 확률 30%</text><line x1="450.8" x2="450.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="454.8" y="100">현재 197</text><text x="120" y="114" style="fill:#5d6470">확률 가중 190 (-3%)</text><line x1="444.0" x2="444.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 193 (-2%)</text></g></svg>