<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="2.0" height="16" rx="3" fill="#5d6470"><title>약세: 0.03$ (-100%) · 확률 35% — CB5 개시가 2~3분기 늦고 Justified 첫 인도가 2028년으로 넘어간다. 4Q27~3Q28 EBITDA가 약 $620M에 그치고(Lake Mariner 몫에 Justified 초기 인도분만 더한 값) Justified 프로젝트 차입이 8% 이상에서 정해진다</title></rect><text x="125.4" y="22">0.03 (-100%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="203.4" height="16" rx="3" fill="#5d6470"><title>기본: 4.40$ (-56%) · 확률 42% — Lake Mariner가 1Q27 말 연환산 임대 매출 약 $700M에 닿고 Justified가 2027년 말부터 단계 인도된다. 4Q27~3Q28 애널리스트 평균 매출 경로 약 $1.33B에 EBITDA 마진 62%를 곱한 약 $830M</title></rect><text x="327.4" y="48">4.40 (-56%) · 확률 42%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="421.6" height="16" rx="3" fill="#9b6bd6"><title>강세: 9.12$ (-9%) · 확률 23% — Justified가 2Q28까지 전부 인도되고 Muskie 첫 500MW에 투자등급 보강 임차인이 주식 발행 없이 붙는다. 배수가 동종 쪽으로 오른다</title></rect><text x="545.6" y="74">9.12 (-9%) · 확률 23%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 10.0</text><text x="120" y="114" style="fill:#5d6470">확률 가중 3.96 (-61%)</text><line x1="291.0" x2="291.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 3.70 (-63%)</text></g></svg>