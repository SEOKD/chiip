<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="173.9" height="16" rx="3" fill="#5d6470"><title>약세: 465,215₩ (-24%) · 확률 35% — 전자BG OPM이 26%대로 내려가고 2028년 증설 전까지 물량이 묶인다. 두산에너빌리티 이익이 기대에 못 미친다</title></rect><text x="297.9" y="22">465,215 (-24%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="298.1" height="16" rx="3" fill="#5d6470"><title>기본: 797,511₩ (+31%) · 확률 40% — 전자BG 2027 매출 약 ₩3.44T(대신), OPM 29% 안팎 유지. 지배 EPS는 추정이다</title></rect><text x="422.1" y="48">797,511 (+31%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 1,240,573₩ (+103%) · 확률 25% — 광모듈·1.6T 믹스와 LTA 가격으로 OPM이 31%를 넘고, 증설 일부가 2027년 말 앞당겨 들어온다</title></rect><text x="587.6" y="74">1,240,573 (+103%) · 확률 25%</text><line x1="348.0" x2="348.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="352.0" y="100">현재 610,000</text><text x="120" y="114" style="fill:#5d6470">확률 가중 791,973 (+30%)</text><line x1="451.7" x2="451.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 887,618 (+46%)</text></g></svg>