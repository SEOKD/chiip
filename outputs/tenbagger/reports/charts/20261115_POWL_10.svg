<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="184.4" height="16" rx="3" fill="#5d6470"><title>약세: 61.7$ (-57%) · 확률 35% — 데이터센터 후속 단계가 늦어지고 석유화학 약세가 이어지며, 새 공장 가동 초기 비용과 구리 원가로 GPM이 27%대로 내려온다. 다음 4개 분기 EPS가 컨센서스 하단 $5.91 근처</title></rect><text x="308.4" y="22">61.7 (-57%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="316.7" height="16" rx="3" fill="#5d6470"><title>기본: 106$ (-26%) · 확률 35% — 잔고 $1.3B가 12개월 안에 매출이 되고 임차 공장이 FY27 하반기 가동해 매출 <tspan style="fill:#5d6470;font-weight:600">+20%</tspan> 안팎, GPM 29~30% 유지. 다음 4개 분기(FY28) EPS 컨센서스 $7.57 수준</title></rect><text x="440.7" y="48">106 (-26%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 155$ (+9%) · 확률 30% — 데이터센터 2단계가 붙고 유틸리티·LNG 수주가 이어지며 상업 부문 가격 인상이 마진을 31% 위로 올린다. 다음 4개 분기 EPS가 컨센서스 상단 $9.15에 다가간다</title></rect><text x="587.6" y="74">155 (+9%) · 확률 30%</text><line x1="546.4" x2="546.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="550.4" y="100">현재 143</text><text x="120" y="114" style="fill:#5d6470">확률 가중 105 (-26%)</text><line x1="451.6" x2="451.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 111 (-22%)</text></g></svg>