<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="172.2" height="16" rx="3" fill="#d0452f"><title>약세: 112$ (-14%) · 확률 30% — 대형 고객 인도가 밀려 FY28 EPS가 FY27 가이던스 $8.10에도 못 미친다. 매출 $108B 하단, 지분 $10B 추가 발행, 총이익률 저점 지속</title></rect><text x="296.2" y="22">112 (-14%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="320.9" height="16" rx="3" fill="#2a5bd7"><title>기본: 209$ (+60%) · 확률 45% — FY28 EPS 컨센서스 범위 안. 매출 $124B, 비GAAP 영업이익률 39% 안팎</title></rect><text x="444.9" y="48">209 (+60%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 302$ (+131%) · 확률 25% — 10GW 일정 유지, 1GW 예시 영업이익률 34% 달성, FY28 매출 $138B 상단</title></rect><text x="587.6" y="74">302 (+131%) · 확률 25%</text><line x1="320.9" x2="320.9" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="324.9" y="100">현재 131</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 203 (+55%)</text><line x1="378.3" x2="378.3" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 168 (+29%)</text></g></svg>