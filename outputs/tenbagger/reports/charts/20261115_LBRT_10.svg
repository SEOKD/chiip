<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="2.0" height="16" rx="3" fill="#5d6470"><title>약세: -0.15$ (-101%) · 확률 35% — 2027 프랙 가격 인상이 노동·운송비 인플레이션에 묻혀 EBITDA가 지금 수준(연 약 $0.58B)에 머물고, 첫 ESA가 2027년으로 밀려 전력 기여가 2028년 하반기 이후로 간다</title></rect><text x="118.7" y="22">-0.15 (-101%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="200.9" height="16" rx="3" fill="#5d6470"><title>기본: 5.66$ (-57%) · 확률 45% — 프랙 EBITDA가 소폭 인상으로 약 $0.66B, 첫 500MW·PowerBridge 1단계가 2027년 4분기부터 순차 가동해 전력 EBITDA가 일부 붙는다. 컨센서스 $0.89B보다 약 12% 낮게 잡았다</title></rect><text x="324.9" y="48">5.66 (-57%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="455.1" height="16" rx="3" fill="#5d6470"><title>강세: 12.8$ (-2%) · 확률 20% — 프랙 가격이 분기마다 오르고 1.2GW 중 첫 500MW가 일정대로, Vantage 400MW도 계약으로 넘어간다</title></rect><text x="579.1" y="74">12.8 (-2%) · 확률 20%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 13.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 5.06 (-61%)</text><line x1="393.4" x2="393.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 7.70 (-41%)</text></g></svg>