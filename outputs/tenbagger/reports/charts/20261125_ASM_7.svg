<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="197.2" height="16" rx="3" fill="#5d6470"><title>약세: 362€ (-43%) · 확률 25% — 고객 계획이 주문으로 다 바뀌지 않거나 부품 병목·수출통제로 2027년 매출이 €5.1B(컨센서스 하단)에 머문다</title></rect><text x="321.2" y="22">362 (-43%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="321.1" height="16" rx="3" fill="#5d6470"><title>기본: 589€ (-8%) · 확률 45% — 컨센서스 FY2027 매출 €5.85B·EPS €34.2 — 회사 가이던스 €5.7B 초과와 1.4nm 양산 투자, DRAM FinFET 도입</title></rect><text x="445.1" y="48">589 (-8%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 850€ (+33%) · 확률 30% — 1.4nm가 2nm보다 큰 노드로 확인되고 메모리·전력 회복이 겹쳐 매출 €6.55B(컨센서스 상단)</title></rect><text x="587.6" y="74">850 (+33%) · 확률 30%</text><line x1="467.6" x2="467.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="471.6" y="100">현재 637</text><text x="120" y="114" style="fill:#5d6470">확률 가중 610 (-4%)</text><line x1="427.5" x2="427.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 564 (-12%)</text></g></svg>