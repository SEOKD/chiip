<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="190.4" height="16" rx="3" fill="#5d6470"><title>약세: 255$ (-31%) · 확률 30% — 클린룸·부품 병목과 데이터센터 일정 지연으로 하반기 장비 인도가 밀린다. FY27 매출 약 $41B(<tspan style="fill:#5d6470;font-weight:600">+19%</tspan>), 조정 영업이익률 34% — EPS 약 $15.4(추정)</title></rect><text x="314.4" y="22">255 (-31%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="310.7" height="16" rx="3" fill="#5d6470"><title>기본: 416$ (+12%) · 확률 40% — 컨센서스 경로 — FY27 매출 약 $46.7B(<tspan style="fill:#5d6470;font-weight:600">+36%</tspan>), 조정 영업이익률 36.4%, 세율 13%로 EPS 약 $18.85(1Q 가이던스 $4.35 위에서 분기마다 소폭 증가)</title></rect><text x="434.7" y="48">416 (+12%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 621$ (+68%) · 확률 30% — D램(4F²·3D 전환)·선단 로직·패키징이 동시에 늘고 출하 능력이 분기마다 오른다. FY27 매출 약 $52B(<tspan style="fill:#5d6470;font-weight:600">+51%</tspan>), 영업이익률 38% — EPS 약 $22.5(추정 상단)</title></rect><text x="587.6" y="74">621 (+68%) · 확률 30%</text><line x1="396.6" x2="396.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="400.6" y="100">현재 370</text><text x="120" y="114" style="fill:#5d6470">확률 가중 429 (+16%)</text><line x1="416.4" x2="416.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 397 (+7%)</text></g></svg>