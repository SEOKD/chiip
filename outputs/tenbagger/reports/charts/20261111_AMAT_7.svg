<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="184.6" height="16" rx="3" fill="#5d6470"><title>약세: 227$ (-39%) · 확률 30% — 고객이 데이터센터 일정 지연으로 2027년 하반기 팹 장비 인도를 미룬다. FY27 매출 약 $40B(+16%, 추정 하단), 램프 비용으로 영업이익률 33% 근처 — EPS 약 $14.6(컨센서스 하단)</title></rect><text x="308.6" y="22">227 (-39%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="308.5" height="16" rx="3" fill="#5d6470"><title>기본: 379$ (+2%) · 확률 45% — 컨센서스 경로 — FY27 매출 약 $46B(+33%), 조정 영업이익률 36%, 세율 13%로 EPS 약 $18.3(14명 평균 $18.28)</title></rect><text x="432.5" y="48">379 (+2%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 569$ (+53%) · 확률 25% — D램·선단 로직·패키징이 동시에 늘고 점유가 오른다. FY27 매출 약 $52B(+50%), 영업이익률 38% — EPS 약 $22(컨센서스 상단)</title></rect><text x="587.6" y="74">569 (+53%) · 확률 25%</text><line x1="423.3" x2="423.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="427.3" y="100">현재 373</text><text x="120" y="114" style="fill:#5d6470">확률 가중 381 (+2%)</text><line x1="413.1" x2="413.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 360 (-3%)</text></g></svg>