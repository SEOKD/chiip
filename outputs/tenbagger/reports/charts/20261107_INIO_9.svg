<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 383" width="340" height="383"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="288" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="162" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">가스엔진 장비</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="149.5" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 58%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">Jenbacher J620·J624·Type 6 발전 엔진, Waukesha</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">압축·발전 엔진과 컨테이너 패키지</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 현장 주전원, 열병합·분산 발</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">전, 가스 압축</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 3Q 장비 $778M — 데이터센터 $463M·전력 $2</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">39M·압축 $75M, 세그먼트 EBITDA 17.1%</text><text x="12" y="180" style="fill:#1a1d23;font-size:13px;font-weight:700">엔진 애프터서비스</text><text x="328" y="180" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="186" width="106.5" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 42%</text><text x="12" y="217" style="fill:#1a1d23;font-size:12px">장기 서비스 계약, 부품, 오버홀, 재제조</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · 설치 기반 약 44GW 엔진의 수명 관리</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">수익 · 3Q $390M(계약 $122M·건별 $269M), 세그먼</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">트 EBITDA 31.7%</text><text x="12" y="306" style="fill:#1a1d23;font-size:13px;font-weight:700">myPlant</text><text x="328" y="306" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="329" style="fill:#1a1d23;font-size:12px">AI 기반 엔진 군 원격 관리</text><text x="12" y="346" style="fill:#5d6470;font-size:12px">쓰는 곳 · 원격 감시, 정비 시점 예측</text><text x="12" y="363" style="fill:#5d6470;font-size:12px">수익 · 서비스 매출에 포함, 별도 공시 없음</text></g></svg>