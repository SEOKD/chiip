<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="203.0" height="16" rx="3" fill="#5d6470"><title>약세: 1,275¥ (-47%) · 확률 35% — 경쟁사 저열팽창 유리가 양산 채택되고 새 공장 감가상각이 먼저 늘어 FY3/28 영업이익이 올해 가이던스 수준(¥34~35B)에 머문다</title></rect><text x="327.0" y="22">1,275 (-47%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="318.8" height="16" rx="3" fill="#5d6470"><title>기본: 2,003¥ (-16%) · 확률 30% — FY3/28 매출 <tspan style="fill:#5d6470;font-weight:600">+15%</tspan>·영업이익 ¥40.8B(<tspan style="fill:#5d6470;font-weight:600">+20%</tspan>) — T글라스 새 공장이 2027년 7월 일정대로 출하하고 이익률은 지금 수준</title></rect><text x="442.8" y="48">2,003 (-16%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 2,913¥ (+21%) · 확률 35% — 증설 시점의 T글라스 판가 개정이 이익률을 올리고 물량이 계획보다 빨리 나와 FY3/28 영업이익이 ¥47B(<tspan style="fill:#5d6470;font-weight:600">+40%</tspan>)에 닿는다</title></rect><text x="587.6" y="74">2,913 (+21%) · 확률 35%</text><line x1="501.7" x2="501.7" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="505.7" y="100">현재 2,398</text><text x="120" y="114" style="fill:#5d6470">확률 가중 2,067 (-14%)</text><line x1="457.1" x2="457.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 2,118 (-12%)</text></g></svg>