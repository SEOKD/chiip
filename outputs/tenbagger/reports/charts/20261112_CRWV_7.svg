<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="85.1" height="16" rx="3" fill="#5d6470"><title>약세: 59.0$ (-3%) · 확률 30% — 업계 신규 공급으로 단기 계약 단가가 꺾이고 데이터센터 셸·전력 연결이 1~2개 분기 늦어, 다음 4개 분기 EBITDA가 4Q 실행률(분기 약 $3B, 연 약 $12B) 근처에 머문다. 투자등급 대출 금리가 8%를 넘어 자산 단위 조달이 비싸진다 — EBITDA 약 $11.0B</title></rect><text x="209.1" y="22">59.0 (-3%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="275.0" height="16" rx="3" fill="#5d6470"><title>기본: 191$ (+214%) · 확률 45% — 백로그 인도와 연말 1.85GW·2027 램프가 계획대로 가고 단가가 유지된다. 다음 4개 분기 매출 약 $24B(컨센서스 $24.0B), EBITDA 마진 약 64% — EBITDA 약 $15.4B(컨센서스와 같은 수준)</title></rect><text x="399.0" y="48">191 (+214%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 321$ (+429%) · 확률 25% — 장기 단가 MW당 $25M 상단과 구형 GPU 재계약, 관리형 추론 확대가 겹쳐 매출 약 $27B, EBITDA 마진 약 66% — EBITDA 약 $18B</title></rect><text x="587.6" y="74">321 (+429%) · 확률 25%</text><line x1="207.7" x2="207.7" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="211.7" y="100">현재 60.8</text><text x="120" y="114" style="fill:#5d6470">확률 가중 184 (+202%)</text><line x1="304.7" x2="304.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 128 (+111%)</text></g></svg>