<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="174.2" height="16" rx="3" fill="#d0452f"><title>약세: 68.0$ (-18%) · 확률 30% — N+M 지연이 이어지고 데이터센터 매출이 가이던스를 또 밑돈다. 4Q27~3Q28 EPS 컨센서스 하단 $9.8보다 27% 낮다</title></rect><text x="298.2" y="22">68.0 (-18%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="316.1" height="16" rx="3" fill="#2a5bd7"><title>기본: 123$ (+49%) · 확률 50% — 가이던스대로 가고 4Q27~3Q28 EPS는 컨센서스 범위 $9.8~$10.3의 하단이다. 표본이 2~3명이라 하단을 쓴다</title></rect><text x="440.1" y="48">123 (+49%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 181$ (+118%) · 확률 20% — N+M이 데이터센터의 50%를 넘고 Ophir가 더해지며 이익률이 22%대로 간다. 컨센서스 상단보다 12% 높다</title></rect><text x="587.6" y="74">181 (+118%) · 확률 20%</text><line x1="332.5" x2="332.5" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="336.5" y="100">현재 82.9</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 118 (+43%)</text><line x1="399.2" x2="399.2" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 109 (+31%)</text></g></svg>