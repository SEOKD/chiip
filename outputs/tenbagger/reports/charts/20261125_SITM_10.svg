<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="165.8" height="16" rx="3" fill="#5d6470"><title>약세: 198$ (-48%) · 확률 35% — 하이퍼스케일러 설비투자가 2027년에 꺾이고 TPD 제약이 하반기까지 간다. 매출 약 $1.30B(4Q 가이던스 연환산 $1.34B 아래), 영업비용 증가로 비GAAP 영업이익률 38% — EPS 추정 범위 하단 근처</title></rect><text x="289.8" y="22">198 (-48%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="285.3" height="16" rx="3" fill="#5d6470"><title>기본: 341$ (-10%) · 확률 30% — 4Q 가이던스 $336M에서 분기 5% 안팎 순차 성장(1분기는 계절성으로 제자리), 매출 약 $1.55B, 비GAAP 영업이익률 44%, 희석 주식 약 33M주(추정). 두 EPS 추정($17.9와 $22.0) 사이다</title></rect><text x="409.3" y="48">341 (-10%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 555$ (+47%) · 확률 35% — TPD 제약이 상반기에 풀리고 큰 고객들의 전망이 주문으로 바뀐다. 매출 약 $1.85B(높은 쪽 추정 $1.72B 위), 비GAAP 영업이익률 47% — EPS 추정 범위 상단 $28 아래</title></rect><text x="587.6" y="74">555 (+47%) · 확률 35%</text><line x1="436.2" x2="436.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="440.2" y="100">현재 378</text><text x="120" y="114" style="fill:#5d6470">확률 가중 366 (-3%)</text><line x1="411.7" x2="411.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 349 (-8%)</text></g></svg>