<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="115.9" height="16" rx="3" fill="#5d6470"><title>약세: 0.11£ (-57%) · 확률 20% — InP 기판 배정이 막히고 반응기 전환이 늦어 FY27 매출이 £150M(컨센서스 하단), 조정 EBITDA £18M에 머문다</title></rect><text x="239.9" y="22">0.11 (-57%) · 확률 20%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="252.9" height="16" rx="3" fill="#5d6470"><title>기본: 0.24£ (-7%) · 확률 60% — 컨센서스 FY27 매출 £175M(<tspan style="fill:#5d6470;font-weight:600">+28%</tspan>)·조정 EBITDA £30M — LTA 물량과 가동률 상승이 2026년 속도를 이어간다</title></rect><text x="376.9" y="48">0.24 (-7%) · 확률 60%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 0.44£ (+71%) · 확률 20% — MACOM 밖 LTA가 늘고 Newport 빈 클린룸에 선급금 증설이 붙어 매출 £200M(컨센서스 상단), 조정 EBITDA £42M</title></rect><text x="587.6" y="74">0.44 (+71%) · 확률 20%</text><line x1="391.9" x2="391.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="395.9" y="100">현재 0.26</text><text x="120" y="114" style="fill:#5d6470">확률 가중 0.25 (-2%)</text><line x1="436.1" x2="436.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 0.30 (+16%)</text></g></svg>