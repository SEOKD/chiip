<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="173.1" height="16" rx="3" fill="#d0452f"><title>약세: 81.4$ (-46%) · 확률 30% — 하반기 AEC가 정체하고 광 $600M이 밀려 FY27 성장이 +85%에 못 미친다. 다음 4개 분기 EPS가 FY27 컨센서스 하단 근처</title></rect><text x="297.1" y="22">81.4 (-46%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="305.0" height="16" rx="3" fill="#2a5bd7"><title>기본: 143$ (-5%) · 확률 45% — 2Q $530M 뒤 하반기 광 램프로 FY27 약 $2.5B. 다음 4개 분기 EPS 컨센서스 $7.37과 같은 높이</title></rect><text x="429.0" y="48">143 (-5%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 218$ (+44%) · 확률 25% — 1.6T AEC와 광 트랜시버가 함께 크고 PIC 설계 수주가 FY27 말부터 매출로 잡혀 FY28 매출이 $4.3B를 넘는다</title></rect><text x="587.6" y="74">218 (+44%) · 확률 25%</text><line x1="441.1" x2="441.1" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="445.1" y="100">현재 151</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 143 (-5%)</text><line x1="415.7" x2="415.7" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 139 (-8%)</text></g></svg>