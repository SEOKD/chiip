<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 508" width="340" height="508"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="413" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="304" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="209" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="97" width="338" height="104" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">유틸리티 송배전·변전 공사</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><text x="12" y="43" style="fill:#1a1d23;font-size:12px">송전선·배전망·변전소 시공과 유지보수</text><text x="12" y="60" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미국 유틸리티, 대부분 MSA</text><text x="12" y="77" style="fill:#5d6470;font-size:12px">수익 · 약 $20B, 이익률 10~12%(CEO 발언)</text><text x="12" y="115" style="fill:#1a1d23;font-size:13px;font-weight:700">데이터센터 전기·기계 공사(MEP)</text><text x="328" y="115" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><text x="12" y="138" style="fill:#1a1d23;font-size:12px">칩을 뺀 건물 안 전기·기계·배관과 부지 공사</text><text x="12" y="155" style="fill:#5d6470;font-size:12px">쓰는 곳 · 하이퍼스케일러와 개발사</text><text x="12" y="172" style="fill:#5d6470;font-size:12px">수익 · 기술 매출 15~20%, MW당 $5~7M 포획(CEO 어</text><text x="12" y="189" style="fill:#5d6470;font-size:12px">림)</text><text x="12" y="227" style="fill:#1a1d23;font-size:13px;font-weight:700">발전·재생에너지 EPC</text><text x="328" y="227" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><text x="12" y="250" style="fill:#1a1d23;font-size:12px">태양광·배터리·가스 발전소 설계·조달·시공</text><text x="12" y="267" style="fill:#5d6470;font-size:12px">쓰는 곳 · 유틸리티, 대형 부하 고객</text><text x="12" y="284" style="fill:#5d6470;font-size:12px">수익 · 재생에너지 $5~10B(CEO 발언)</text><text x="12" y="322" style="fill:#1a1d23;font-size:13px;font-weight:700">지하 인프라·산업</text><text x="328" y="322" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="328" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="328" width="46.3" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="336" text-anchor="end" style="font-size:11.5px">매출 18%</text><text x="12" y="359" style="fill:#1a1d23;font-size:12px">가스 배관, 산업 설비, 기계 공사</text><text x="12" y="376" style="fill:#5d6470;font-size:12px">쓰는 곳 · 가스 유틸리티, 파이프라인, 산업체</text><text x="12" y="393" style="fill:#5d6470;font-size:12px">수익 · 3Q 매출 $2.2B, 이익률 9.4%</text><text x="12" y="431" style="fill:#1a1d23;font-size:13px;font-weight:700">변압기·차단기·전주 제조</text><text x="328" y="431" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="454" style="fill:#1a1d23;font-size:12px">병목 장비를 자체 생산해 공사에 묶는다</text><text x="12" y="471" style="fill:#5d6470;font-size:12px">쓰는 곳 · 자사 EPC와 고객 공급</text><text x="12" y="488" style="fill:#5d6470;font-size:12px">수익 · 별도 공시 없음(미확인)</text></g></svg>