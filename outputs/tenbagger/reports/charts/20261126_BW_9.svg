<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="28.7" height="16" rx="3" fill="#5d6470"><title>약세: 0.37$ (-90%) · 확률 40% — Base Electron 현장 착공이 2027년 하반기로 밀리고 두 번째 대형 수주가 없다. 조정 EBITDA는 2026년 목표 중간 $92.5M 언저리에 머문다 — 지금 주가가 담고 있는 수준</title></rect><text x="152.7" y="22">0.37 (-90%) · 확률 40%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="242.3" height="16" rx="3" fill="#5d6470"><title>기본: 3.12$ (-17%) · 확률 25% — 회사 목표 중간 $132.5M — 컨센서스 $135.1M과 거의 같다. 잔고 중 2027년 인식 예정 $706M에 연 $200M 안팎 단납기 부품·서비스, 일부 신규 수주가 붙는다</title></rect><text x="366.3" y="48">3.12 (-17%) · 확률 25%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 5.97$ (+60%) · 확률 35% — 4Q26~1Q27에 $200~400M급 수주가 두 건 넘게 계약되고 시공 인력 문제가 끝난다. 회사가 &#x27;보수적으로 잡았다&#x27;고 한 목표 상단 $140M을 14% 넘긴다</title></rect><text x="587.6" y="74">5.97 (+60%) · 확률 35%</text><line x1="410.5" x2="410.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="414.5" y="100">현재 3.74</text><text x="120" y="114" style="fill:#5d6470">확률 가중 3.02 (-19%)</text><line x1="407.3" x2="407.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 3.70 (-1%)</text></g></svg>