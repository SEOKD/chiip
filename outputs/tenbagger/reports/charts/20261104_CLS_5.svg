<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="168.1" height="16" rx="3" fill="#d0452f"><title>약세: 172$ (-34%) · 확률 25% — 4Q가 가이던스 하단에 그치고 OpenAI·TPU 램프가 2028년으로 밀려 2027 매출이 가이던스 범위 하단($36B)에 가깝다</title></rect><text x="292.1" y="22">172 (-34%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="292.1" height="16" rx="3" fill="#2a5bd7"><title>기본: 299$ (+15%) · 확률 50% — 4Q $6.4B 뒤 2027 상반기 1.6T·Helios 램프, 하반기 OpenAI·TPU. 다음 4개 분기 EPS 컨센서스 $18.94와 같은 높이</title></rect><text x="416.1" y="48">299 (+15%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 475$ (+83%) · 확률 25% — 부품 공급이 풀려 2027 매출이 $45B 위로 가고 조정 영업이익률이 9%를 넘는다</title></rect><text x="587.6" y="74">475 (+83%) · 확률 25%</text><line x1="374.0" x2="374.0" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="378.0" y="100">현재 260</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 311 (+20%)</text><line x1="433.6" x2="433.6" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 321 (+23%)</text></g></svg>