<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="152.3" height="16" rx="3" fill="#5d6470"><title>약세: 71.0SEK (-44%) · 확률 30% — DCT 이익률이 10% 안팎에 머물고 재고·이자 부담이 이어져 FY2027 EPS가 추정 범위 하단에 그친다</title></rect><text x="276.3" y="22">71.0 (-44%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="287.0" height="16" rx="3" fill="#5d6470"><title>기본: 134SEK (+5%) · 확률 40% — 잔고가 계획대로 인도되고 DCT 이익률이 10%대 초중반으로 돌아와 FY2027 EPS 추정 평균 SEK 6.5</title></rect><text x="411.0" y="48">134 (+5%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 216SEK (+70%) · 확률 30% — 버지니아 공장 숙련·장기 공급 계약으로 DCT 이익률이 +4~6%p 오르고 FoodTech 매각으로 이자 비용이 줄어 추정 범위 상단</title></rect><text x="587.6" y="74">216 (+70%) · 확률 30%</text><line x1="392.1" x2="392.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="396.1" y="100">현재 127</text><text x="120" y="114" style="fill:#5d6470">확률 가중 140 (+10%)</text><line x1="422.3" x2="422.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 141 (+11%)</text></g></svg>