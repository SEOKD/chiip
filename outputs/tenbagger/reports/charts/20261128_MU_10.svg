<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="180.0" height="16" rx="3" fill="#5d6470"><title>약세: 276$ (-57%) · 확률 45% — 2027년 하반기부터 범용 DRAM 계약 가격이 내리고 FY2028 매출이 약 $273B(<tspan style="fill:#5d6470;font-weight:600">+8%</tspan>)에 그친다. 영업이익률 74%. 업계 증설과 고객의 탑재량 축소가 겹치는 경우다. 애널리스트 최저 추정 $188 아래다.</title></rect><text x="304.0" y="22">276 (-57%) · 확률 45%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="314.2" height="16" rx="3" fill="#5d6470"><title>기본: 482$ (-26%) · 확률 25% — FY2028 매출 약 $337B(<tspan style="fill:#5d6470;font-weight:600">+20%</tspan>), 영업이익률 82%. 2027년 계약 가격 <tspan style="fill:#5d6470;font-weight:600">+30%</tspan>대, 2028년은 HBM과 데이터센터 SSD가 범용 DRAM 가격 하락을 메운다. 애널리스트 평균 $215.6 수준이다.</title></rect><text x="438.2" y="48">482 (-26%) · 확률 25%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 711$ (+10%) · 확률 30% — 공급 부족이 2028년 내내 이어져 FY2028 매출 약 $374B, 영업이익률 84%. 2028년 계약 가격이 유지되고 자사주 매입이 주식 수를 줄인다. 애널리스트 최고 추정 $286 아래다.</title></rect><text x="587.6" y="74">711 (+10%) · 확률 30%</text><line x1="542.0" x2="542.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="546.0" y="100">현재 647</text><text x="120" y="114" style="fill:#5d6470">확률 가중 458 (-29%)</text><line x1="477.5" x2="477.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 548 (-15%)</text></g></svg>