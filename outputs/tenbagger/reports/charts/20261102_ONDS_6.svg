<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="235.8" height="16" rx="3" fill="#d0452f"><title>약세: 4.16$ (-34%) · 확률 30% — DZYNE·ULTRA 인도가 밀리고 이스라엘 쪽 주문이 줄어 다음 4개 분기 매출 $0.80B(컨센서스 −20%)</title></rect><text x="359.8" y="22">4.16 (-34%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="337.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 5.95$ (-6%) · 확률 45% — 컨센서스대로 다음 4개 분기 매출 약 $1.0B, 잔고 $757M과 6/30 이후 주문 $270M이 매출로 바뀐다</title></rect><text x="461.2" y="48">5.95 (-6%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 8.18$ (+29%) · 확률 25% — FEMA 대드론 보조금·미 육군 주문이 더해져 $1.20B, 3Q·4Q 주문이 분기 $200M을 넘는다</title></rect><text x="587.6" y="74">8.18 (+29%) · 확률 25%</text><line x1="478.2" x2="478.2" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="482.2" y="100">현재 6.32</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 5.97 (-6%)</text><line x1="443.1" x2="443.1" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 5.70 (-10%)</text></g></svg>