<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 288" width="340" height="288"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="162" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">UTI 운송·숙련 기술</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="161.3" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 63%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">자동차·디젤·충돌 수리·오토바이·해양·항공 정비와</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">용접·HVACR·전기·로봇 자동화 직업 과정(9~18개월,</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수료증·학위)</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">쓰는 곳 · 고교 졸업생·성인 전직자·제대군인</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 과정별 수업료(연방 학자금 대부분) — 학생</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">수 × 과정 단가</text><text x="12" y="180" style="fill:#5d6470;font-size:13px;font-weight:700">Concorde 의료 교육</text><text x="328" y="180" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="186" width="94.7" height="8" rx="4" fill="#5d6470"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 37%</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">간호·치위생·치과 보조·방사선·초음파·수술 기술·약</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">국 기술 직업 과정과 학위</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">쓰는 곳 · 성인 학습자·전직자</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">수익 · 과정별 수업료 — 간호·치위생은 단가가 높다</text></g></svg>