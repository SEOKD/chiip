<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="201.7" height="16" rx="3" fill="#5d6470"><title>약세: 725$ (-48%) · 확률 25% — AI 투자 속도가 꺾여 고객이 2028년 주문을 미루고, 중국 매출이 금액으로도 줄며 가치 기반 가격 반영이 늦어진다. 12개월 뒤 다음 4개 분기 EPS가 FY28 추정 하단($58.4) 경로에 머문다</title></rect><text x="325.7" y="22">725 (-48%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="318.1" height="16" rx="3" fill="#5d6470"><title>기본: 1,144$ (-17%) · 확률 50% — 컨센서스 경로 — 2027 출하 <tspan style="fill:#5d6470;font-weight:600">+30%</tspan>, FY27 매출 약 $60B, EBIT 이익률 45%. 4Q27~3Q28 분기 추정 합 약 $68.6(계산)</title></rect><text x="442.1" y="48">1,144 (-17%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 1,667$ (+21%) · 확률 25% — 2028년 증설이 <tspan style="fill:#5d6470;font-weight:600">+30%</tspan>를 넘고 가치 기반 가격·High-NA 램프가 겹친다. EPS가 FY28 추정 평균($78.0)을 넘어 상단($96.4) 쪽으로 간다</title></rect><text x="587.6" y="74">1,667 (+21%) · 확률 25%</text><line x1="504.6" x2="504.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="508.6" y="100">현재 1,383</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1,170 (-15%)</text><line x1="477.1" x2="477.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1,284 (-7%)</text></g></svg>