<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="196.7" height="16" rx="3" fill="#5d6470"><title>약세: 32.9$ (-34%) · 확률 25% — Vector 분기 성장이 10% 안팎으로 꺾이고 AppLovin과 지면 경쟁이 붙는다. 매출 약 $2.8B, 조정 EBITDA 약 $1.15B(마진 약 41%)</title></rect><text x="320.7" y="22">32.9 (-34%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="316.3" height="16" rx="3" fill="#5d6470"><title>기본: 52.9$ (+6%) · 확률 50% — 4Q 가이던스대로 Vector가 분기 <span class="up">+20%</span> 안팎을 이어 가다 2027년 중반부터 둔화한다. 매출 약 $3.08B(다음 4개 분기 컨센서스), 조정 EBITDA 약 $1.40B(마진 약 45%)</title></rect><text x="440.3" y="48">52.9 (+6%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 77.6$ (+55%) · 확률 25% — 런타임 신호와 Spark로 광고주가 계속 늘어 Vector가 분기 <span class="up">+25%</span>를 이어 간다. 매출 약 $3.4B, 조정 EBITDA 약 $1.65B(마진 약 48%)</title></rect><text x="587.6" y="74">77.6 (+55%) · 확률 25%</text><line x1="419.8" x2="419.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="423.8" y="100">현재 50.2</text><text x="120" y="114" style="fill:#5d6470">확률 가중 54.1 (+8%)</text><line x1="430.7" x2="430.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 52.0 (+4%)</text></g></svg>