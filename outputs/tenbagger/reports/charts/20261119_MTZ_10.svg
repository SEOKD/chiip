<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="205.7" height="16" rx="3" fill="#5d6470"><title>약세: 116$ (-33%) · 확률 30% — 파이프라인 인허가 지연이 2027년 상반기까지 이어지고 통신 이익률이 7% 아래에 머문다. 매출 $20B대, EPS $10.5 — 컨센서스 범위 하단</title></rect><text x="329.7" y="22">116 (-33%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="323.9" height="16" rx="3" fill="#5d6470"><title>기본: 183$ (+5%) · 확률 43% — 컨센서스 FY2027 EPS $12.4·매출 $21.6~22.0B. 잔고 소진과 전력 송배전 이익률 유지, 파이프라인 이연분 일부 회수</title></rect><text x="447.9" y="48">183 (+5%) · 확률 43%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 262$ (+50%) · 확률 27% — 전력 송배전·대형 부하 턴키 수주가 이어지고 파이프라인이 과거 최대 EBITDA($634M)에 다가가 매출 $23B 이상, EPS $14.2 — 컨센서스 범위 상단</title></rect><text x="587.6" y="74">262 (+50%) · 확률 27%</text><line x1="429.1" x2="429.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="433.1" y="100">현재 175</text><text x="120" y="114" style="fill:#5d6470">확률 가중 185 (+6%)</text><line x1="408.1" x2="408.1" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 163 (-7%)</text></g></svg>