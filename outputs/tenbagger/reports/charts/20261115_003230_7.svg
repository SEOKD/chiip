<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="204.4" height="16" rx="3" fill="#5d6470"><title>약세: 689,724₩ (-43%) · 확률 30% — 자싱 램프가 2027년 하반기로 밀리고, 비는 한국 캐파를 채울 미국·유럽 수요가 늦다. 원화 강세로 GPM이 45% 아래</title></rect><text x="328.4" y="22">689,724 (-43%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="325.5" height="16" rx="3" fill="#5d6470"><title>기본: 1,098,450₩ (-9%) · 확률 40% — FY2027 매출 약 ₩3.77T·영업이익 약 ₩873B(컨센서스). 자싱은 3분기 안에 램프하고 이관분이 먼저 찬다</title></rect><text x="449.5" y="48">1,098,450 (-9%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 1,564,652₩ (+29%) · 확률 30% — 자싱이 특근 포함 캐파까지 돌고(채널 전언 최대 14억 개), 한국 물량이 미국·유럽 고단가 지역으로 재배치돼 OPM이 25%를 유지한다</title></rect><text x="587.6" y="74">1,564,652 (+29%) · 확률 30%</text><line x1="478.5" x2="478.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="482.5" y="100">현재 1,210,000</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1,115,693 (-8%)</text><line x1="485.0" x2="485.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1,231,908 (+2%)</text></g></svg>