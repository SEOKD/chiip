<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 818" width="340" height="818"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="706" width="338" height="104" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="580" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="451" width="338" height="121" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="322" width="338" height="121" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="179" width="338" height="135" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="169" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">데이터센터·네트워킹 PCB(N+M 포함)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="106.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 41%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">AI 가속기 서버와 스위치에 들어가는 저손실 고다층</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">보드다. N+M은 층수가 다른 두 판을 맞붙여 신호와</text><text x="12" y="91" style="fill:#1a1d23;font-size:12px">전력 경로를 나눈다</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">쓰는 곳 · AI 칩 회사·대형 클라우드·네트워크 장비</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">사</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">수익 · 3Q $498.0M, +115%. 프로그램 단위로 팔고</text><text x="12" y="159" style="fill:#5d6470;font-size:12px">소재 인상분을 전가한다</text><text x="12" y="197" style="fill:#1a1d23;font-size:13px;font-weight:700">A&amp;D PCB·RF 부품·모듈</text><text x="328" y="197" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="203" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="203" width="86.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="211" text-anchor="end" style="font-size:11.5px">매출 34%</text><text x="12" y="234" style="fill:#1a1d23;font-size:12px">국방용 보드, 고주파 부품, 빔포밍 네트워크, 다중</text><text x="12" y="251" style="fill:#1a1d23;font-size:12px">칩 모듈이다</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">쓰는 곳 · 레이더, 미사일, 위성, 전자전</text><text x="12" y="285" style="fill:#5d6470;font-size:12px">수익 · A&amp;D 매출의 약 절반. 3Q A&amp;D 합계 $404.5M,</text><text x="12" y="302" style="fill:#5d6470;font-size:12px">장기 프로그램</text><text x="12" y="340" style="fill:#1a1d23;font-size:13px;font-weight:700">임무 시스템</text><text x="328" y="340" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="363" style="fill:#1a1d23;font-size:12px">해상 감시 레이더 APS-143·APS-153, IFF, MOSAIC</text><text x="12" y="380" style="fill:#1a1d23;font-size:12px">소형 레이더, 항공기 통신 체계다</text><text x="12" y="397" style="fill:#5d6470;font-size:12px">쓰는 곳 · 미군과 동맹국</text><text x="12" y="414" style="fill:#5d6470;font-size:12px">수익 · 설계부터 맡는 장기 계약. 잔여 이행의무 $4</text><text x="12" y="431" style="fill:#5d6470;font-size:12px">63.5M</text><text x="12" y="469" style="fill:#1a1d23;font-size:13px;font-weight:700">Epiq 소프트웨어 무선</text><text x="328" y="469" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><text x="12" y="492" style="fill:#1a1d23;font-size:12px">신호 정보·전자전용 소프트웨어 정의 무선과 내방사</text><text x="12" y="509" style="fill:#1a1d23;font-size:12px">선 우주 컴퓨팅이다</text><text x="12" y="526" style="fill:#5d6470;font-size:12px">쓰는 곳 · 신호 정보, 전자전, 우주</text><text x="12" y="543" style="fill:#5d6470;font-size:12px">수익 · 9/30 인수. 2027 시너지 반영 EBITDA의 17.</text><text x="12" y="560" style="fill:#5d6470;font-size:12px">4배에 샀고 매출은 미공시다</text><text x="12" y="598" style="fill:#1a1d23;font-size:13px;font-weight:700">일반 PCB</text><text x="328" y="598" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="604" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="604" width="64.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="612" text-anchor="end" style="font-size:11.5px">매출 25%</text><text x="12" y="635" style="fill:#1a1d23;font-size:12px">의료·산업·계측·자동차용 보드다</text><text x="12" y="652" style="fill:#5d6470;font-size:12px">쓰는 곳 · AI 칩 테스트 장비, 의료기기, 자동차</text><text x="12" y="669" style="fill:#5d6470;font-size:12px">수익 · 3Q 의료·산업·계측 $213.3M(+97%), 자동차</text><text x="12" y="686" style="fill:#5d6470;font-size:12px">$88.0M(+11%)</text><text x="12" y="724" style="fill:#1a1d23;font-size:13px;font-weight:700">Ophir 적외선·레이저 광학(인수 예정)</text><text x="328" y="724" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="747" style="fill:#1a1d23;font-size:12px">열화상 렌즈와 레이저 광학 부품이다</text><text x="12" y="764" style="fill:#5d6470;font-size:12px">쓰는 곳 · 무인기·대무인기 탐지, 산업용 레이저</text><text x="12" y="781" style="fill:#5d6470;font-size:12px">수익 · $650M, 2027 EBITDA 약 10배. 2027년 2분</text><text x="12" y="798" style="fill:#5d6470;font-size:12px">기 종결 예정</text></g></svg>