<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="213.1" height="16" rx="3" fill="#d0452f"><title>약세: 49.5$ (-52%) · 확률 25% — 하이퍼스케일러가 2027년 AI 투자를 늦추고 메모리 가격 탓 기기 약세가 이어져 유리 혁신이 감소, 태양광 적자 지속. 다음 4개 분기 코어 EPS가 FY27 추정 하단 $3.70 아래 $3.60</title></rect><text x="337.1" y="22">49.5 (-52%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="325.9" height="16" rx="3" fill="#2a5bd7"><title>기본: 75.6$ (-27%) · 확률 50% — 광통신 +30%대·Enterprise 런레이트 확대, 유리 혁신 보합, 태양광 2027년 손익분기 근처. 다음 4개 분기 코어 EPS 컨센서스 $4.13과 같은 높이</title></rect><text x="449.9" y="48">75.6 (-27%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 108$ (+4%) · 확률 25% — 4Q 가이던스 상단을 넘고 Verizon·AT&amp;T 계약 출하가 2027년 상반기에 붙으며 태양광이 흑자 전환. FY27 추정 상단 $4.85 쪽</title></rect><text x="587.6" y="74">108 (+4%) · 확률 25%</text><line x1="565.7" x2="565.7" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="569.7" y="100">현재 103</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 77.1 (-25%)</text><line x1="469.1" x2="469.1" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 81.0 (-22%)</text></g></svg>