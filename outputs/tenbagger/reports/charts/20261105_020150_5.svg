<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="132.0" height="16" rx="3" fill="#d0452f"><title>약세: 18,738₩ (-46%) · 확률 35% — 6공장 가동 초기 고정비와 HVLP 3·4급 수율 부진으로 2027년 상반기까지 분기 영업적자가 이어지고 가공비 인상은 동결된다. 다음 4개 분기 EBITDA ₩60B(영업이익 약 −₩30B + 감가상각 약 ₩90B)</title></rect><text x="256.0" y="22">18,738 (-46%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="253.4" height="16" rx="3" fill="#2a5bd7"><title>기본: 35,957₩ (+3%) · 확률 45% — 4Q26 판매량 증가, 1Q27 분기 손익분기 근처, 2027 영업이익이 컨센서스 ₩30.8B 근처. 다음 4개 분기 EBITDA ₩88B</title></rect><text x="377.4" y="48">35,957 (+3%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 65,791₩ (+89%) · 확률 20% — 전지박 가공비 인상과 HVLP 3·4급 수율 개선이 겹쳐 2027 영업이익이 키움 추정 ₩36.2B를 넘고 회로박 판매가 2배를 넘는다. 다음 4개 분기 EBITDA ₩130B</title></rect><text x="587.6" y="74">65,791 (+89%) · 확률 20%</text><line x1="365.6" x2="365.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="369.6" y="100">현재 34,850</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 35,897 (+3%)</text><line x1="389.7" x2="389.7" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 38,267 (+10%)</text></g></svg>