<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="172.2" height="16" rx="3" fill="#5d6470"><title>약세: 54.9$ (-21%) · 확률 35% — 에너지 매출총이익률이 2027년에도 8% 안팎에 머물고 4Q·1Q 재생 수주가 회사 기대의 절반에 그친다. 선거 뒤 가스 발전·데이터센터 일정이 밀린다</title></rect><text x="296.2" y="22">54.9 (-21%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="317.9" height="16" rx="3" fill="#5d6470"><title>기본: 101$ (+46%) · 확률 40% — 에너지 GM이 2027년 하반기에 10%대로 돌아오고 가스 발전 $1B·PayneCrest $500M이 나온다. 다음 4개 분기(4Q27~3Q28) EPS는 컨센서스 하단 $5.42 수준</title></rect><text x="441.9" y="48">101 (+46%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 148$ (+113%) · 확률 25% — 4Q·1Q 수주가 회사 말대로 들어오고 송배전 마진 13%가 유지되며 재생이 다시 성장한다. 다음 4개 분기 EPS가 컨센서스 상단 $6.12를 넘는다</title></rect><text x="587.6" y="74">148 (+113%) · 확률 25%</text><line x1="337.5" x2="337.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="341.5" y="100">현재 69.3</text><text x="120" y="114" style="fill:#5d6470">확률 가중 96.6 (+39%)</text><line x1="389.9" x2="389.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 86.0 (+24%)</text></g></svg>