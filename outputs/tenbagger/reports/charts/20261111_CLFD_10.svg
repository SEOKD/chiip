<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="340" height="380"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="254" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="128" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">FieldSmart 광섬유 관리(패널·캐비닛·FDH)</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="153.6" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 60%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">광섬유를 나누고 접속·보호하는 캐비닛·패널·월박스</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · 지역 통신사·케이블TV의 가정용 광통신망</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">(FTTH) 구축</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">수익 · 프로젝트별 주문(출하 때 매출 인식)</text><text x="12" y="146" style="fill:#5d6470;font-size:13px;font-weight:700">광섬유 조립품(드롭 케이블·패치코드)</text><text x="328" y="146" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="152" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="152" width="89.6" height="8" rx="4" fill="#5d6470"/><text x="328" y="160" text-anchor="end" style="font-size:11.5px">매출 35%</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">공장에서 커넥터를 미리 단 광섬유 케이블</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">쓰는 곳 · 가입자 인입·장비 연결 — 현장 접속 작업</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">을 줄인다</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">수익 · 주문 단위 판매</text><text x="12" y="272" style="fill:#5d6470;font-size:13px;font-weight:700">데이터센터 고밀도 광섬유 관리(Nova)</text><text x="328" y="272" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="278" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="278" width="12.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="286" text-anchor="end" style="font-size:11.5px">매출 5%</text><text x="12" y="309" style="fill:#5d6470;font-size:12px">데이터센터 안 고밀도 광섬유 패널·카세트</text><text x="12" y="326" style="fill:#5d6470;font-size:12px">쓰는 곳 · 하이퍼스케일 캠퍼스의 서버·스위치 간 광</text><text x="12" y="343" style="fill:#5d6470;font-size:12px">연결</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">수익 · 건물 단위 대형 주문(첫 주문 $22M)</text></g></svg>