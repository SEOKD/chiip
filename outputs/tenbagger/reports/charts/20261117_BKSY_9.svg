<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="100.2" height="16" rx="3" fill="#5d6470"><title>약세: 9.40$ (-59%) · 확률 35% — 소버린 인도가 늦고 2027 세출에서 상업 영상 구매가 늘지 않는다. 서비스 매출 성장이 <tspan style="fill:#5d6470;font-weight:600">+15%</tspan>대로 둔화하고 위성 추가 비용으로 이익률이 20% 아래. 다음 4개 분기 EBITDA $30M</title></rect><text x="224.2" y="22">9.40 (-59%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="229.3" height="16" rx="3" fill="#5d6470"><title>기본: 21.5$ (-7%) · 확률 35% — FY27 매출 $190M(컨센서스, <tspan style="fill:#5d6470;font-weight:600">+31%</tspan>), 조정 EBITDA 이익률 25% 안팎. 소버린 위성 2~3기 인도, 컨소시엄은 개발 단계. 다음 4개 분기 EBITDA $50M</title></rect><text x="353.3" y="48">21.5 (-7%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 43.5$ (+88%) · 확률 30% — Gen-3 8기 체제로 Assured 구독이 늘고 컨소시엄 본계약이 2027년 상반기에 체결된다. 이익률 35%. 다음 4개 분기 EBITDA $80M(FY28 컨센서스 상단 쪽)</title></rect><text x="587.6" y="74">43.5 (+88%) · 확률 30%</text><line x1="366.9" x2="366.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="370.9" y="100">현재 23.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 23.9 (+3%)</text><line x1="365.3" x2="365.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 23.0 (-1%)</text></g></svg>