<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 695" width="340" height="695"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="549" width="338" height="138" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="406" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="277" width="338" height="121" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="148" width="338" height="121" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="138" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">가스·유체 공급 시스템</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><text x="12" y="43" style="fill:#5d6470;font-size:12px">장비 안에서 공정 가스와 화학액을 정밀하게 보내는</text><text x="12" y="60" style="fill:#5d6470;font-size:12px">모듈이다. 밸브·레귤레이터·유량 제어기를 초고순도</text><text x="12" y="77" style="fill:#5d6470;font-size:12px">용접 배관으로 잇는다.</text><text x="12" y="94" style="fill:#5d6470;font-size:12px">쓰는 곳 · 식각·증착 장비</text><text x="12" y="111" style="fill:#5d6470;font-size:12px">수익 · 장비사 주문을 받아 조달·조립·시험까지 맡는</text><text x="12" y="128" style="fill:#5d6470;font-size:12px">다</text><text x="12" y="166" style="fill:#5d6470;font-size:13px;font-weight:700">프레임·용접·공정 모듈·로보틱스</text><text x="328" y="166" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><text x="12" y="189" style="fill:#5d6470;font-size:12px">장비의 뼈대, 고순도 용접물, 웨이퍼 이송 장치와 메</text><text x="12" y="206" style="fill:#5d6470;font-size:12px">카트로닉스 조립품이다.</text><text x="12" y="223" style="fill:#5d6470;font-size:12px">쓰는 곳 · 장비사가 외주로 넘기는 상위 조립</text><text x="12" y="240" style="fill:#5d6470;font-size:12px">수익 · 용접·프레임 수직계열화로 원가를 낮춘다. 세</text><text x="12" y="257" style="fill:#5d6470;font-size:12px">부(필리핀) 용접 캐파를 두 배로 늘리는 중이다</text><text x="12" y="295" style="fill:#5d6470;font-size:13px;font-weight:700">부품(Fluid Solutions)</text><text x="328" y="295" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><text x="12" y="318" style="fill:#5d6470;font-size:12px">초청정 밸브·커넥터·피팅·히터 같은 가스 라인 부품</text><text x="12" y="335" style="fill:#5d6470;font-size:12px">이다.</text><text x="12" y="352" style="fill:#5d6470;font-size:12px">쓰는 곳 · 반도체와 석유화학·전력</text><text x="12" y="369" style="fill:#5d6470;font-size:12px">수익 · 모듈보다 이익률이 높은 부품을 안에서 만든</text><text x="12" y="386" style="fill:#5d6470;font-size:12px">다</text><text x="12" y="424" style="fill:#5d6470;font-size:13px;font-weight:700">세정·코팅·오염 분석</text><text x="328" y="424" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="430" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="430" width="26.1" height="8" rx="4" fill="#5d6470"/><text x="328" y="438" text-anchor="end" style="font-size:11.5px">매출 10%</text><text x="12" y="461" style="fill:#5d6470;font-size:12px">쓰고 난 장비 챔버 부품을 초고순도로 세정·재코팅하</text><text x="12" y="478" style="fill:#5d6470;font-size:12px">고 미세 오염을 분석한다.</text><text x="12" y="495" style="fill:#5d6470;font-size:12px">쓰는 곳 · 소자사 팹과 장비사</text><text x="12" y="512" style="fill:#5d6470;font-size:12px">수익 · 웨이퍼 투입량에 연동된다. 3Q 매출 $77.1M,</text><text x="12" y="529" style="fill:#5d6470;font-size:12px">총이익률 28.8%</text><text x="12" y="567" style="fill:#5d6470;font-size:13px;font-weight:700">NPX·build-to-spec</text><text x="328" y="567" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">기술</text><text x="12" y="590" style="fill:#5d6470;font-size:12px">고객 설계대로 만드는 단계에서 설계 단계로 들어가</text><text x="12" y="607" style="fill:#5d6470;font-size:12px">는 전환이다. NPX는 신제품 개발·도입·이관을 합친</text><text x="12" y="624" style="fill:#5d6470;font-size:12px">조직이다.</text><text x="12" y="641" style="fill:#5d6470;font-size:12px">쓰는 곳 · 식각·ALD·PVD·리소그래피·계측</text><text x="12" y="658" style="fill:#5d6470;font-size:12px">수익 · 첫 공급사 자격을 얻으면 양산 때 점유와 이</text><text x="12" y="675" style="fill:#5d6470;font-size:12px">익률이 오른다. 아직 매출로 확인되지 않았다</text></g></svg>