<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="187.3" height="16" rx="3" fill="#5d6470"><title>약세: 89,109₩ (-27%) · 확률 30% — 원화 강세·금속 가격이 이어져 영업이익률이 30% 근처에 머물고, Bloom Energy 수주가 한 분기 끊겨 2027 매출이 +20%에 그친다</title></rect><text x="311.3" y="22">89,109 (-27%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="317.9" height="16" rx="3" fill="#5d6470"><title>기본: 151,216₩ (+23%) · 확률 50% — 4Q에 이연분이 들어와 영업이익률 33~35%로 돌아오고, 2027 매출 ₩893B·영업이익률 37% 컨센서스 경로를 따른다</title></rect><text x="441.9" y="48">151,216 (+23%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 220,523₩ (+80%) · 확률 20% — B/B 1.5배 이상이 이어지고 데이터센터 직접 고객·유럽 수주가 늘어 2027 매출이 ₩935B를 넘고, 원가 전가 조항이 이익률을 38%로 되돌린다</title></rect><text x="587.6" y="74">220,523 (+80%) · 확률 20%</text><line x1="377.8" x2="377.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="381.8" y="100">현재 122,600</text><text x="120" y="114" style="fill:#5d6470">확률 가중 146,445 (+19%)</text><line x1="422.5" x2="422.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 143,872 (+17%)</text></g></svg>