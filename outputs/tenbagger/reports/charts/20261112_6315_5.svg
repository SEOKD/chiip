<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="151.0" height="16" rx="3" fill="#5d6470"><title>약세: 1,940¥ (-16%) · 확률 30% — HBM 발주가 2023년처럼 한 번 튀고 꺾여 3Q·4Q 수주가 분기 ¥15~20B로 돌아가고, FY3/28 상반기 매출이 ¥30B 안팎으로 내려간다. 구매 부품 지연으로 하반기 매출 일부가 밀리고 영업이익률은 14~16%. 다음 4개 분기 EPS ¥95</title></rect><text x="275.0" y="22">1,940 (-16%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="304.1" height="16" rx="3" fill="#5d6470"><title>기본: 3,908¥ (+69%) · 확률 50% — 하반기 가이던스(매출 ¥37.3B·영업이익률 20%)를 지키고 FY3/28 매출이 사장 감 ¥80B 근처, 영업이익률 19~20%. 다음 4개 분기 EPS ¥143.5(12개월 선행 컨센서스)</title></rect><text x="428.1" y="48">3,908 (+69%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 5,957¥ (+157%) · 확률 20% — 다른 HBM 고객·미국 공장 발주가 더해져 분기 수주 ¥30B가 이어지고 FY3/28 매출 ¥90B·영업이익률 21%. 다음 4개 분기 EPS ¥175</title></rect><text x="587.6" y="74">5,957 (+157%) · 확률 20%</text><line x1="300.3" x2="300.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="304.3" y="100">현재 2,317</text><text x="120" y="114" style="fill:#5d6470">확률 가중 3,727 (+61%)</text><line x1="380.4" x2="380.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 3,346 (+44%)</text></g></svg>