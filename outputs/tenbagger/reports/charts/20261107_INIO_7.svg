<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="202.7" height="16" rx="3" fill="#d0452f"><title>약세: 15.0$ (+9%) · 확률 30% — 수주가 꺾이고 데이터센터 반발로 추정이 내려간다. 다음 4개 분기 EBITDA 컨센서스 $1.11B보다 약 12% 낮다</title></rect><text x="326.7" y="22">15.0 (+9%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="320.9" height="16" rx="3" fill="#2a5bd7"><title>기본: 23.7$ (+72%) · 확률 45% — 다음 4개 분기 EBITDA 컨센서스 $1.11B대로 간다. 애널리스트 2명 값이다</title></rect><text x="444.9" y="48">23.7 (+72%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 34.2$ (+149%) · 확률 25% — 3Q처럼 추정을 넘고 장비 마진 18%대, 슬롯이 주문으로 바뀐다</title></rect><text x="587.6" y="74">34.2 (+149%) · 확률 25%</text><line x1="306.5" x2="306.5" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="310.5" y="100">현재 13.8</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 23.7 (+72%)</text><line x1="386.8" x2="386.8" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 19.7 (+43%)</text></g></svg>