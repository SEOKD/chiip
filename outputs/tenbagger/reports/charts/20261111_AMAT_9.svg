<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 400" width="340" height="400"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="305" width="338" height="87" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="145" width="338" height="152" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">반도체 장비(Semiconductor Systems)</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="197.6" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 77%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">증착·식각·CMP·에피·열처리·이온 주입·e-beam 계측</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">장비</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 파운드리·로직(67%)·D램(26%)·낸드(7%)</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">팹의 전공정과 첨단 패키징</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 장비 판매 — 출하·설치 때 매출 인식</text><text x="12" y="163" style="fill:#5d6470;font-size:13px;font-weight:700">AGS(서비스·부품·업그레이드)</text><text x="328" y="163" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="169" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="169" width="49.9" height="8" rx="4" fill="#5d6470"/><text x="328" y="177" text-anchor="end" style="font-size:11.5px">매출 20%</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">예비 부품·업그레이드·장비 유지보수 구독·AIx 공정</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">제어</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · 고객 팹 가동률·수율 유지(설치 기반 대</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">상)</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">수익 · 부품 판매 + 구독 계약(평균 2.5년 이상, 보</text><text x="12" y="285" style="fill:#5d6470;font-size:12px">도 경유)</text><text x="12" y="323" style="fill:#5d6470;font-size:13px;font-weight:700">디스플레이·기타</text><text x="328" y="323" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><text x="12" y="346" style="fill:#5d6470;font-size:12px">대형 디스플레이 증착·검사 장비 외</text><text x="12" y="363" style="fill:#5d6470;font-size:12px">쓰는 곳 · OLED·LCD 패널 공장</text><text x="12" y="380" style="fill:#5d6470;font-size:12px">수익 · 장비 판매</text></g></svg>