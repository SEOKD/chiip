<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="190.3" height="16" rx="3" fill="#d0452f"><title>약세: 107,228₩ (-43%) · 확률 30% — 2027 상반기 DRAM·낸드 계약가가 꺾이고 모바일·PC 수요 조정이 겹쳐 다음 4개 분기 EPS가 분기 ₩13,000 수준(3Q ₩11,462와 4Q 추정 ₩16,033 사이)에 머문다. 배수는 동종 하단으로</title></rect><text x="314.3" y="22">107,228 (-43%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="313.0" height="16" rx="3" fill="#2a5bd7"><title>기본: 176,326₩ (-7%) · 확률 50% — 4Q26 EPS 컨센서스 ₩16,033이 1년 이어진다 — HBM 완판과 LTA가 물량을 받치고 가격은 보합</title></rect><text x="437.0" y="48">176,326 (-7%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 261,195₩ (+38%) · 확률 20% — 2027 HBM 단가 상승과 서버 DRAM 부족이 이어져 2027 EPS 증권사 추정(₩77,370~78,942) 경로를 탄다</title></rect><text x="587.6" y="74">261,195 (+38%) · 확률 20%</text><line x1="455.0" x2="455.0" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="459.0" y="100">현재 188,700</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 172,570 (-9%)</text><line x1="473.0" x2="473.0" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 198,859 (+5%)</text></g></svg>