<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="132.5" height="16" rx="3" fill="#5d6470"><title>약세: 36.2$ (-46%) · 확률 35% — 중국 OSAT 증설이 FY27 하반기에 멈추고 2023년처럼 분기 매출이 $250M 안팎으로 내려간다. TCB는 목표 하단에도 못 미친다. 12개월 뒤 다음 4개 분기 조정 EPS가 FY28 컨센서스 하단($2.10)과 평균($4.50) 사이</title></rect><text x="256.5" y="22">36.2 (-46%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="264.9" height="16" rx="3" fill="#5d6470"><title>기본: 72.5$ (+8%) · 확률 30% — 컨센서스 경로 — FY28 매출 $1.35B(<tspan style="fill:#5d6470;font-weight:600">−9%</tspan>), 조정 EBIT 이익률 21%. 12개월 뒤 다음 4개 분기 = FY28 조정 EPS $4.50</title></rect><text x="388.9" y="48">72.5 (+8%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 127$ (+89%) · 확률 35% — 와이어 본더 수요가 FY28 상반기까지 이어지고 TCB·패널이 연 $200M을 넘는다. EPS가 FY27 수준($5.75)을 넘어 FY28 상단($7.20) 쪽으로</title></rect><text x="587.6" y="74">127 (+89%) · 확률 35%</text><line x1="364.8" x2="364.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="368.8" y="100">현재 67.0</text><text x="120" y="114" style="fill:#5d6470">확률 가중 78.8 (+18%)</text><line x1="364.8" x2="364.8" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 67.0 (+0%)</text></g></svg>