<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="171.2" height="16" rx="3" fill="#5d6470"><title>약세: 15.5$ (-25%) · 확률 35% — 선거 뒤 주 단위 규제로 2027년 데이터센터 착공이 밀리고 하이퍼스케일러 직접 주문이 오지 않는다. 대형사 증설로 가격이 내려 이익률이 22%대에 머문다. 다음 4개 분기(2Q FY28~1Q FY29) EPS가 FY28 컨센서스 하단 아래 $1.6</title></rect><text x="295.2" y="22">15.5 (-25%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="302.5" height="16" rx="3" fill="#5d6470"><title>기본: 27.3$ (+33%) · 확률 20% — FY28 매출 $3.9B(컨센서스, <tspan style="fill:#5d6470;font-weight:600">+53%</tspan>), 조정 EBITDA 이익률 25% 안팎. 하이퍼스케일러 직접 주문은 작은 첫 주문 수준. 다음 4개 분기 EPS 컨센서스 $2.12 수준</title></rect><text x="426.5" y="48">27.3 (+33%) · 확률 20%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 41.9$ (+104%) · 확률 45% — 하이퍼스케일러 2곳이 FY27 하반기에 주문을 내고 파워트레인 모듈 비중이 30%를 넘는다. 공급 부족이 2028년까지 이어져 이익률 26% 이상. EPS가 컨센서스 상단 위 $2.6</title></rect><text x="587.6" y="74">41.9 (+104%) · 확률 45%</text><line x1="347.8" x2="347.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="351.8" y="100">현재 20.6</text><text x="120" y="114" style="fill:#5d6470">확률 가중 29.7 (+44%)</text><line x1="419.0" x2="419.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 27.0 (+31%)</text></g></svg>