<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="195.2" height="16" rx="3" fill="#5d6470"><title>약세: 13.6$ (-55%) · 확률 30% — BEAD 집행이 더 늦어 광대역이 FY26 수준에 머물고 데이터센터는 첫 주문 $22M에서 끝난다. 매출 약 $175M, 총이익률 30%대 초반이 이어져 영업손실 — FY27 EBITDA 약 $3M(감가상각 약 $6.5M 포함)</title></rect><text x="319.2" y="22">13.6 (-55%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="286.3" height="16" rx="3" fill="#5d6470"><title>기본: 19.9$ (-34%) · 확률 50% — 회사 가이던스 중간 — 매출 $200M, EPS $0.355(대부분 이자 수익), 영업이익 약 $0.7M에 감가상각을 더해 FY27 EBITDA 약 $7M. 다음 4개 분기 EBITDA 추정 $7.2M과 같은 수준</title></rect><text x="410.3" y="48">19.9 (-34%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 32.3$ (+7%) · 확률 20% — 데이터센터 같은 캠퍼스 다음 건물 주문이 FY27 안에 들어오고 총이익률이 33%로 돌아온다. 매출 $205M 이상, FY27 EBITDA 약 $13M(실적 전 컨센서스 $12M 수준)</title></rect><text x="587.6" y="74">32.3 (+7%) · 확률 20%</text><line x1="553.2" x2="553.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="557.2" y="100">현재 30.2</text><text x="120" y="114" style="fill:#5d6470">확률 가중 20.5 (-32%)</text><line x1="478.7" x2="478.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 25.0 (-17%)</text></g></svg>