<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="128.0" height="16" rx="3" fill="#d0452f"><title>약세: 7.51$ (+5%) · 확률 30% — XTO 2개 함대가 비어 프랙 EBITDA가 약 15% 줄고(13개 중 2개) 1Q27 재계약 가격이 동결된다. 재가동 비용이 2027 상반기까지 남고 데이터센터 계약이 없어 PROPWR는 기존 계약 MW만 쌓는다. TTM 조정 EBITDA $192M보다 낮은 높이</title></rect><text x="252.0" y="22">7.51 (+5%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="287.6" height="16" rx="3" fill="#2a5bd7"><title>기본: 16.9$ (+135%) · 확률 50% — 13개 함대를 유지하고 재계약 가격이 소폭 오른다. PROPWR가 연말 250~275MW에서 Targa 배치로 계단식으로 늘어난다. 다음 4개 분기 EBITDA 컨센서스 $263M과 같은 높이</title></rect><text x="411.6" y="48">16.9 (+135%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 27.2$ (+279%) · 확률 20% — 데이터센터 1건이 2027 상반기에 서명되고 전동 함대 리스 매입으로 분기 리스료(약 $16M)가 줄며 재계약 가격이 두 자릿수 오른다</title></rect><text x="587.6" y="74">27.2 (+279%) · 확률 20%</text><line x1="242.4" x2="242.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="246.4" y="100">현재 7.18</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 16.1 (+125%)</text><line x1="368.9" x2="368.9" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 14.6 (+103%)</text></g></svg>