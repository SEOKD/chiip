<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="205.1" height="16" rx="3" fill="#5d6470"><title>약세: 11.3$ (-48%) · 확률 30% — 고교 채널 부족분이 FY27 재학생에 이월되고 숙련 기술 믹스로 학생당 매출이 계속 줄어든다. 성장 투자를 줄이지 못해 FY27 조정 EBITDA가 FY26($101.5M)보다 낮다</title></rect><text x="329.1" y="22">11.3 (-48%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="323.3" height="16" rx="3" fill="#5d6470"><title>기본: 17.9$ (-19%) · 확률 50% — 신규 등록이 높은 한 자릿수로 늘고 FY26 개교 캠퍼스가 차며 FY27 조정 EBITDA $113M(+11%). 컨센서스($113~116M) 안이다</title></rect><text x="447.3" y="48">17.9 (-19%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 25.6$ (+17%) · 확률 20% — 현장 영업 증원으로 고교 채널이 회복하고 운영 모델 통합 효과가 나와 FY27 조정 EBITDA $130M. FY29 $220M 경로 위에 다시 선다</title></rect><text x="587.6" y="74">25.6 (+17%) · 확률 20%</text><line x1="517.4" x2="517.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="521.4" y="100">현재 21.9</text><text x="120" y="114" style="fill:#5d6470">확률 가중 17.5 (-20%)</text><line x1="462.2" x2="462.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 18.9 (-14%)</text></g></svg>