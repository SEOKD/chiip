<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="125.2" height="16" rx="3" fill="#d0452f"><title>약세: 80,785₩ (-32%) · 확률 30% — 메모리 기판 값이 꺾이고 증설 감가상각이 먼저 잡혀 EPS가 최근 4개 분기 3,556원 수준에 머문다</title></rect><text x="249.2" y="22">80,785 (-32%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="296.7" height="16" rx="3" fill="#2a5bd7"><title>기본: 191,491₩ (+60%) · 확률 50% — FY2027 영업이익 ₩412~429B 범위. 10/22 투자의 감가상각을 반영해 iM EPS 6,530원보다 조금 낮췄다</title></rect><text x="420.7" y="48">191,491 (+60%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 299,205₩ (+151%) · 확률 20% — LTA로 물량과 값이 고정되고 FC-BGA 증설분이 2027년 2분기부터 차며 OPM이 23%를 넘는다</title></rect><text x="587.6" y="74">299,205 (+151%) · 확률 20%</text><line x1="305.0" x2="305.0" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="309.0" y="100">현재 119,400</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 179,822 (+51%)</text><line x1="369.8" x2="369.8" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 161,215 (+35%)</text></g></svg>