<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="149.5" height="16" rx="3" fill="#5d6470"><title>약세: 802¥ (-61%) · 확률 20% — 대형 안건이 끝나고 후속이 없으며 외부 조달 원가와 미국 비중 상승으로 FY3/28 영업이익이 ¥250B(<tspan style="fill:#5d6470;font-weight:600">−42%</tspan>)로 내려간다</title></rect><text x="273.5" y="22">802 (-61%) · 확률 20%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="284.2" height="16" rx="3" fill="#5d6470"><title>기본: 1,525¥ (-27%) · 확률 60% — FY3/28 매출 ¥1,700B(<tspan style="fill:#5d6470;font-weight:600">−4%</tspan>)·영업이익 ¥355B(<tspan style="fill:#5d6470;font-weight:600">−17%</tspan>) — 대형 안건은 줄지만 하반기 이익률 21.5% 수준과 북미 수요가 유지된다</title></rect><text x="408.2" y="48">1,525 (-27%) · 확률 60%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 2,488¥ (+20%) · 확률 20% — 미국 외 데이터센터에서 후속 대형 안건이 이어지고 가격 인상이 외부 조달 원가를 덮어 FY3/28 영업이익이 ¥460B(<tspan style="fill:#5d6470;font-weight:600">+7%</tspan>)에 닿는다</title></rect><text x="587.6" y="74">2,488 (+20%) · 확률 20%</text><line x1="507.1" x2="507.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="511.1" y="100">현재 2,077</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1,573 (-24%)</text><line x1="433.5" x2="433.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1,682 (-19%)</text></g></svg>