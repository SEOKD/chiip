<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="130.3" height="16" rx="3" fill="#5d6470"><title>약세: 41.1$ (-29%) · 확률 25% — 계약 D 배치가 2027 하반기로 밀리고 서비스 매출이 인수분 이상 늘지 않아 FY27 조정 EBITDA 약 $0.8B</title></rect><text x="254.3" y="22">41.1 (-29%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="268.8" height="16" rx="3" fill="#5d6470"><title>기본: 84.7$ (+47%) · 확률 50% — 회사 문구 &#x27;2027 EBITDA는 2026의 두 배 이상&#x27; 하단, 1Q27 가이던스 중간($240M) × 4 수준</title></rect><text x="392.8" y="48">84.7 (+47%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 146$ (+153%) · 확률 25% — 계약 D가 2027 상반기부터 순조롭게 늘고 200MW 추가분·O&amp;M 계약이 붙어 FY27 약 $1.25B</title></rect><text x="587.6" y="74">146 (+153%) · 확률 25%</text><line x1="303.3" x2="303.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="307.3" y="100">현재 57.8</text><text x="120" y="114" style="fill:#5d6470">확률 가중 89.2 (+54%)</text><line x1="364.3" x2="364.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 77.0 (+33%)</text></g></svg>