<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="223.5" height="16" rx="3" fill="#5d6470"><title>약세: 347$ (-17%) · 확률 35% — 철강 지수가 2027년 상반기까지 계속 올라 가격 반영이 계속 뒤처진다. 인프라 영업이익률 16%대, 농업은 북아프리카 출하가 하반기로 밀린다. FY2026 가이던스 하단($22.75)에도 못 미치는 값이고 애널리스트 최저 추정 $25.09 아래다.</title></rect><text x="347.5" y="22">347 (-17%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="340.4" height="16" rx="3" fill="#5d6470"><title>기본: 528$ (+26%) · 확률 30% — 매출 약 $4.7B(+7~8%), 영업이익률 15%대. 북미 유틸리티가 물량 두 자릿수·가격 약 10%로 늘고 인프라 마진은 2027년 하반기에 회복한다. 컨센서스 두 값($25.2·$26.1)의 사이다.</title></rect><text x="464.4" y="48">528 (+26%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 719$ (+72%) · 확률 35% — 철강 지수가 2027년 초에 멈춰 인프라 영업이익률이 18%를 넘고, 증설 물량이 계획보다 빨리 가동되며, 북아프리카 프로젝트와 북미 농업 회복이 겹친다. 애널리스트 최고 추정 $26.79를 넘는 값이다.</title></rect><text x="587.6" y="74">719 (+72%) · 확률 35%</text><line x1="390.1" x2="390.1" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="394.1" y="100">현재 419</text><text x="120" y="114" style="fill:#5d6470">확률 가중 531 (+27%)</text><line x1="430.2" x2="430.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 481 (+15%)</text></g></svg>