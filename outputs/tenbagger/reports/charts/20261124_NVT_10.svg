<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="224.0" height="16" rx="3" fill="#5d6470"><title>약세: 70.3$ (-37%) · 확률 35% — 선거 뒤 신규 부지 지연으로 2027년 상반기 수주가 비고 잔고가 줄어든다. Maverick 마진이 10%대 중반에 머물고 관세·원가로 매출총이익률이 더 내려간다 — 매출 약 $6.6B(컨센서스 하단)</title></rect><text x="348.0" y="22">70.3 (-37%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="337.2" height="16" rx="3" fill="#5d6470"><title>기본: 106$ (-5%) · 확률 30% — 컨센서스 FY2027 EPS $7.00~7.03, 매출 $7.4B. 잔여 이행 의무가 예정대로 출하되고 블레인 2·굿이어 공장이 2027년 중반 가동, 조정 영업이익률 약 22%</title></rect><text x="461.2" y="48">106 (-5%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 145$ (+30%) · 확률 35% — 인허가를 마친 데이터센터 프로젝트가 계획대로 가고 Maverick이 강한 두 자릿수로 큰다. 전력 + 냉각 묶음 수주가 붙어 매출 약 $8.1B(컨센서스 상단), EPS 추정 상단 $7.71</title></rect><text x="587.6" y="74">145 (+30%) · 확률 35%</text><line x1="476.8" x2="476.8" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="480.8" y="100">현재 112</text><text x="120" y="114" style="fill:#5d6470">확률 가중 107 (-4%)</text><line x1="445.2" x2="445.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 102 (-9%)</text></g></svg>