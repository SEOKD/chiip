<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="2.0" height="16" rx="3" fill="#d0452f"><title>약세: -0.80$ (-112%) · 확률 35% — Barber Lake 잔여 데이터홀과 Black Pearl 2단계가 2~3분기 늦어 4Q27~3Q28 EBITDA가 $600M에 그친다. 12월 ERCOT 분류가 미뤄지고 새 임대가 없다. 비용 초과가 한 번 더 나온다</title></rect><text x="98.8" y="22">-0.80 (-112%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="209.3" height="16" rx="3" fill="#2a5bd7"><title>기본: 6.63$ (+2%) · 확률 45% — 계약 700MW가 2027년 안에 대부분 인도된다. 4Q27~3Q28 EBITDA 컨센서스 $793M에서 일반관리비 증가를 뺀 $750M — 안정화 NOI $864M의 87%</title></rect><text x="333.3" y="48">6.63 (+2%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 14.7$ (+126%) · 확률 20% — 인도가 일정대로 끝나 안정화 NOI $864M에 가까워지고, Colchis 또는 온사이트 발전 1GW 임대가 2027년 상반기에 체결돼 배수가 동종 쪽으로 오른다</title></rect><text x="587.6" y="74">14.7 (+126%) · 확률 20%</text><line x1="325.1" x2="325.1" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="329.1" y="100">현재 6.50</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 5.64 (-13%)</text><line x1="281.0" x2="281.0" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 5.10 (-22%)</text></g></svg>