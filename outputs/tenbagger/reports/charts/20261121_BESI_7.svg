<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="157.4" height="16" rx="3" fill="#5d6470"><title>약세: 52.7€ (-63%) · 확률 15% — HBM 하이브리드 본딩이 2028년 이후로 밀리고 중국·OSAT 수주가 꺾여 2027년 매출이 €1.05B(컨센서스 하단)에 머문다</title></rect><text x="281.4" y="22">52.7 (-63%) · 확률 15%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="295.3" height="16" rx="3" fill="#5d6470"><title>기본: 98.9€ (-31%) · 확률 70% — 컨센서스 FY2027 매출 €1.30B·EPS €6.05 — 1H27에 3Q 수주 인도가 몰리고 로직·CPO 하이브리드 본딩이 늘어난다</title></rect><text x="419.3" y="48">98.9 (-31%) · 확률 70%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 155€ (+9%) · 확률 15% — HBM 차세대 사양에 하이브리드 본딩이 들어가고 미국 로직 고객이 증설해 매출 €1.56B(컨센서스 상단)</title></rect><text x="587.6" y="74">155 (+9%) · 확률 15%</text><line x1="546.2" x2="546.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="550.2" y="100">현재 143</text><text x="120" y="114" style="fill:#5d6470">확률 가중 100 (-30%)</text><line x1="439.5" x2="439.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 107 (-25%)</text></g></svg>