<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 608" width="340" height="608"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="465" width="338" height="135" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="322" width="338" height="135" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="162" width="338" height="152" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">상업·데이터센터 엔지니어링·에너지 관리</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="64.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 25%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">데이터센터·대형 상업 고객의 변전소·BESS 설계, 에</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">너지 조달·제어·시설 관리를 한다(APG·Burton·Mant</text><text x="12" y="91" style="fill:#1a1d23;font-size:12px">is)</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 개발사·대형 C&amp;I 고객</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 프로젝트·관리 계약. 2Q 기준 매출 약 4분의</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">1, Mantis로 확대</text><text x="12" y="180" style="fill:#1a1d23;font-size:13px;font-weight:700">유틸리티 에너지 프로그램·전력 계획</text><text x="328" y="180" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="186" width="92.2" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 36%</text><text x="12" y="217" style="fill:#1a1d23;font-size:12px">유틸리티를 대신해 효율·수요 감축 프로그램을 설계·</text><text x="12" y="234" style="fill:#1a1d23;font-size:12px">운영하고 부하 예측·전력 계획을 한다</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">쓰는 곳 · 전력회사·공공 전력기관(LADWP·NYPA·SCE</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">)</text><text x="12" y="285" style="fill:#5d6470;font-size:12px">수익 · 다년 계약, 운영비·성과 기준. 3Q 고객 구성</text><text x="12" y="302" style="fill:#5d6470;font-size:12px">약 3분의 1(추정)</text><text x="12" y="340" style="fill:#1a1d23;font-size:13px;font-weight:700">공공 에너지 설비 개선(학교·도시)</text><text x="328" y="340" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="346" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="346" width="64.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="354" text-anchor="end" style="font-size:11.5px">매출 25%</text><text x="12" y="377" style="fill:#1a1d23;font-size:12px">학교·시청·대학의 HVAC·조명·태양광·중앙 열원 설비</text><text x="12" y="394" style="fill:#1a1d23;font-size:12px">를 턴키로 바꾸고 절감액으로 비용을 맞춘다</text><text x="12" y="411" style="fill:#5d6470;font-size:12px">쓰는 곳 · 주·지방정부, 학군, 대학</text><text x="12" y="428" style="fill:#5d6470;font-size:12px">수익 · 고정가 프로젝트. 3Q 고객 구성 약 3분의 1(</text><text x="12" y="445" style="fill:#5d6470;font-size:12px">추정)</text><text x="12" y="483" style="fill:#1a1d23;font-size:13px;font-weight:700">엔지니어링·컨설팅(지방정부)</text><text x="328" y="483" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="489" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="489" width="35.6" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="497" text-anchor="end" style="font-size:11.5px">매출 14%</text><text x="12" y="520" style="fill:#1a1d23;font-size:12px">도시 토목 설계, 건축 인허가·검사, 건설 관리, 지</text><text x="12" y="537" style="fill:#1a1d23;font-size:12px">방 재정 자문을 맡는다</text><text x="12" y="554" style="fill:#5d6470;font-size:12px">쓰는 곳 · 시·카운티·학군</text><text x="12" y="571" style="fill:#5d6470;font-size:12px">수익 · 시간 단가 계약. 3Q 계약매출 $29.7M(13.9%</text><text x="12" y="588" style="fill:#5d6470;font-size:12px">), 총이익률 56%</text></g></svg>