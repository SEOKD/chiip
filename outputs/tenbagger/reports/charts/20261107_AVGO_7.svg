<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="201.7" height="16" rx="3" fill="#d0452f"><title>약세: 286$ (-3%) · 확률 25% — 부지·전력·기판 병목으로 배치가 늦고 GM이 70% 아래로 내려간다. 다음 4개 분기 EPS 컨센서스 $17.4보다 약 17% 낮다</title></rect><text x="325.7" y="22">286 (-3%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="322.7" height="16" rx="3" fill="#2a5bd7"><title>기본: 457$ (+56%) · 확률 50% — 다음 4개 분기 EPS 컨센서스 $17.4대로 간다. FQ4 가이던스가 첫 분기다</title></rect><text x="446.7" y="48">457 (+56%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 656$ (+124%) · 확률 25% — 공급 확보가 빨라져 FY27 AI $115B를 넘는다(회사는 수요가 이 전망을 넘는다고 했다)</title></rect><text x="587.6" y="74">656 (+124%) · 확률 25%</text><line x1="327.4" x2="327.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="331.4" y="100">현재 294</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 464 (+58%)</text><line x1="446.3" x2="446.3" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 462 (+57%)</text></g></svg>