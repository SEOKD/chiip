<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="93.3" height="16" rx="3" fill="#d0452f"><title>약세: 12.2$ (-80%) · 확률 30% — 대형 AI 가속기 공급사가 2027년 상반기 OSAT 평가 뒤 양산을 미루고, 하이퍼스케일 두 번째 칩 램프가 늦어 FY28 매출이 FY27 수준($150M)에 머문다. 비GAAP 순이익률은 하한 20% 근처</title></rect><text x="217.3" y="22">12.2 (-80%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="195.8" height="16" rx="3" fill="#2a5bd7"><title>기본: 25.7$ (-58%) · 확률 45% — 잔고 출하로 FY27 $150M, 두 번째 Sonoma 칩이 2027년 램프, 대형 고객은 일부 양산. 다음 4개 분기 EPS 컨센서스 $1.26과 같은 높이</title></rect><text x="319.8" y="48">25.7 (-58%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="340.0" height="16" rx="3" fill="#2a5bd7"><title>강세: 44.6$ (-27%) · 확률 25% — 대형 고객이 2027년 1~3월 데이터로 WLBI 양산을 정하고 소모품이 40%대를 지켜 FY28 매출이 $250M 안팎. FY28 EPS 추정 상단 쪽</title></rect><text x="464.0" y="74">44.6 (-27%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 60.8</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 26.4 (-57%)</text><line x1="348.6" x2="348.6" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 30.0 (-51%)</text></g></svg>