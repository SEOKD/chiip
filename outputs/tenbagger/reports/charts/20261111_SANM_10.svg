<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 414" width="340" height="414"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="271" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="145" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">통신·클라우드·AI 인프라 제조(IMS·ZT)</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="157.2" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 61%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">AI 서버 랙·네트워크 장비 조립·시험(ZT의 랙 통합</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">포함)</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 하이퍼스케일러·AI 연구소·통신 장비 회</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">사의 데이터센터</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 조립 단가 + NRE, GPU는 대부분 위탁(순액)</text><text x="12" y="163" style="fill:#5d6470;font-size:13px;font-weight:700">산업·에너지·의료·방위·자동차 제조</text><text x="328" y="163" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="169" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="169" width="98.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="177" text-anchor="end" style="font-size:11.5px">매출 39%</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">산업·에너지·의료·방위·항공·자동차 전자 조립(고혼</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">합·소량)</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · 의료기기·방위 전자·위성·전력 장비 회사</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">수익 · 프로그램별 장기 공급 계약(3~5년)</text><text x="12" y="289" style="fill:#5d6470;font-size:13px;font-weight:700">부품·제품(CPS: PCB·금속 랙·메모리·스토리</text><text x="12" y="306" style="fill:#5d6470;font-size:13px;font-weight:700">지·광 모듈)</text><text x="328" y="289" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="312" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="312" width="53.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="320" text-anchor="end" style="font-size:11.5px">매출 21%</text><text x="12" y="343" style="fill:#5d6470;font-size:12px">고다층 PCB·AI 랙 금속 가공·Viking 스토리지·맞춤</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">메모리·광 모듈</text><text x="12" y="377" style="fill:#5d6470;font-size:12px">쓰는 곳 · 자사 시스템 조립과 외부 고객</text><text x="12" y="394" style="fill:#5d6470;font-size:12px">수익 · 부품 판매(그룹 내부분은 매출 제거)</text></g></svg>