<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="172.5" height="16" rx="3" fill="#5d6470"><title>약세: 122$ (-63%) · 확률 45% — NVIDIA·Lumentum 물량이 줄고 부품이 빠듯해 Building 10이 늦게 찬다. 램프 초기 비용과 바트 강세로 OPM이 10% 아래로 내려온다. 다음 4개 분기 EPS가 컨센서스 하단 $20.4보다 낮은 $19.5</title></rect><text x="296.5" y="22">122 (-63%) · 확률 45%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="267.8" height="16" rx="3" fill="#5d6470"><title>기본: 189$ (-42%) · 확률 35% — Building 10이 FY27 하반기에 차며 매출이 FY28 $7.9B 안팎(컨센서스), 조정 OPM 10.8% 유지. 다음 4개 분기(2Q FY28~1Q FY29) EPS 컨센서스 $22.7 수준</title></rect><text x="391.8" y="48">189 (-42%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="398.2" height="16" rx="3" fill="#5d6470"><title>강세: 282$ (-14%) · 확률 20% — 하이퍼스케일 직거래·머천트·OCS·NPO가 동시에 붙고 Building 11 전에 캐파가 거의 찬다. 믹스 개선으로 GPM이 12.5% 위로. EPS가 컨센서스 상단 $32.0 쪽으로 간다</title></rect><text x="522.2" y="74">282 (-14%) · 확률 20%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 328</text><text x="120" y="114" style="fill:#5d6470">확률 가중 178 (-46%)</text><line x1="425.3" x2="425.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 216 (-34%)</text></g></svg>