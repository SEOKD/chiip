<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 427" width="340" height="427"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="332" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="237" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="128" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">DS(메모리·파운드리·시스템LSI)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="178.2" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 70%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">DRAM·HBM·서버 SSD, 2~4나노 위탁생산, 엑시노스·</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">이미지 센서</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · AI 서버·클라우드·스마트폰·PC</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">수익 · 메모리 판매(LTA), 파운드리 웨이퍼 판매</text><text x="12" y="146" style="fill:#1a1d23;font-size:13px;font-weight:700">DX(모바일·TV·가전)</text><text x="328" y="146" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="152" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="152" width="63.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="160" text-anchor="end" style="font-size:11.5px">매출 25%</text><text x="12" y="183" style="fill:#1a1d23;font-size:12px">갤럭시 스마트폰·폴더블, TV, 가전, 네트워크 장비</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">쓰는 곳 · 소비자·통신사</text><text x="12" y="217" style="fill:#5d6470;fo