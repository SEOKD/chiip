<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 455" width="340" height="455"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="346" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="237" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="111" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">발전 용량 임대</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="68.1" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 27%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">자체 가스 터빈 발전기를 고객 현장에 장기 임대</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터·유전·산업 현장 전력</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수익 · MW당 용량 요금(리스, ASC 842)</text><text x="12" y="129" style="fill:#5d6470;font-size:13px;font-weight:700">전력 서비스(설치·O&amp;M·시공)</text><text x="328" y="129" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="135" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="135" width="106.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="143" text-anchor="end" style="font-size:11.5px">매출 42%</text><text x="12" y="166" style="fill:#5d6470;font-size:12px">발전소 설치·시운전·운영·정비, 부지·기초·가스관 시</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">공</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">쓰는 곳 · 자체·제3자 발전 설비</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">수익 · 용역·공사 대금(ASC 606)</text><text x="12" y="255" style="fill:#5d6470;font-size:13px;font-weight:700">BoP·배전 장비 판매</text><text x="328" y="255" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="261" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="261" width="38.4" height="8" rx="4" fill="#5d6470"/><text x="328" y="269" text-anchor="end" style="font-size:11.5px">매출 15%</text><text x="12" y="292" style="fill:#5d6470;font-size:12px">배전·개폐 장치, 배출 저감 등 주변 설비</text><text x="12" y="309" style="fill:#5d6470;font-size:12px">쓰는 곳 · 고객 소유 발전 설비</text><text x="12" y="326" style="fill:#5d6470;font-size:12px">수익 · 제품 판매</text><text x="12" y="364" style="fill:#5d6470;font-size:13px;font-weight:700">물류 솔루션</text><text x="328" y="364" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="370" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="370" width="42.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="378" text-anchor="end" style="font-size:11.5px">매출 17%</text><text x="12" y="401" style="fill:#5d6470;font-size:12px">프랙 모래 저장·운송 장비와 현장 운송</text><text x="12" y="418" style="fill:#5d6470;font-size:12px">쓰는 곳 · 셰일 유정 완결</text><text x="12" y="435" style="fill:#5d6470;font-size:12px">수익 · 시스템 임대·운송 요금</text></g></svg>