<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="170.2" height="16" rx="3" fill="#d0452f"><title>약세: 30.5$ (-23%) · 확률 30% — 통신이 1H27에도 두 자릿수 감소하고 감가상각이 믹스 효과를 넘는다. EPS는 컨센서스 $2.48보다 약 17% 낮다</title></rect><text x="294.2" y="22">30.5 (-23%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="304.5" height="16" rx="3" fill="#2a5bd7"><title>기본: 54.5$ (+38%) · 확률 45% — 컴퓨팅 +30%, 통신 하반기 회복, GM 19%대. 두 추정 $2.48~$3.03의 가운데다</title></rect><text x="428.5" y="48">54.5 (+38%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 83.0$ (+110%) · 확률 25% — 컴퓨팅 +40%에 통신 재고 회복이 겹치고 GM 20%를 넘는다. 모델 집계 $3.03보다 약 10% 높다</title></rect><text x="587.6" y="74">83.0 (+110%) · 확률 25%</text><line x1="340.6" x2="340.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="344.6" y="100">현재 39.5</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 54.4 (+38%)</text><line x1="399.2" x2="399.2" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 50.0 (+27%)</text></g></svg>