<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="152.6" height="16" rx="3" fill="#d0452f"><title>약세: 29.0$ (-34%) · 확률 30% — 4Q가 가이던스대로 $263~291M로 꺾이고 2027 매출 +10%대. 세정 감소가 이어지고 GM 44%. 중국 WFE 2026 −9.9% 전망이 2027에도 이어진다</title></rect><text x="276.6" y="22">29.0 (-34%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="287.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 54.5$ (+23%) · 확률 45% — 11/5 가이던스 소폭 상향, 2027 매출 약 $1.42B(+23%), GM 46%. 지금 다음 4개 분기 EPS $2.33과 비슷하다</title></rect><text x="411.2" y="48">54.5 (+23%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 88.0$ (+99%) · 확률 25% — 잔고 $2.5B가 빠르게 인수돼 2027 매출 약 $1.6B, SPM·패널 도금 반복 주문, GM 47%. 컨센서스 상단 $1.65B에 가깝다</title></rect><text x="587.6" y="74">88.0 (+99%) · 확률 25%</text><line x1="352.6" x2="352.6" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="356.6" y="100">현재 44.1</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 55.2 (+25%)</text><line x1="399.2" x2="399.2" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 53.0 (+20%)</text></g></svg>