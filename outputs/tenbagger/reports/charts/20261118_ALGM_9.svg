<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="164.3" height="16" rx="3" fill="#5d6470"><title>약세: 10.2$ (-64%) · 확률 35% — 800V 데이터센터 램프가 2027년 하반기로 더 밀리고 자동차 재고 조정이 겹친다. 12개월 뒤 다음 4개 분기(3Q FY28~2Q FY29) EPS가 지금의 다음 4개 분기 추정($1.30) 근처에 머문다</title></rect><text x="288.3" y="22">10.2 (-64%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="305.3" height="16" rx="3" fill="#5d6470"><title>기본: 18.9$ (-33%) · 확률 30% — 컨센서스 경로 — FY28 매출 $1.34B(<tspan style="fill:#5d6470;font-weight:600">+19%</tspan>), 조정 영업이익률 25%. 3Q FY28~2Q FY29 분기 추정 합 $1.81</title></rect><text x="429.3" y="48">18.9 (-33%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 28.8$ (+2%) · 확률 35% — 데이터센터 재가속·자동차 가격 인상·총이익률 55% 도달이 함께 온다. EPS가 FY29 추정 상단($2.65) 쪽으로 간다</title></rect><text x="587.6" y="74">28.8 (+2%) · 확률 35%</text><line x1="575.3" x2="575.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="579.3" y="100">현재 28.2</text><text x="120" y="114" style="fill:#5d6470">확률 가중 19.3 (-32%)</text><line x1="458.7" x2="458.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 21.0 (-26%)</text></g></svg>