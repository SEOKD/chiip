<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="225.1" height="16" rx="3" fill="#5d6470"><title>약세: 94.8$ (-9%) · 확률 30% — RUCKUS 부품 부족이 2027년 상반기까지 이어지고 산업 경기가 식어 매출 $3.75B, 이자비용 부담이 남는다 — 컨센서스 하단</title></rect><text x="349.1" y="22">94.8 (-9%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="337.2" height="16" rx="3" fill="#5d6470"><title>기본: 142$ (+36%) · 확률 40% — 컨센서스 FY2027 EPS $10.0, 매출 $4.0B. 데이터센터 $275M 출하와 RUCKUS 정상화가 하반기에 이뤄진다</title></rect><text x="461.2" y="48">142 (+36%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 195$ (+87%) · 확률 30% — Wi-Fi 7 교체가 2027년에 몰리고 교차 판매가 시작돼 매출 $4.25B, 증분 마진 30% 근처 — 컨센서스 상단</title></rect><text x="587.6" y="74">195 (+87%) · 확률 30%</text><line x1="367.3" x2="367.3" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="371.3" y="100">현재 104</text><text x="120" y="114" style="fill:#5d6470">확률 가중 144 (+38%)</text><line x1="430.9" x2="430.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 131 (+26%)</text></g></svg>