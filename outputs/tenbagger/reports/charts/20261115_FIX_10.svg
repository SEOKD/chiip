<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="201.7" height="16" rx="3" fill="#5d6470"><title>약세: 738$ (-34%) · 확률 30% — AI CAPEX 증가율이 꺾이고 텍사스 인허가가 늦어져 2027 수주가 매출 아래로 떨어진다. 매출총이익률이 22~23%로 내려가 영업이익률이 14% 안팎으로 돌아간다</title></rect><text x="325.7" y="22">738 (-34%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="324.5" height="16" rx="3" fill="#5d6470"><title>기본: 1,187$ (+7%) · 확률 45% — 잔고 $17.81B가 계획대로 전환되고 매출총이익률 24~25%·영업이익률 16%대가 유지된다. 다음 4개 분기(4Q27~3Q28) EPS는 컨센서스 범위 $66.7~72.7의 가운데</title></rect><text x="448.5" y="48">1,187 (+7%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 1,695$ (+52%) · 확률 25% — 모듈러 신규 고객이 프로그램형으로 넘어오고 프로젝트 성숙으로 2027 상반기 이익 조정이 커진다. 영업이익률이 17%를 넘고 EPS가 컨센서스 상단을 넘는다</title></rect><text x="587.6" y="74">1,695 (+52%) · 확률 25%</text><line x1="424.2" x2="424.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="428.2" y="100">현재 1,112</text><text x="120" y="114" style="fill:#5d6470">확률 가중 1,179 (+6%)</text><line x1="410.4" x2="410.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 1,062 (-5%)</text></g></svg>