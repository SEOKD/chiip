<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="150.2" height="16" rx="3" fill="#5d6470"><title>약세: 24.0$ (-18%) · 확률 30% — 선주문이 풀리며 1H27 B/B가 1.0 아래로 내려가고 유통이 재고를 줄인다. 매출 약 $3.9B, 총이익률 24%, 판관비 분기 $157M — EPS 약 $1.35(컨센서스 하단)</title></rect><text x="274.2" y="22">24.0 (-18%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="289.3" height="16" rx="3" fill="#5d6470"><title>기본: 46.2$ (+59%) · 확률 50% — 잔고 $2.2B 소화와 가격 인상이 이어져 매출 약 $4.15B(다음 4개 분기 컨센서스 $4.13B), 총이익률 26~27%, 유효세율 30% — EPS 약 $1.95(컨센서스 $1.98과 같은 수준)</title></rect><text x="413.3" y="48">46.2 (+59%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 74.0$ (+154%) · 확률 20% — AI·산업·방산 수요가 이어지고 가격이 금속 원가를 앞서 총이익률이 28~29%(과거 사이클 고점 근처)로 간다. 매출 약 $4.4B — EPS 약 $2.5</title></rect><text x="587.6" y="74">74.0 (+154%) · 확률 20%</text><line x1="302.4" x2="302.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="306.4" y="100">현재 29.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 45.1 (+55%)</text><line x1="364.2" x2="364.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 39.0 (+34%)</text></g></svg>