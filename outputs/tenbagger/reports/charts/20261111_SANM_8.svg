<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="203.0" height="16" rx="3" fill="#5d6470"><title>약세: 145$ (-6%) · 확률 25% — Helios 고객 인수가 FY28로 밀리고 부품 부족이 이어진다. 클라우드·AI 시스템 매출 약 $6B, 전체 매출 약 $16.5B, 조정 영업이익률 6.5% — EPS 약 $13.5(실적 전 컨센서스 $14.14 아래)</title></rect><text x="327.0" y="22">145 (-6%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="330.8" height="16" rx="3" fill="#5d6470"><title>기본: 237$ (+53%) · 확률 50% — 회사 가이던스 중간 — 매출 $18.5B, 조정 영업이익률 7.25%, 영업외 비용 $140M, 약 55M 주로 EPS $16.50</title></rect><text x="454.8" y="48">237 (+53%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 332$ (+114%) · 확률 25% — 두 번째 플랫폼이 빨리 커지고 세 번째 플랫폼·수직 계열화가 FY27 하반기 숫자로 나온다. 매출 $19.5B 이상, 조정 영업이익률 7.5% — EPS 약 $18.5(가이던스 상단 $17.50 위)</title></rect><text x="587.6" y="74">332 (+114%) · 확률 25%</text><line x1="336.9" x2="336.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="340.9" y="100">현재 155</text><text x="120" y="114" style="fill:#5d6470">확률 가중 238 (+53%)</text><line x1="471.7" x2="471.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 252 (+62%)</text></g></svg>