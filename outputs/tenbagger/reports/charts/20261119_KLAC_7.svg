<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="184.9" height="16" rx="3" fill="#5d6470"><title>약세: 57.6$ (-60%) · 확률 25% — 고객 팹 지연이 2027년 주문 연기로 번지고 메모리 원가가 남는다. 12개월 뒤 다음 4개 분기 조정 EPS가 FY27 수준($6.02)에 머문다</title></rect><text x="308.9" y="22">57.6 (-60%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="307.3" height="16" rx="3" fill="#5d6470"><title>기본: 95.8$ (-34%) · 확률 50% — 컨센서스 경로 — FY28 매출 $23.0B(<tspan style="fill:#5d6470;font-weight:600">+19%</tspan>), GAAP EBIT 이익률 48%. 2Q FY28~1Q FY29 분기 추정 합 약 $7.5(계산)</title></rect><text x="431.3" y="48">95.8 (-34%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="452.0" height="16" rx="3" fill="#5d6470"><title>강세: 141$ (-3%) · 확률 25% — WFE가 2030 모델을 앞당기고 총이익률이 64%로 돌아온다. EPS가 FY29 추정 평균($8.13)을 넘는다</title></rect><text x="576.0" y="74">141 (-3%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 145</text><text x="120" y="114" style="fill:#5d6470">확률 가중 97.6 (-33%)</text><line x1="450.3" x2="450.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 103 (-29%)</text></g></svg>