<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="162.3" height="16" rx="3" fill="#d0452f"><title>약세: 96.0$ (-36%) · 확률 25% — FY26 40mm 발주가 밀리고 정부 LAP 시설 정지가 반복돼 방산 매출 증가가 한 자릿수로 꺾이고, 관세 환급이 끝나 가전이 다시 적자다. 다음 4개 분기 EPS가 FY27 추정 하단 $5.50 근처</title></rect><text x="286.3" y="22">96.0 (-36%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="293.6" height="16" rx="3" fill="#2a5bd7"><title>기본: 174$ (+16%) · 확률 50% — 백로그 출하가 이어져 방산 매출이 +10% 안팎, 방산 매출총이익률 19~20%, 관세 환급 없음. 다음 4개 분기 EPS 컨센서스 $7.62와 같은 높이</title></rect><text x="417.6" y="48">174 (+16%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 274$ (+83%) · 확률 25% — FY26 발주(최대 $448M) 확정과 M918E2 추가 발주로 방산 매출 +20% 이상, 3Q의 믹스·효율이 이어져 방산 이익률이 20%를 넘는다. FY27 추정 상단 $9.82 근처</title></rect><text x="587.6" y="74">274 (+83%) · 확률 25%</text><line x1="372.7" x2="372.7" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="376.7" y="100">현재 150</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 180 (+20%)</text><line x1="393.7" x2="393.7" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 162 (+8%)</text></g></svg>