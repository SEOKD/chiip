<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 431" width="340" height="431"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="271" width="338" height="152" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="145" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">항공 제품(엔진 모듈 교환)</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="238.3" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 93%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">정비해 둔 CFM56·V2500 엔진 모듈과 엔진을 항공사</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">에 팔거나 교환해 준다</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 737NG·A320ceo를 운항하는 항공사·정비</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">회사</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 모듈·엔진 판매가, 다년 교환 계약</text><text x="12" y="163" style="fill:#5d6470;font-size:13px;font-weight:700">항공 리스·전략 자본</text><text x="328" y="163" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="169" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="169" width="17.7" height="8" rx="4" fill="#5d6470"/><text x="328" y="177" text-anchor="end" style="font-size:11.5px">매출 7%</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">항공기·엔진 리스와 SCI 파트너십 운용(수수료·지분</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">수익)</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · 항공사(세일즈리스백 포함)</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">수익 · 리스료·정비 적립금·운용 수수료</text><text x="12" y="289" style="fill:#5d6470;font-size:13px;font-weight:700">FTAI Power Mod-1</text><text x="328" y="289" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="295" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="295" width="3.0" height="8" rx="4" fill="#5d6470"/><text x="328" y="303" text-anchor="end" style="font-size:11.5px">매출 0%</text><text x="12" y="326" style="fill:#5d6470;font-size:12px">CFM56 코어를 발전용으로 바꾼 25MW급 가스터빈(연</text><text x="12" y="343" style="fill:#5d6470;font-size:12px">속 23MW), 천연가스·액체 연료</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 현장 발전(전력망 연결 전·대</text><text x="12" y="377" style="fill:#5d6470;font-size:12px">체)</text><text x="12" y="394" style="fill:#5d6470;font-size:12px">수익 · 대당 판매 + 현장 터빈 교환 정비(2027 인도</text><text x="12" y="411" style="fill:#5d6470;font-size:12px">시작)</text></g></svg>