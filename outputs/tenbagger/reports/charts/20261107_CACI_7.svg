<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="230.8" height="16" rx="3" fill="#d0452f"><title>약세: 515$ (-16%) · 확률 25% — 하반기 성장이 밀리고 이익률이 12%대 중반에 머문다. FY2028 EPS 컨센서스 하단</title></rect><text x="354.8" y="22">515 (-16%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="337.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 753$ (+23%) · 확률 50% — 가이던스가 지켜지고 대드론·ARKA가 쌓인다. FY2028 컨센서스 $39.0~$40.6 사이</title></rect><text x="461.2" y="48">753 (+23%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 1,035$ (+69%) · 확률 25% — Spectral 양산과 대드론 발주가 빨라지고 이익률이 14%에 닿는다. FY2028 추정 상단 $44.5 부근</title></rect><text x="587.6" y="74">1,035 (+69%) · 확률 25%</text><line x1="393.8" x2="393.8" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="397.8" y="100">현재 611</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 764 (+25%)</text><line x1="447.9" x2="447.9" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 732 (+20%)</text></g></svg>