<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 523" width="340" height="523"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="414" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="271" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="128" width="338" height="135" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">Corporate Payments</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="105.7" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 41%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">국경 간 송금·환헤지, 다중통화 계좌, 가상카드·직불</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">카드로 공급업체 대금 지급(AP), 지출관리</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 중견기업·펀드·자산운용사</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">수익 · 결제액·환전 스프레드·카드 가맹점 수수료</text><text x="12" y="146" style="fill:#5d6470;font-size:13px;font-weight:700">Vehicle Payments</text><text x="328" y="146" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="152" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="152" width="107.5" height="8" rx="4" fill="#5d6470"/><text x="328" y="160" text-anchor="end" style="font-size:11.5px">매출 42%</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">연료카드·통행료 태그·정비·차량 등록 결제와 폐쇄형</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">주유 가맹점 네트워크</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">쓰는 곳 · 트럭·플릿 운영사, 브라질 운전자·화주</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">수익 · 가맹점 수수료·카드 이용료·연료 가격 연동</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">수수료</text><text x="12" y="289" style="fill:#5d6470;font-size:13px;font-weight:700">Lodging Payments</text><text x="328" y="289" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="295" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="295" width="24.3" height="8" rx="4" fill="#5d6470"/><text x="328" y="303" text-anchor="end" style="font-size:11.5px">매출 10%</text><text x="12" y="326" style="fill:#5d6470;font-size:12px">현장 근로자·항공 승무원·재난 이재민 숙박 예약과</text><text x="12" y="343" style="fill:#5d6470;font-size:12px">결제</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">쓰는 곳 · 건설·에너지 업체, 항공사, 보험사·정부</text><text x="12" y="377" style="fill:#5d6470;font-size:12px">재난 기관</text><text x="12" y="394" style="fill:#5d6470;font-size:12px">수익 · 객실 박당 수수료</text><text x="12" y="432" style="fill:#5d6470;font-size:13px;font-weight:700">Other</text><text x="328" y="432" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="438" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="438" width="18.4" height="8" rx="4" fill="#5d6470"/><text x="328" y="446" text-anchor="end" style="font-size:11.5px">매출 7%</text><text x="12" y="469" style="fill:#5d6470;font-size:12px">선불 기프트 카드·급여 카드</text><text x="12" y="486" style="fill:#5d6470;font-size:12px">쓰는 곳 · 유통업체·고용주</text><text x="12" y="503" style="fill:#5d6470;font-size:12px">수익 · 카드 발행·거래 수수료</text></g></svg>