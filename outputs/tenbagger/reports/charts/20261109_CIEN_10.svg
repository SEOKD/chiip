<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 523" width="340" height="523"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="414" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="288" width="338" height="118" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="179" width="338" height="101" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="169" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">네트워킹 플랫폼</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="207.6" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 81%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">WaveLogic 코히어런트 모뎀, 6500·Waveserver 광전</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">송, RLS·HyperRail 선로 시스템, 800ZR 착탈식 모</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">듈, 라우팅·스위칭</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 간 연결·장거리 백본·해저 케</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">이블·통신사 메트로망</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">수익 · 광 장비와 모듈을 팔고, 선로가 깔리면 증설</text><text x="12" y="159" style="fill:#5d6470;font-size:12px">물량이 이어진다</text><text x="12" y="197" style="fill:#5d6470;font-size:13px;font-weight:700">글로벌 서비스</text><text x="328" y="197" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="203" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="203" width="29.7" height="8" rx="4" fill="#5d6470"/><text x="328" y="211" text-anchor="end" style="