<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="102.6" height="16" rx="3" fill="#5d6470"><title>약세: 2.67$ (-64%) · 확률 35% — 발주 지연이 2027년 상반기까지 이어져 잔고가 $600M 아래로 내려가고 콘크리트 이익률이 &#x27;한 자릿수 중반&#x27;으로 돌아간다. 매출 $880M대, EBITDA 이익률 5.5% — FY2026 가이던스 아래</title></rect><text x="226.6" y="22">2.67 (-64%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="266.8" height="16" rx="3" fill="#5d6470"><title>기본: 6.94$ (-6%) · 확률 30% — 컨센서스 FY2027 EBITDA $60~62M. 입찰 일부가 잔고가 되고 매출 $975M~1,007M, EBITDA 이익률 6% 안팎</title></rect><text x="390.8" y="48">6.94 (-6%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 12.1$ (+63%) · 확률 35% — 해군 MACC 과제와 입찰 대기 $2B의 상당 부분이 2027년 상반기에 잔고가 돼 매출 $1.07B 이상, EBITDA 이익률 6.6% 이상</title></rect><text x="587.6" y="74">12.1 (+63%) · 확률 35%</text><line x1="403.7" x2="403.7" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="407.7" y="100">현재 7.38</text><text x="120" y="114" style="fill:#5d6470">확률 가중 7.24 (-2%)</text><line x1="350.7" x2="350.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 6.00 (-19%)</text></g></svg>