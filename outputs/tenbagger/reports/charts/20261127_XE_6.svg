<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="279.8" height="16" rx="3" fill="#5d6470"><title>약세: 4.96$ (-40%) · 확률 35% — Dow 예비 투자 결정이 2028년으로 밀리고 ARDP 작업량이 지금 수준에서 멈춘다. 매출이 낮은 쪽 추정 경로(2027년 $311M)에도 못 미친다</title></rect><text x="403.8" y="22">4.96 (-40%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="350.3" height="16" rx="3" fill="#5d6470"><title>기본: 6.21$ (-24%) · 확률 40% — Dow가 2027년 예비 결정을 내리고 상업 고객 용역이 늘지만 애널리스트 평균 경로(약 $771M)보다는 약 30% 낮다. 3Q 뒤에도 추정이 깎였고 무엇이 매출인지 합의가 없기 때문이다</title></rect><text x="474.3" y="48">6.21 (-24%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="461.4" height="16" rx="3" fill="#5d6470"><title>강세: 8.18$ (-0%) · 확률 25% — Dow 결정 뒤 장납기 조달과 건설 지원 용역이 붙고 두 번째 사업(Cascade)이 건설 허가 신청 단계로 간다. 애널리스트 평균을 넘는다</title></rect><text x="585.4" y="74">8.18 (-0%) · 확률 25%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 8.22</text><text x="120" y="114" style="fill:#5d6470">확률 가중 6.26 (-24%)</text><line x1="492.3" x2="492.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 6.60 (-20%)</text></g></svg>