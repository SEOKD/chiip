<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="207.2" height="16" rx="3" fill="#d0452f"><title>약세: 81.7$ (-17%) · 확률 25% — 중동 분쟁으로 2027 일정에서도 1~2경기가 빠지고, 미국 시청 성장이 멈춰 스폰서 갱신 단가가 둔화한다. MotoGP 비용 투자가 이어져 4Q27~3Q28 조정 EBITDA가 $1.20B(컨센서스 $1.38B의 87%)에 그친다</title></rect><text x="331.2" y="22">81.7 (-17%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="331.4" height="16" rx="3" fill="#2a5bd7"><title>기본: 131$ (+32%) · 확률 50% — 2027년 24경기 복귀, 개최료·중계권 연 단가 인상, 팀 상금 비율 안정 — 4Q27~3Q28 조정 EBITDA 컨센서스 $1.38B에서 MotoGP 성장 투자를 뺀 $1.36B</title></rect><text x="455.4" y="48">131 (+32%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 183$ (+85%) · 확률 25% — 스프린트 확대·라스베이거스·Paddock Club 확장과 MotoGP 중계권 재계약이 겹쳐 $1.48B. 지배주주가 사라져 배수가 동종 위로 유지된다</title></rect><text x="587.6" y="74">183 (+85%) · 확률 25%</text><line x1="370.9" x2="370.9" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="374.9" y="100">현재 98.9</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 131 (+33%)</text><line x1="414.2" x2="414.2" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 116 (+17%)</text></g></svg>