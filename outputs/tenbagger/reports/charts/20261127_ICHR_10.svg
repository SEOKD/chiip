<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="119.2" height="16" rx="3" fill="#5d6470"><title>약세: 11.0$ (-57%) · 확률 50% — 장비 투자 증가가 2027년 하반기에 멈추고 부품 제약이 이어져 매출이 <tspan style="fill:#5d6470;font-weight:600">+18%</tspan>에 그친다. 매출 약 $1.46B, 조정 영업이익률 6%로 2026년 수준에서 정체.</title></rect><text x="243.2" y="22">11.0 (-57%) · 확률 50%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="300.3" height="16" rx="3" fill="#5d6470"><title>기본: 27.8$ (+8%) · 확률 20% — 매출 약 $1.61B(<tspan style="fill:#5d6470;font-weight:600">+30%</tspan>), 조정 영업이익률 약 10%. 추가 매출의 매출총이익 전환율 25~30%와 영업비용 <tspan style="fill:#5d6470;font-weight:600">+15%</tspan>를 넣은 값이고 애널리스트 평균 $3.48보다 조금 낮다.</title></rect><text x="424.3" y="48">27.8 (+8%) · 확률 20%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 42.9$ (+67%) · 확률 30% — 부품 제약이 상반기에 풀리고 자체 유량 제어 제품이 인증을 받아 매출 약 $1.70B(<tspan style="fill:#5d6470;font-weight:600">+38%</tspan>), 조정 영업이익률 12%.</title></rect><text x="587.6" y="74">42.9 (+67%) · 확률 30%</text><line x1="397.4" x2="397.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="401.4" y="100">현재 25.6</text><text x="120" y="114" style="fill:#5d6470">확률 가중 23.9 (-7%)</text><line x1="401.3" x2="401.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 26.0 (+1%)</text></g></svg>