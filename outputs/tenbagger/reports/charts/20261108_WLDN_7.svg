<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="186.1" height="16" rx="3" fill="#d0452f"><title>약세: 49.5$ (-25%) · 확률 25% — 데이터센터 착공 지연으로 상업 수주가 줄고 Mantis 통합이 늦다. 2027 조정 EBITDA가 목표 $140M보다 약 11% 낮다</title></rect><text x="310.1" y="22">49.5 (-25%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="320.0" height="16" rx="3" fill="#2a5bd7"><title>기본: 85.0$ (+28%) · 확률 50% — 회사 목표(계약매출 약 $1B, 조정 EBITDA $140M 이상) 근처로 간다. 컨센서스 $144M와 비슷하다</title></rect><text x="444.0" y="48">85.0 (+28%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 123$ (+86%) · 확률 25% — 유기 성장이 15%로 오르고 Mantis 교차 판매가 숫자로 나온다. 컨센서스 상단 $156M 근처다</title></rect><text x="587.6" y="74">123 (+86%) · 확률 25%</text><line x1="369.2" x2="369.2" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="373.2" y="100">현재 66.2</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 85.7 (+29%)</text><line x1="428.5" x2="428.5" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 82.0 (+24%)</text></g></svg>