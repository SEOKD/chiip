<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="204.0" height="16" rx="3" fill="#d0452f"><title>약세: 206$ (-29%) · 확률 25% — 종료 정산 효과가 사라지고 고정가 C&amp;I에서 원가 초과가 한 번 나온다. 2027 성장이 가이던스 하단(+15%)에 머물고 마진이 2026 수준으로 돌아간다. 컨센서스 하단 $13.17과 같은 높이</title></rect><text x="328.0" y="22">206 (-29%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="319.4" height="16" rx="3" fill="#2a5bd7"><title>기본: 323$ (+11%) · 확률 50% — 2027 가이던스 중간(+16.5%)과 부문 마진 상단~중간이 이어진다. 다음 4개 분기 EPS 컨센서스 $15.54와 같은 높이</title></rect><text x="443.4" y="48">323 (+11%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 469$ (+61%) · 확률 25% — 대형 송전이 1Q27 잔고에 들어오고 C&amp;I 마진이 9% 근처에서 버틴다. 4개 분기 연속 20% 상회 습관이 이어지면 다음 4개 분기 EPS가 약 16% 더 올라간다</title></rect><text x="587.6" y="74">469 (+61%) · 확률 25%</text><line x1="408.1" x2="408.1" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="412.1" y="100">현재 292</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 331 (+13%)</text><line x1="464.8" x2="464.8" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 349 (+20%)</text></g></svg>