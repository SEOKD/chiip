<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="172.2" height="16" rx="3" fill="#d0452f"><title>약세: 215$ (-49%) · 확률 30% — 메모리 가격이 내려 전가 매출이 줄고 ISG 이익률이 10%대 초반으로 돌아간다. PC가 2년째 줄어 FY29 EPS가 FY27 수준에 머문다</title></rect><text x="296.2" y="22">215 (-49%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="309.1" height="16" rx="3" fill="#2a5bd7"><title>기본: 386$ (-9%) · 확률 50% — AI 잔고가 매출로 바뀌고 이익률은 천천히 내린다. FY29 컨센서스 $33.8~$36.5 사이</title></rect><text x="433.1" y="48">386 (-9%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 579$ (+37%) · 확률 20% — 공급 부족이 2028년까지 이어지고 기업 AI가 스토리지 동반 판매를 끌어올린다. FY29 추정 상단 $38.6~$50 사이</title></rect><text x="587.6" y="74">579 (+37%) · 확률 20%</text><line x1="459.5" x2="459.5" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="463.5" y="100">현재 424</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 374 (-12%)</text><line x1="448.9" x2="448.9" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 411 (-3%)</text></g></svg>