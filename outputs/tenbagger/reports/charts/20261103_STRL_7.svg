<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="192.9" height="16" rx="3" fill="#d0452f"><title>약세: 308$ (-8%) · 확률 30% — 서명 수주 공백이 1H27까지 이어져 2027 매출 약 +15%. CEC 비중 확대로 조정 EBIT 이익률 18%. FY2026 가이던스 수준에서 이익이 멈춘다</title></rect><text x="316.9" y="22">308 (-8%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="317.1" height="16" rx="3" fill="#2a5bd7"><title>기본: 507$ (+51%) · 확률 45% — 미서명 수주가 4Q·1Q에 대부분 서명으로 넘어오고 2027 매출 약 $5.8~6.1B. 지금 컨센서스 $26.78과 비슷하다</title></rect><text x="441.1" y="48">507 (+51%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 741$ (+121%) · 확률 25% — 텍사스·태평양 북서부 신규 캠퍼스와 CEC 성장이 겹쳐 매출 +35% 이상, 부지 조성 이익률 유지. 4Q가 3Q처럼 내재 값을 크게 넘는다</title></rect><text x="587.6" y="74">741 (+121%) · 확률 25%</text><line x1="330.0" x2="330.0" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="334.0" y="100">현재 335</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 506 (+51%)</text><line x1="435.5" x2="435.5" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 504 (+50%)</text></g></svg>