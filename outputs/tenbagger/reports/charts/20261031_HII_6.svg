<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="217.0" height="16" rx="3" fill="#d0452f"><title>약세: 242$ (-24%) · 확률 25% — 정산이 사라지고 조선 이익률이 6%대에 머문다. 4Q27~3Q28 EPS 컨센서스 하단 $21.8보다 11% 낮다</title></rect><text x="341.0" y="22">242 (-24%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="326.4" height="16" rx="3" fill="#2a5bd7"><title>기본: 364$ (+15%) · 확률 50% — FY2027 조선 이익률이 6.5~7%로 오르고 처리량이 회복된다. 컨센서스 범위 $21.8~$22.9의 하단이다</title></rect><text x="450.4" y="48">364 (+15%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 517$ (+63%) · 확률 25% — 조선 이익률 7% 돌파와 처리량 15% 복귀가 함께 온다. 컨센서스 상단보다 9% 높다</title></rect><text x="587.6" y="74">517 (+63%) · 확률 25%</text><line x1="404.1" x2="404.1" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="408.1" y="100">현재 317</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 372 (+17%)</text><line x1="422.1" x2="422.1" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 337 (+6%)</text></g></svg>