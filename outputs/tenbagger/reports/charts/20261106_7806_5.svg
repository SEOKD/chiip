<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="181.1" height="16" rx="3" fill="#d0452f"><title>약세: 5,297¥ (-38%) · 확률 30% — 인바운드 둔화와 유행 꺾임으로 FY9/27 매출 성장이 한 자릿수로 내려가고, 마케팅비를 줄이지 못해 영업이익률이 10% 안팎에 머문다. 다음 4개 분기 EPS ¥280(FY9/26 가이던스 ¥279.66 수준)</title></rect><text x="305.1" y="22">5,297 (-38%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="306.2" height="16" rx="3" fill="#2a5bd7"><title>기본: 8,954¥ (+4%) · 확률 50% — FY9/27 매출 +15~18%, 영업이익 약 ¥19B(SMBC닛코 추정 근처), 영업이익률 12% 안팎. 다음 4개 분기 EPS ¥355(12개월 선행 컨센서스)</title></rect><text x="430.2" y="48">8,954 (+4%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 13,558¥ (+57%) · 확률 20% — 가이던스 상향 패턴이 FY9/27에도 이어져 매출 +25% 이상, 하반기 투자 효과로 영업이익률이 반기 수준(15%)에 가까워진다. 다음 4개 분기 EPS ¥430</title></rect><text x="587.6" y="74">13,558 (+57%) · 확률 20%</text><line x1="414.4" x2="414.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="418.4" y="100">현재 8,610</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 8,778 (+2%)</text><line x1="412.0" x2="412.0" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 8,540 (-1%)</text></g></svg>