<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="194.7" height="16" rx="3" fill="#5d6470"><title>약세: 137$ (-36%) · 확률 35% — 통신 이익률이 13%대 초반에 머물고 FTTH 성장이 FY28에 한 자릿수로 식는다. 무선 $150M 회수가 다시 밀린다. 다음 4개 분기(4Q FY28~3Q FY29) EPS가 컨센서스 하단 근처 $17.5</title></rect><text x="318.7" y="22">137 (-36%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="323.4" height="16" rx="3" fill="#5d6470"><title>기본: 228$ (+6%) · 확률 40% — FY28 매출 $8.4B(컨센서스, <tspan style="fill:#5d6470;font-weight:600">+11%</tspan>), 빌딩 시스템 이익률 20% 안팎, 통신 이익률 소폭 회복. 다음 4개 분기 EPS 컨센서스 $21.8 수준</title></rect><text x="447.4" y="48">228 (+6%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 326$ (+52%) · 확률 25% — BEAD 건설과 장거리망이 2027년에 겹치고 빌딩 시스템이 20%대 이익률로 커진다. EPS가 컨센서스 상단 쪽 $25</title></rect><text x="587.6" y="74">326 (+52%) · 확률 25%</text><line x1="425.9" x2="425.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="429.9" y="100">현재 215</text><text x="120" y="114" style="fill:#5d6470">확률 가중 221 (+2%)</text><line x1="419.7" x2="419.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 211 (-2%)</text></g></svg>