<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="230.0" height="16" rx="3" fill="#5d6470"><title>약세: 26.7$ (-41%) · 확률 25% — 소비 둔화로 회원이 줄고 동일 센터 성장이 5%대로 낮아진다. 신규 클럽 초기 적자가 겹쳐 조정 EBITDA 약 $0.98B(마진 약 27.5%)</title></rect><text x="354.0" y="22">26.7 (-41%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="342.0" height="16" rx="3" fill="#5d6470"><title>기본: 39.7$ (-13%) · 확률 50% — 회비 인상과 개장이 가이던스대로 이어진다. 매출 약 $3.64B(다음 4개 분기 컨센서스), 조정 EBITDA 약 $1.04B(마진 약 28.5%)</title></rect><text x="466.0" y="48">39.7 (-13%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 53.8$ (+18%) · 확률 25% — 회원 증가가 4%대로 돌아오고 센터 내 지출이 <tspan style="fill:#5d6470;font-weight:600">+15%</tspan> 이상 이어진다. 매출 약 $3.72B, 조정 EBITDA 약 $1.09B(마진 약 29.3%)</title></rect><text x="587.6" y="74">53.8 (+18%) · 확률 25%</text><line x1="512.5" x2="512.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="516.5" y="100">현재 45.5</text><text x="120" y="114" style="fill:#5d6470">확률 가중 40.0 (-12%)</text><line x1="473.3" x2="473.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 41.0 (-10%)</text></g></svg>