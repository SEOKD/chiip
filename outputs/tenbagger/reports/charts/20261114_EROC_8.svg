<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="131.7" height="16" rx="3" fill="#5d6470"><title>약세: 5.43$ (-35%) · 확률 25% — El Paso 다음 대형 주문이 늦어 2028년 상반기 공장이 비고, 2027년 마진이 10%대 후반에 머문다. 12/7 해제 물량이 나온다</title></rect><text x="255.7" y="22">5.43 (-35%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="281.2" height="16" rx="3" fill="#5d6470"><title>기본: 11.6$ (+38%) · 확률 50% — 잔고가 2027년 말까지 전환되고 분기 뒤 $300M이 계약으로 굳는다. 2028년분은 일부만 찬다. 컨센서스 $0.835보다 약 14% 낮게 잡았다</title></rect><text x="405.2" y="48">11.6 (+38%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 19.1$ (+127%) · 확률 25% — 2028년분 수주가 Atlas까지 채우고 신규 계약 마진 20% 중반이 반영되기 시작한다</title></rect><text x="587.6" y="74">19.1 (+127%) · 확률 25%</text><line x1="324.0" x2="324.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="328.0" y="100">현재 8.41</text><text x="120" y="114" style="fill:#5d6470">확률 가중 11.9 (+42%)</text><line x1="384.4" x2="384.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 10.9 (+30%)</text></g></svg>