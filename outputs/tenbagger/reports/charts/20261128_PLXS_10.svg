<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="117.7" height="16" rx="3" fill="#5d6470"><title>약세: 49.4$ (-75%) · 확률 35% — 반도체 장비 투자가 2027년 하반기에 쉬어 FY2028 매출이 $5.9B 안팎(<tspan style="fill:#5d6470;font-weight:600">+2%</tspan>)에 그친다. 조정 영업이익률 6.0%, 재고 조정으로 현금 순환일이 70일 위로 오른다. 애널리스트 최저 추정 $11.06 아래다.</title></rect><text x="241.7" y="22">49.4 (-75%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="203.2" height="16" rx="3" fill="#5d6470"><title>기본: 85.3$ (-56%) · 확률 45% — FY2028 매출 약 $6.5B(<tspan style="fill:#5d6470;font-weight:600">+12%</tspan>), 조정 영업이익률 6.6% 안팎. A&amp;D 수주가 매출로 바뀌며 반도체 장비 둔화를 메운다. 애널리스트 평균 $11.79~13.00 사이다.</title></rect><text x="327.2" y="48">85.3 (-56%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="299.5" height="16" rx="3" fill="#5d6470"><title>강세: 126$ (-35%) · 확률 20% — FY2028 매출 약 $7.0B(<tspan style="fill:#5d6470;font-weight:600">+18%</tspan>), 조정 영업이익률 7%로 새 목표 상단. 반도체 장비 사이클이 2028년까지 이어지고 데이터센터 전력·에너지 저장 프로그램이 붙는다. 애널리스트 최고 추정 $12.48을 넘는 값이다.</title></rect><text x="423.5" y="74">126 (-35%) · 확률 20%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 195</text><text x="120" y="114" style="fill:#5d6470">확률 가중 80.9 (-58%)</text><line x1="353.4" x2="353.4" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 98.0 (-50%)</text></g></svg>