<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 509" width="340" height="509"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="414" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="288" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="162" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">RockBlock</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="103.7" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 40%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">자체 설계 천연가스 발전기를 쌓아 올리는 모듈. 1.</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">5~3.5MW 묶음, 최소 500kW 단위</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 브리지 전력·백업 전력·유틸리</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">티 피크 전력</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 장비 판매. 공개 사례 366MW $290M, 약 $0.</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">79M/MW(Chiip 계산)</text><text x="12" y="180" style="fill:#1a1d23;font-size:13px;font-weight:700">설치(ESI)</text><text x="328" y="180" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="186" width="66.6" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 26%</text><text x="12" y="217" style="fill:#1a1d23;font-size:12px">설계·인허가·시공·시운전을 일괄로 맡는다</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · 대형 현장 구축</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">수익 · 진행 기준 매출, 2Q $10.4M. 10-Q 잔여 수</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">행 의무 약 $1.8B는 설치·서비스 기준이다</text><text x="12" y="306" style="fill:#1a1d23;font-size:13px;font-weight:700">운영·유지보수·자산 관리</text><text x="328" y="306" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="312" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="312" width="85.8" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="320" text-anchor="end" style="font-size:11.5px">매출 34%</text><text x="12" y="343" style="fill:#1a1d23;font-size:12px">설치 뒤 장기 운영과 정비</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">쓰는 곳 · 설치 기반 1,104MW</text><text x="12" y="377" style="fill:#5d6470;font-size:12px">수익 · 연환산 반복 매출 $23.6M, 계약 5~15년. An</text><text x="12" y="394" style="fill:#5d6470;font-size:12px">thropic 건은 별도 계약 예정이라고 CEO가 말했다</text><text x="12" y="432" style="fill:#1a1d23;font-size:13px;font-weight:700">Granite</text><text x="328" y="432" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="455" style="fill:#1a1d23;font-size:12px">발전기에 들어가는 제어·운영 소프트웨어</text><text x="12" y="472" style="fill:#5d6470;font-size:12px">쓰는 곳 · 원격 감시와 전력망 지원 운전</text><text x="12" y="489" style="fill:#5d6470;font-size:12px">수익 · 별도 매출로 공시되지 않는다</text></g></svg>