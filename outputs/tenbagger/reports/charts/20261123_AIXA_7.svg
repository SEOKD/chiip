<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="128.4" height="16" rx="3" fill="#5d6470"><title>약세: 14.6€ (-50%) · 확률 25% — 증산이 분기 €200M 근처에서 멈추고 광전자 수주가 식어 2027년 매출이 €740M(컨센서스 하단)에 머문다</title></rect><text x="252.4" y="22">14.6 (-50%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="267.5" height="16" rx="3" fill="#5d6470"><title>기본: 30.5€ (+4%) · 확률 50% — 컨센서스 FY2027 매출 €880M·EPS €1.50 — 잔고 €549.4M이 12개월 안에 출하되고 애프터세일즈와 신규 수주가 나머지를 채운다</title></rect><text x="391.5" y="48">30.5 (+4%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 52.8€ (+80%) · 확률 25% — 분기 출하가 €250M 이상으로 올라가고 300mm GaN·SiC 주문이 겹쳐 매출 €1.02B(컨센서스 상단)</title></rect><text x="587.6" y="74">52.8 (+80%) · 확률 25%</text><line x1="378.2" x2="378.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="382.2" y="100">현재 29.4</text><text x="120" y="114" style="fill:#5d6470">확률 가중 32.1 (+9%)</text><line x1="374.6" x2="374.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 29.0 (-1%)</text></g></svg>