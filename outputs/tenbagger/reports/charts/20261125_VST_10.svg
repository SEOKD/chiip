<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="163.5" height="16" rx="3" fill="#5d6470"><title>약세: 67.5$ (-44%) · 확률 25% — 가이던스 하단 $7.7B를 조금 밑돈다 — 헤지 밖 2%와 소매 마진, Cogentrix 편입 초기 부진. 더 큰 것은 배수다: 텍사스 유예 논의와 ERCOT 선도 가격 추가 하락으로 2028년 이익이 2027년 아래로 보이기 시작한다</title></rect><text x="287.5" y="22">67.5 (-44%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="309.8" height="16" rx="3" fill="#5d6470"><title>기본: 128$ (+6%) · 확률 35% — 회사 가이던스 $7.7~8.5B의 중간값. 2027년 발전량의 약 98%가 헤지됐고 Cogentrix와 Meta 운영분 인도가 들어 있다. 컨센서스 $7.93B보다 조금 높다</title></rect><text x="433.8" y="48">128 (+6%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 191$ (+58%) · 확률 40% — 가이던스 상단. ERCOT 일괄 심사가 풀려 가스 발전소 장기 계약이 이어지고, 남은 원전 물량 계약이 발표돼 배수가 동종 독립 발전사 수준으로 돌아온다</title></rect><text x="587.6" y="74">191 (+58%) · 확률 40%</text><line x1="412.7" x2="412.7" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="416.7" y="100">현재 121</text><text x="120" y="114" style="fill:#5d6470">확률 가중 138 (+14%)</text><line x1="430.3" x2="430.3" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 128 (+6%)</text></g></svg>