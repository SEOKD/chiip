<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="100.2" height="16" rx="3" fill="#5d6470"><title>약세: 25.7$ (-73%) · 확률 30% — 러시아 추가 면제가 늦어 2027년 판매 물량이 줄고 SWU 원가가 판매가보다 빨리 오른다. 다음 4개 분기(4Q27~3Q28) EPS가 2027년 추정 하단 근처 $1.8</title></rect><text x="224.2" y="22">25.7 (-73%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="259.6" height="16" rx="3" fill="#5d6470"><title>기본: 66.5$ (-29%) · 확률 35% — 2027년 매출 $600M(자체 추정)과 중개 마진 유지, 현금 이자 수익. 4Q27~3Q28 분기 추정 합 $3.5 수준</title></rect><text x="383.6" y="48">66.5 (-29%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 119$ (+26%) · 확률 35% — 상업 HALEU 판매와 SWU 가격 상승이 겹치고 증설이 일정대로 간다. EPS가 2027년 추정 상단($5.3~5.6) 쪽 $5.0</title></rect><text x="587.6" y="74">119 (+26%) · 확률 35%</text><line x1="487.5" x2="487.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="491.5" y="100">현재 94.2</text><text x="120" y="114" style="fill:#5d6470">확률 가중 72.6 (-23%)</text><line x1="432.2" x2="432.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 80.0 (-15%)</text></g></svg>