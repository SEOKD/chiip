<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="163.3" height="16" rx="3" fill="#5d6470"><title>약세: 32.9$ (-57%) · 확률 30% — 데이터센터 프로젝트가 밀려 BASX 잔고 출하가 2028년으로 넘어가고 상업 건설 약세로 AAON 브랜드가 정체 — 매출 $2.5B, 컨센서스 하단</title></rect><text x="287.3" y="22">32.9 (-57%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="306.4" height="16" rx="3" fill="#5d6470"><title>기본: 61.7$ (-20%) · 확률 35% — 컨센서스 FY2027 EPS $3.70~3.88, 매출 $2.9~2.95B. 멤피스 가동률이 오르고 코일 마진이 유지된다</title></rect><text x="430.4" y="48">61.7 (-20%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 93.3$ (+21%) · 확률 35% — 4Q·1Q 수주 시즌에 BASX 대형 프로그램이 이어지고 가격 반영으로 영업이익률 16%대 — 매출 $3.35B, 컨센서스 상단</title></rect><text x="587.6" y="74">93.3 (+21%) · 확률 35%</text><line x1="503.0" x2="503.0" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="507.0" y="100">현재 77.1</text><text x="120" y="114" style="fill:#5d6470">확률 가중 64.1 (-17%)</text><line x1="452.9" x2="452.9" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 67.0 (-13%)</text></g></svg>