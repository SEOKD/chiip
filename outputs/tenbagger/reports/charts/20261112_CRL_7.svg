<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="240.8" height="16" rx="3" fill="#5d6470"><title>약세: 215$ (-37%) · 확률 25% — B/B가 1.0 근처로 내려가 2027 유기 성장이 1~2%에 머물고, 가격 효과가 늦어진다. 매출 약 $3.95B, 조정 영업이익률 22% — EPS 약 $11.6</title></rect><text x="364.8" y="22">215 (-37%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="348.8" height="16" rx="3" fill="#5d6470"><title>기본: 311$ (-9%) · 확률 50% — DSA 중간 한 자릿수 성장과 절감이 이어져 매출 약 $3.99B(다음 4개 분기 컨센서스), 조정 영업이익률 약 21.6%, 세율 23% — EPS 약 $12.6(컨센서스 $12.61과 같은 수준)</title></rect><text x="472.8" y="48">311 (-9%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 413$ (+21%) · 확률 25% — B/B가 1.15 이상으로 돌아오고 NHP 원가 하락·$300M 절감이 앞당겨진다. 매출 약 $4.05B, 조정 영업이익률 23% 이상 — EPS 약 $13.4</title></rect><text x="587.6" y="74">413 (+21%) · 확률 25%</text><line x1="504.5" x2="504.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="508.5" y="100">현재 343</text><text x="120" y="114" style="fill:#5d6470">확률 가중 312 (-9%)</text><line x1="471.2" x2="471.2" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 313 (-9%)</text></g></svg>