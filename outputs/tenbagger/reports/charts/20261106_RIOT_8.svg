<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 346" width="340" height="346"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="237" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="128" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">데이터센터 임대</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="26.1" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 10%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">전력·부지·변전 설비를 갖춘 패드를 장기 임대(Cors</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">icana는 트리플넷, Rockdale은 Tier 3 건물)</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · AI 학습·추론 연산</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">수익 · 15~20년 고정 임대료, 연 3% 인상</text><text x="12" y="146" style="fill:#1a1d23;font-size:13px;font-weight:700">비트코인 채굴</text><text x="328" y="146" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="152" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="152" width="163.6" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="160" text-anchor="end" style="font-size:11.5px">매출 64%</text><text x="12" y="183" style="fill:#1a1d23;font-size:12px">자체 채굴기 44.9EH/s로 비트코인 생산</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">쓰는 곳 · 현금 확보 + 전력 출력제한 크레딧</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">수익 · 채굴 보상·비트코인 매각</text><text x="12" y="255" style="fill:#1a1d23;font-size:13px;font-weight:700">엔지니어링(전기 설비 제조)</text><text x="328" y="255" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="261" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="261" width="66.3" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="269" text-anchor="end" style="font-size:11.5px">매출 26%</text><text x="12" y="292" style="fill:#1a1d23;font-size:12px">ESS Metron·E4A의 맞춤 배전 장비·전기 설계</text><text x="12" y="309" style="fill:#5d6470;font-size:12px">쓰는 곳 · 자사·외부 데이터센터 전력 설비</text><text x="12" y="326" style="fill:#5d6470;font-size:12px">수익 · 주문 제작 판매(잔고 $142M)</text></g></svg>