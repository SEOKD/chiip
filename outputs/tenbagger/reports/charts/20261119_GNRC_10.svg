<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="190.4" height="16" rx="3" fill="#5d6470"><title>약세: 163$ (-17%) · 확률 30% — 캐파 램프가 늦어 2027 데이터센터 매출이 $1.5B 안팎에 그치고 C&amp;I 이익률이 12%대에 머문다</title></rect><text x="314.4" y="22">163 (-17%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="320.1" height="16" rx="3" fill="#5d6470"><title>기본: 274$ (+39%) · 확률 35% — 2027 데이터센터 매출 약 $2.1B, 하반기 쏠림. EPS는 컨센서스 범위 $13.66~16.30의 가운데 아래(추정)</title></rect><text x="444.1" y="48">274 (+39%) · 확률 35%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 397$ (+102%) · 확률 35% — 캐파 3배가 일정대로 끝나고 C&amp;I 이익률이 15%를 넘으며 주거용이 정전 수요로 두 자릿수 성장한다</title></rect><text x="587.6" y="74">397 (+102%) · 확률 35%</text><line x1="349.9" x2="349.9" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="353.9" y="100">현재 197</text><text x="120" y="114" style="fill:#5d6470">확률 가중 284 (+44%)</text><line x1="411.7" x2="411.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 250 (+27%)</text></g></svg>