<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="214.0" height="16" rx="3" fill="#5d6470"><title>약세: 201$ (-13%) · 확률 25% — 외부 레이저 조달 비중이 그대로이고 1.6T DSP 부족으로 2~3분기 매출이 가이던스 하단에 머문다. 총이익률 40%, 다음 4개 분기 EPS 약 $10(컨센서스 하단 아래)</title></rect><text x="338.0" y="22">201 (-13%) · 확률 25%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="331.0" height="16" rx="3" fill="#5d6470"><title>기본: 312$ (+34%) · 확률 50% — 다음 4개 분기 EPS 컨센서스 $11.57~$11.70. 회사 목표대로 FY27 안에 $3B 분기, PhotonLink 3월 분기 $100M</title></rect><text x="455.0" y="48">312 (+34%) · 확률 50%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 436$ (+88%) · 확률 25% — 내부 InP 비중이 오르기 시작해 총이익률이 42~43%로 가고 DCI·OCS·PhotonLink가 회사 목표를 앞선다</title></rect><text x="587.6" y="74">436 (+88%) · 확률 25%</text><line x1="366.5" x2="366.5" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="370.5" y="100">현재 232</text><text x="120" y="114" style="fill:#5d6470">확률 가중 315 (+36%)</text><line x1="427.0" x2="427.0" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 289 (+25%)</text></g></svg>