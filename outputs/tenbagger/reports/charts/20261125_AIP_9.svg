<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="59.4" height="16" rx="3" fill="#5d6470"><title>약세: 2.24$ (-87%) · 확률 30% — 매출이 애널리스트 최저 추정 $108M(<tspan style="fill:#5d6470;font-weight:600">+9%</tspan>)에 그치고 영업비는 계획대로 늘어 조정 영업손익이 0 근처에 머문다</title></rect><text x="183.4" y="22">2.24 (-87%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="116.4" height="16" rx="3" fill="#5d6470"><title>기본: 4.39$ (-75%) · 확률 40% — 매출 $116M(<tspan style="fill:#5d6470;font-weight:600">+16.5%</tspan>), 조정 영업이익 $1.5M에 감가상각을 더한 값 — 두 추정($6.3M·$10.2M)의 가운데</title></rect><text x="240.4" y="48">4.39 (-75%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="210.1" height="16" rx="3" fill="#5d6470"><title>강세: 7.92$ (-55%) · 확률 30% — 매출이 최고 추정 $124M(<tspan style="fill:#5d6470;font-weight:600">+25%</tspan>)이고 늘어난 매출의 89%가 매출총이익으로 남는다 — 칩렛 계약과 로열티가 빨리 붙는 경우</title></rect><text x="334.1" y="74">7.92 (-55%) · 확률 30%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 17.5</text><text x="120" y="114" style="fill:#5d6470">확률 가중 4.80 (-73%)</text><line x1="260.6" x2="260.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 5.30 (-70%)</text></g></svg>