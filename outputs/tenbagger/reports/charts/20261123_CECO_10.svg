<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="129.1" height="16" rx="3" fill="#5d6470"><title>약세: 36.1$ (-25%) · 확률 30% — 대형 가스 발전 프로젝트가 밀리거나 취소돼 연말 잔고의 절반 남짓만 매출이 된다. 매출 $1.75B, 조정 EBITDA 이익률은 3Q 수준 17.3%에 머문다 — Thermon을 1년 내내 넣은 2026년 환산치 $255~280M에서 조금 느는 수준</title></rect><text x="253.1" y="22">36.1 (-25%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="324.4" height="16" rx="3" fill="#5d6470"><title>기본: 90.8$ (+89%) · 확률 40% — 컨센서스 $495M — 회사 가이던스 중간 $500M과 사실상 같다. 연말 잔고의 70%가 매출이 되고 이익률이 22%대로 오른다</title></rect><text x="448.4" y="48">90.8 (+89%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 130$ (+170%) · 확률 30% — 회사가 지난 5번 중 4번 그랬듯 첫 가이던스를 10% 넘긴다. 매출 $2.3B, 조정 EBITDA 이익률 약 24%</title></rect><text x="587.6" y="74">130 (+170%) · 확률 30%</text><line x1="291.6" x2="291.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="295.6" y="100">현재 48.0</text><text x="120" y="114" style="fill:#5d6470">확률 가중 86.1 (+79%)</text><line x1="391.7" x2="391.7" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 76.0 (+58%)</text></g></svg>