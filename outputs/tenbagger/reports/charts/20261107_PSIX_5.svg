<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="162.3" height="16" rx="3" fill="#d0452f"><title>약세: 31.2$ (-20%) · 확률 30% — 데이터센터 주문이 밀리고 GM이 25%대로 돌아간다. 다음 4개 분기 EPS 컨센서스 $3.80보다 약 26% 낮다</title></rect><text x="286.3" y="22">31.2 (-20%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="293.6" height="16" rx="3" fill="#2a5bd7"><title>기본: 56.5$ (+44%) · 확률 45% — 다음 4개 분기 EPS 컨센서스 $3.80대로 간다(애널리스트 3명)</title></rect><text x="417.6" y="48">56.5 (+44%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#1a1d23"><title>강세: 89.3$ (+128%) · 확률 25% — 3Q처럼 분기 EPS $1.2 이상이 이어지고 위스콘신 램프가 산출을 늘린다</title></rect><text x="587.6" y="74">89.3 (+128%) · 확률 25%</text><line x1="323.3" x2="323.3" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="327.3" y="100">현재 39.2</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 57.1 (+46%)</text><line x1="405.6" x2="405.6" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 55.0 (+40%)</text></g></svg>