<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="197.4" height="16" rx="3" fill="#5d6470"><title>약세: 130$ (-43%) · 확률 30% — AI 데이터 고객이 2027 주문 일부를 미루고 방산 세출이 늦어진다. 원자재(구리 PPI 전년비 <tspan style="fill:#5d6470;font-weight:600">+24%</tspan>) 부담이 가격 전가를 앞질러 총이익률이 39% 안팎으로 내려간다. 12개월 뒤 다음 4개 분기 조정 EPS가 FY27 컨센서스 하단($10.75) 근처</title></rect><text x="321.4" y="22">130 (-43%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="320.7" height="16" rx="3" fill="#5d6470"><title>기본: 211$ (-7%) · 확률 40% — 컨센서스 경로 — FY27 매출 $985M(<tspan style="fill:#5d6470;font-weight:600">+17%</tspan>)·조정 EBIT 이익률 22%, FY27 EPS $12.34에 FY28 <tspan style="fill:#5d6470;font-weight:600">+9%</tspan>(추정). 12개월 뒤 다음 4개 분기 = 4Q27 $3.31 + FY28의 3/4</title></rect><text x="444.7" y="48">211 (-7%) · 확률 40%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 305$ (+35%) · 확률 30% — 10월 말 잔고 $742M이 계획대로 2027 매출로 바뀌고 ITDS가 30% 넘게 큰다. 총이익률 42% 유지. EPS가 FY27 컨센서스 상단($13.61)을 넘어 FY28에 15% 더 큰다</title></rect><text x="587.6" y="74">305 (+35%) · 확률 30%</text><line x1="463.4" x2="463.4" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="467.4" y="100">현재 226</text><text x="120" y="114" style="fill:#5d6470">확률 가중 215 (-5%)</text><line x1="430.5" x2="430.5" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 204 (-10%)</text></g></svg>