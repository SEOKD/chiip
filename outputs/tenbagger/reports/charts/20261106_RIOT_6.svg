<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="134.6" height="16" rx="3" fill="#d0452f"><title>약세: 16.1$ (+9%) · 확률 30% — Corsicana 1단계가 1~2분기 늦고 Rockdale 96MW가 2028년으로 밀린다. 비트코인이 $70,000 아래에 머물러 채굴 이익이 0 근처다 — EBITDA $0.45B</title></rect><text x="258.6" y="22">16.1 (+9%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="275.0" height="16" rx="3" fill="#2a5bd7"><title>기본: 32.9$ (+123%) · 확률 45% — Corsicana 400MW(2027-09)·200MW(2028-01), Rockdale 96MW(2027-12), AMD 50MW가 일정대로 임대료를 낸다. 4Q27~3Q28 EBITDA는 컨센서스 $603M과 일정 기준 상향식 계산 약 $0.85B(임대 NOI 약 $0.9B + 채굴·엔지니어링 − 판관비) 사이 $0.7B</title></rect><text x="399.0" y="48">32.9 (+123%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 55.5$ (+276%) · 확률 25% — 인도가 일정대로 끝나고 AMD가 옵션 150MW 중 일부를 행사한다. 비트코인 강세로 채굴 이익이 더해진다 — EBITDA $0.95B</title></rect><text x="587.6" y="74">55.5 (+276%) · 확률 25%</text><line x1="243.3" x2="243.3" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="247.3" y="100">현재 14.8</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 33.5 (+127%)</text><line x1="345.5" x2="345.5" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 27.0 (+83%)</text></g></svg>