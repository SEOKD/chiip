<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 424" width="340" height="424"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="329" width="338" height="87" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="220" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="111" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">부지 조성(데이터센터·반도체 캠퍼스)</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="143.4" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 56%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">대형 부지 토공·배수·기반 공사</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터·반도체 공장 첫 공정</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">수익 · 공사 진행률만큼 매출</text><text x="12" y="129" style="fill:#1a1d23;font-size:13px;font-weight:700">전기 공사(CEC)</text><text x="328" y="129" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">서비스</text><rect x="12" y="135" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="135" width="69.1" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="143" text-anchor="end" style="font-size:11.5px">매출 27%</text><text x="12" y="166" style="fill:#1a1d23;font-size:12px">건물 전기·기계 설비 시공</text><text x="12" y="183" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 건물 내부</text><text x="12" y="200" style="fill:#5d6470;font-size:12px">수익 · 공사 진행률만큼 매출</text><text x="12" y="238" style="fill:#1a1d23;font-size:13px;font-weight:700">교