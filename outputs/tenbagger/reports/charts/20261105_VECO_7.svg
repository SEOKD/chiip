<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#1a1d23;font-size:12px">약세</text><rect x="120" y="10" width="157.6" height="16" rx="3" fill="#d0452f"><title>약세: 27.1$ (-25%) · 확률 30% — 부품 부족과 외주사 램프 지연으로 2027년 매출 성장이 15~20%에 그치고 매출총이익률이 40% 안팎에 머문다. 합병은 종결되고 Axcelis 주가가 업종 조정으로 더 빠진다</title></rect><text x="281.6" y="22">27.1 (-25%) · 확률 30%</text><text x="114" y="48" text-anchor="end" style="fill:#1a1d23;font-size:12px">기본</text><rect x="120" y="36" width="291.8" height="16" rx="3" fill="#2a5bd7"><title>기본: 50.2$ (+39%) · 확률 45% — 4Q 매출총이익률 43~44%를 지키고 2027년 매출이 $1.0~1.1B. 다음 4개 분기 EPS 컨센서스 $2.36과 같은 높이</title></rect><text x="415.8" y="48">50.2 (+39%) · 확률 45%</text><text x="114" y="74" text-anchor="end" style="fill:#1a1d23;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#2a5bd7"><title>강세: 79.7$ (+121%) · 확률 25% — 첨단 패키징 2배·InP 레이저·NSA 2·3번째 Tier1 주문이 겹쳐 2027년 매출 $1.15B 이상, 매출총이익률 45%. FY27 EPS 추정 상단 $3.30 쪽</title></rect><text x="587.6" y="74">79.7 (+121%) · 확률 25%</text><line x1="329.4" x2="329.4" y1="4" y2="88" stroke="#1a1d23" stroke-dasharray="4 3"/><text x="333.4" y="100">현재 36.0</text><text x="120" y="114" style="fill:#1a1d23">확률 가중 50.6 (+41%)</text><line x1="393.4" x2="393.4" y1="4" y2="88" stroke="#1f8a5b" stroke-width="2"/><text x="120" y="128" style="fill:#1f8a5b;font-weight:700">목표주가 47.0 (+31%)</text></g></svg>