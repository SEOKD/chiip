<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 686" width="340" height="686"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="540" width="338" height="138" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="397" width="338" height="135" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="288" width="338" height="101" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="162" width="338" height="118" rx="10" fill="none" stroke="#e6e8ec"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#e6e8ec"/><text x="12" y="20" style="fill:#1a1d23;font-size:13px;font-weight:700">InP(인화인듐) 기판</text><text x="328" y="20" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="26" width="189.4" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 74%</text><text x="12" y="57" style="fill:#1a1d23;font-size:12px">인듐과 인으로 된 화합물 반도체 단결정 웨이퍼다.</text><text x="12" y="74" style="fill:#1a1d23;font-size:12px">잉곳을 키워 2~6인치로 자른다.</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 광 트랜시버의 레이저(EML·CW</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">)와 고속 포토디텍터</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 3Q 매출 $54.3M(전체의 74%). 웨이퍼가 커</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">질수록 장당 가격이 오른다</text><text x="12" y="180" style="fill:#1a1d23;font-size:13px;font-weight:700">GaAs(갈륨비소) 기판</text><text x="328" y="180" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="186" width="31.7" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 12%</text><text x="12" y="217" style="fill:#1a1d23;font-size:12px">반절연·반도체성 GaAs 웨이퍼, 6·8인치까지 만든다.</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">쓰는 곳 · RF 증폭기·VCSEL 레이저·LED·로보틱스</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">센서</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">수익 · 3Q $9.1M. 데이터센터용 VCSEL이 새 기회</text><text x="12" y="306" style="fill:#1a1d23;font-size:13px;font-weight:700">Ge(게르마늄) 기판</text><text x="328" y="306" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="312" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="312" width="3.0" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="320" text-anchor="end" style="font-size:11.5px">매출 0%</text><text x="12" y="343" style="fill:#1a1d23;font-size:12px">단원소 반도체 웨이퍼다.</text><text x="12" y="360" style="fill:#5d6470;font-size:12px">쓰는 곳 · 위성용 다중접합 태양전지</text><text x="12" y="377" style="fill:#5d6470;font-size:12px">수익 · 3Q $0.34M — 작다</text><text x="12" y="415" style="fill:#1a1d23;font-size:13px;font-weight:700">원재료(연결 합작사)</text><text x="328" y="415" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="421" width="256" height="8" rx="4" fill="#e6e8ec"/><rect x="12" y="421" width="33.8" height="8" rx="4" fill="#2a5bd7"/><text x="328" y="429" text-anchor="end" style="font-size:11.5px">매출 13%</text><text x="12" y="452" style="fill:#1a1d23;font-size:12px">고순도 갈륨·인듐 정제와 pBN(열분해 질화붕소) 도</text><text x="12" y="469" style="fill:#1a1d23;font-size:12px">가니다.</text><text x="12" y="486" style="fill:#5d6470;font-size:12px">쓰는 곳 · 자사 기판 원료와 외부 판매</text><text x="12" y="503" style="fill:#5d6470;font-size:12px">수익 · 3Q $9.7M. 자회사 Jinmei가 고순도 인듐 정</text><text x="12" y="520" style="fill:#5d6470;font-size:12px">제를 시작해 원료를 직접 확보한다</text><text x="12" y="558" style="fill:#1a1d23;font-size:13px;font-weight:700">VGF 결정 성장·저결함</text><text x="328" y="558" text-anchor="end" style="fill:#2a5bd7;font-size:11.5px;font-weight:600">기술</text><text x="12" y="581" style="fill:#1a1d23;font-size:12px">수직 온도구배 응고법으로 결함이 적은 단결정을 키</text><text x="12" y="598" style="fill:#1a1d23;font-size:12px">우는 공정 기술이다.</text><text x="12" y="615" style="fill:#5d6470;font-size:12px">쓰는 곳 · 고출력 레이저용 저결함 기판, 6인치 대</text><text x="12" y="632" style="fill:#5d6470;font-size:12px">구경</text><text x="12" y="649" style="fill:#5d6470;font-size:12px">수익 · 결함 요구가 까다로울수록 경쟁자가 줄고 가</text><text x="12" y="666" style="fill:#5d6470;font-size:12px">격 프리미엄이 붙는다(경영진)</text></g></svg>