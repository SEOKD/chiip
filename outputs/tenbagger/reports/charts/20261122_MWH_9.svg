<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="202.8" height="16" rx="3" fill="#5d6470"><title>약세: 17.7$ (-28%) · 확률 35% — 컨센서스 하단 경로. 세액공제 기한 전 앞당김이 끝나 2027년 매출이 $4.6B(<tspan style="fill:#5d6470;font-weight:600">+13%</tspan>)에 그치고 조정 EBITDA 이익률이 11%대로 내려와 EBITDA가 FY2026 가이던스에서 늘지 않는다</title></rect><text x="326.8" y="22">17.7 (-28%) · 확률 35%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="300.4" height="16" rx="3" fill="#5d6470"><title>기본: 26.2$ (+6%) · 확률 30% — 4Q26 내재 매출 $1.205B·이익률 12.4%가 2027년 내내 이어지는 경로(연 환산 매출 $4.82B × 12.4% ≈ $0.60B, 계산). 잔고의 본계약 전환이 지금 속도를 유지한다</title></rect><text x="424.4" y="48">26.2 (+6%) · 확률 30%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="463.6" height="16" rx="3" fill="#5d6470"><title>강세: 40.4$ (+64%) · 확률 35% — 높은 쪽 추정 경로. 총 잔고 $9.18B가 예정대로 본계약이 돼 매출 $5.4B(<tspan style="fill:#5d6470;font-weight:600">+33%</tspan>), 조정 EBITDA 이익률 13.9%</title></rect><text x="587.6" y="74">40.4 (+64%) · 확률 35%</text><line x1="403.2" x2="403.2" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="407.2" y="100">현재 24.7</text><text x="120" y="114" style="fill:#5d6470">확률 가중 28.2 (+14%)</text><line x1="452.6" x2="452.6" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 29.0 (+17%)</text></g></svg>