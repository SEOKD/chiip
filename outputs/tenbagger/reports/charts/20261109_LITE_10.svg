<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 322" width="340" height="322"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><rect x="1" y="162" width="338" height="152" rx="10" fill="none" stroke="#5d6470"/><rect x="1" y="2" width="338" height="152" rx="10" fill="none" stroke="#5d6470"/><text x="12" y="20" style="fill:#5d6470;font-size:13px;font-weight:700">부품(Components)</text><text x="328" y="20" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="26" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="26" width="152.8" height="8" rx="4" fill="#5d6470"/><text x="328" y="34" text-anchor="end" style="font-size:11.5px">매출 60%</text><text x="12" y="57" style="fill:#5d6470;font-size:12px">EML·CW·펌프·협선폭·초고출력 레이저 칩과 레이저</text><text x="12" y="74" style="fill:#5d6470;font-size:12px">조립품, 파장 선택 스위치(WSS)</text><text x="12" y="91" style="fill:#5d6470;font-size:12px">쓰는 곳 · 광 트랜시버·CPO 광원·장거리 데이터센터</text><text x="12" y="108" style="fill:#5d6470;font-size:12px">연결</text><text x="12" y="125" style="fill:#5d6470;font-size:12px">수익 · 자체 InP 팹 다섯 곳에서 칩을 만들어 모듈</text><text x="12" y="142" style="fill:#5d6470;font-size:12px">회사에 판다</text><text x="12" y="180" style="fill:#5d6470;font-size:13px;font-weight:700">시스템(Systems)</text><text x="328" y="180" text-anchor="end" style="fill:#5d6470;font-size:11.5px;font-weight:600">제품</text><rect x="12" y="186" width="256" height="8" rx="4" fill="#5d6470"/><rect x="12" y="186" width="103.2" height="8" rx="4" fill="#5d6470"/><text x="328" y="194" text-anchor="end" style="font-size:11.5px">매출 40%</text><text x="12" y="217" style="fill:#5d6470;font-size:12px">800G·1.6T 클라우드 트랜시버, 광 회로 스위치(OCS</text><text x="12" y="234" style="fill:#5d6470;font-size:12px">), 산업용 레이저</text><text x="12" y="251" style="fill:#5d6470;font-size:12px">쓰는 곳 · 데이터센터 서버·스위치 연결, 구글형 광</text><text x="12" y="268" style="fill:#5d6470;font-size:12px">스위칭</text><text x="12" y="285" style="fill:#5d6470;font-size:12px">수익 · 태국 공장에서 모듈과 스위치를 조립해 하이</text><text x="12" y="302" style="fill:#5d6470;font-size:12px">퍼스케일러·장비사에 판다</text></g></svg>