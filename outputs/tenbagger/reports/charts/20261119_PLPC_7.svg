<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 134" width="700" height="134"><style>text{fill:#5d6470;font-size:10.5px;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><g transform="translate(0,0)"><text x="114" y="22" text-anchor="end" style="fill:#5d6470;font-size:12px">약세</text><rect x="120" y="10" width="180.8" height="16" rx="3" fill="#5d6470"><title>약세: 108$ (-61%) · 확률 20% — 2026년이 송배전 물량의 정점이고 가격 인상 효과가 사라진다. 12개월 뒤 다음 4개 분기 EPS가 FY26 수준($13.45) 아래에 머문다</title></rect><text x="304.8" y="22">108 (-61%) · 확률 20%</text><text x="114" y="48" text-anchor="end" style="fill:#5d6470;font-size:12px">기본</text><rect x="120" y="36" width="304.0" height="16" rx="3" fill="#5d6470"><title>기본: 182$ (-34%) · 확률 60% — 컨센서스 경로 — FY27 매출 $860M(<tspan style="fill:#5d6470;font-weight:600">+7%</tspan>), EBIT 이익률 11.7%. 4Q27~3Q28 분기 추정 합 약 $16.3(계산)</title></rect><text x="428.0" y="48">182 (-34%) · 확률 60%</text><text x="114" y="74" text-anchor="end" style="fill:#5d6470;font-size:12px">강세</text><rect x="120" y="62" width="440.3" height="16" rx="3" fill="#5d6470"><title>강세: 263$ (-5%) · 확률 20% — 미국 송배전 투자가 2027년에도 <tspan style="fill:#5d6470;font-weight:600">+20%</tspan>대로 이어지고 총이익률 34%를 지킨다. EPS가 FY28 추정 상단($20.8) 쪽으로 간다</title></rect><text x="564.3" y="74">263 (-5%) · 확률 20%</text><line x1="583.6" x2="583.6" y1="4" y2="88" stroke="#5d6470" stroke-dasharray="4 3"/><text x="587.6" y="100">현재 277</text><text x="120" y="114" style="fill:#5d6470">확률 가중 183 (-34%)</text><line x1="447.8" x2="447.8" y1="4" y2="88" stroke="#5d6470" stroke-width="2"/><text x="120" y="128" style="fill:#5d6470;font-weight:700">목표주가 196 (-29%)</text></g></svg>