    basis: 수익률 예측 변수(요인·이상현상)의 논문 효과는 공개 뒤 약 58% 약해진다 — 사전값 = 논문 효과 × (1 − 0.58). McLean & Pontiff(2016, JF 71(1)) 97개 예측 변수. 프로바이저 D-20261029-01. 게재본 초록 확인 2026-10-31(대학 페이지 전재본 https://sf.cufe.edu.cn/info/1198/6543.htm, Wiley 원본 대조는 못함) — 공개 후 58%, 공개로 알게 된 거래 몫 32%(58%−26%). 2013 워킹페이퍼(SSRN 2156623, 82개 특성)의 약 35%는 표본이 다른 이전 판
    source: https://doi.org/10.1111/jofi.12365
  fit:
    method: 치입 제안서의 논문 효과 vs 표본 외 실현 효과 비율 누적(제안서 10건 이상 후)
    target: 표본 외 효과 / 논문 효과
