- 손으로 작성 2026-11-13, 2026-11-27 Analysis 회차에 갱신 — 영업손실이 매출보다 큰 개발 단계라 build_drivers 규칙(TTM·컨센서스 이익률 출발)이 의미 없는 값을 내서 연도별 경로 목록으로 쓴다(co-oklo와 같은 방식). 기준 매출 rev0 = FY2026 Zacks 컨센서스 $215.3M(3명). 기본 매출 경로
  = Zacks 평균(2026-11-17 갱신) 2027 $508M·2028 $859M·2029 $1,137M·2030 $1,693M·2031 $1,918M·2032 $2,590M(2029년 이후 2명), 2033년 이후 +15%→+5% 감속은 자체 가정(근거 약함). Fiscal.ai 자체 추정(2027 $311M·2028 $358M, 모델·신뢰 낮음)은
  약세 경로(2027 $197M)와 기본 사이에 있다. Data provided by Zacks Investment Research, Inc., www.zacksdata.com
- 이익률 = Zacks EBIT 2027 −$445M(매출 대비 −88%, 2명 — 11/3 −$370M에서 악화). 2028·2029는 Zacks EPS −$0.61·−$0.44에서 역산한 근사(이자 수익 포함이라 영업 기준보다 덜 나쁘게 보일 수 있다 — 근거 약함), 2030 EPS +$0.35 → 8%. 장기 25%는 자체 가정(기술료·연료·용역 혼합,
  흑자 SMR 개발사 선례 없음 — 근거 약함)
- 강세 = Zacks 매출 최고 경로(2027 $845M → 2032 $3,851M), 약세 = 최저 경로(2027 $197M → 2032 $1,329M). 확률 35/45/20 — 첫 호기 원전의 일정·비용 초과 기저율이 높고 Dow 예비 투자 결정이 2027년으로 남아 약세 쪽(정량 기저율 미조회 — 근거 약함). NRC 건설 허가 조기 발급(11/9)은
  인허가 위험을 줄인다
- 투하자본 ic0 = 자기자본 2,037.9 + 리스 24.3 − 현금·단기 투자 1,558.4 = $503.7M(2026-09-30, datapack_check 기준). 매출÷투하자본 1.2(약세 0.9·강세 1.4) — 회사가 발전소를 소유하지 않는 기술료·연료 모델이라 자본 집약도가 직접 발전 운영(Oklo 0.4)보다 낮다고 본 자체 가정(근거 약함)
- 업종 자본비용은 electrical_equipment로 근사 — 원전 개발사 전용 업종 값 없음. 무차입이라 실제 자기자본 비중 ~100%
- plus(외부 관점 기저율 혼합) 끔 — 매출 램프 구조가 기저율 표본과 달라 혼합하면 경로가 무의미해진다. 대신 약세 확률 35%로 외부 관점을 반영
- 희석 — 3Q26 10-Q 주당손익 주석의 희석 제외 증권을 모두 더했다(조건부 워런트 포함, 보수적)
- 3Q 콜(2026-11-12) 질문 초점(증권사) — TD Cowen(예비 FID 선행 조건·AEP 협약의 자본 보호), Guggenheim(장납기 조달·운영 허가), Morgan Stanley(선거 뒤 지원·허가 반복성), JPMorgan(석탄 폐지 부지), Texas Capital(XTAC·조사 시험), Wedbush(FID 전 설계 완성도)
