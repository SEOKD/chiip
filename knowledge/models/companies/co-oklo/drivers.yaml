- 손으로 작성 2026-11-08(핵심 루프 대기열 '작성', 알파 5.8 진입 + 3Q 실적 2026-11-06) — 매출 전(pre-revenue) 단계라 build_drivers 규칙(TTM·컨센서스 이익률 출발)이 의미 없는 값을 내서
  연도별 경로 목록으로 썼다. 기준 매출 rev0 = Zacks FY2026 컨센서스 $3.5M(5명). 기본 매출 경로 = Zacks 2027 $9.3M·2028 $36.4M·2029 $103.0M·2030
  $291.4M(4명, 범위 $139~627M) 그대로, 2031년 이후 +80%→+12% 감속은 자체 가정(근거 약함). Data provided by Zacks Investment Research, Inc., www.zacksdata.com
- 이익률 = Zacks EBIT 2026 −$277.5M·2027 −$307.9M(5명)을 매출로 나눈 값. 2028년 이후 영업손실 축소 경로(−$0.30B → 흑자 2032)와 장기 30%(발전 판매 PPA 사업자 수준)는
  자체 가정(근거 약함) — 동종 상장 SMR 개발사 중 흑자 기업이 없어 대조 기준이 없다
- 강세 = 2030 컨센서스 최고 $627M 경로, 약세 = 첫 호기 2년 지연(2030 컨센서스 최저 $139M). 확률 35/45/20 — 첫 호기(FOAK) 원전의 인허가·건설 지연 기저율이 높아 약세 쪽으로(근거 약함, 정량 기저율 미조회)
- 매출÷투하자본 0.4(약세 0.3·강세 0.45): 발전소를 직접 짓고 운영하는 구조(콜 — 2026 PP&E 현금 지출 가이던스 $400~500M, 영업 현금 사용 $120~150M) — 유틸리티형 자본 집약도(근거 약함)
- 업종 자본비용은 electrical_equipment(베타 1.25)로 근사 — 원전 개발사 전용 업종 값 없음. 무차입이라 실제 자기자본 비중 ~100%(설정은 89%) → WACC 약간 낮게 잡힐 수 있다
- plus(외부 관점 3년차 이후 기저율 혼합) 끔 — 매출 $3.5M 출발의 램프는 기저율 표본(상장사 매출 성장)과 구조가 달라 혼합하면 경로가 무의미해진다. 대신 약세 확률 35%로 외부 관점을 반영
- 희석 — 옵션·RSU·워런트 미조회 — 미확인(희석 과소 가능). 컨센서스 대조 = 매출 경로는 컨센서스와 같음(2030까지), 이후는 컨센서스 없음
- 3Q 콜(2026-11-06) 질문 초점(증권사) — Guggenheim(연료 사업·첫 매출 시점), Piper Sandler, Canaccord(플루토늄 확보 일정·비용), TD Cowen(오하이오 프로젝트·Meta 계약 구속력),
